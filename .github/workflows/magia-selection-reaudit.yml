name: Magia Selection Reaudit

on:
  push:
    branches:
      - fix/20260901-magia-selection-reaudit
    paths:
      - tools/apply-magia-selection-reaudit.mjs
      - .github/workflows/magia-selection-reaudit.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260901-magia-selection-reaudit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic migration
        run: node tools/apply-magia-selection-reaudit.mjs
      - name: Validate Research
        run: node tools/validate-research-data.mjs research/L_MAGIA_RECORD_RN/research-data.json
      - name: Validate Selection
        run: node tools/validate-selection-data.mjs research/L_MAGIA_RECORD_RN/selection-data.json research/L_MAGIA_RECORD_RN/research-data.json
      - name: Validate Observation
        run: node tools/validate-machine-observation-data.mjs research/L_MAGIA_RECORD_RN/machine-observation-data.json
      - name: Validate UI Design
        run: node tools/validate-ui-design-data.mjs .
      - name: Commit semantic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_MAGIA_RECORD_RN/research-data.json research/L_MAGIA_RECORD_RN/selection-data.json research/L_MAGIA_RECORD_RN/machine-observation-data.json research/L_MAGIA_RECORD_RN/ui-design-data.json
          if git diff --cached --quiet; then
            echo "No semantic changes to commit"
          else
            git commit -m "fix: re-audit magia selection and observation"
            git push origin HEAD:fix/20260901-magia-selection-reaudit
          fi
      - name: Machine pipeline
        run: npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
      - name: Full tests
        run: npm test
      - name: Repository audit
        run: npm run audit
