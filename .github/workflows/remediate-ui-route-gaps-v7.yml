name: Remediate UI route gaps v7

on:
  push:
    branches:
      - audit/20260912-cross-sectional-v7
    paths:
      - tools/remediate-ui-route-gaps-v7.mjs
      - .github/workflows/remediate-ui-route-gaps-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/20260912-cross-sectional-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical UI route remediation
        run: node tools/remediate-ui-route-gaps-v7.mjs
      - name: Validate UI Design repository
        run: node tools/validate-ui-design-data.mjs
      - name: Repository tests
        run: npm test
      - name: Repository audit
        run: npm run audit
      - name: Cross-sectional route check
        run: |
          node tools/audit-cross-sectional-v7.mjs
          node tools/reclassify-cross-sectional-v7.mjs
          node -e "const r=require('./reports/cross-sectional-v7-audit.json'); if(r.issueCounts.ADOPTED_INPUT_NO_UI_ROUTE) throw new Error('ADOPTED_INPUT_NO_UI_ROUTE remains: '+r.issueCounts.ADOPTED_INPUT_NO_UI_ROUTE); console.log('ADOPTED_INPUT_NO_UI_ROUTE: 0')"
      - name: Commit canonical UI changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/ui-design-data.json
          if git diff --cached --quiet; then
            echo 'No canonical UI route remediation required.'
            exit 0
          fi
          git commit -m 'Audit: restore adopted input UI routes'
          git push origin HEAD:audit/20260912-cross-sectional-v7
