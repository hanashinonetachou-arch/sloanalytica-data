name: Add Magihallo8 REG Threshold Once

on:
  push:
    branches:
      - prototype-multi-machine
    paths:
      - .github/workflows/add-magihallo8-reg-threshold-once.yml

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Research and Selection
        run: |
          node <<'NODE'
          const fs = require('fs');
          const rp = 'research/L_MAGICAL_HALLOWEEN8_FE/research-data.json';
          const sp = 'research/L_MAGICAL_HALLOWEEN8_FE/selection-data.json';
          const r = JSON.parse(fs.readFileSync(rp, 'utf8'));
          const s = JSON.parse(fs.readFileSync(sp, 'utf8'));

          if (!r.sources.some(x => x.sourceId === 'SRC_MAGI8_REG_THRESHOLD')) {
            r.sources.push({
              sourceId: 'SRC_MAGI8_REG_THRESHOLD',
              publisher: 'なな徹',
              title: 'マジカルハロウィン8 殲滅ボーナス 規定撃破数抽選',
              url: 'https://nana-press.com/kaiseki/machine/627/18076/',
              checkedAt: '2026-08-19',
              sourceType: 'major_analysis'
            });
          }

          const feature = {
            researchFeatureId: 'RF_REG_REQUIRED_KILLS',
            name: '殲滅ボーナス 規定撃破数',
            factStatus: 'verified',
            candidateModel: 'multinomial',
            trialUnit: '判別できた殲滅ボーナス',
            observationScope: '殲滅ボーナス（規定撃破数を25/50/75/100体のいずれかに一意に判別できた回のみ）',
            categories: ['25体','50体','75体','100体'],
            settingDistributions: {
              SET_1: {'25体':0.0078,'50体':0.0625,'75体':0.0938,'100体':0.8359},
              SET_2: {'25体':0.0156,'50体':0.1250,'75体':0.1250,'100体':0.7344},
              SET_3: {'25体':0.0625,'50体':0.2500,'75体':0.1563,'100体':0.5313},
              SET_4: {'25体':0.3125,'50体':0.3125,'75体':0.1875,'100体':0.1875},
              SET_5: {'25体':0.3281,'50体':0.3281,'75体':0.2188,'100体':0.1250},
              SET_6: {'25体':0.3438,'50体':0.3438,'75体':0.2500,'100体':0.0625}
            },
            sourceRefs: ['SRC_MAGI8_REG_THRESHOLD','SRC_MAGI8_NANA'],
            crossSourceStatus: 'multi_source_consistent',
            notes: '25・50体選択率に特大の設定差。実戦では一撃フラグやレア役多数による大量撃破などで規定数を特定できない場合があるため、その回は集計対象外とする。判別不能ケースは稀という実機知見を踏まえ、判別できた回だけを条件付きで利用する。'
          };
          const fi = r.features.findIndex(x => x.researchFeatureId === feature.researchFeatureId);
          if (fi >= 0) r.features[fi] = feature; else r.features.push(feature);

          const otherNumeric = r.researchCompleteness?.numericSurfaces?.find(x => x.surface === 'other_numeric');
          if (otherNumeric) {
            otherNumeric.status = 'CHECKED';
            otherNumeric.sourceRefs = [...new Set([...(otherNumeric.sourceRefs||[]), 'SRC_MAGI8_REG_THRESHOLD'])];
            otherNumeric.notes = '殲滅ボーナス規定撃破数は25/50/75/100体に特大の設定差があり候補化。判別不能回を除外する条件付きFeatureとしてSelectionで補助採用。特定ボーナスは1日の出現回数が少なく主軸にしない。';
          }

          const newInputs = [
            {id:'INP_REG_THRESHOLD_25',name:'25体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:40,description:'規定撃破数を25体と一意に判別できた殲滅ボーナスのみ入力します。',defaultValue:0},
            {id:'INP_REG_THRESHOLD_50',name:'50体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:41,description:'規定撃破数を50体と一意に判別できた殲滅ボーナスのみ入力します。',defaultValue:0},
            {id:'INP_REG_THRESHOLD_75',name:'75体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:42,description:'規定撃破数を75体と一意に判別できた殲滅ボーナスのみ入力します。',defaultValue:0},
            {id:'INP_REG_THRESHOLD_100',name:'100体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:43,description:'規定撃破数を100体と一意に判別できた殲滅ボーナスのみ入力します。一撃フラグやレア役多数などで規定数を特定できない回は、25/50/75/100のどれにも入力しません。',defaultValue:0}
          ];
          for (const input of newInputs) {
            const i = s.inputs.findIndex(x => x.id === input.id);
            if (i >= 0) s.inputs[i] = input; else s.inputs.push(input);
          }

          const sf = {
            researchFeatureId:'RF_REG_REQUIRED_KILLS',
            featureId:'FEAT_REG_REQUIRED_KILLS',
            adoptionCategory:'INCLUDE_SUPPORT',
            numeratorInputId:'INP_REG_THRESHOLD_25',
            categoryInputIds:['INP_REG_THRESHOLD_50','INP_REG_THRESHOLD_75','INP_REG_THRESHOLD_100'],
            inputTransform:'sum_inputs_to_trials',
            minimumSample:1,
            sampleRecommendation:5,
            weight:0.8,
            difficultyParticipation:'EXCLUDE',
            userReason:'殲滅ボーナスの規定撃破数は25・50体の選択率を中心に設定差が非常に大きく、少数回でも情報量が高い。一撃フラグやレア役多数などで規定数を一意に特定できない回は集計対象から除外し、判別できた回だけを条件付きで補助利用する。観測不能回の選択バイアスを完全には否定できないため重み0.8とする。',
            difficultyExclusionReason:'1日あたりの殲滅ボーナス回数と判別不能率を通常ゲーム数へ安定換算できないためDifficultyには含めない。'
          };
          const sfi = s.features.findIndex(x => x.researchFeatureId === sf.researchFeatureId);
          if (sfi >= 0) s.features[sfi] = sf; else s.features.push(sf);
          s.uiCategoryLabels = {...(s.uiCategoryLabels||{}), REG_THRESHOLD:'REG 規定撃破数'};

          fs.writeFileSync(rp, JSON.stringify(r,null,2)+'\n');
          fs.writeFileSync(sp, JSON.stringify(s,null,2)+'\n');
          NODE

      - name: Validate and regenerate machine
        run: |
          npm run research:validate -- L_MAGICAL_HALLOWEEN8_FE
          npm run selection:validate -- L_MAGICAL_HALLOWEEN8_FE
          npm run machine:pipeline -- L_MAGICAL_HALLOWEEN8_FE

      - name: Verify generated REG threshold feature
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('machines/L_MAGICAL_HALLOWEEN8_FE/machine-package.json','utf8'));
          const f=p.features.features.find(x=>x.featureId==='FEAT_REG_REQUIRED_KILLS');
          if(!f) throw new Error('REG threshold feature missing');
          if(f.modelType!=='multinomial') throw new Error('REG threshold model is not multinomial');
          if(f.reliabilityProfile?.weight!==0.8) throw new Error('REG threshold weight mismatch');
          const sec=p.ui.sections.find(x=>x.id==='AUTO_REG_THRESHOLD');
          if(!sec || sec.items.length!==4) throw new Error('REG threshold UI section mismatch');
          console.log('REG threshold feature verified');
          NODE

      - name: Publish machine
        run: npm run machine:publish:batch -- --apply L_MAGICAL_HALLOWEEN8_FE

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_MAGICAL_HALLOWEEN8_FE machines/L_MAGICAL_HALLOWEEN8_FE catalog.json difficulty-catalog.json machine-registry.json reports || true
          if ! git diff --cached --quiet; then
            git commit -m "feat: add Magihallo8 REG threshold inference"
            git push origin HEAD:prototype-multi-machine
          fi

      - name: Deploy prototype Pages explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref prototype-multi-machine

# retrigger 2026-08-19
