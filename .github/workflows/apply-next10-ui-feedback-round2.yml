name: Apply Next10 UI Feedback Round2

on:
  push:
    branches:
      - integrate/20260908-next10-ui-feedback-round2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/20260908-next10-ui-feedback-round2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check transform
        run: node --check tools/apply-next10-ui-feedback-round2.mjs

      - name: Apply canonical and generated UI fixes
        run: node tools/apply-next10-ui-feedback-round2.mjs

      - name: Parse changed JSON
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'research/L_FIRE_FORCE_2/ui-design-data.json',
            'machines/L_FIRE_FORCE_2/machine-package.json',
            'research/L_KABANERI_UNATO_KESSEN_XX/ui-design-data.json',
            'machines/L_KABANERI_UNATO_KESSEN_XX/machine-package.json',
            'research/L_JORMUNGAND_ND01G/ui-design-data.json',
            'machines/L_JORMUNGAND_ND01G/machine-package.json',
            'research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json',
            'machines/LB_TRIPLE_CROWN_SEVEN_FG/machine-package.json',
            'machines/L_KYOKOU_SUIRI_ST/machine-package.json'
          ];
          for (const f of files) JSON.parse(fs.readFileSync(f, 'utf8'));
          console.log(`JSON parse PASS: ${files.length} files`);
          NODE

      - name: Semantic UI assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const ok = (x,m) => { if(!x) throw new Error(m); };

          const fire = read('research/L_FIRE_FORCE_2/ui-design-data.json');
          ok(!fire.sections['ボーナス終了画面・確定パターン'], 'Fire Force separate evidence section remains');
          ok(['INP_EVIDENCE_BONUS_END_4PLUS','INP_EVIDENCE_BONUS_END_5PLUS','INP_EVIDENCE_BONUS_END_6'].every(id => fire.sections['炎炎ボーナス終了画面'].inputIds.includes(id)), 'Fire Force evidence not co-located');

          const kaba = read('research/L_KABANERI_UNATO_KESSEN_XX/ui-design-data.json');
          ok(kaba.inputContracts.INP_LOWER_BELL_TRIALS.name === '通常時・ST中・ボーナス中の消化ゲーム数', 'Kabaneri denominator wording mismatch');

          const jor = read('research/L_JORMUNGAND_ND01G/ui-design-data.json');
          const jids = ['INP_BONUS_END_SCREEN_DEFAULT','INP_BONUS_END_SCREEN_EVENING','INP_BONUS_END_SCREEN_SLEEPING_VALMET','INP_BONUS_END_SCREEN_THREE_DOCTORS'];
          ok(jids.every(id => jor.inputContracts[id].gridSpan === 6), 'Jormungand end screens are not 2-column');

          const tri = read('research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json');
          const suppressed = tri.features.filter(f => f.adoptionCategory === 'EXCLUDE' && f.summarySuppressed === true);
          ok(suppressed.length >= 3, 'Triple Crown integrated standalone EXCLUDE summaries not suppressed');
          ok(!suppressed.some(f => /BT.*REPLAY.*BB/i.test(`${f.featureId||''} ${f.researchFeatureId||''}`)), 'Triple Crown BT replay+BB incorrectly suppressed');

          const kySel = read('research/L_KYOKOU_SUIRI_ST/selection-data.json');
          const kyPkg = read('machines/L_KYOKOU_SUIRI_ST/machine-package.json');
          const excluded = new Set(kySel.inputs.filter(x => x.inferenceRole === 'EXCLUDE').map(x => x.id));
          const inputIds = new Set();
          const walk = v => { if(Array.isArray(v)) v.forEach(walk); else if(v && typeof v === 'object'){ if(typeof v.id === 'string' && v.id.startsWith('INP_') && ('name' in v || 'type' in v)) inputIds.add(v.id); Object.values(v).forEach(walk); } };
          walk(kyPkg);
          ok([...excluded].every(id => !inputIds.has(id)), 'Kyokou EXCLUDE-only input still exposed in generated package');
          console.log('Semantic UI assertions: PASS');
          NODE

      - name: Commit applied data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research machines
          if git diff --cached --quiet; then
            echo 'No applied data changes'
            exit 0
          fi
          git commit -m 'ui: apply Next10 real-device feedback round2'
          git push origin HEAD:integrate/20260908-next10-ui-feedback-round2
