name: Compact 20260907 Gate B Stats

on:
  push:
    branches:
      - batch/20260907-next10-gateb
    paths:
      - '.github/workflows/compact-20260907-gate-b-stats.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-gateb
          fetch-depth: 0
      - name: Build compact feature metrics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const prep=JSON.parse(fs.readFileSync('reports/batch-20260907-selection-prepare.json','utf8'));
          const machines=[];
          for(const item of prep.results){
            const p=`${prep.workspace}/${item.machineId}/statistical-report.json`;
            const s=JSON.parse(fs.readFileSync(p,'utf8'));
            machines.push({machineId:item.machineId,features:(s.features??[]).map(f=>({researchFeatureId:f.researchFeatureId,name:f.name,model:f.candidateModel,calculable:f.calculable,settingCount:f.settingCount,extremeGap:f.extremeGap,extremeRatio:(f.probabilityRange?.min>0?f.probabilityRange.max/f.probabilityRange.min:null),requiredTrials80:f.extremePair80?.requiredTrials80??null,hardestAdjacentTrials95:f.hardestAdjacentPair?.approxTrials95??null,notes:f.notes??[]}))});
          }
          fs.writeFileSync('reports/batch-20260907-selection-compact-stats.json',JSON.stringify({schemaVersion:'batch-selection-compact-stats-v1',machines},null,2)+'\n');
          NODE
      - name: Commit compact stats
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/batch-20260907-selection-compact-stats.json
          git commit -m 'GateB: add compact feature statistics'
          git push origin HEAD:batch/20260907-next10-gateb
