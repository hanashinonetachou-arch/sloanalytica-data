name: Resequence Provisional Registration IDs

on:
  push:
    branches:
      - chore/20260912-resequence-provisional-registration-ids
    paths:
      - tools/sync-machine-registry.mjs
      - .github/workflows/resequence-provisional-registration-ids.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resequence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/20260912-resequence-provisional-registration-ids
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resequence registry
        run: npm run registry:sync
      - name: Validate registry
        run: npm run registry:validate
      - name: Verify chronological IDs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const expected=[...catalog.machines].sort((a,b)=>a.introductionDate.localeCompare(b.introductionDate)||a.machineId.localeCompare(b.machineId));
          const byId=new Map(registry.machines.map(m=>[m.machineId,m]));
          for(let i=0;i<expected.length;i++){
            const machine=byId.get(expected[i].machineId);
            if(!machine) throw new Error(`Missing registry machine: ${expected[i].machineId}`);
            if(machine.provisionalRegistrationId!==i+1) throw new Error(`ID mismatch ${expected[i].machineId}: ${machine.provisionalRegistrationId} != ${i+1}`);
            if(machine.releaseDate!==expected[i].introductionDate) throw new Error(`releaseDate mismatch ${expected[i].machineId}`);
          }
          console.log(`Chronological provisional IDs verified: ${expected.length} machines`);
          NODE
      - name: Run test suite
        run: npm test
      - name: Commit generated registry
        run: |
          if git diff --quiet -- machine-registry.json; then
            echo 'machine-registry.json already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add machine-registry.json
          git commit -m 'Registry: apply chronological provisional IDs'
          git push origin HEAD:chore/20260912-resequence-provisional-registration-ids
