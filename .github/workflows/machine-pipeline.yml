name: MachineData Pipeline

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'research/**/research-data.json'
      - 'research/**/selection-data.json'
      - 'research/**/ui-design-data.json'
      - 'tools/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/machine-pipeline.yml'
  workflow_dispatch:
    inputs:
      machine_id:
        description: 'Machine ID to validate'
        required: true
        type: string

jobs:
  validate-machine-data:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve changed stages
        id: stages
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/research_files.txt
          : > /tmp/ui_design_files.txt
          : > /tmp/machine_ids.txt
          : > /tmp/new_research_machine_ids.txt

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${{ inputs.machine_id }}" > /tmp/machine_ids.txt
          else
            git diff --diff-filter=ACMRT --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | sed -nE '/^research\/[^/]+\/research-data\.json$/p' \
              | sort -u > /tmp/research_files.txt

            git diff --diff-filter=ACMRT --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | sed -nE 's#^research/([^/]+)/selection-data\.json$#\1#p' \
              | sort -u > /tmp/machine_ids.txt

            git diff --diff-filter=ACMRT --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | sed -nE '/^research\/[^/]+\/ui-design-data\.json$/p' \
              | sort -u > /tmp/ui_design_files.txt

            if [[ -s /tmp/ui_design_files.txt ]]; then
              node tools/filter-materialized-ui-changes.mjs \
                --base "${{ github.event.pull_request.base.sha }}" \
                --head "${{ github.event.pull_request.head.sha }}" \
                --files-from /tmp/ui_design_files.txt >> /tmp/machine_ids.txt
              sort -u -o /tmp/machine_ids.txt /tmp/machine_ids.txt
            fi
          fi

          if [[ -s /tmp/research_files.txt ]]; then
            echo 'Changed ResearchData:'
            cat /tmp/research_files.txt
            echo 'has_research=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_research=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ -s /tmp/machine_ids.txt ]]; then
            echo 'Machine IDs ready for full pipeline:'
            cat /tmp/machine_ids.txt
            echo 'has_machines=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No changed SelectionData or materialized UI semantics; full MachineData generation is not required.'
            echo 'has_machines=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce setting-confirmation sections last
        run: node tools/audit-ui-evidence-section-order.mjs .

      - name: Validate changed ResearchData
        if: steps.stages.outputs.has_research == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r research_file; do
            echo "::group::${research_file}"
            machine_id="$(basename "$(dirname "$research_file")")"
            if [[ -f "research/${machine_id}/machine-research-summary.json" && -f "research/${machine_id}/canonical-ui.json" && -f "research/${machine_id}/observation-data.json" ]]; then
              echo "New research pipeline contract detected: ${machine_id}"
              node tools/build-research-runtime-pilot.mjs "${machine_id}"
              node tools/validate-runtime-machine-package.mjs "build/${machine_id}/machine-package.generated.json"
              printf '%s\n' "${machine_id}" >> /tmp/new_research_machine_ids.txt
            else
              npm run research:validate -- "$research_file"
            fi
            echo '::endgroup::'
          done < /tmp/research_files.txt

      - name: Build and validate changed machines in guarded batches
        if: steps.stages.outputs.has_machines == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/machine_ids_chunk_*
          if [[ -s /tmp/new_research_machine_ids.txt ]]; then
            grep -vxFf /tmp/new_research_machine_ids.txt /tmp/machine_ids.txt > /tmp/legacy_machine_ids.txt || true
          else
            cp /tmp/machine_ids.txt /tmp/legacy_machine_ids.txt
          fi
          if [[ ! -s /tmp/legacy_machine_ids.txt ]]; then
            echo 'All changed machines use the new research runtime path; legacy machine:batch is not required.'
            exit 0
          fi
          split -l 10 /tmp/legacy_machine_ids.txt /tmp/machine_ids_chunk_
          for chunk in /tmp/machine_ids_chunk_*; do
            count="$(wc -l < "$chunk" | tr -d ' ')"
            echo "::group::MachineData batch ${chunk##*/} (${count} machines)"
            npm run machine:batch -- --file "$chunk"
            echo '::endgroup::'
          done

      - name: Commit generated artifacts
        if: >-
          github.event_name == 'pull_request' &&
          steps.stages.outputs.has_machines == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo 'Generated artifacts are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json difficulty-catalog.json research/*/selection-data.json research/*/statistics-report.json research/*/difficulty-report.json research/*/setting-band-report.json machines/*/machine-package.json machine-registry.json reports/m7-full-fleet-migration-audit-20260916.json reports/m7-full-fleet-migration-audit-20260916.md
          if git diff --cached --quiet; then
            echo 'No generated artifact changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh generated MachineData artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Repository tests for research-only or infrastructure changes
        if: steps.stages.outputs.has_machines != 'true'
        run: npm test

      - name: Repository audit for research-only or infrastructure changes
        if: steps.stages.outputs.has_machines != 'true'
        run: npm run audit

      - name: User-facing service-name audit for research-only or infrastructure changes
        if: steps.stages.outputs.has_machines != 'true'
        run: npm run audit:ui-service-names
