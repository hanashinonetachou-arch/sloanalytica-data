name: MachineData Pipeline

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - '.github/workflows/machine-pipeline.yml'
      - 'tools/audit-machine-data-statistics-v2.mjs'

jobs:
  machine-statistical-audit-phase1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run statistical audit v2
        run: node tools/audit-machine-data-statistics-v2.mjs . reports/machine-data-statistical-audit-v2.json reports/machine-data-statistical-audit-v2.md
      - name: Existing full tests and audits
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Commit statistical audit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/machine-data-statistical-audit-v2.json reports/machine-data-statistical-audit-v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: generate statistical MachineData report v2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
