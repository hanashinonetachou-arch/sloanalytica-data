name: MachineData Pipeline

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'research/**/research-data.json'
      - 'research/**/selection-data.json'
      - 'tools/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/machine-pipeline.yml'
  workflow_dispatch:
    inputs:
      machine_id:
        description: 'Machine ID to validate'
        required: true
        type: string

jobs:
  validate-machine-data:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Fire Force ending-screen migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/enen-ending-explicit-default-20260821'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node tools/apply-enen-ending-explicit-default-20260821.mjs
          npm run machine:batch -- L_ENEN_NO_SHOUBOUTAI_JG
          npm run machine:publish:batch -- L_ENEN_NO_SHOUBOUTAI_JG --apply
          npm test
          npm run audit
          npm run audit:ui-service-names
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/L_ENEN_NO_SHOUBOUTAI_JG/selection-data.json research/L_ENEN_NO_SHOUBOUTAI_JG/statistics-report.json research/L_ENEN_NO_SHOUBOUTAI_JG/difficulty-report.json machines/L_ENEN_NO_SHOUBOUTAI_JG/machine-package.json tools/build-machine-data.mjs catalog.json difficulty-catalog.json machine-registry.json reports/batch-machine-pipeline-report.json
          git diff --cached --quiet || git commit -m 'Refine Fire Force ending-screen inputs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Resolve changed stages
        id: stages
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/research_files.txt
          : > /tmp/machine_ids.txt

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${{ inputs.machine_id }}" > /tmp/machine_ids.txt
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | sed -nE '/^research\/[^/]+\/research-data\.json$/p' \
              | sort -u > /tmp/research_files.txt

            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | sed -nE 's#^research/([^/]+)/selection-data\.json$#\1#p' \
              | sort -u > /tmp/machine_ids.txt
          fi

          if [[ -s /tmp/research_files.txt ]]; then
            echo 'Changed ResearchData:'
            cat /tmp/research_files.txt
            echo 'has_research=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_research=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ -s /tmp/machine_ids.txt ]]; then
            echo 'Machine IDs ready for full pipeline:'
            cat /tmp/machine_ids.txt
            echo 'has_machines=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No changed SelectionData; full MachineData generation is not required yet.'
            echo 'has_machines=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed ResearchData
        if: steps.stages.outputs.has_research == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r research_file; do
            echo "::group::${research_file}"
            npm run research:validate -- "$research_file"
            echo '::endgroup::'
          done < /tmp/research_files.txt

      - name: Build and validate changed machines as one batch
        if: steps.stages.outputs.has_machines == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run machine:batch -- --file /tmp/machine_ids.txt

      - name: Commit generated artifacts
        if: >-
          github.event_name == 'pull_request' &&
          steps.stages.outputs.has_machines == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo 'Generated artifacts are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json difficulty-catalog.json research/*/statistics-report.json research/*/difficulty-report.json machines/*/machine-package.json
          if git diff --cached --quiet; then
            echo 'No generated artifact changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh generated MachineData artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Repository tests for research-only or infrastructure changes
        if: steps.stages.outputs.has_machines != 'true'
        run: npm test

      - name: Repository audit for research-only or infrastructure changes
        if: steps.stages.outputs.has_machines != 'true'
        run: npm run audit

      - name: User-facing service-name audit for research-only or infrastructure changes
        if: steps.stages.outputs.has_machines != 'true'
        run: npm run audit:ui-service-names
