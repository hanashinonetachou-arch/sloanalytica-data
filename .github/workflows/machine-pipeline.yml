name: TEMP Apply menu/predecessor reaudit

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/tmp-apply-menu-predecessor-reaudit.mjs'
      - '.github/workflows/machine-pipeline.yml'

jobs:
  apply-reaudit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reaudit changes
        run: node tools/tmp-apply-menu-predecessor-reaudit.mjs
      - name: Validate changed ResearchData
        shell: bash
        run: |
          set -euo pipefail
          for id in L_SEIYA_KAIOU_ED L_STREET_FIGHTER5_ZD L_BOFURI_FN L_SYMPHOGEAR_SEIGI_JA L_HOKUTO_MUSOU_FS S_KIN_NO_KABOCHA_AA S_BAHAMA_A3_30 S_OKIDOKI_BLACK_EP S_AOHARU_MISAO_A2 S_DANMACHI2_XZ; do
            npm run research:validate -- "research/$id/research-data.json"
          done
      - name: Commit reaudit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/research-data.json research/L_SEIYA_KAIOU_ED/selection-data.json research/L_STREET_FIGHTER5_ZD/selection-data.json research/L_BOFURI_FN/selection-data.json research/L_HOKUTO_MUSOU_FS/selection-data.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: apply menu and predecessor data reaudit'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
