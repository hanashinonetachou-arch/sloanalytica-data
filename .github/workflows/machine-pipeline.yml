name: MachineData Pipeline

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - '.github/workflows/machine-pipeline.yml'
      - 'tools/tmp-generate-10machines-seiya-danmachi2.mjs'

jobs:
  generate-temporary-batch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate research and selection
        run: node tools/tmp-generate-10machines-seiya-danmachi2.mjs
      - name: Prepare batch list
        shell: bash
        run: |
          cat > /tmp/machine_ids.txt <<'EOF'
          L_SEIYA_KAIOU_ED
          L_STREET_FIGHTER5_ZD
          L_BOFURI_FN
          L_SYMPHOGEAR_SEIGI_JA
          L_HOKUTO_MUSOU_FS
          S_KIN_NO_KABOCHA_AA
          S_BAHAMA_A3_30
          S_OKIDOKI_BLACK_EP
          S_AOHARU_MISAO_A2
          S_DANMACHI2_XZ
          EOF
      - name: Disposition all researched evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=fs.readFileSync('/tmp/machine_ids.txt','utf8').trim().split(/\r?\n/);
          for(const id of ids){
            const rp=`research/${id}/research-data.json`, sp=`research/${id}/selection-data.json`;
            const r=JSON.parse(fs.readFileSync(rp,'utf8')), s=JSON.parse(fs.readFileSync(sp,'utf8'));
            const ev=r.evidenceCandidates??[];
            s.evidenceUi=ev.length?{groups:[{groupId:'SETTING_EVIDENCE',label:'確認した設定確定・否定情報',selectionMode:'single',normalizationMode:'ALLOWED_SETTINGS',options:ev.map((e,i)=>({value:`EVIDENCE_${i+1}`,label:e.name,allowedSettings:e.allowedSettings,sourceEvidenceIds:[e.researchEvidenceId]}))}]}:{groups:[]};
            fs.writeFileSync(sp,JSON.stringify(s,null,2)+'\n');
          }
          NODE
      - name: Validate research
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r id; do npm run research:validate -- "research/$id/research-data.json"; done < /tmp/machine_ids.txt
      - name: Build batch
        run: npm run machine:batch -- --file /tmp/machine_ids.txt
      - name: Publish atomic batch
        run: npm run machine:publish:batch -- --apply --file /tmp/machine_ids.txt
      - name: Commit persistent files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog.json difficulty-catalog.json machine-registry.json
          while IFS= read -r id; do
            git add -- "research/$id/research-data.json" "research/$id/selection-data.json" "research/$id/statistics-report.json" "research/$id/difficulty-report.json" "research/$id/setting-band-report.json" "machines/$id/machine-package.json"
          done < /tmp/machine_ids.txt
          if git diff --cached --quiet; then echo 'No persistent changes'; exit 0; fi
          git commit -m 'feat: add research and MachineData for 10 machines'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
