name: TEMP Genericize linked-service wording

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/tmp-genericize-linked-service-wording.mjs'
      - '.github/workflows/machine-pipeline.yml'

jobs:
  apply-wording:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply generic wording
        run: node tools/tmp-genericize-linked-service-wording.mjs
      - name: Commit wording changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_BOFURI_FN/selection-data.json research/L_HOKUTO_MUSOU_FS/selection-data.json
          git commit -m 'fix: genericize linked-service wording'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}