name: Finalize 20260907 Gate A

on:
  push:
    branches:
      - batch/20260907-next10-gatea
    paths:
      - '.github/workflows/finalize-20260907-gate-a.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-gatea
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve final Research dispositions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const dispositions={
            'L_FIRE_FORCE_2:DC_10':'SANKYO公式機種ページ・公式コンテンツ一覧を確認したが、本機固有の実機遊技履歴連動/データ書き出し機能は公開資料で確認できなかった。非対応とは断定せずREFERENCEとして保持。',
            'L_UMINEKO_2_A1:DC_15':'公式/主要解析情報を横断確認したが、本機固有の実機遊技履歴連動サービスは確認できなかった。HAZUSE上のQRコード導線はオフィシャルサイトへの外部リンクであり、実機連動サービスの根拠にはしない。',
            'L_JORMUNGAND_ND01G:DC_07':'公開解析ではケロットトロフィーの示唆内容が従来機種からの予想として掲載されており、確定情報としては扱えない。候補自体はREFERENCEとして保持し、Hard Evidence化しない。',
            'LB_TRIPLE_CROWN_SEVEN_FG:DC_12':'岡崎産業公式機種情報・公開解析を確認したが、本機固有のスマートフォン遊技履歴連動/データ書き出し機能は確認できなかった。非対応とは断定せずREFERENCEとして保持。',
            'L_KYOKOU_SUIRI_ST:DC_10':'Daiichi公式機種情報・公開解析を確認したが、本機固有の実機遊技履歴連動/データ書き出し機能は確認できなかった。非対応とは断定せずREFERENCEとして保持。',
            'L_AKUDAMA_DRIVE_TP:DC_15':'SANYO公式機種情報・更新情報・公開解析を確認したが、本機固有の実機遊技履歴連動/データ書き出し機能は確認できなかった。非対応とは断定せずREFERENCEとして保持。',
            'L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA:DC_14':'SANKYO/ビスティ公式機種ページ・公式コンテンツ一覧を確認したが、本機固有のQR遊技履歴連動/データ書き出し機能は公開資料で確認できなかった。QRという一般導線と実機連動を混同せずREFERENCEとして保持。'
          };
          for(const id of ids){
            const p=`research/${id}/research-data.json`;
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            if(d.machine?.machineId!==id) throw new Error(`machineId mismatch ${id}`);
            for(const item of d.discoveryInventory??[]){
              if(item.transferStatus!=='UNRESOLVED') continue;
              const key=`${id}:${item.discoveryCandidateId}`;
              const note=dispositions[key];
              if(!note) throw new Error(`unexpected unresolved candidate ${key} ${item.name}`);
              item.transferStatus='REFERENCE';
              item.note=note;
            }
            d.researchStage='GATE_A_PASS';
            fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          }
          NODE
      - name: Validate exact Gate A scope
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA)
          for id in "${ids[@]}"; do node tools/validate-research-data.mjs "research/$id/research-data.json"; done
          node tools/discovery-completeness-gate.mjs "${ids[@]}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          let features=0,evidence=0,discovery=0,reference=0;const errors=[];
          for(const id of ids){const d=JSON.parse(fs.readFileSync(`research/${id}/research-data.json`));if(d.researchStage!=='GATE_A_PASS')errors.push(`${id}: stage=${d.researchStage}`);const u=(d.discoveryInventory??[]).filter(x=>x.transferStatus==='UNRESOLVED');if(u.length)errors.push(`${id}: unresolved=${u.map(x=>x.discoveryCandidateId).join(',')}`);features+=(d.features??[]).length;evidence+=(d.evidenceCandidates??[]).length;discovery+=(d.discoveryInventory??[]).length;reference+=(d.discoveryInventory??[]).filter(x=>x.transferStatus==='REFERENCE').length;}
          if(errors.length)throw new Error(errors.join('\n'));
          const report=`# SloAnalytica 2026-09-07 Next10 — Gate A Research checkpoint\n\n## Status\n\n**Gate A / Research: PASS**\n\n- exact batch scope: 10/10\n- ResearchData validator: 10/10 PASS\n- Discovery Completeness: PASS\n- unresolved Discovery candidates: 0\n- features: ${features}\n- evidence candidates: ${evidence}\n- discovery candidates: ${discovery}\n- reference candidates: ${reference}\n- public main: unchanged\n\n## Research policy notes\n\nREFERENCE retains discovered candidates that are real research subjects but either lack a complete public setting-specific numeric table, are non-hard tendencies, or have no confirmed machine-specific linked-service data contract. They are not silently dropped and do not imply Selection adoption.\n\nJormungand Kerotto trophy semantics remain REFERENCE because the currently found public description labels them as prediction based on prior machines; they are not promoted to Hard Evidence.\n\nLinked services positively confirmed in this batch include MySlot for Kabaneri, SloPla NEXT for Jormungand, Daitomo for Shinuchi Yoshimune, and UniMemo for Million God. Other machines retain the result of the public-service discovery audit without claiming non-support where no definitive manufacturer statement exists.\n`;
          fs.writeFileSync('reports/batch-20260907-gate-a-completion.md',report);
          console.log(JSON.stringify({machines:10,features,evidence,discovery,reference,unresolved:0},null,2));
          NODE
      - name: Commit canonical Gate A state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_FIRE_FORCE_2/research-data.json research/L_UMINEKO_2_A1/research-data.json research/L_KABANERI_UNATO_KESSEN_XX/research-data.json research/L_JORMUNGAND_ND01G/research-data.json research/LB_TRIPLE_CROWN_SEVEN_FG/research-data.json research/L_SHINUCHI_YOSHIMUNE_A1/research-data.json research/L_KYOKOU_SUIRI_ST/research-data.json research/L_AKUDAMA_DRIVE_TP/research-data.json research/L_MILLION_GOD_KISEKI_CX/research-data.json research/L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA/research-data.json reports/batch-20260907-gate-a-completion.md
          if git diff --cached --quiet; then echo 'No canonical changes.'; else git commit -m 'GateA: finalize 20260907 Next10 research'; git push origin HEAD:batch/20260907-next10-gatea; fi
