name: Batch 20260903 Registration Map Capture
on:
  push:
    branches: [batch/20260903-hanagasa-ultraman]
    paths: ['.github/workflows/batch-20260903-registration-map-capture.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260903-hanagasa-ultraman
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply in disposable worktree state and capture IDs
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          npm run machine:publish:batch -- --apply \
            L_ULTRAMAN_KE L_GUILTY_CROWN_2_XF LB_JACKPOT_CY1 LB_1000CHAN_ALPHA_L3 L_DMC5_ST_XA \
            S_KABANERI_ZR LB_NEW_PULSAR_BT_C9 LB_PREMIUM_UMAIBO_S1 L_TOLOVE_DARKNESS_S8 L_HANAGASA_NA
          node --input-type=module <<'NODE' > /tmp/map.json
          import fs from 'node:fs';
          const ids=['L_HANAGASA_NA','L_TOLOVE_DARKNESS_S8','LB_PREMIUM_UMAIBO_S1','LB_NEW_PULSAR_BT_C9','S_KABANERI_ZR','L_DMC5_ST_XA','LB_1000CHAN_ALPHA_L3','LB_JACKPOT_CY1','L_GUILTY_CROWN_2_XF','L_ULTRAMAN_KE'];
          const r=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const es=r.machines??r.entries??r;
          console.log(JSON.stringify(ids.map(id=>{const x=es.find(e=>e.machineId===id);return {machineId:id,provisionalRegistrationId:x?.provisionalRegistrationId??null,registrationId:x?.registrationId??null};}),null,2));
          NODE
          git reset --hard "$base"
          cp /tmp/map.json reports/batch-20260903-registration-map.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/batch-20260903-registration-map.json
          git commit -m 'audit: capture 20260903 registration map'
          git pull --rebase origin batch/20260903-hanagasa-ultraman
          git push origin HEAD:batch/20260903-hanagasa-ultraman
