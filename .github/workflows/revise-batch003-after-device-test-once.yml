name: Revise Batch 003 After Device Test Once

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - .github/workflows/revise-batch003-after-device-test-once.yml

permissions:
  contents: write
  actions: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch shared builder policies
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tools/build-machine-data.mjs';
          let s=fs.readFileSync(p,'utf8');

          const oldDefault='  const defaultValue=x.defaultValue!==undefined?x.defaultValue:\n    x.type==="boolean"?false:x.type==="multi_enum"?[]:x.type==="enum"?"__UNSET__":0;';
          const newDefault='  const defaultValue=x.category==="PREDECESSOR"?"":x.defaultValue!==undefined?x.defaultValue:\n    x.type==="boolean"?false:x.type==="multi_enum"?[]:x.type==="enum"?"__UNSET__":0;';
          if(s.includes(oldDefault)) s=s.replace(oldDefault,newDefault);
          else if(!s.includes('x.category==="PREDECESSOR"?""')) throw new Error('predecessor blank-default anchor not found');

          const oldReturn='  return {\n    schemaVersion:"selection-summary-v1",\n    evaluatedCount:selected.length+rejected.length,\n    selectedCount:selected.length,\n    rejectedCount:rejected.length,\n    selected,rejected\n  };';
          const newReturn='  const selectedResearchIds=new Set((selection.features??[]).map(sf=>sf.researchFeatureId));\n  for(const rf of research.features??[]){\n    if(!rf?.researchFeatureId || selectedResearchIds.has(rf.researchFeatureId) || rf.factStatus!=="verified") continue;\n    const reason=String(rf.notes??"").trim();\n    rejected.push({featureId:`REJECTED_${rf.researchFeatureId}`,name:rf.name,reason:reason||"設定差候補として調査しましたが、1日の実戦での情報量・観測条件・既採用要素との重複を考慮し、推測計算には採用していません。"});\n  }\n  return {\n    schemaVersion:"selection-summary-v1",\n    evaluatedCount:selected.length+rejected.length,\n    selectedCount:selected.length,\n    rejectedCount:rejected.length,\n    selected,rejected\n  };';
          if(s.includes(oldReturn)) s=s.replace(oldReturn,newReturn);
          else if(!s.includes('const selectedResearchIds=new Set')) throw new Error('selection summary anchor not found');
          fs.writeFileSync(p,s,'utf8');
          NODE

      - name: Patch machine-specific Research and Selection
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const upsert=(arr,key,obj)=>{ const i=arr.findIndex(x=>x[key]===obj[key]); if(i>=0) arr[i]=obj; else arr.push(obj); };
          const addSource=(r,src)=>{ if(!r.sources.some(x=>x.sourceId===src.sourceId)) r.sources.push(src); };
          const featureById=(r,id)=>r.features.find(x=>x.researchFeatureId===id);

          // TOARU: use CZ only for own-session numeric inference; AT is strongly dependent on CZ route and no clean setting-specific CZ success table is verified.
          {
            const rp='research/L_TOARU_INDEX_JC/research-data.json', sp='research/L_TOARU_INDEX_JC/selection-data.json';
            const r=read(rp), s=read(sp);
            const at=featureById(r,'RF_AT_INITIAL');
            if(at) at.notes='AT初当りにも設定差はあるが、通常時ATの主要経路がCZ成功でCZ初当りと強く相関する。CZ成功率そのものを設定別に分離できる信頼できる公開表を確認できないため、CZとATを独立尤度として二重計上せず、自分区間は高頻度なCZ初当りを採用する。';
            s.inputs=s.inputs.filter(x=>x.id!=='INP_AT_COUNT');
            s.features=s.features.filter(x=>x.researchFeatureId!=='RF_AT_INITIAL');
            s.uiCategoryLabels={...(s.uiCategoryLabels||{}),PRIMARY:'CZ初当り'};
            write(rp,r); write(sp,s);
          }

          // MADOKA: BIG promotion feature + generic denial labels + petit-bonus character denial evidence.
          {
            const rp='research/L_MADOKA_FORTE_UU/research-data.json', sp='research/L_MADOKA_FORTE_UU/selection-data.json';
            const r=read(rp), s=read(sp);
            addSource(r,{sourceId:'SRC_MADO_PETIT_UPGRADE',publisher:'パチマガスロマガ',title:'まどかチャンス中の抽選 プチボからBIGへの昇格',url:'https://cs62.cs-plaza.com/g/pachi/pla/s_conq/macy_slot/56/tj09.php',checkedAt:'2026-08-19',sourceType:'major_analysis'});
            addSource(r,{sourceId:'SRC_MADO_PETIT_CHAR',publisher:'なな徹',title:'プチボーナス中のキャラ紹介による設定示唆',url:'https://nana-press.com/kaiseki/machine/626/17767/',checkedAt:'2026-08-19',sourceType:'major_analysis'});
            upsert(r.features,'researchFeatureId',{
              researchFeatureId:'RF_PETIT_BIG_UPGRADE',name:'プチボーナス当選時のBIG昇格',factStatus:'verified',candidateModel:'binomial',trialUnit:'対象プチボーナス当選',observationScope:'まどかチャンス3G目の小役非入賞からプチボーナス当選となるケース',numeratorDefinition:'対象ケースからBIGへ昇格した回数',denominatorDefinition:'3G目小役非入賞でプチボーナス当選対象となった回数',settingValues:{SET_1:{probability:0.063,rawDisplay:'6.3%'},SET_2:{probability:0.094,rawDisplay:'9.4%'},SET_3:{probability:0.125,rawDisplay:'12.5%'},SET_4:{probability:0.156,rawDisplay:'15.6%'},SET_5:{probability:0.180,rawDisplay:'18.0%'},SET_6:{probability:0.199,rawDisplay:'19.9%'}},sourceRefs:['SRC_MADO_PETIT_UPGRADE'],crossSourceStatus:'multi_source_consistent',notes:'設定1から6で約3.2倍。対象条件を明確に判別でき、1試行あたりの情報量が高いため補助採用する。通常ゲーム数への発生Exposureは安定換算できないためDifficultyには含めない。'
            });
            const evs=[
              ['RE_PETIT_2PLUS_DENY3','プチボ中キャラ紹介：設定2以上・設定3否定',['SET_2','SET_4','SET_5','SET_6'],['SET_1','SET_3']],
              ['RE_PETIT_2PLUS_DENY4','プチボ中キャラ紹介：設定2以上・設定4否定',['SET_2','SET_3','SET_5','SET_6'],['SET_1','SET_4']],
              ['RE_PETIT_2PLUS_DENY5','プチボ中キャラ紹介：設定2以上・設定5否定',['SET_2','SET_3','SET_4','SET_6'],['SET_1','SET_5']],
              ['RE_PETIT_3PLUS_DENY4','プチボ中キャラ紹介：設定3以上・設定4否定',['SET_3','SET_5','SET_6'],['SET_1','SET_2','SET_4']],
              ['RE_PETIT_3PLUS_DENY5','プチボ中キャラ紹介：設定3以上・設定5否定',['SET_3','SET_4','SET_6'],['SET_1','SET_2','SET_5']]
            ];
            for(const [id,name,allowed,denied] of evs) upsert(r.evidenceCandidates,'researchEvidenceId',{researchEvidenceId:id,name,factStatus:'verified',observationScope:'プチボーナス中キャラ紹介',allowedSettings:allowed,deniedSettings:denied,sourceRefs:['SRC_MADO_PETIT_CHAR'],notes:name});
            const newInputs=[
              {id:'INP_PETIT_BIG_TRIALS',name:'BIG昇格抽選 対象回数',type:'counter',category:'PETIT_BIG_UPGRADE',unit:'回',displayOrder:40,description:'まどかチャンス3G目の小役非入賞で、プチボーナス当選対象となった回数を入力します。',defaultValue:0},
              {id:'INP_PETIT_BIG_UPGRADE',name:'BIG昇格回数',type:'counter',category:'PETIT_BIG_UPGRADE',unit:'回',displayOrder:41,description:'対象ケースからBIGへ昇格した回数を入力します。',defaultValue:0}
            ];
            for(const x of newInputs) upsert(s.inputs,'id',x);
            upsert(s.features,'researchFeatureId',{researchFeatureId:'RF_PETIT_BIG_UPGRADE',featureId:'FEAT_PETIT_BIG_UPGRADE',adoptionCategory:'INCLUDE_SUPPORT',numeratorInputId:'INP_PETIT_BIG_UPGRADE',denominatorInputId:'INP_PETIT_BIG_TRIALS',minimumSample:1,sampleRecommendation:40,weight:1,displayFormat:'percent',difficultyParticipation:'EXCLUDE',userReason:'プチボーナス当選時のBIG昇格率は設定1の6.3%から設定6の19.9%まで約3.2倍。対象条件を実戦で判別できるため補助採用する。',difficultyExclusionReason:'対象ケースの発生回数を通常ゲーム数へ安定換算できないためDifficultyには含めない。'});
            const denial=s.evidenceUi.groups.find(g=>g.groupId==='SETTING_DENIAL');
            if(denial){
              for(const o of denial.options){ if(o.value==='CZ_END_DENY_2') o.label='CZ終了時：設定2否定'; if(o.value==='CZ_END_DENY_1_3') o.label='CZ終了時：設定1・3否定'; }
            }
            const petitGroup={groupId:'PETIT_CHARACTER_DENIAL',label:'プチボ中キャラ紹介（設定下限・否定）',selectionMode:'multi',normalizationMode:'ALLOWED_SETTINGS',options:[
              {value:'PETIT_2PLUS_DENY3',label:'設定2以上・設定3否定',allowedSettings:['SET_2','SET_4','SET_5','SET_6'],excludedSettings:['SET_1','SET_3'],sourceEvidenceIds:['RE_PETIT_2PLUS_DENY3']},
              {value:'PETIT_2PLUS_DENY4',label:'設定2以上・設定4否定',allowedSettings:['SET_2','SET_3','SET_5','SET_6'],excludedSettings:['SET_1','SET_4'],sourceEvidenceIds:['RE_PETIT_2PLUS_DENY4']},
              {value:'PETIT_2PLUS_DENY5',label:'設定2以上・設定5否定',allowedSettings:['SET_2','SET_3','SET_4','SET_6'],excludedSettings:['SET_1','SET_5'],sourceEvidenceIds:['RE_PETIT_2PLUS_DENY5']},
              {value:'PETIT_3PLUS_DENY4',label:'設定3以上・設定4否定',allowedSettings:['SET_3','SET_5','SET_6'],excludedSettings:['SET_1','SET_2','SET_4'],sourceEvidenceIds:['RE_PETIT_3PLUS_DENY4']},
              {value:'PETIT_3PLUS_DENY5',label:'設定3以上・設定5否定',allowedSettings:['SET_3','SET_4','SET_6'],excludedSettings:['SET_1','SET_2','SET_5'],sourceEvidenceIds:['RE_PETIT_3PLUS_DENY5']}
            ]};
            const gi=s.evidenceUi.groups.findIndex(g=>g.groupId===petitGroup.groupId); if(gi>=0)s.evidenceUi.groups[gi]=petitGroup; else s.evidenceUi.groups.push(petitGroup);
            s.uiCategoryLabels={...(s.uiCategoryLabels||{}),PETIT_BIG_UPGRADE:'プチボーナス BIG昇格'};
            write(rp,r); write(sp,s);
          }

          // RINKAKE: Kiku re-entry included; non-rare success researched but excluded for insufficient daily trials.
          {
            const rp='research/L_RING_NI_KAKERO1_FS/research-data.json', sp='research/L_RING_NI_KAKERO1_FS/selection-data.json';
            const r=read(rp), s=read(sp);
            addSource(r,{sourceId:'SRC_RING_KIKU',publisher:'P-WORLD',title:'L リングにかけろ1 V 菊チャンス関連',url:'https://www.p-world.co.jp/machine/database/9934',checkedAt:'2026-08-19',sourceType:'major_analysis'});
            upsert(r.features,'researchFeatureId',{researchFeatureId:'RF_KIKU_REENTRY',name:'菊チャンス失敗後の再突入',factStatus:'verified',candidateModel:'binomial',trialUnit:'菊チャンス失敗',observationScope:'菊チャンス失敗後',numeratorDefinition:'失敗後に菊チャンスへ再突入した回数',denominatorDefinition:'菊チャンス失敗回数',settingValues:{SET_1:{probability:0.1992,rawDisplay:'19.92%'},SET_2:{probability:0.2148,rawDisplay:'21.48%'},SET_3:{probability:0.2344,rawDisplay:'23.44%'},SET_4:{probability:0.2539,rawDisplay:'25.39%'},SET_5:{probability:0.2930,rawDisplay:'29.30%'},SET_6:{probability:0.3320,rawDisplay:'33.20%'}},sourceRefs:['SRC_RING_KIKU'],crossSourceStatus:'multi_source_consistent',notes:'設定1から6で約1.67倍。失敗回数を分母として明確に観測できるため補助採用。設定1対6の分離には多数試行が必要なので単独判断はしない。'});
            upsert(r.features,'researchFeatureId',{researchFeatureId:'RF_KIKU_NONRARE_SUCCESS',name:'菊チャンス中 非レア役成功',factStatus:'verified',candidateModel:'binomial',trialUnit:'非レア役成立の菊チャンス',observationScope:'菊チャンス中',numeratorDefinition:'非レア役で成功した回数',denominatorDefinition:'非レア役成立の菊チャンス回数',settingValues:{SET_1:{probability:0.0039,rawDisplay:'0.39%'},SET_2:{probability:0.0039,rawDisplay:'0.39%'},SET_3:{probability:0.0039,rawDisplay:'0.39%'},SET_4:{probability:0.0078,rawDisplay:'0.78%'},SET_5:{probability:0.0117,rawDisplay:'1.17%'},SET_6:{probability:0.0156,rawDisplay:'1.56%'}},sourceRefs:['SRC_RING_KIKU'],crossSourceStatus:'multi_source_consistent',notes:'設定1対6で4倍だが絶対確率が0.39%～1.56%と低く、1日の実戦では有効試行が不足しやすい。概算で数百回規模の対象試行が必要なため推測計算には不採用。非レア役成功が複数回出た場合の参考情報として扱う。'});
            for(const x of [
              {id:'INP_KIKU_FAILURES',name:'菊チャンス失敗回数',type:'counter',category:'KIKU_REENTRY',unit:'回',displayOrder:30,defaultValue:0},
              {id:'INP_KIKU_REENTRY',name:'失敗後の再突入回数',type:'counter',category:'KIKU_REENTRY',unit:'回',displayOrder:31,defaultValue:0}
            ]) upsert(s.inputs,'id',x);
            upsert(s.features,'researchFeatureId',{researchFeatureId:'RF_KIKU_REENTRY',featureId:'FEAT_KIKU_REENTRY',adoptionCategory:'INCLUDE_SUPPORT',numeratorInputId:'INP_KIKU_REENTRY',denominatorInputId:'INP_KIKU_FAILURES',minimumSample:1,sampleRecommendation:80,weight:1,displayFormat:'percent',difficultyParticipation:'EXCLUDE',userReason:'菊チャンス失敗後の再突入率は19.92%～33.20%と段階的な設定差があり、失敗回数を明確な分母として数えられるため補助採用。',difficultyExclusionReason:'菊チャンス失敗回数を通常ゲーム数へ安定換算できないためDifficultyには含めない。'});
            s.uiCategoryLabels={...(s.uiCategoryLabels||{}),KIKU_REENTRY:'菊チャンス 再突入'};
            write(rp,r); write(sp,s);
          }

          // MONKEY: conditional white-voice distribution.
          {
            const rp='research/L_MONKEY_TURN5_CE/research-data.json', sp='research/L_MONKEY_TURN5_CE/selection-data.json';
            const r=read(rp), s=read(sp);
            addSource(r,{sourceId:'SRC_MONKEY_WHITE_VOICE',publisher:'なな徹',title:'激走チャージ終了時（サブ液晶）のセリフ振り分け',url:'https://nana-press.com/kaiseki/machine/644/18059/',checkedAt:'2026-08-19',sourceType:'major_analysis'});
            upsert(r.features,'researchFeatureId',{researchFeatureId:'RF_GEKSOU_WHITE_VOICE',name:'激走チャージ終了時 白セリフ内訳',factStatus:'verified',candidateModel:'multinomial',trialUnit:'白セリフ確認',observationScope:'激走チャージ終了時・白文字の2種類',categories:['基本白','偶数示唆白'],settingDistributions:{SET_1:{'基本白':0.5,'偶数示唆白':0.5},SET_2:{'基本白':0.4,'偶数示唆白':0.6},SET_4:{'基本白':0.4,'偶数示唆白':0.6},SET_5:{'基本白':0.7,'偶数示唆白':0.3},SET_6:{'基本白':0.4,'偶数示唆白':0.6}},sourceRefs:['SRC_MONKEY_WHITE_VOICE'],crossSourceStatus:'multi_source_consistent',notes:'白セリフ2種に限定した条件付き分布。設定5では基本白70%、設定2/4/6では40%と差が大きく、特に設定5対偶数高設定の識別に有効。'});
            for(const x of [
              {id:'INP_WHITE_VOICE_BASE',name:'白：基本パターン',type:'counter',category:'GEKSOU_WHITE_VOICE',unit:'回',displayOrder:30,description:'激走チャージ終了時、白文字の基本パターンを確認した回数。',defaultValue:0},
              {id:'INP_WHITE_VOICE_EVEN',name:'白：偶数示唆',type:'counter',category:'GEKSOU_WHITE_VOICE',unit:'回',displayOrder:31,description:'激走チャージ終了時、白文字の偶数示唆パターンを確認した回数。',defaultValue:0}
            ]) upsert(s.inputs,'id',x);
            upsert(s.features,'researchFeatureId',{researchFeatureId:'RF_GEKSOU_WHITE_VOICE',featureId:'FEAT_GEKSOU_WHITE_VOICE',adoptionCategory:'INCLUDE_SUPPORT',numeratorInputId:'INP_WHITE_VOICE_BASE',categoryInputIds:['INP_WHITE_VOICE_EVEN'],inputTransform:'sum_inputs_to_trials',minimumSample:1,sampleRecommendation:20,weight:1,difficultyParticipation:'EXCLUDE',userReason:'白セリフ2種類だけの条件付き分布なら観測条件が揃う。設定5と設定2/4/6で内訳差が大きいため補助採用。',difficultyExclusionReason:'白セリフ発生回数を通常ゲーム数へ安定換算できないためDifficultyには含めない。'});
            s.uiCategoryLabels={...(s.uiCategoryLabels||{}),GEKSOU_WHITE_VOICE:'激走チャージ終了時 白セリフ'};
            write(rp,r); write(sp,s);
          }

          // MAGIHALLO: descriptions + REG threshold multinomial.
          {
            const rp='research/L_MAGICAL_HALLOWEEN8_FE/research-data.json', sp='research/L_MAGICAL_HALLOWEEN8_FE/selection-data.json';
            const r=read(rp), s=read(sp);
            addSource(r,{sourceId:'SRC_MAGI8_REG_THRESHOLD',publisher:'なな徹',title:'マジカルハロウィン8 殲滅ボーナス 規定撃破数抽選',url:'https://nana-press.com/kaiseki/machine/627/18076/',checkedAt:'2026-08-19',sourceType:'major_analysis'});
            upsert(r.features,'researchFeatureId',{researchFeatureId:'RF_REG_REQUIRED_KILLS',name:'殲滅ボーナス 規定撃破数',factStatus:'verified',candidateModel:'multinomial',trialUnit:'判別できた殲滅ボーナス',observationScope:'殲滅ボーナス（規定撃破数を25/50/75/100体のいずれかに一意に判別できた回のみ）',categories:['25体','50体','75体','100体'],settingDistributions:{SET_1:{'25体':0.0078,'50体':0.0625,'75体':0.0938,'100体':0.8359},SET_2:{'25体':0.0156,'50体':0.125,'75体':0.125,'100体':0.7344},SET_3:{'25体':0.0625,'50体':0.25,'75体':0.1563,'100体':0.5313},SET_4:{'25体':0.3125,'50体':0.3125,'75体':0.1875,'100体':0.1875},SET_5:{'25体':0.3281,'50体':0.3281,'75体':0.2188,'100体':0.125},SET_6:{'25体':0.3438,'50体':0.3438,'75体':0.25,'100体':0.0625}},sourceRefs:['SRC_MAGI8_REG_THRESHOLD','SRC_MAGI8_NANA'],crossSourceStatus:'multi_source_consistent',notes:'25・50体選択率に超特大の設定差がある。一撃フラグやレア役多数による大量撃破などで規定数を一意に特定できない回は除外し、判別できた回だけを利用する。判別不能ケースは実戦上まれだが選択バイアスを完全には否定できないため補助Featureとする。'});
            const roleGames=s.inputs.find(x=>x.id==='INP_ROLE_GAMES'); if(roleGames) roleGames.description='実機連動機能を推奨。使用しない場合はARTのゲーム数をカウントします。';
            const coin=s.inputs.find(x=>x.id==='INP_COMMON_COIN'); if(coin) coin.description='実機連動機能を使用しない場合は、ART中のナビなしベルをカウントします。';
            const dok=s.inputs.find(x=>x.id==='INP_DOKOMAJI_ELIGIBLE_BONUS'); if(dok) dok.description='超高確中と判断できるボーナス、ART中ボーナス、および朝一30G程度のボーナスは除外して入力します。作戦室ステージは超高確濃厚です。';
            for(const x of [
              {id:'INP_REG_THRESHOLD_25',name:'25体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:40,description:'規定撃破数を25体と一意に判別できた殲滅ボーナスのみ入力します。',defaultValue:0},
              {id:'INP_REG_THRESHOLD_50',name:'50体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:41,description:'規定撃破数を50体と一意に判別できた殲滅ボーナスのみ入力します。',defaultValue:0},
              {id:'INP_REG_THRESHOLD_75',name:'75体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:42,description:'規定撃破数を75体と一意に判別できた殲滅ボーナスのみ入力します。',defaultValue:0},
              {id:'INP_REG_THRESHOLD_100',name:'100体規定 回数',type:'counter',category:'REG_THRESHOLD',unit:'回',displayOrder:43,description:'規定撃破数を100体と一意に判別できた殲滅ボーナスのみ入力します。一撃フラグやレア役多数などで規定数を特定できない回は、どの項目にも入力しません。',defaultValue:0}
            ]) upsert(s.inputs,'id',x);
            upsert(s.features,'researchFeatureId',{researchFeatureId:'RF_REG_REQUIRED_KILLS',featureId:'FEAT_REG_REQUIRED_KILLS',adoptionCategory:'INCLUDE_SUPPORT',numeratorInputId:'INP_REG_THRESHOLD_25',categoryInputIds:['INP_REG_THRESHOLD_50','INP_REG_THRESHOLD_75','INP_REG_THRESHOLD_100'],inputTransform:'sum_inputs_to_trials',minimumSample:1,sampleRecommendation:5,weight:0.8,difficultyParticipation:'EXCLUDE',userReason:'規定撃破数は25・50体を中心に設定差が非常に大きく、少数回でも情報量が高い。規定数を一意に判別できない回だけ除外して補助採用する。',difficultyExclusionReason:'殲滅ボーナス回数と判別不能率を通常ゲーム数へ安定換算できないためDifficultyには含めない。'});
            s.uiCategoryLabels={...(s.uiCategoryLabels||{}),REG_THRESHOLD:'REG 規定撃破数'};
            write(rp,r); write(sp,s);
          }
          NODE

      - name: Add regression tests
        run: |
          cat > test/predecessor-unentered-zero.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { buildMachineData } from '../tools/build-machine-data.mjs';
          test('PREDECESSOR defaults stay blank so denominator-only input cannot imply zero observed events',()=>{
            const r=JSON.parse(fs.readFileSync('research/L_HIGURASHI_GOU_SS/research-data.json','utf8'));
            const s=JSON.parse(fs.readFileSync('research/L_HIGURASHI_GOU_SS/selection-data.json','utf8'));
            const p=buildMachineData(r,s);
            const pred=p.inputs.inputs.filter(i=>i.category==='PREDECESSOR');
            assert.ok(pred.length>0);
            assert.ok(pred.every(i=>i.defaultValue===''));
          });
          test('unselected verified Research features are exposed with rejection explanations',()=>{
            const r=JSON.parse(fs.readFileSync('research/L_RING_NI_KAKERO1_FS/research-data.json','utf8'));
            const s=JSON.parse(fs.readFileSync('research/L_RING_NI_KAKERO1_FS/selection-data.json','utf8'));
            const p=buildMachineData(r,s);
            const rejected=p.selectionSummary.rejected.find(x=>x.name==='菊チャンス中 非レア役成功');
            assert.ok(rejected);
            assert.match(rejected.reason,/1日の実戦|数百回/);
          });
          EOF

      - name: Validate and regenerate batch 003
        run: >-
          npm run machine:batch --
          L_HIGURASHI_GOU_SS
          L_TOARU_INDEX_JC
          L_GEN_CHOMUGEN_PH
          L_MADOKA_FORTE_UU
          L_KENGAN_ASHURA_ND
          L_RING_NI_KAKERO1_FS
          L_MONKEY_TURN5_CE
          L_MAGICAL_HALLOWEEN8_FE
          L_KEIJI_SADO_ER
          L_BASILISK_KIZUNA2_TENZEN_ZN

      - name: Verify generated contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ids=['L_HIGURASHI_GOU_SS','L_TOARU_INDEX_JC','L_GEN_CHOMUGEN_PH','L_MADOKA_FORTE_UU','L_KENGAN_ASHURA_ND','L_RING_NI_KAKERO1_FS','L_MONKEY_TURN5_CE','L_MAGICAL_HALLOWEEN8_FE','L_KEIJI_SADO_ER','L_BASILISK_KIZUNA2_TENZEN_ZN'];
          for(const id of ids){ const p=JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`,'utf8')); const pred=p.inputs.inputs.filter(i=>i.category==='PREDECESSOR'); if(pred.some(i=>i.defaultValue!=='')) throw new Error(`${id}: predecessor default not blank`); }
          const toaru=JSON.parse(fs.readFileSync('machines/L_TOARU_INDEX_JC/machine-package.json','utf8')); if(toaru.features.features.some(f=>f.featureId==='FEAT_AT_INITIAL')) throw new Error('Toaru own AT feature still active');
          const mado=JSON.parse(fs.readFileSync('machines/L_MADOKA_FORTE_UU/machine-package.json','utf8')); if(!mado.features.features.some(f=>f.featureId==='FEAT_PETIT_BIG_UPGRADE')) throw new Error('Madoka upgrade feature missing');
          if(mado.evidence.evidences.filter(e=>e.sourceEvidenceRefs?.some?.(x=>String(x).includes('PETIT'))).length<5) throw new Error('Madoka petit denial evidence missing');
          const ring=JSON.parse(fs.readFileSync('machines/L_RING_NI_KAKERO1_FS/machine-package.json','utf8')); if(!ring.features.features.some(f=>f.featureId==='FEAT_KIKU_REENTRY')) throw new Error('Ring reentry missing');
          if(!ring.selectionSummary.rejected.some(x=>x.name==='菊チャンス中 非レア役成功')) throw new Error('Ring rejected explanation missing');
          const monkey=JSON.parse(fs.readFileSync('machines/L_MONKEY_TURN5_CE/machine-package.json','utf8')); if(!monkey.features.features.some(f=>f.featureId==='FEAT_GEKSOU_WHITE_VOICE')) throw new Error('Monkey white voice missing');
          const magi=JSON.parse(fs.readFileSync('machines/L_MAGICAL_HALLOWEEN8_FE/machine-package.json','utf8')); if(!magi.features.features.some(f=>f.featureId==='FEAT_REG_REQUIRED_KILLS')) throw new Error('Magihallo threshold missing');
          console.log('batch003 device-test revision verified');
          NODE

      - name: Publish all 10 changed packages
        run: >-
          npm run machine:publish:batch -- --apply
          L_HIGURASHI_GOU_SS
          L_TOARU_INDEX_JC
          L_GEN_CHOMUGEN_PH
          L_MADOKA_FORTE_UU
          L_KENGAN_ASHURA_ND
          L_RING_NI_KAKERO1_FS
          L_MONKEY_TURN5_CE
          L_MAGICAL_HALLOWEEN8_FE
          L_KEIJI_SADO_ER
          L_BASILISK_KIZUNA2_TENZEN_ZN

      - name: Commit generated and source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-machine-data.mjs test/predecessor-unentered-zero.test.mjs research machines catalog.json difficulty-catalog.json machine-registry.json reports || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: revise batch 003 after device test"
            git push origin HEAD:prototype-multi-machine
          fi

      - name: Deploy prototype Pages explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref prototype-multi-machine
