name: Sync catalog package metadata

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-catalog-package-metadata.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync catalog package metadata
        run: node tools/sync-catalog-package-metadata.mjs .

      - name: Verify catalog metadata is stable
        run: |
          git diff -- catalog.json
          cp catalog.json /tmp/catalog-after-first-sync.json
          node tools/sync-catalog-package-metadata.mjs .
          cmp --silent catalog.json /tmp/catalog-after-first-sync.json

      - name: Commit synchronized catalog
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "distribution: sync catalog package metadata"
          git push origin "HEAD:${{ github.ref_name }}"
