name: Batch 20260910 Next10 Registration Postpublish Diagnostic

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - '.github/workflows/batch-20260910-next10-registration-postpublish-diagnostic.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply in runner and capture exact assigned IDs
        shell: bash
        run: |
          set -euo pipefail
          ids='L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA'
          npm run machine:publish:batch -- --apply $ids >/tmp/publish.log 2>&1
          node --input-type=module <<'NODE' > batches/20260910-next10-v7/postpublish-registration-diagnostic.json
          import fs from 'node:fs';
          const ids=['L_YABACHIBA_ZM','L_NANGOKU_SPECIAL_M1','L_SENGOKU_COLLECTION6_KS','L_KARAKURI_CIRCUS2_JG','L_ULTRAMAN_FINAL_BATTLE_ME','L_WORLD_DAI_STAR_PA3','L_YAJIKITA_MAIRU_BG','L_TONDEMO_SKILL_KM','LB_TRIPLE_CROWN_X300','L_TOARU_INDEX2_FA'];
          const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8')).machines;
          const selected=ids.map(id=>{const r=registry.find(x=>x.machineId===id); return {machineId:id,provisionalRegistrationId:r?.provisionalRegistrationId??null,displayName:r?.displayName??null};});
          console.log(JSON.stringify({registryCount:registry.length,selected},null,2));
          NODE
          git restore -- catalog.json difficulty-catalog.json machine-registry.json reports 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batches/20260910-next10-v7/postpublish-registration-diagnostic.json
          git commit -m 'audit: capture postpublish registration assignments'
          git pull --rebase origin batch/20260910-next10-gate0-v2
          git push origin HEAD:batch/20260910-next10-gate0-v2
