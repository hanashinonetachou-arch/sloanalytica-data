name: Evidence UI Batch A Remediation

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - '.github/workflows/evidence-ui-gate0-batch-a-diagnostic.yml'
      - 'machines/**'
      - 'research/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-remediation-batch-a-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize audited Batch A machines
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            L_EVANGELION_MIRAI_JF
            L_KINNIKUMAN4_SLDC
            L_LOVEKYURE2_PS
            L_MAHJONG_FIGHT_CLUB_KAKUSEI_KM
            L_NOGIZAKA46_UD
            L_SAO_B2
            L_SENGOKU_BASARA_GIGA_ZE
            S_BOOWY_SV
          )
          mkdir -p /tmp/batch-a-materialized
          for id in "${ids[@]}"; do
            pkg="machines/$id/machine-package.json"
            ui="research/$id/ui-design-data.json"
            out="/tmp/batch-a-materialized/$id.json"
            node tools/materialize-ui-design-into-machine-package.mjs "$pkg" "$ui" "$out"
            mv "$out" "$pkg"
          done
      - name: Guard remediation scope and semantics
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(machines/(L_EVANGELION_MIRAI_JF|L_KINNIKUMAN4_SLDC|L_LOVEKYURE2_PS|L_MAHJONG_FIGHT_CLUB_KAKUSEI_KM|L_NOGIZAKA46_UD|L_SAO_B2|L_SENGOKU_BASARA_GIGA_ZE|S_BOOWY_SV)/machine-package\.json|\.github/workflows/evidence-ui-gate0-batch-a-diagnostic\.yml|reports/)'
          bad=$(git diff --name-only origin/prototype-multi-machine...HEAD; git diff --name-only) | sort -u | grep -Ev "$allowed" || true
          if [ -n "$bad" ]; then echo "Unexpected remediation paths:"; echo "$bad"; exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {execFileSync} from 'node:child_process';
          const ids=['L_EVANGELION_MIRAI_JF','L_KINNIKUMAN4_SLDC','L_LOVEKYURE2_PS','L_MAHJONG_FIGHT_CLUB_KAKUSEI_KM','L_NOGIZAKA46_UD','L_SAO_B2','L_SENGOKU_BASARA_GIGA_ZE','S_BOOWY_SV'];
          const stableInput = x => { const y=structuredClone(x); delete y.uiGridSpan; delete y.uiCompactCounter; return y; };
          for (const id of ids) {
            const p=`machines/${id}/machine-package.json`;
            const before=JSON.parse(execFileSync('git',['show',`origin/prototype-multi-machine:${p}`],{encoding:'utf8'}));
            const after=JSON.parse(fs.readFileSync(p,'utf8'));
            for (const k of ['machine','features','evidence','selectionSummary','reliability','metadata','validation','statistics']) {
              if (JSON.stringify(before[k])!==JSON.stringify(after[k])) throw new Error(`${id}: semantic block changed: ${k}`);
            }
            const bi=(before.inputs?.inputs??[]).map(stableInput), ai=(after.inputs?.inputs??[]).map(stableInput);
            if (JSON.stringify(bi)!==JSON.stringify(ai)) throw new Error(`${id}: input semantics changed`);
          }
          console.log('Semantic guard: PASS (features/evidence/settings/sources unchanged)');
          NODE
      - name: Selection validation
        run: npm run selection:validate
      - name: Observation validation
        run: npm run observation:validate
      - name: Canonical UI validation
        run: npm run ui-design:validate
      - name: Strict UI / Observation linkage
        run: npm run ui-design:observation:audit
      - name: Four-layer pipeline gate
        run: npm run pipeline:four-layer:gate
      - name: Evidence UI validator all
        run: node tools/validate-evidence-ui-all.mjs
      - name: Repository tests
        run: npm test
      - name: Gate 0 fixture tests
        run: npm run evidence-ui:gate0:test
      - name: Gate 0 after remediation
        shell: bash
        run: |
          set +e
          node tools/audit-evidence-ui-gate0.mjs --output=evidence-ui-gate0-after-batch-a.json
          rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          node tools/validate-evidence-ui-gate0-ledger.mjs evidence-ui-gate0-after-batch-a.json
          exit 0
      - name: Commit only validated machine artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add machines/L_EVANGELION_MIRAI_JF/machine-package.json \
                  machines/L_KINNIKUMAN4_SLDC/machine-package.json \
                  machines/L_LOVEKYURE2_PS/machine-package.json \
                  machines/L_MAHJONG_FIGHT_CLUB_KAKUSEI_KM/machine-package.json \
                  machines/L_NOGIZAKA46_UD/machine-package.json \
                  machines/L_SAO_B2/machine-package.json \
                  machines/L_SENGOKU_BASARA_GIGA_ZE/machine-package.json \
                  machines/S_BOOWY_SV/machine-package.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: materialize Evidence UI Batch A machine packages'
          git push origin HEAD:audit/evidence-ui-remediation-batch-a-20260915
