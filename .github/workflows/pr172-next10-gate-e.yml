name: PR172 Next10 Gate E Automated Quality Gate
# Re-run marker: validate the cleaned post-repair Next10 state before prototype fast-forward.

on:
  push:
    branches:
      - research/20260905-batch10-next
    paths:
      - .github/workflows/pr172-next10-gate-e.yml
      - machines/**
      - tools/**
      - package.json
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - .github/workflows/pr172-next10-gate-e.yml
      - machines/**
      - tools/**
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Next10 machine-package contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids = [
            'L_AZURLANE_THE_ANIMATION_KN',
            'L_DRUAGA_NO_TOU_ZA',
            'L_SMASLO_TOKYO_REVENGERS_ZF',
            'L_BABEL_BA',
            'L_SHIN_ONIMUSHA_3_SA',
            'L_ZENIGATA_5_L2',
            'L_TOARU_KAGAKU_NO_RAILGUN_2_FV',
            'L_ZETTAI_SHOGEKI_FORCE_FH',
            'L_KAKUMEIKI_VALVRAVE_2_JF',
            'L_NEO_PLANET_SLED',
          ];
          const failures = [];
          for (const id of ids) {
            const path = `machines/${id}/machine-package.json`;
            if (!fs.existsSync(path)) { failures.push(`${id}: machine-package missing`); continue; }
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (pkg.machine?.machineId !== id) failures.push(`${id}: machineId mismatch`);
            const inputs = new Map((pkg.inputs?.inputs ?? []).map(x => [x.id, x]));
            for (const f of pkg.features?.features ?? []) {
              for (const key of ['numeratorInputId','denominatorInputId']) {
                if (f[key] && !inputs.has(f[key])) failures.push(`${id}/${f.featureId}: missing ${key} ${f[key]}`);
              }
              for (const setting of pkg.machine?.settings ?? []) {
                if (f.probabilityEngineUsage !== false && f.modelType !== 'multinomial' && f.modelType !== 'conditional_partial_multinomial' && !Number.isFinite(Number(f.probabilities?.[setting]))) {
                  failures.push(`${id}/${f.featureId}: missing probability ${setting}`);
                }
              }
              for (const ref of f.sourceEvidenceRefs ?? []) {
                if (!(pkg.evidence?.sources ?? []).some(s => s.id === ref)) failures.push(`${id}/${f.featureId}: unknown source ${ref}`);
              }
            }
            for (const e of pkg.evidence?.evidences ?? []) {
              if (!inputs.has(e.inputId)) failures.push(`${id}/${e.id}: missing input ${e.inputId}`);
              for (const ref of e.sourceEvidenceRefs ?? []) {
                if (!(pkg.evidence?.sources ?? []).some(s => s.id === ref)) failures.push(`${id}/${e.id}: unknown source ${ref}`);
              }
            }
            const uiInputIds = new Set();
            for (const s of pkg.ui?.sections ?? []) {
              const visit = items => { for (const item of items ?? []) if (item?.type === 'input') uiInputIds.add(item.inputId); };
              visit(s.items);
              for (const tab of s.tabs ?? []) visit(tab.items);
            }
            for (const input of inputs.values()) {
              if (!uiInputIds.has(input.id)) failures.push(`${id}: input not materialized in UI ${input.id}`);
              if (['counter','integer','number'].includes(input.type)) {
                let contractOk = false;
                const visit = items => { for (const item of items ?? []) if (item?.type === 'input' && item.inputId === input.id && item.config?.emptyMeansUnobserved === true && item.config?.observedZeroAllowed === true) contractOk = true; };
                for (const s of pkg.ui?.sections ?? []) { visit(s.items); for (const tab of s.tabs ?? []) visit(tab.items); }
                if (!contractOk) failures.push(`${id}/${input.id}: UI must preserve empty=unobserved and explicit zero`);
              }
            }
          }
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`PASS: Next10 machine-package contracts ${ids.length}/10`);
          NODE

      - name: Repository-wide guard tests
        run: npm test

      - name: Public-data audit
        run: npm run audit

      - name: User-facing service-name audit
        run: npm run audit:ui-service-names

      - name: User-verified UX contract audit
        run: npm run ux-contract:audit

      - name: UI design tests
        run: npm run ui-design:test

      - name: Difficulty event/exposure tests
        run: |
          npm run difficulty:event-exposure:test
          npm run difficulty:exposure-audit

      - name: Registry baseline diagnostic
        continue-on-error: true
        run: npm run registry:validate

      - name: Gate E summary
        run: |
          echo 'Gate E checks completed for the 2026-09-05 Next10 batch.'
