name: Monkey V EX Compact UI One Shot

on:
  push:
    branches:
      - feature/monkey-v-ex-item-compact-ui

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monkey-v-ex-item-compact-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compact UI metadata
        run: node tools/tmp-compact-monkey-v-ex-ui.mjs
      - name: Rebuild and validate Monkey V
        run: npm run machine:batch -- L_MONKEY_TURN5_CE
      - name: Verify compact section contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('machines/L_MONKEY_TURN5_CE/machine-package.json','utf8'));
          const s=(p.ui?.sections??[]).find(x=>x.id==='AUTO_GEKSOU_EX_ITEM');
          if(!s) throw new Error('EX item section missing');
          if(!String(s.description||'').includes('強チェリーは全設定で獲得率100%')) throw new Error('section description missing');
          if((s.items??[]).length!==6 || s.items.some(i=>i.gridSpan!==6)) throw new Error('gridSpan 6 contract missing');
          const inputs=new Map((p.inputs?.inputs??[]).map(i=>[i.id,i]));
          for(const item of s.items) {
            if(inputs.get(item.inputId)?.description) throw new Error(`duplicate input description remains: ${item.inputId}`);
          }
          NODE
      - name: Commit generated changes
        run: |
          rm tools/tmp-compact-monkey-v-ex-ui.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-machine-data.mjs research/L_MONKEY_TURN5_CE machines/L_MONKEY_TURN5_CE reports difficulty-catalog.json machine-registry.json tools/tmp-compact-monkey-v-ex-ui.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Compact Monkey V EX item input layout"
          git push origin HEAD:feature/monkey-v-ex-item-compact-ui
