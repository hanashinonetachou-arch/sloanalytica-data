name: Batch 20260910 Next10 Identity Apply

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - .github/workflows/batch-20260910-next10-identity-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply machine identity metadata
        run: node tools/apply-machine-identity-classification.mjs --apply

      - name: Verify machine identity metadata
        run: node tools/apply-machine-identity-classification.mjs --verify

      - name: Public data audit
        run: node tools/audit-public-data.mjs

      - name: Repository tests
        run: npm test

      - name: Diff sanity check
        run: git diff --check

      - name: Commit identity outputs
        run: |
          if git diff --quiet; then
            echo "No generated identity changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json machine-identity-metadata.json machines
          git commit -m "data: sync Next10 machine identity metadata"
          git push origin HEAD:batch/20260910-next10-gate0-v2
