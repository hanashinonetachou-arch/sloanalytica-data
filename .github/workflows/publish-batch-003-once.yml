name: Publish Batch 003 Once

on:
  push:
    branches:
      - prototype-multi-machine
    paths:
      - .github/workflows/publish-batch-003-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish 10 machines
        run: >-
          npm run machine:publish:batch -- --apply
          L_HIGURASHI_GOU_SS
          L_TOARU_INDEX_JC
          L_GEN_CHOMUGEN_PH
          L_MADOKA_FORTE_UU
          L_KENGAN_ASHURA_ND
          L_RING_NI_KAKERO1_FS
          L_MONKEY_TURN5_CE
          L_MAGICAL_HALLOWEEN8_FE
          L_KEIJI_SADO_ER
          L_BASILISK_KIZUNA2_TENZEN_ZN
      - name: Commit published artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json difficulty-catalog.json machine-registry.json machines build || true
          if git diff --cached --quiet; then
            echo "No publish changes to commit"
          else
            git commit -m "publish: user-selected batch 003"
            git push origin HEAD:prototype-multi-machine
          fi
