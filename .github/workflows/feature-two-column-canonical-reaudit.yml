name: Feature Two-Column Canonical Reaudit

on:
  pull_request:
    branches:
      - prototype-multi-machine
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reaudit canonical Feature counter layout
        run: node tools/reaudit-feature-two-column-canonical.mjs --report reports/feature-two-column-canonical-reaudit.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: feature-two-column-canonical-reaudit
          path: reports/feature-two-column-canonical-reaudit.json
