name: MHW Evidence Pending Migration

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/apply-mhw-evidence-observation-pending.mjs'
      - '.github/workflows/mhw-evidence-pending-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/apply-mhw-evidence-observation-pending.mjs
      - name: Validate Selection Evidence disposition
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateSelectionEvidenceCoverage } from './tools/batch-completeness-gates.mjs';
          const s=JSON.parse(fs.readFileSync('research/S_MHW_ICEBORNE_ZF/selection-data.json','utf8'));
          const r=JSON.parse(fs.readFileSync('research/S_MHW_ICEBORNE_ZF/research-data.json','utf8'));
          const v=validateSelectionEvidenceCoverage(s,r,{required:true});
          if(!v.ok) throw new Error(v.errors.join('\n'));
          const exposed=(s.evidenceUi?.groups??[]).flatMap(g=>g.options??[]).some(o=>(o.sourceEvidenceIds??[]).includes('RE_HIGH_WEAK_SELIANA'));
          if(exposed) throw new Error('RE_HIGH_WEAK_SELIANA is still exposed');
          const excluded=(s.evidenceReview?.exclusions??[]).some(x=>x.researchEvidenceId==='RE_HIGH_WEAK_SELIANA');
          if(!excluded) throw new Error('RE_HIGH_WEAK_SELIANA exclusion missing');
          NODE
      - name: Rebuild target machine
        run: npm run machine:pipeline -- S_MHW_ICEBORNE_ZF --skip-repo-checks
      - name: Run full tests
        run: npm test
      - name: Run public audit
        run: npm run audit
      - name: Run UI service-name audit
        run: npm run audit:ui-service-names
      - name: Run target Observation linkage
        run: node tools/audit-observation-selection-linkage.mjs S_MHW_ICEBORNE_ZF --strict-v2
      - name: Run target four-layer gate
        run: node tools/four-layer-pipeline-gate.mjs S_MHW_ICEBORNE_ZF
      - name: Refresh semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Refresh causal audit
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Verify MHW pending Evidence is not reported as overlap
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=(r.machines??[]).find(x=>x.machineId==='S_MHW_ICEBORNE_ZF');
          if(!m) throw new Error('MHW semantic result missing');
          const bad=(m.issues??[]).some(i=>(i.relatedEvidence??[]).some(e=>e.researchEvidenceId==='RE_HIGH_WEAK_SELIANA'));
          if(bad) throw new Error('Pending Evidence still participates in semantic overlap audit');
          console.log('MHW status',m.status,'issues',(m.issues??[]).length);
          NODE
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: disposition unverified MHW Evidence [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
