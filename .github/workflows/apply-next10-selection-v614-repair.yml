name: Apply Next10 v6.14 selection repairs

on:
  push:
    branches:
      - audit/20260908-next10-selection-v614
    paths:
      - tools/repair-next10-selection-v614.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply canonical repairs
        run: node tools/repair-next10-selection-v614.mjs
      - name: Validate repaired Research/Selection
        run: |
          set -euo pipefail
          for id in LB_TRIPLE_CROWN_SEVEN_FG L_UMINEKO_2_A1; do
            node tools/validate-research-data.mjs "research/$id/research-data.json"
            node tools/validate-selection-data.mjs "research/$id/selection-data.json"
          done
          node tools/audit-selection-quality.mjs \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G \
            LB_TRIPLE_CROWN_SEVEN_FG L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP \
            L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA --strict
      - name: Contract assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const t=JSON.parse(fs.readFileSync('research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json','utf8'));
          const u=JSON.parse(fs.readFileSync('research/L_UMINEKO_2_A1/selection-data.json','utf8'));
          const feat=(s,id)=>s.features.find(f=>f.featureId===id);
          if(feat(t,'FEAT_SMALL_ROLE_COMPOSITION')?.adoptionCategory!=='INCLUDE_SUPPORT') throw new Error('Triple joint small-role feature missing');
          if(feat(t,'FEAT_PLUM')?.adoptionCategory!=='EXCLUDE') throw new Error('Triple standalone plum must be subsumed');
          if(feat(t,'FEAT_CHERRY')?.adoptionCategory!=='EXCLUDE') throw new Error('Triple standalone cherry must be subsumed');
          if(/入力負担|手動.*負担|カウント.*負担/.test(feat(t,'FEAT_BT_REPLAY_BB')?.userFacingReason??'')) throw new Error('BT reject still references burden');
          if(feat(u,'FEAT_ART_ROLE_COMPOSITION')?.adoptionCategory!=='INCLUDE_SUPPORT') throw new Error('Umineko ART joint feature missing');
          if(feat(u,'FEAT_ART_MISS')?.adoptionCategory!=='EXCLUDE' || feat(u,'FEAT_ART_COMMON_BELL')?.adoptionCategory!=='EXCLUDE') throw new Error('Umineko standalone ART features must be subsumed');
          console.log('PASS: v6.14 joint-model assertions');
          NODE
      - name: Commit repaired canonical data
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/LB_TRIPLE_CROWN_SEVEN_FG/research-data.json research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json \
                  research/L_UMINEKO_2_A1/research-data.json research/L_UMINEKO_2_A1/selection-data.json
          git commit -m 'fix: align Next10 selection with v6.14 dependency contract'
          git push origin HEAD:audit/20260908-next10-selection-v614
