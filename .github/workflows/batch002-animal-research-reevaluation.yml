name: Batch002 Animal Research Reevaluation

on:
  push:
    branches:
      - production/v85-batch-002-foundation-20261001
    paths:
      - production/.batch002-animal-research-reevaluation-trigger

permissions:
  contents: write

concurrency:
  group: batch002-animal-research-reevaluation
  cancel-in-progress: false

jobs:
  reevaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/v85-batch-002-foundation-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate production foundation
        working-directory: production
        run: npm test
      - name: Invalidate Animal from Research
        working-directory: production
        run: node --experimental-strip-types src/invalidate-machine-downstream.ts batch-20261001-002 L_ANIMAL_SLOT_DOCCHI_ZT --include-research
      - name: Rematerialize Wave 2 Research draft
        working-directory: production
        run: node --experimental-strip-types src/materialize-research-drafts.ts batch-20261001-002 wave-2
      - name: Regenerate through App Runtime
        working-directory: production
        run: node --experimental-strip-types src/deterministic-production-worker.ts batch-20261001-002 --through APP_RUNTIME
      - name: Validate resulting state
        working-directory: production
        run: npm test
      - name: Commit authoritative reevaluation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261001-002
          if git diff --cached --quiet; then
            echo "No authoritative state changes."
            exit 0
          fi
          git commit -m "Reevaluate Animal small-role feature from Research [skip ci]"
          git push origin HEAD:production/v85-batch-002-foundation-20261001
