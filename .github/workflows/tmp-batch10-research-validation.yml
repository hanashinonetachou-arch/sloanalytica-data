name: Temporary Batch10 Research Validation

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-batch10-research-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate batch10 ResearchData
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            S_ANOTHER_GOD_HADES_SL
            S_OVERLORD_II_SX
            S_GUNDAM_UNICORN_SF
            S_SENGOKU_COLLECTION5_PS
            L_CHO_HANAMATSURI_PB
            L_DOUBLE_ATTACK2_EX
            S_SLODOL_PK
            L_MOMOTARO_DENTETSU_TEIBAN_PU
            L_LUPIN_DAIKOUKAISHA_H1
            L_SMASLO_DUNBINE_MF
          )
          for id in "${ids[@]}"; do
            echo "=== $id ==="
            npm run research:validate -- "research/$id/research-data.json"
          done
