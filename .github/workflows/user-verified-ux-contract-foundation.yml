name: User-Verified UX Contract Foundation

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'UX_CONTRACT_POLICY.md'
      - 'ux-contracts/**'
      - 'tools/audit-user-verified-ux-contracts.mjs'
      - 'tools/apply-user-verified-ux-contract-foundation.mjs'
      - '.github/workflows/user-verified-ux-contract-foundation.yml'

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UX contract foundation
        run: node tools/apply-user-verified-ux-contract-foundation.mjs
      - name: Validate C.C. SelectionData
        run: npm run selection:validate -- research/S_CODE_GEASS_3_CC_FS/selection-data.json research/S_CODE_GEASS_3_CC_FS/research-data.json
      - name: Rebuild C.C.
        run: npm run machine:pipeline -- S_CODE_GEASS_3_CC_FS
      - name: Verify UX contract and repository
        run: |
          npm run ux-contract:audit
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Commit permanent changes and generated data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-machine-data.mjs tools/validate-selection-data.mjs tools/guard-machine-pipeline.mjs package.json research/S_CODE_GEASS_3_CC_FS/selection-data.json machines/S_CODE_GEASS_3_CC_FS/machine-package.json catalog.json difficulty-catalog.json research/S_CODE_GEASS_3_CC_FS UX_CONTRACT_POLICY.md ux-contracts tools/audit-user-verified-ux-contracts.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: preserve user-verified UX through MachineData rebuilds'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
