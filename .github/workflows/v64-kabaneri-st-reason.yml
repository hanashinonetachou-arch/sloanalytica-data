name: v6.4 Kabaneri ST Reason

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-kabaneri-st-reason.mjs'
      - 'tools/audit-v64-causal-relations.mjs'
      - 'test/v64-causal-relation-audit.test.mjs'
      - '.github/workflows/v64-kabaneri-st-reason.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run reason migration
        run: node tools/migrate-v64-kabaneri-st-reason.mjs .
      - name: Apply reason migration
        run: node tools/migrate-v64-kabaneri-st-reason.mjs . --apply
      - name: Rebuild Kabaneri package
        run: npm run machine:pipeline -- S_KABANERI_ZR --skip-repo-checks
      - name: Refresh semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Refresh causal review
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Run causal regression
        run: node --test test/v64-causal-relation-audit.test.mjs
      - name: Assert only Iceborne remains in causal review
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const semantic=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const k=semantic.machines.find(x=>x.machineId==='S_KABANERI_ZR');
          if((k?.issues??[]).some(x=>x.code==='CAUSAL_RELATION_REJECT_CANDIDATE')) throw new Error('Kabaneri still in causal review');
          const causal=JSON.parse(fs.readFileSync('reports/v64-causal-relation-review.json','utf8'));
          if(causal.summary.candidateCount!==11 || causal.summary.machineCount!==1) throw new Error(`unexpected causal baseline ${JSON.stringify(causal.summary)}`);
          if(!causal.candidates.every(x=>x.machineId==='S_MHW_ICEBORNE_ZF')) throw new Error('unexpected non-Iceborne causal candidate');
          console.log('PASS only Monster Hunter Iceborne remains');
          NODE
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/S_KABANERI_ZR machines/S_KABANERI_ZR catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "audit: clarify Kabaneri ST exclusion"
            git push origin HEAD:prototype-multi-machine
          fi
