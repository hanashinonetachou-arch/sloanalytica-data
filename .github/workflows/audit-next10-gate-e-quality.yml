name: Next10 isolated Gate E quality

on:
  push:
    branches:
      - audit/20260907-next10-research-universe

permissions:
  contents: read

concurrency:
  group: next10-gate-e-quality
  cancel-in-progress: false

jobs:
  gate-e:
    if: ${{ !contains(github.event.head_commit.message, '[gate-e-triggered]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Define exact Next10 scope
        run: |
          cat > /tmp/gate-e-machines.txt <<'EOF'
          L_FIRE_FORCE_2
          L_UMINEKO_2_A1
          L_KABANERI_UNATO_KESSEN_XX
          L_JORMUNGAND_ND01G
          LB_TRIPLE_CROWN_SEVEN_FG
          L_SHINUCHI_YOSHIMUNE_A1
          L_KYOKOU_SUIRI_ST
          L_AKUDAMA_DRIVE_TP
          L_MILLION_GOD_KISEKI_CX
          L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
          EOF
          test "$(wc -l < /tmp/gate-e-machines.txt)" -eq 10
          test "$(sort /tmp/gate-e-machines.txt | uniq | wc -l)" -eq 10
      - name: Research validation 10/10
        run: while read -r id; do npm run research:validate -- "research/$id/research-data.json"; done < /tmp/gate-e-machines.txt
      - name: Selection validation 10/10
        run: while read -r id; do npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"; done < /tmp/gate-e-machines.txt
      - name: Selection Quality strict
        run: node tools/audit-selection-quality.mjs $(cat /tmp/gate-e-machines.txt) --strict
      - name: Observation validation 10/10
        run: |
          args=(); while read -r id; do args+=("research/$id/machine-observation-data.json"); done < /tmp/gate-e-machines.txt
          npm run observation:validate -- "${args[@]}"
      - name: Selection Observation strict linkage
        run: npm run observation:selection:audit -- $(cat /tmp/gate-e-machines.txt) --strict-v2
      - name: UI Design validation and linkages
        run: |
          npm run ui-design:validate
          npm run ui-design:linkage:audit -- . $(cat /tmp/gate-e-machines.txt)
          npm run ui-design:observation:audit -- $(cat /tmp/gate-e-machines.txt) --strict-v2
      - name: Four-layer Pipeline Gate
        run: npm run pipeline:four-layer:gate -- $(cat /tmp/gate-e-machines.txt)
      - name: Re-audit semantic regression assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const errors=[];
          for(const id of ids){
            const s=read(`research/${id}/selection-data.json`);
            const o=read(`research/${id}/machine-observation-data.json`);
            const ui=read(`research/${id}/ui-design-data.json`);
            const inc=(s.features??[]).filter(f=>String(f.adoptionCategory??'').startsWith('INCLUDE'));
            const maps=new Map((o.featureMappings??[]).map(m=>[m.featureId,m]));
            for(const f of inc) if(!maps.get(f.featureId)?.usableForInference) errors.push(`${id}: adopted ${f.featureId} lacks inference Observation mapping`);
            const expected=(s.inputs??[]).filter(i=>i.inferenceRole!=='EXCLUDE').map(i=>i.id);
            const actual=Object.values(ui.sections??{}).flatMap(sec=>sec.inputIds??[]);
            if(expected.length!==actual.length || expected.some(x=>!actual.includes(x))) errors.push(`${id}: UI input set differs from Selection`);
          }
          const tc=read('research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json');
          if(tc.features.find(f=>f.researchFeatureId==='RF_PLUM')?.adoptionCategory!=='EXCLUDE') errors.push('Triple Crown plum must remain EXCLUDE');
          const tcui=read('research/LB_TRIPLE_CROWN_SEVEN_FG/ui-design-data.json');
          if(Object.values(tcui.sections??{}).flatMap(s=>s.inputIds??[]).some(x=>String(x).includes('PLUM'))) errors.push('Triple Crown plum reappeared in UI');
          const jo=read('research/L_JORMUNGAND_ND01G/selection-data.json');
          const jf=jo.features.find(f=>f.featureId==='FEAT_BONUS_END_SCREEN');
          if(JSON.stringify(jf?.categoryExcludeLabels??[])!==JSON.stringify(['HANDGUN_SHELL','OLD_KOKO_TEAM','KASPER','GOLDEN_SCARECROW'])) errors.push('Jormungand Evidence exclusions regressed');
          const noLinked=['L_FIRE_FORCE_2','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','LB_TRIPLE_CROWN_SEVEN_FG'];
          for(const id of noLinked){const o=read(`research/${id}/machine-observation-data.json`);if(o.sourceCoverage?.linkedService!=='CHECKED_NONE') errors.push(`${id}: linkedService coverage regressed`);}
          if(errors.length) throw new Error(errors.join('\n'));
          console.log(JSON.stringify({status:'PASS',machines:10},null,2));
          NODE
      - name: MachineData materialization stability and migration audit
        run: |
          node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/gate-e-machines.txt)
          npm run selection:migration-audit
      - name: Optional contracts
        run: |
          found=0
          while read -r id; do
            while IFS= read -r f; do [ -n "$f" ] || continue; found=1; npm run denominator:validate -- "$f"; done < <(find "research/$id" -type f -name 'denominator-resolution*.json' -print 2>/dev/null || true)
            for f in "research/$id/evidence-ui.json" "machines/$id/evidence-ui.json"; do
              if [ -f "$f" ]; then found=1; npm run evidence-ui:validate -- "$f" "research/$id/research-data.json"; fi
            done
          done < /tmp/gate-e-machines.txt
          echo "optional contracts checked flag: $found"
      - name: UI difficulty UX and registry audits
        run: |
          npm run ui-design:test
          npm run difficulty:event-exposure:test
          npm run difficulty:exposure-audit
          npm run audit:ui-service-names
          npm run ux-contract:audit
          npm run registry:validate
      - name: Repository-wide tests and public-data audit
        run: |
          npm test
          npm run audit
      - name: Generated artifact drift check
        run: |
          git restore -- reports/v64-observation-debt-classification.json 2>/dev/null || true
          node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/gate-e-machines.txt)
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Gate E summary
        run: |
          echo 'Gate E Automated Quality Gate: PASS'
          echo 'Batch: 20260907 Next10 Research/Selection re-audit / exact 10 machines'
          echo 'Integration: NOT RUN'
          echo 'Public main: untouched'
