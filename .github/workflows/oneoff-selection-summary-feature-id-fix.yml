name: One-off selectionSummary featureId repair

on:
  push:
    branches:
      - fix/20260907-selection-summary-feature-id

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch canonical package builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/build-machine-data.mjs')
          text = p.read_text(encoding='utf-8')
          needle = '    return structuredClone(c);'
          if needle not in text:
              raise SystemExit('buildSelectionSummary contract return site not found')
          lines = [
              '    const cloned=structuredClone(c);',
              '    const researchById=new Map((research.features??[]).map(f=>[f.researchFeatureId,f]));',
              '    const candidates=(selection.features??[])',
              '      .filter(sf=>sf.adoptionCategory!=="DISPLAY_ONLY" && sf.summarySuppressed!==true)',
              '      .map(sf=>{',
              '        const rf=researchById.get(sf.researchFeatureId);',
              '        const explicitReason=sf.userFacingReason ?? sf.userReason ?? sf.rejectionReason;',
              '        return {',
              '          featureId:sf.featureId,',
              '          group:sf.adoptionCategory==="EXCLUDE"?"rejected":"selected",',
              '          name:sf.nameOverride??rf?.name,',
              '          reason:(typeof explicitReason==="string"&&explicitReason.trim())?explicitReason.trim():(sf.adoptionCategory==="EXCLUDE"?"採用条件が確定していないため、現時点では推測計算に使用していません。":"推測計算に採用しています。")',
              '        };',
              '      });',
              '    const used=new Set();',
              '    for(const group of ["selected","rejected"]){',
              '      cloned[group]=cloned[group].map(item=>{',
              '        if(typeof item.featureId==="string"&&item.featureId) return item;',
              '        const available=candidates.filter(x=>x.group===group&&!used.has(x.featureId));',
              '        let matches=available.filter(x=>x.name===item.name&&x.reason===item.reason);',
              '        if(matches.length===0) matches=available.filter(x=>x.name===item.name||x.reason===item.reason);',
              '        if(matches.length!==1) fail(`selectionSummaryContract ${group} item cannot resolve featureId uniquely: ${item.name}`);',
              '        const match=matches[0];',
              '        if(typeof match.featureId!=="string"||!match.featureId) fail(`selectionSummaryContract ${group} item resolved without featureId: ${item.name}`);',
              '        used.add(match.featureId);',
              '        return {featureId:match.featureId,...item};',
              '      });',
              '    }',
              '    return cloned;'
          ]
          text = text.replace(needle, '\n'.join(lines), 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate only the 2026-09-07 batch
        shell: bash
        run: |
          set -euo pipefail
          IDS=(
            L_FIRE_FORCE_2
            L_UMINEKO_2_A1
            L_KABANERI_UNATO_KESSEN_XX
            L_JORMUNGAND_ND01G
            LB_TRIPLE_CROWN_SEVEN_FG
            L_SHINUCHI_YOSHIMUNE_A1
            L_KYOKOU_SUIRI_ST
            L_AKUDAMA_DRIVE_TP
            L_MILLION_GOD_KISEKI_CX
            L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
          )
          for id in "${IDS[@]}"; do
            echo "=== regenerate $id ==="
            node tools/machine-pipeline.mjs "$id" --skip-repo-checks
          done
          git restore -- difficulty-catalog.json machine-registry.json 2>/dev/null || true
          for id in "${IDS[@]}"; do
            git restore -- "research/$id/statistics-report.json" "research/$id/difficulty-report.json" "research/$id/setting-band-report.json" 2>/dev/null || true
          done

      - name: Verify selectionSummary featureId contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const ids = ['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          for (const id of ids) {
            const pkg = JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`, 'utf8'));
            const sel = JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`, 'utf8'));
            const validIds = new Set((sel.features ?? []).map(f => f.featureId).filter(Boolean));
            const items = [...(pkg.selectionSummary?.selected ?? []), ...(pkg.selectionSummary?.rejected ?? [])];
            if (!items.length) throw new Error(`${id}: selectionSummary is empty`);
            for (const item of items) {
              if (typeof item.featureId !== 'string' || !item.featureId) throw new Error(`${id}: missing featureId for ${item.name}`);
              if (!validIds.has(item.featureId)) throw new Error(`${id}: unknown featureId ${item.featureId}`);
            }
            console.log(`PASS ${id}: ${items.length}/${items.length} summary items have valid featureId`);
          }
          NODE

      - name: Run repository audits
        shell: bash
        run: |
          npm test
          npm run audit
          npm run selection:summary-readiness
          git restore -- reports/selection-summary-readiness.json reports/selection-summary-readiness.md

      - name: Enforce scoped diff and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/oneoff-selection-summary-feature-id-fix.yml
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const out = execFileSync('git', ['status','--porcelain'], {encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowedIds = new Set(['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA']);
          const unexpected=[];
          for (const line of out) {
            const file=line.slice(3).replace(/^"|"$/g,'');
            const ok = file==='tools/build-machine-data.mjs' || file==='catalog.json' || file==='.github/workflows/oneoff-selection-summary-feature-id-fix.yml' || [...allowedIds].some(id=>file===`machines/${id}/machine-package.json`);
            if (!ok) unexpected.push(line);
          }
          if (unexpected.length) throw new Error(`Unexpected changed paths:\n${unexpected.join('\n')}`);
          console.log(out.join('\n'));
          NODE
          git add tools/build-machine-data.mjs catalog.json machines
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve featureId in selection summary packages"
          git push origin HEAD
