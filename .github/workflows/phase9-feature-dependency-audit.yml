name: Phase 9 Feature Dependency Audit

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/audit-feature-dependency-phase9.mjs'
      - 'test/feature-dependency-phase9.test.mjs'
      - '.github/workflows/phase9-feature-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 9 audit
        id: phase9
        shell: bash
        run: |
          set +e
          node tools/audit-feature-dependency-phase9.mjs . reports/phase9-feature-dependency-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/phase9-feature-dependency-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh Phase 9 feature dependency report [skip ci]"
            git push
          fi
      - name: Run regression test
        run: node --test --test-concurrency=1 test/feature-dependency-phase9.test.mjs
      - name: Enforce audit result
        if: steps.phase9.outputs.status != '0'
        run: exit "${{ steps.phase9.outputs.status }}"
