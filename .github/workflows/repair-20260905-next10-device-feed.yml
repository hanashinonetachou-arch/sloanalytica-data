name: Repair 20260905 Next10 Device Feed

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/repair-20260905-next10-device-feed.yml'

permissions:
  contents: write

jobs:
  repair-feed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - name: Diagnose cumulative catalog candidates
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            origin/prototype-multi-machine \
            origin/integration/20260903-publish-stack \
            origin/batch/20260904-next10-clean \
            origin/batch/20260904-next10-device \
            origin/research/20260903-batch10-next; do
            safe=$(echo "$ref" | tr '/:' '__')
            if git show "$ref:catalog.json" > "/tmp/${safe}.json" 2>/dev/null; then
              REF="$ref" FILE="/tmp/${safe}.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const ids=new Set((c.machines??[]).map(x=>x.machineId));
          const checks=['L_BIOHAZARD5_ZE','L_SISTER_QUEST_CA','L_HANAGASA_NA','L_ULTRAMAN_KE','L_IZA_BANCHO_SB8'];
          console.log(process.env.REF, 'count='+ids.size, checks.map(id=>`${id}=${ids.has(id)}`).join(' '));
          NODE
            fi
          done
      - name: Stop after diagnosis
        run: echo 'diagnostic complete'
