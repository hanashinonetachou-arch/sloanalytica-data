name: v6.4 Accelerator Rejection Reasons

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-accelerator-rejection-reasons.mjs'
      - 'tools/audit-v64-causal-relations.mjs'
      - 'test/v64-causal-relation-audit.test.mjs'
      - '.github/workflows/v64-accelerator-rejection-reasons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run rejection-reason migration
        run: node tools/migrate-v64-accelerator-rejection-reasons.mjs .
      - name: Apply rejection-reason migration
        run: node tools/migrate-v64-accelerator-rejection-reasons.mjs . --apply
      - name: Rebuild target machine package
        run: npm run machine:pipeline -- L_TOARU_ACCELERATOR_RZ --skip-repo-checks
      - name: Refresh v6.4 semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Run causal review regression
        run: node --test test/v64-causal-relation-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Run Observation linkage and gate target only
        run: |
          set +e
          npm run observation:selection:audit 2>&1 | tee /tmp/observation-linkage.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '^ERROR: L_TOARU_ACCELERATOR_RZ:' /tmp/observation-linkage.log; then
            echo 'Target machine introduced an Observation -> Selection linkage error.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Global Observation linkage audit still has pre-existing errors outside this batch; recorded as REVIEW.'
          fi
      - name: Run four-layer gate
        run: npm run pipeline:four-layer:gate -- L_TOARU_ACCELERATOR_RZ
      - name: Run v6.4 causal relation review
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Assert Accelerator leaves causal-reason review
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=s.machines.find(x=>x.machineId==='L_TOAR_ACCELERATOR_RZ') ?? s.machines.find(x=>x.machineId==='L_TOARU_ACCELERATOR_RZ');
          const causal=(m?.issues??[]).filter(x=>x.code==='CAUSAL_RELATION_REJECT_CANDIDATE');
          if(causal.length) throw new Error(`Accelerator still has ${causal.length} causal reason candidates`);
          const c=JSON.parse(fs.readFileSync('reports/v64-causal-relation-review.json','utf8'));
          if(c.summary.candidateCount!==18 || c.summary.machineCount!==7) throw new Error(`unexpected causal baseline ${JSON.stringify(c.summary)}`);
          console.log(`PASS Accelerator causal cleanup; global candidates=${c.summary.candidateCount}`);
          NODE
      - name: Show semantic diff
        run: |
          git status --short
          git --no-pager diff --stat
          git --no-pager diff -- research/L_TOARU_ACCELERATOR_RZ/selection-data.json research/L_TOARU_ACCELERATOR_RZ/machine-observation-data.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_TOARU_ACCELERATOR_RZ machines/L_TOARU_ACCELERATOR_RZ catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "audit: replace Accelerator causal rejection reasons"
            git push origin HEAD:prototype-multi-machine
          fi
