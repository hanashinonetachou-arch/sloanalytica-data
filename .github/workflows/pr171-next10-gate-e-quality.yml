name: PR171 Next10 Gate E Automated Quality Gate

on:
  pull_request:
    branches:
      - prototype-multi-machine
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  gate-e:
    if: github.event.pull_request.number == 171 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: pr171-next10-gate-e
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Define atomic next10 set
        run: |
          cat > /tmp/gate-e-machines.txt <<'EOF'
          L_IZA_BANCHO_SB8
          L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK
          L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN
          LB_TRIPLE_CROWN_SF4
          LB_MATADOR_3_TT
          L_TENSEI_SHITARA_KEN_DESHITA_GT
          L_DARLING_IN_THE_FRANXX_SA
          L_SAKI_CHOJO_KESSEN_YR
          S_KONOSUBA_ZR
          S_RAKUEN_TSUHO_FS
          EOF
          test "$(wc -l < /tmp/gate-e-machines.txt)" -eq 10

      - name: Gate D final prerequisite
        run: |
          test -f research/batches/20260903-next10/GATE_D_FINAL.md
          grep -q '^Status: PASS$' research/batches/20260903-next10/GATE_D_FINAL.md
          test -f reports/batch-20260904-next10-gate-d-runner.md
          grep -q 'registry / UI tests / service-name audit / repository tests: PASS' reports/batch-20260904-next10-gate-d-runner.md

      - name: Research validation 10/10
        run: |
          while read -r id; do
            npm run research:validate -- "research/$id/research-data.json"
          done < /tmp/gate-e-machines.txt

      - name: Selection validation 10/10
        run: |
          while read -r id; do
            npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"
          done < /tmp/gate-e-machines.txt

      - name: Selection Quality strict
        run: node tools/audit-selection-quality.mjs $(cat /tmp/gate-e-machines.txt) --strict

      - name: Observation v2 validation 10/10
        run: |
          args=()
          while read -r id; do args+=("research/$id/machine-observation-data.json"); done < /tmp/gate-e-machines.txt
          npm run observation:validate -- "${args[@]}"

      - name: Selection Observation strict linkage
        run: npm run observation:selection:audit -- $(cat /tmp/gate-e-machines.txt) --strict-v2

      - name: UI Design validation 10/10
        run: |
          while read -r id; do npm run ui-design:validate -- "research/$id/ui-design-data.json"; done < /tmp/gate-e-machines.txt

      - name: Selection UI linkage
        run: npm run ui-design:linkage:audit -- . $(cat /tmp/gate-e-machines.txt)

      - name: UI Observation strict-v2 linkage
        run: npm run ui-design:observation:audit -- $(cat /tmp/gate-e-machines.txt) --strict-v2

      - name: Four-layer Pipeline Gate
        run: npm run pipeline:four-layer:gate -- $(cat /tmp/gate-e-machines.txt)

      - name: MachineData materialization stability
        run: node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/gate-e-machines.txt)

      - name: Optional denominator-resolution contracts
        run: |
          found=0
          while read -r id; do
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              found=1
              npm run denominator:validate -- "$f"
            done < <(find "research/$id" -type f -name 'denominator-resolution*.json' -print 2>/dev/null || true)
          done < /tmp/gate-e-machines.txt
          echo "denominator contract files checked: $found"

      - name: Optional Evidence UI contracts
        run: |
          found=0
          while read -r id; do
            for f in "research/$id/evidence-ui.json" "machines/$id/evidence-ui.json"; do
              if [ -f "$f" ]; then
                found=1
                npm run evidence-ui:validate -- "$f" "research/$id/research-data.json"
              fi
            done
          done < /tmp/gate-e-machines.txt
          echo "evidence-ui contract files checked: $found"

      - name: UI and difficulty contract tests
        run: |
          npm run ui-design:test
          npm run difficulty:event-exposure:test
          npm run difficulty:exposure-audit

      - name: User-facing and UX contract audits
        run: |
          npm run audit:ui-service-names
          npm run ux-contract:audit

      - name: Registry consistency
        run: npm run registry:validate

      - name: Repository-wide tests
        run: npm test

      - name: Public-data audit
        run: npm run audit

      - name: Generated artifact drift check
        run: |
          git restore -- reports/v64-observation-debt-classification.json 2>/dev/null || true
          node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/gate-e-machines.txt)
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Gate E summary
        run: |
          echo 'Gate E Automated Quality Gate: PASS'
          echo 'Formal Publish: NOT RUN'
