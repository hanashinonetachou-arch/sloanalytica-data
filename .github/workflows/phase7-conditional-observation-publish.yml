name: Phase 7 Conditional Observation Publish

on:
  push:
    branches:
      - phase7/conditional-observation-contract-20260923
    paths:
      - '.github/workflows/phase7-conditional-observation-publish.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run generic V8 production-line regression
        run: npm run test:v8-production-line
      - name: Publish conditional-observation calibration packages
        run: |
          node tools/v8-machine-pipeline.mjs S_REVUE_STARLIGHT_CX --publish
          node tools/v8-machine-pipeline.mjs L_MUSHOKU_TENSEI_NM --publish
      - name: Commit generated distribution
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-registry.json             machines/S_REVUE_STARLIGHT_CX/machine-package.json             machines/L_MUSHOKU_TENSEI_NM/machine-package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "publish: conditional-observation V8 calibration packages"
          git push origin "HEAD:${{ github.ref_name }}"
