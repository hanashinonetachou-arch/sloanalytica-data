name: Fire Force button-only counters 20260821
on:
  push:
    branches:
      - fix/enen-button-only-counters-20260821
permissions:
  contents: write
jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enen-button-only-counters-20260821
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/apply-enen-button-only-counters-20260821.mjs
      - run: npm run machine:batch -- L_ENEN_NO_SHOUBOUTAI_JG
      - run: npm run machine:publish:batch -- L_ENEN_NO_SHOUBOUTAI_JG --apply
      - run: npm test
      - run: npm run audit
      - run: npm run audit:ui-service-names
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -- research/L_ENEN_NO_SHOUBOUTAI_JG machines/L_ENEN_NO_SHOUBOUTAI_JG catalog.json difficulty-catalog.json machine-registry.json reports/batch-machine-pipeline-report.json
          git diff --cached --quiet || git commit -m "Use button-only Fire Force counters"
          git push origin HEAD:fix/enen-button-only-counters-20260821
