name: Batch 20260903 Kabaneri Observation Reopen

on:
  push:
    branches:
      - batch/20260903-hanagasa-ultraman
    paths:
      - '.github/workflows/batch-20260903-kabaneri-observation-reopen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reopen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260903-hanagasa-ultraman
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Demote latent BB-rank promotion
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id='S_KABANERI_ZR',path=`research/${id}/selection-data.json`,s=JSON.parse(fs.readFileSync(path,'utf8'));
          const x=s.features.find(x=>x.researchFeatureId==='RF_CZ_FAIL_RANKUP');
          if(!x) throw new Error('RF_CZ_FAIL_RANKUP missing');
          x.adoptionCategory='EXCLUDE';
          x.userFacingReason='CZ失敗時のBBランク昇格抽選は公開値があるが、昇格結果そのものは内部ランクであり、100Gキリ番演出や駿城ボーナス終了画面はランクの示唆に留まる。実際の昇格段階を直接観測できないため、潜在状態を入力値として扱わない。';
          x.rejectionReason=x.userFacingReason;x.difficultyParticipation='EXCLUDE';
          for(const k of ['numeratorInputId','denominatorInputId','categoryInputIds','denominatorInputIds','inputTransform','suppressedByFeatureIds','difficultyExclusionReason']) delete x[k];
          s.inputs=s.inputs.filter(i=>!i.id.startsWith('INP_CZ_FAIL_RANKUP_'));
          delete s.uiCategoryLabels.SEL_RF_CZ_FAIL_RANKUP;
          fs.writeFileSync(path,JSON.stringify(s,null,2)+'\n');
          NODE
      - name: Revalidate Selection
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_HANAGASA_NA L_TOLOVE_DARKNESS_S8 LB_PREMIUM_UMAIBO_S1 LB_NEW_PULSAR_BT_C9 S_KABANERI_ZR L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 L_GUILTY_CROWN_2_XF L_ULTRAMAN_KE)
          for id in "${ids[@]}"; do node tools/validate-selection-data.mjs "research/$id/selection-data.json" "research/$id/research-data.json"; done
          node tools/audit-selection-quality.mjs "${ids[@]}" --strict
          node --test --test-concurrency=1 test/feature-dependency-phase9.test.mjs
      - name: Rebuild current Gate B checkpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_HANAGASA_NA','L_TOLOVE_DARKNESS_S8','LB_PREMIUM_UMAIBO_S1','LB_NEW_PULSAR_BT_C9','S_KABANERI_ZR','L_DMC5_ST_XA','LB_1000CHAN_ALPHA_L3','LB_JACKPOT_CY1','L_GUILTY_CROWN_2_XF','L_ULTRAMAN_KE'];
          const counts={INCLUDE_PRIMARY:0,INCLUDE_SUPPORT:0,INCLUDE_FALLBACK:0,EXCLUDE:0};let rf=0,re=0,ei=0,ee=0;const machines=[];
          for(const id of ids){const r=JSON.parse(fs.readFileSync(`research/${id}/research-data.json`,'utf8')),s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`,'utf8'));rf+=r.features.length;re+=r.evidenceCandidates.length;const local={INCLUDE_PRIMARY:0,INCLUDE_SUPPORT:0,INCLUDE_FALLBACK:0,EXCLUDE:0};for(const x of s.features){counts[x.adoptionCategory]++;local[x.adoptionCategory]++;}const refs=new Set((s.evidence??[]).map(x=>x.researchEvidenceId));for(const g of s.evidenceUi?.groups??[])for(const o of g.options??[])for(const z of o.sourceEvidenceIds??[])refs.add(z);const exc=new Set((s.evidenceReview?.exclusions??[]).map(x=>x.researchEvidenceId));ei+=refs.size;ee+=exc.size;machines.push({machineId:id,features:r.features.length,featureDispositions:local,evidence:r.evidenceCandidates.length,evidenceIncluded:refs.size,evidenceExcluded:exc.size,quality:'PASS'});}
          const report={schemaVersion:'batch-gate-b-final-audit-v1',batch:'20260903-hanagasa-ultraman',generatedAt:new Date().toISOString(),status:'PASS',researchFeatureCandidates:rf,featureDispositions:counts,featureMissing:rf-Object.values(counts).reduce((a,b)=>a+b,0),researchEvidenceCandidates:re,evidenceIncluded:ei,evidenceExcluded:ee,evidenceMissing:re-ei-ee,selectionValidation:'PASS_10_OF_10',selectionQuality:'PASS_10_REVIEW_0_BLOCKED_0',evidenceCompleteness:'PASS',discoveryMissing:0,userFacingRejectReasonMissing:0,inputBurdenOnlyRejects:0,excludeOnlyInputLeakage:0,highRiskDoubleCountingUnresolved:0,reverseEngineeredMissingTables:0,latentInternalStateTreatedAsObserved:0,semanticLocks:'PASS',errors:[],machines,trackedSelectionDebt:['9 public-table-incomplete Research candidates remain excluded without interpolation or reverse engineering.','2 LBジャックポット secondary-source role claims remain excluded/LOW_PRIORITY_HOLD.','DMC latent heaven-mode choice was replaced with directly observable post-upper-ST 100G+α hit outcome.','Kabaneri CZ-failure BB-rank promotion was demoted after Observation-entry review because the promotion result is latent; rank displays are only hints.','Difficulty exposure remains UNRESOLVED until Observation establishes exact acquisition and trial exposure.']};
          if(report.featureMissing||report.evidenceMissing)throw new Error('coverage mismatch');
          fs.writeFileSync('reports/batch-20260903-gate-b-final-audit.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('reports/batch-20260903-kabaneri-observation-reopen-audit.json',JSON.stringify({schemaVersion:'observation-entry-reopen-audit-v1',batch:'20260903-hanagasa-ultraman',generatedAt:new Date().toISOString(),machineId:id,trigger:'BBランク昇格は内部状態。公開されるキリ番/駿城終了画面はランク示唆であって昇格段階の直接観測ではない。',selectionChange:{researchFeatureId:'RF_CZ_FAIL_RANKUP',from:'INCLUDE_FALLBACK',to:'EXCLUDE'},researchChanged:false,gateBRecertified:'PASS',status:'PASS'},null,2)+'\n');
          NODE
      - name: Commit correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/S_KABANERI_ZR/selection-data.json reports/batch-20260903-gate-b-final-audit.json reports/batch-20260903-kabaneri-observation-reopen-audit.json
          git commit -m 'selection: demote latent Kabaneri BB-rank fallback' || exit 0
          git pull --rebase origin batch/20260903-hanagasa-ultraman
          git push origin HEAD:batch/20260903-hanagasa-ultraman
