name: Audit Next10 UI feedback

on:
  push:
    branches:
      - integrate/20260908-next10-ui-feedback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ui-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan ambiguous user-facing wording
        run: node tools/audit-user-facing-valid-wording.mjs
