name: Feature UI v2 KEEP-12 Wave2

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/apply-feature-ui-v2-keep12-wave2.mjs'
      - '.github/workflows/feature-ui-v2-keep12-wave2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical KEEP-12 wave2
        run: node tools/apply-feature-ui-v2-keep12-wave2.mjs

      - name: Prepare guarded machine batches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave2-a.txt <<'EOF'
          LB_TRIPLE_CROWN_SEVEN_FG
          L_BOFURI_FN
          L_BOUNTY_ANGEL
          L_DRUAGA_NO_TOU_ZA
          L_HEY_ELITE_SALARYMAN_KAGAMI_PA4
          L_MADOKA_FORTE_UU
          L_MAGICAL_HALLOWEEN8_FE
          L_SAO2_PA1
          L_SHINUCHI_YOSHIMUNE_A1
          L_SMASLO_TOKYO_REVENGERS_ZF
          EOF
          cat > /tmp/wave2-b.txt <<'EOF'
          L_SUPER_RIO_ACE2_ND02H
          L_UMINEKO_2_A1
          S_KABANERI_ZR
          S_SENGOKU_MUSOU3_ZYTCD
          EOF
          test "$(wc -l < /tmp/wave2-a.txt | tr -d ' ')" -le 10
          test "$(wc -l < /tmp/wave2-b.txt | tr -d ' ')" -le 10

      - name: Materialize batch A
        run: npm run machine:batch -- --file /tmp/wave2-a.txt

      - name: Materialize batch B
        run: npm run machine:batch -- --file /tmp/wave2-b.txt

      - name: Run Feature UI v2 read-only audit
        run: node tools/audit-feature-ui-v2-final.mjs --report reports/feature-ui-v2-audit-wave2.json

      - name: Commit canonical and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/ui-design-data.json machines/*/machine-package.json catalog.json difficulty-catalog.json machine-registry.json research/*/statistics-report.json research/*/difficulty-report.json research/*/setting-band-report.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: apply Feature UI v2 KEEP-12 wave2'
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
