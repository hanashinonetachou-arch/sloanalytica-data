name: Batch004 Wave2 Production Worker

on:
  push:
    branches:
      - production/v85-batch-004-foundation-20261003
    paths:
      - production/.batch004-wave2-production-trigger

permissions:
  contents: write

concurrency:
  group: batch004-wave2-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/v85-batch-004-foundation-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate production foundation
        working-directory: production
        run: |
          node --experimental-strip-types src/reconcile-batch.ts batch-20261003-004
          npm test
      - name: Materialize Wave 2 research through authoritative validator
        working-directory: production
        run: node --experimental-strip-types src/materialize-research-drafts.ts batch-20261003-004 wave-2
      - name: Advance Wave 2 through app runtime
        working-directory: production
        run: node --experimental-strip-types src/deterministic-production-worker.ts batch-20261003-004 --through APP_RUNTIME
      - name: Validate resulting production state
        working-directory: production
        run: npm test
      - name: Commit authoritative Batch 003 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261003-004
          if git diff --cached --quiet; then
            echo "Batch 003 production state already current."
            exit 0
          fi
          git commit -m "Advance Batch 004 Wave 2 through app runtime [skip ci]"
          git push origin HEAD:production/v85-batch-004-foundation-20261003
