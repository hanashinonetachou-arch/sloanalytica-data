name: v6.4 Linked Service Batch Apply

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'reports/v64-linked-service-audit-batch.json'
      - '.github/workflows/v64-linked-service-batch-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v64-linked-service-batch-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run linked-service batch
        run: node tools/apply-observation-linked-service-audit.mjs reports/v64-linked-service-audit-batch.json
      - name: Apply linked-service batch
        run: node tools/apply-observation-linked-service-audit.mjs reports/v64-linked-service-audit-batch.json --apply
      - name: Run v6.4 observation audit gate and refresh debt report
        run: |
          node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
          node --test test/v64-observation-debt-classification.test.mjs
          node tools/classify-v64-observation-debt.mjs
      - name: Commit linked-service batch and refreshed reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/*/machine-observation-data.json reports/v64-observation-trial-universe-audit.json reports/v64-observation-debt-classification.json
          if git diff --cached --quiet; then
            echo "No linked-service or report changes to commit."
            exit 0
          fi
          git commit -m "research: apply linked-service audit batch"
          git restore -- .
          git pull --rebase origin prototype-multi-machine
          git push origin HEAD:prototype-multi-machine
