name: M7 Phase 2.2 Hokuto Verify
on:
  push:
    branches: [audit/m7-phase2-2-hokuto-formalization-final-20260916]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regenerate deterministic fleet report
        run: node tools/audit-m7-full-fleet-migration.mjs --write
      - name: Run focused M7 audit tests
        run: node --test test/m7-full-fleet-migration-audit.test.mjs
      - name: Commit regenerated reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/m7-full-fleet-migration-audit-20260916.json reports/m7-full-fleet-migration-audit-20260916.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: refresh M7 fleet report after Hokuto formalization"
          git push
