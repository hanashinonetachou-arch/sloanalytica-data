name: Phase 5c Cross-Basis 3-Machine Fix

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'scripts/apply-phase5c-cross-basis-3machines-fix.mjs'
      - '.github/workflows/phase5c-cross-basis-3machines-fix.yml'

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cross-basis fixes
        run: node scripts/apply-phase5c-cross-basis-3machines-fix.mjs
      - name: Validate changed SelectionData
        run: |
          for id in L_BIOHAZARD_VENDETTA_FK L_HOKUTO_AD_XR L_SAO_B2; do
            npm run selection:validate -- research/$id/selection-data.json research/$id/research-data.json
          done
      - name: Rebuild affected machines
        run: |
          printf '%s\n' L_BIOHAZARD_VENDETTA_FK L_HOKUTO_AD_XR L_SAO_B2 > /tmp/machine_ids.txt
          npm run machine:batch -- --file /tmp/machine_ids.txt
      - name: Verify repository and audits
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
          node tools/audit-machine-data-statistics-v3.mjs . reports/machine-data-statistical-audit-after-phase5c.json reports/machine-data-statistical-audit-after-phase5c.md
          node tools/audit-estimated-difficulty-exposure.mjs
          node tools/audit-estimated-exposure-review-priority.mjs
          node tools/audit-target-game-basis-comparability.mjs
          cat reports/target-game-basis-comparability-v1.md
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research machines catalog.json difficulty-catalog.json reports/machine-data-statistical-audit-after-phase5c.json reports/machine-data-statistical-audit-after-phase5c.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: apply Phase 5c cross-basis corrections'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
