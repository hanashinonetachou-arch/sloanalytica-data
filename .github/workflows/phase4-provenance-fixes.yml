name: Phase 4 Provenance Fixes

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'scripts/apply-phase4-provenance-fixes.mjs'
      - '.github/workflows/phase4-provenance-fixes.yml'

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply provenance fixes
        run: node scripts/apply-phase4-provenance-fixes.mjs
      - name: Validate changed ResearchData
        run: |
          npm run research:validate -- research/S_EUREKA_SEVEN_HIEVO_XS/research-data.json
          npm run research:validate -- research/S_CODE_GEASS_3_CC_FS/research-data.json
      - name: Build affected machines
        run: |
          printf '%s\n' S_EUREKA_SEVEN_HIEVO_XS S_CODE_GEASS_3_CC_FS > /tmp/machine_ids.txt
          npm run machine:batch -- --file /tmp/machine_ids.txt
      - name: Verify repository and provenance
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
          node tools/audit-machine-data-statistics-v3.mjs . reports/machine-data-statistical-audit-after-phase4-provenance.json reports/machine-data-statistical-audit-after-phase4-provenance.md
          node tools/audit-research-provenance.mjs
          cat reports/research-provenance-audit-v1.md
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research machines catalog.json difficulty-catalog.json reports/machine-data-statistical-audit-after-phase4-provenance.json reports/machine-data-statistical-audit-after-phase4-provenance.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: apply Phase 4 research provenance corrections'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
