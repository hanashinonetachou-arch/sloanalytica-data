name: Feature Two-Column Counter Audit

on:
  pull_request:
    branches:
      - prototype-multi-machine
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Feature counter-pair candidates
        run: node tools/audit-feature-counter-pairs.mjs --json-out reports/feature-two-column-counter-audit.json
      - name: Upload refined audit report
        uses: actions/upload-artifact@v4
        with:
          name: feature-two-column-counter-audit
          path: reports/feature-two-column-counter-audit.json
