name: Inuyasha2 BIG End Shared Input

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/apply-inuyasha2-big-end-shared-input.mjs'
      - '.github/workflows/inuyasha2-big-end-shared-input.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/apply-inuyasha2-big-end-shared-input.mjs
      - name: Validate shared Evidence coverage
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateSelectionEvidenceCoverage } from './tools/batch-completeness-gates.mjs';
          const s=JSON.parse(fs.readFileSync('research/L_INUYASHA2_FK/selection-data.json','utf8'));
          const r=JSON.parse(fs.readFileSync('research/L_INUYASHA2_FK/research-data.json','utf8'));
          const coverage=validateSelectionEvidenceCoverage(s,r,{required:true});
          if(!coverage.ok) throw new Error(coverage.errors.join('\n'));
          const pair=(s.evidence??[]).filter(e=>e.researchEvidenceId==='RE_BIG_END_PAIR');
          if(pair.length!==2) throw new Error(`expected two context-specific pair Evidence records, got ${pair.length}`);
          const inputs=new Set(pair.map(e=>e.inputId));
          if(!inputs.has('INP_RF_WHITE_BIG_END_PAIR')||!inputs.has('INP_RF_BLUE_BIG_END_PAIR')) throw new Error('PAIR context inputs missing');
          NODE
      - name: Rebuild target machine
        run: npm run machine:pipeline -- L_INUYASHA2_FK --skip-repo-checks
      - name: Refresh semantic audit before tests
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Run full tests
        run: npm test
      - name: Run public audit
        run: npm run audit
      - name: Run UI service-name audit
        run: npm run audit:ui-service-names
      - name: Run strict Observation linkage
        run: node tools/audit-observation-selection-linkage.mjs L_INUYASHA2_FK --strict-v2
      - name: Run four-layer gate
        run: node tools/four-layer-pipeline-gate.mjs L_INUYASHA2_FK
      - name: Run causal audit
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Verify Inuyasha2 semantic review resolved
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=a.machines.find(x=>x.machineId==='L_INUYASHA2_FK');
          if(!m||m.status!=='PASS') throw new Error(`Inuyasha2 semantic status ${m?.status}: ${JSON.stringify(m?.issues)}`);
          console.log('Inuyasha2 semantic PASS');
          NODE
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: share Inuyasha2 BIG ending Evidence inputs [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
