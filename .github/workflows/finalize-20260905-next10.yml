name: Finalize 20260905 Next10 Research Batch

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/finalize-20260905-next10.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize reviewed source data and remove device-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path('.')
          IDS = [
            'L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN',
            'LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT',
            'L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'
          ]

          def load(p):
            return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p, obj):
            Path(p).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def clean_text(s):
            if not isinstance(s, str): return s
            repl = [
              ('Gate B/Gate Cで採用済み。',''), ('Gate B/Gate C','採用判断'), ('Gate A','調査'), ('Gate B','採用判断'),
              ('Gate C','観測設計'), ('Gate D','UI構築'), ('Gate E','品質監査'), ('eligible attempt','対象となる試行'),
              ('Hard Evidence','設定確定情報'), ('Exposure','観測量'), ('numeric core','数値推測'),
              ('joint modelなしでは','事象間の依存を分離できないため'), ('joint model','依存関係を考慮した統合モデル'),
              ('REFERENCE','参考候補')
            ]
            for a,b in repl: s=s.replace(a,b)
            return s.strip()

          def deep_clean(obj):
            if isinstance(obj, dict):
              return {k: deep_clean(clean_text(v) if isinstance(v,str) else v) for k,v in obj.items()}
            if isinstance(obj, list): return [deep_clean(v) for v in obj]
            return obj

          # Clean source-facing wording across the 10-machine research records.
          for mid in IDS:
            for fn in ['research-data.json','selection-data.json','machine-observation-data.json','ui-design-data.json']:
              p = ROOT/'research'/mid/fn
              if p.exists():
                save(p, deep_clean(load(p)))

          # Konosuba: source-of-truth sync for the reviewed support feature and rejection reasons.
          mid='S_KONOSUBA_ZR'
          rp=ROOT/'research'/mid/'research-data.json'; r=load(rp)
          for f in r.get('features',[]):
            if f.get('researchFeatureId')=='RF_REF_EMERGENCY_QUEST':
              f.update({
                'name':'緊急クエスト時の対戦相手振り分け', 'factStatus':'verified', 'candidateModel':'binomial',
                'trialUnit':'緊急クエスト1回', 'numeratorDefinition':'緊急クエストでデストロイヤーが選ばれた回数',
                'denominatorDefinition':'緊急クエストに突入した総回数',
                'settingValues':{
                  'SET_1':{'probability':0.063,'rawDisplay':'6.3%'}, 'SET_2':{'probability':0.070,'rawDisplay':'7.0%'},
                  'SET_3':{'probability':0.117,'rawDisplay':'11.7%'}, 'SET_4':{'probability':0.078,'rawDisplay':'7.8%'},
                  'SET_5':{'probability':0.121,'rawDisplay':'12.1%'}, 'SET_6':{'probability':0.125,'rawDisplay':'12.5%'}},
                'crossSourceStatus':'matched',
                'notes':'デストロイヤー選択率に設定差があり実戦中に明確に数えられる。補助判別として採用し、20回程度から参考度が上がり30回以上を一つの目安とする。'
              })
            elif f.get('researchFeatureId')=='RF_REF_QUEST_RANK_SUCCESS':
              f['notes']='0〜39pt・40〜59pt・60〜79ptでは成功率に設定差がある一方、80pt以上には設定差がない。連続演出中の書き換え当選を区別しないとランク到達時抽選だけを正しく数えられないため、現行入力仕様では不採用。'
            elif f.get('researchFeatureId')=='RF_REF_BATH_INITIAL_POINTS':
              f['notes']='初期2〜5ptの振り分けには設定差があるが、大半を占める2ptの差は小さく4pt・5ptは低頻度。対象となるお風呂ゾーンを同条件で漏れなく数える必要があり、現行入力仕様では安定した推測材料として扱いにくいため不採用。'
          save(rp,r)

          sp=ROOT/'research'/mid/'selection-data.json'; s=load(sp)
          # keep AT inputs, add reviewed emergency-quest inputs
          s['inputs']=[x for x in s.get('inputs',[]) if x.get('id') not in {'INP_EMERGENCY_QUEST_TOTAL','INP_DESTROYER_COUNT'}]
          s['inputs'] += [
            {'id':'INP_EMERGENCY_QUEST_TOTAL','name':'緊急クエスト回数','category':'SEL_FEAT_EMERGENCY_QUEST','type':'counter','unit':'回','displayOrder':20,'inferenceRole':'INCLUDE_SUPPORT','defaultValue':''},
            {'id':'INP_DESTROYER_COUNT','name':'デストロイヤー回数','category':'SEL_FEAT_EMERGENCY_QUEST','type':'counter','unit':'回','displayOrder':21,'inferenceRole':'INCLUDE_SUPPORT','defaultValue':''}
          ]
          feats=[]
          for f in s.get('features',[]):
            if f.get('researchFeatureId')=='RF_REF_EMERGENCY_QUEST': continue
            if f.get('featureId')=='FEAT_AT_INITIAL':
              f['userReason']='AT初当りの対象となる通常時ゲームを分母とし、同じ観測経路の分子と組み合わせる。'
            if f.get('featureId')=='FEAT_REF_QUEST_RANK_SUCCESS':
              f['userFacingReason']=f['rejectionReason']='0〜39pt・40〜59pt・60〜79ptでは成功率に設定差がある一方、80pt以上には設定差がありません。また連続演出中の書き換え当選を区別しないと、ランク到達時の抽選だけを正しく数えられません。現状の入力仕様では各ランク帯の対象回数と書き換えを一貫して分離記録できないため不採用。'
            if f.get('featureId')=='FEAT_REF_BATH_INITIAL_POINTS':
              f['userFacingReason']=f['rejectionReason']='初期2〜5ptの振り分けには設定差がありますが、大半を占める2ptの差は小さく、差が目立つ4pt・5ptは低頻度です。さらに対象となるお風呂ゾーンを漏れなく同じ条件で数える必要があるため、現状の入力仕様では安定した推測材料として扱いにくく不採用。'
            feats.append(f)
          feats.insert(1,{
            'researchFeatureId':'RF_REF_EMERGENCY_QUEST','featureId':'FEAT_EMERGENCY_QUEST_DESTROYER','adoptionCategory':'INCLUDE_SUPPORT','weight':0.6,
            'numeratorInputId':'INP_DESTROYER_COUNT','denominatorInputId':'INP_EMERGENCY_QUEST_TOTAL',
            'userReason':'デストロイヤー選択率に大きな設定差があり、対戦相手を実戦中に明確に数えられるため補助判別として採用。少数回では振れが大きいため、20回程度から参考度が上がり、30回以上を一つの目安とする。',
            'difficultyParticipation':'EXCLUDE'
          })
          s['features']=feats; save(sp,s)

          op=ROOT/'research'/mid/'machine-observation-data.json'; o=load(op)
          o['observations']=[x for x in o.get('observations',[]) if x.get('observationId')!='OBS_EMERGENCY_QUEST_OPPONENT']
          o['observations'].insert(1,{
            'observationId':'OBS_EMERGENCY_QUEST_OPPONENT','sourceType':'DIRECT_PLAY','observationMode':'MANUAL_COUNTER','status':'FOUND',
            'label':'緊急クエスト 対戦相手','categories':['緊急クエスト回数','デストロイヤー回数'],
            'timing':['緊急クエスト突入時に対戦相手を確認'],
            'excludedConditions':['緊急クエスト以外の対戦を混ぜない','対戦相手を確認できなかった試行を分母へ混ぜない'],
            'sourceRefs':['SRC_HAZUSE','SRC_PACHINAVI'],'notes':'緊急クエスト1回を1試行として、デストロイヤー選択回数を同じ観測区間で記録する。'
          })
          o['featureMappings']=[x for x in o.get('featureMappings',[]) if x.get('featureId')!='FEAT_EMERGENCY_QUEST_DESTROYER']
          o['featureMappings'].append({'featureId':'FEAT_EMERGENCY_QUEST_DESTROYER','mappingType':'EXACT','observationIds':['OBS_EMERGENCY_QUEST_OPPONENT'],'collectionMethods':['MANUAL_COUNTER'],'usableForInference':True,'usableForDifficulty':False,'notes':'緊急クエスト総回数とデストロイヤー回数を同一観測区間で記録する。'})
          save(op,o)

          up=ROOT/'research'/mid/'ui-design-data.json'; u=load(up)
          u.setdefault('sections',{})['緊急クエスト 対戦相手']={
            'inputIds':['INP_EMERGENCY_QUEST_TOTAL','INP_DESTROYER_COUNT'],
            'description':'緊急クエストに入った回数と、そのうちデストロイヤーだった回数を入力します。設定3・5・6ではデストロイヤーが選ばれやすいため、補助的な設定推測に使用します。',
            'observationRole':'DIRECT_PLAY','observationRefs':['OBS_EMERGENCY_QUEST_OPPONENT'],'acquisitionSources':['DIRECT_PLAY'],'collapsible':False,'defaultExpanded':True}
          order=[x for x in u.get('sectionOrder',[]) if x!='緊急クエスト 対戦相手']; u['sectionOrder']=order+['緊急クエスト 対戦相手']
          u.setdefault('inputContracts',{})['INP_EMERGENCY_QUEST_TOTAL']={'name':'緊急クエスト','mode':'COUNTER','gridSpan':6,'directInput':False,'compact':True,'step':1,'quickAdd':[1],'quickInputEligible':True,'inputVisible':True,'emptyMeansUnobserved':True,'observedZeroAllowed':True}
          u['inputContracts']['INP_DESTROYER_COUNT']={'name':'デストロイヤー','mode':'COUNTER','gridSpan':6,'directInput':False,'compact':True,'step':1,'quickAdd':[1],'quickInputEligible':True,'inputVisible':True,'emptyMeansUnobserved':True,'observedZeroAllowed':True}
          save(up,u)

          # Shared normal-game denominators for Triple Crown and Matador.
          def shared_denominator(mid, count_ids, old_denoms, labels, feature_ids):
            sp=ROOT/'research'/mid/'selection-data.json'; s=load(sp)
            s['inputs']=[x for x in s.get('inputs',[]) if x.get('id') not in set(old_denoms)]
            if not any(x.get('id')=='INP_NORMAL_GAMES' for x in s['inputs']):
              s['inputs'].insert(0,{'id':'INP_NORMAL_GAMES','name':'通常時ゲーム数','category':'COMMON','type':'integer','unit':'G','displayOrder':9,'inferenceRole':'INCLUDE_PRIMARY','defaultValue':''})
            for f in s.get('features',[]):
              if f.get('featureId') in feature_ids:
                f['denominatorInputId']='INP_NORMAL_GAMES'
                f['userReason']=f"通常時ゲーム数を共通分母とし、同じ通常時区間で数えた{labels[f['featureId']]}回数を組み合わせる。"
            save(sp,s)
            up=ROOT/'research'/mid/'ui-design-data.json'; u=load(up)
            u['sectionOrder']=['通常時']
            u['sections']={'通常時':{'inputIds':['INP_NORMAL_GAMES']+count_ids,'description':'同じ通常時の観測区間について、ゲーム数を1回だけ入力し、各回数を同じ区間で数えます。','observationRole':'DIRECT_PLAY','observationRefs':[],'acquisitionSources':['DIRECT_PLAY'],'collapsible':False,'defaultExpanded':True}}
            contracts=u.get('inputContracts',{})
            for d in old_denoms: contracts.pop(d,None)
            contracts['INP_NORMAL_GAMES']={'name':'通常時ゲーム数','mode':'NUMBER','gridSpan':12,'directInput':True,'quickAdd':[50],'quickInputEligible':False,'inputVisible':True,'emptyMeansUnobserved':True,'observedZeroAllowed':True}
            for cid in count_ids:
              contracts.setdefault(cid,{}).update({'gridSpan':6,'quickInputEligible':True})
            u['inputContracts']=contracts; save(up,u)

          shared_denominator('LB_TRIPLE_CROWN_SF4',['INP_BIG_COUNT','INP_REG_COUNT','INP_CHERRY_COUNT','INP_PLUM_COUNT'],['INP_BIG_GAMES','INP_REG_GAMES','INP_CHERRY_GAMES','INP_PLUM_GAMES'],{'FEAT_BIG':'BIG','FEAT_REG':'REG','FEAT_CHERRY':'チェリー','FEAT_PLUM':'プラム'},{'FEAT_BIG','FEAT_REG','FEAT_CHERRY','FEAT_PLUM'})
          shared_denominator('LB_MATADOR_3_TT',['INP_BB_COUNT','INP_RB_COUNT'],['INP_BB_GAMES','INP_RB_GAMES'],{'FEAT_BB':'BB','FEAT_RB':'RB'},{'FEAT_BB','FEAT_RB'})

          # Rakuen Tsuiho: preserve the reviewed MySlot wording in source data.
          mid='S_RAKUEN_TSUHO_FS'; sp=ROOT/'research'/mid/'selection-data.json'; s=load(sp)
          for x in s.get('inputs',[]):
            if x.get('id')=='INP_MY_SLOT_TOTAL_GAMES': x['name']='マイスロ結果画面の総ゲーム数'
          for f in s.get('features',[]):
            if f.get('featureId')=='FEAT_COMMON_BELL':
              f['userReason']='マイスロの結果画面に表示された「共通ベル回数」と「総ゲーム数」を、そのままセットで入力する。手元で数えた通常時ゲーム数とは混ぜない。'
          save(sp,s)
          up=ROOT/'research'/mid/'ui-design-data.json'; u=load(up)
          for sec in u.get('sections',{}).values():
            if 'INP_COMMON_BELL_COUNT' in sec.get('inputIds',[]):
              sec['description']='マイスロの結果画面に表示された「共通ベル回数」と「総ゲーム数」を、そのままセットで入力してください。手元で数えた通常時ゲーム数とは混ぜません。'
          if 'INP_MY_SLOT_TOTAL_GAMES' in u.get('inputContracts',{}): u['inputContracts']['INP_MY_SLOT_TOTAL_GAMES']['name']='マイスロ結果画面の総ゲーム数'
          save(up,u)
          PY

          rm -rf device-test/20260905-next10
          rm -f .github/workflows/publish-20260905-next10-isolated.yml \
                .github/workflows/real-device-feedback-20260905.yml \
                .github/workflows/real-device-feedback-20260905-v2.yml \
                .github/workflows/repair-20260905-next10-device-feed.yml \
                .github/workflows/repair-20260905-next10-device-feed-v2.yml

      - name: Install dependencies
        run: npm ci
      - name: Final data audit
        shell: bash
        run: |
          set -euo pipefail
          npm run research:validate
          npm run observation:validate
          npm run ui-design:validate
          npm run audit
          npm run registry:validate
          npm test
          node - <<'NODE'
          const fs=require('fs');
          const cat=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entries=cat.machines || cat.entries || cat.items || [];
          if(entries.length!==220) throw new Error(`catalog count ${entries.length} != 220`);
          const reg=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const machines=reg.machines || reg.entries || [];
          const ids=new Set(machines.map(x=>x.machineId||x.id));
          for(const id of ['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS']) if(!ids.has(id)) throw new Error(`missing ${id}`);
          console.log('FINAL_NEXT10_CHECK PASS catalog=220 next10=10');
          NODE
      - name: Commit finalized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize reviewed next10 batch'
          git push origin HEAD:publish/20260905-next10
