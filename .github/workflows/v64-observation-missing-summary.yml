name: v6.4 Observation Missing Summary

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - '.github/workflows/v64-observation-missing-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build missing Observation summary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-observation-trial-universe-audit.json','utf8'));
          const missing=r.machines.filter(m=>m.issues.some(i=>i.type==='OBSERVATION_FILE_MISSING')).map(m=>({machineId:m.machineId,displayName:m.displayName,activeFeatureCount:m.activeFeatureCount}));
          console.log(JSON.stringify(missing,null,2));
          fs.writeFileSync('reports/v64-observation-missing-summary.json',JSON.stringify({count:missing.length,machines:missing},null,2)+'\n');
          if(missing.length!==10) throw new Error(`expected 10 missing Observation files, got ${missing.length}`);
          NODE
      - name: Commit summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v64-observation-missing-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: summarize missing Observation files [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
