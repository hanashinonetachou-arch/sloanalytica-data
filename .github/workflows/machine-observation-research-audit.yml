name: Machine Observation Research Audit

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'research/**/research-data.json'
      - 'research/**/machine-observation-data.json'
      - 'tools/audit-machine-observation-research.mjs'
      - 'tools/validate-machine-observation-data.mjs'
      - '.github/workflows/machine-observation-research-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve changed Observation files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | sed -nE '/^research\/[^/]+\/machine-observation-data\.json$/p' \
            | sort -u > /tmp/observation_files.txt
          sed -nE 's#^research/([^/]+)/machine-observation-data\.json$#\1#p' /tmp/observation_files.txt \
            | sort -u > /tmp/observation_machine_ids.txt
          echo 'Changed Observation files:'
          cat /tmp/observation_files.txt || true

      - name: Validate standalone Machine Observation Data
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ -s /tmp/observation_files.txt ]]; then
              mapfile -t files < /tmp/observation_files.txt
              node tools/validate-machine-observation-data.mjs "${files[@]}"
            else
              echo 'No changed Machine Observation Data files.'
            fi
          else
            node tools/validate-machine-observation-data.mjs
          fi

      - name: Audit Machine Observation Research
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node tools/audit-machine-observation-research.mjs --json-out=reports/machine-observation-research-audit.json || true
            node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ids = new Set(fs.existsSync('/tmp/observation_machine_ids.txt')
            ? fs.readFileSync('/tmp/observation_machine_ids.txt','utf8').split(/\r?\n/).filter(Boolean)
            : []);
          const report = JSON.parse(fs.readFileSync('reports/machine-observation-research-audit.json','utf8'));
          const scoped = (report.machines ?? []).filter(machine => ids.has(machine.machineId));
          const blockers = scoped.filter(machine => ['INVALID_RESEARCH_JSON','REVIEW_SCHEMA'].includes(machine.classification));
          console.log(`Scoped Observation research audit: ${scoped.length} changed machines`);
          for (const machine of scoped) console.log(`${machine.machineId}: ${machine.classification}`);
          if (blockers.length) {
            console.error(`Batch-local Observation research blockers: ${blockers.length}`);
            process.exit(1);
          }
          NODE
          else
            node tools/audit-machine-observation-research.mjs --json-out=reports/machine-observation-research-audit.json
          fi

      - name: Show summary
        if: always()
        run: |
          if [ -f reports/machine-observation-research-audit.json ]; then
            node -e "const r=require('./reports/machine-observation-research-audit.json'); console.log(JSON.stringify(r.summary,null,2))"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-observation-research-audit
          path: reports/machine-observation-research-audit.json
          if-no-files-found: warn
