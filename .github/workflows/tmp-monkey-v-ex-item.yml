name: Monkey V EX Item One Shot

on:
  push:
    branches:
      - feature/monkey-v-ex-item

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monkey-v-ex-item
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Research and Selection update
        run: node tools/tmp-add-monkey-v-ex-item.mjs
      - name: Validate and regenerate Monkey V
        run: npm run machine:batch -- L_MONKEY_TURN5_CE
      - name: Verify EX Features are emitted
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('machines/L_MONKEY_TURN5_CE/machine-package.json','utf8'));
          const ids=new Set((p.features?.features??[]).map(f=>f.featureId));
          for(const id of ['FEAT_GEKSOU_EX_WEAK','FEAT_GEKSOU_EX_WEAK_CHANCE','FEAT_GEKSOU_EX_STRONG_CHANCE']) {
            if(!ids.has(id)) throw new Error(`missing ${id}`);
          }
          NODE
      - name: Commit generated changes
        run: |
          rm tools/tmp-add-monkey-v-ex-item.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_MONKEY_TURN5_CE machines/L_MONKEY_TURN5_CE reports difficulty-catalog.json machine-registry.json tools/tmp-add-monkey-v-ex-item.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Monkey V EX item inference features"
          git push origin HEAD:feature/monkey-v-ex-item
