name: Diagnose machine identity sources 20260906

on:
  push:
    branches: [fix/identity-audit-backfill-20260906]
    paths: ['.github/workflows/diagnose-machine-identity-sources-20260906.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-audit-backfill-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose identity sources
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'; import path from 'node:path';
          const audit=JSON.parse(fs.readFileSync('reports/machine-identity-classification-audit.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const seen=new Set(); for(const rel of audit.checkpointFiles??[]){for(const e of JSON.parse(fs.readFileSync(rel,'utf8')).entries??[])seen.add(e.machineId);}
          const production=(catalog.machines??[]).filter(m=>m.machineId!=='S_REVUE_STARLIGHT_CX_TEST_V66');
          const missing=production.filter(m=>!seen.has(m.machineId));
          const registryBy=new Map((registry.machines??[]).map(x=>[x.machineId,x]));
          const jsonFiles=[];
          const roots=['research/batches','research'];
          function walk(d){if(!fs.existsSync(d))return; for(const ent of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,ent.name); if(ent.isDirectory()){if(p.split(path.sep).length<6)walk(p);} else if(ent.name.endsWith('.json')&&fs.statSync(p).size<2_000_000)jsonFiles.push(p);}}
          for(const r of roots)walk(r);
          function candidatesFor(id){const found=[]; for(const p of jsonFiles){let text;try{text=fs.readFileSync(p,'utf8');}catch{continue;} if(!text.includes(id))continue; let j;try{j=JSON.parse(text);}catch{continue;} const stack=[{v:j,loc:'$'}]; while(stack.length){const {v,loc}=stack.pop(); if(!v||typeof v!=='object')continue; if(v.machineId===id){const c={path:p,loc,introductionDate:v.introductionDate??v.releaseDate??v.introducedAt??null,machineType:v.machineType??null,gameType:v.gameType??null,releaseDateStatus:v.releaseDateStatus??null,displayName:v.displayName??v.formalName??null}; if(c.introductionDate||c.machineType||c.gameType)found.push(c);} if(Array.isArray(v))v.forEach((x,i)=>stack.push({v:x,loc:`${loc}[${i}]`})); else for(const [k,x] of Object.entries(v)) if(x&&typeof x==='object')stack.push({v:x,loc:`${loc}.${k}`}); }
            } return found.slice(0,30);}
          const rows=missing.map(c=>{const r=registryBy.get(c.machineId); const pkg=JSON.parse(fs.readFileSync(`machines/${c.machineId}/machine-package.json`,'utf8')).machine??{}; return {machineId:c.machineId,displayName:c.displayName,registry:{releaseDate:r?.releaseDate??null,releaseDateStatus:r?.releaseDateStatus??null,manufacturer:r?.manufacturer??null,provisionalRegistrationId:r?.provisionalRegistrationId??null},catalog:{introductionDate:c.introductionDate??null,machineType:c.machineType??null,gameType:c.gameType??null},package:{introductionDate:pkg.introductionDate??null,machineType:pkg.machineType??null,gameType:pkg.gameType??null},structuredCandidates:candidatesFor(c.machineId)};});
          const report={generatedAt:new Date().toISOString(),auditedCount:seen.size,productionCount:production.length,missingCount:missing.length,missingIds:missing.map(x=>x.machineId),rows};
          fs.writeFileSync('reports/machine-identity-gap-diagnostic-20260906.json',JSON.stringify(report,null,2)+'\n');
          console.log(`audited=${seen.size} production=${production.length} missing=${missing.length}`);
          for(const x of rows)console.log(`${x.machineId}\tdate=${x.registry.releaseDate??'-'}(${x.registry.releaseDateStatus??'-'})\tcandidates=${x.structuredCandidates.length}`);
          EOF
      - name: Commit diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/machine-identity-gap-diagnostic-20260906.json
          git commit -m 'audit: diagnose 49 machine identity ledger gaps'
          git pull --rebase origin fix/identity-audit-backfill-20260906
          git push origin HEAD:fix/identity-audit-backfill-20260906
