name: Geass C.C. Bonus Candidate Marginal Audit

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/evaluate-geass-cc-bonus-candidate.mjs'
      - '.github/workflows/geass-cc-candidate-marginal.yml'
      - 'research/S_CODE_GEASS_3_CC_FS/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate marginal value
        run: node tools/evaluate-geass-cc-bonus-candidate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: geass-cc-bonus-candidate-marginal
          path: |
            reports/geass-cc-bonus-candidate-marginal.json
            reports/geass-cc-bonus-candidate-marginal.md
