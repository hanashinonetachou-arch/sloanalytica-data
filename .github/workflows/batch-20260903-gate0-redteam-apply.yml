name: Batch 20260903 Gate 0 Red-team Apply

on:
  push:
    branches:
      - batch/20260903-hanagasa-ultraman
    paths:
      - '.github/workflows/batch-20260903-gate0-redteam-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260903-hanagasa-ultraman
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand canonical Discovery and Research transfer
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const planPath='reports/batch-20260903-discovery-inventory-plan.json';
          const plan=JSON.parse(fs.readFileSync(planPath,'utf8'));
          const add={
            L_TOLOVE_DARKNESS_S8:[
              ['D_GAME_BONUS_250_650','250G・650G規定G数ボーナス抽選','RF_GAME_BONUS_250_650'],
              ['D_DARWIN_HIDDEN_NAGI','打-WIN LITE 隠れ凪設定示唆','RE_DARWIN_HIDDEN_NAGI'],
              ['D_DARWIN_LITE_SERVICE','打-WIN LITE連動サービス','reference','REFERENCE']
            ],
            S_KABANERI_ZR:[
              ['D_INITIAL_BB_RANK','初期BBランク振り分け','RF_INITIAL_BB_RANK'],
              ['D_IKOMA_LIFE_AVOID','生駒CZ残りライフ別減算回避抽選','RF_IKOMA_LIFE_AVOID']
            ],
            L_DMC5_ST_XA:[
              ['D_NORMAL_MODE_ZONE','通常モード別ゾーン期待度','RF_NORMAL_MODE_ZONE'],
              ['D_INITIAL_BONUS_LEVEL','初期ボーナスレベル振り分け','RF_INITIAL_BONUS_LEVEL'],
              ['D_BONUS_LEVEL_UP','ボーナスレベルアップ抽選','RF_BONUS_LEVEL_UP'],
              ['D_BLOODY_BATTLE_ENTRY','DMCボーナス中ブラッディバトル抽選','RF_BLOODY_BATTLE_ENTRY'],
              ['D_BLOODY_BATTLE_WIN','ブラッディバトル当選契機別勝利期待度','RF_BLOODY_BATTLE_WIN'],
              ['D_ST_PRE_JCB_PROMOTE','ST本前兆中JCB昇格抽選','RF_ST_PRE_JCB_PROMOTE'],
              ['D_ST_EMBLEM_TYPE','ST・上位STエンブレム種別','RF_ST_EMBLEM_TYPE'],
              ['D_UPPER_ST_EMBLEM_COUNT','上位STエンブレム個数','RF_UPPER_ST_EMBLEM_COUNT']
            ],
            LB_NEW_PULSAR_BT_C9:[
              ['D_ORANGE_PRACTICAL','オレンジ実戦値候補','reference','REFERENCE']
            ],
            L_GUILTY_CROWN_2_XF:[
              ['D_BONUS_AT_AGG','ボーナス+AT合算','RF_BONUS_AT_AGG'],
              ['D_RESONANCE_POINT','レゾナンスポイント獲得抽選','RF_RESONANCE_POINT'],
              ['D_APOCALYPSE_ENDING','四度目の黙示録中エンディング移行抽選','RF_APOCALYPSE_ENDING'],
              ['D_APOCALYPSE_CONTINUE','四度目の黙示録セット継続抽選','RF_APOCALYPSE_CONTINUE']
            ],
            LB_1000CHAN_ALPHA_L3:[
              ['D_BONUS_TRIGGER_DISTRIBUTION','ボーナス当選契機内訳分布','RF_BONUS_TRIGGER_DISTRIBUTION']
            ],
            LB_JACKPOT_CY1:[
              ['D_BELL_SECONDARY','ベル設定差の二次情報候補','RF_BELL_SECONDARY'],
              ['D_CHERRY_SECONDARY','チェリー設定差の二次情報候補','RF_CHERRY_SECONDARY']
            ]
          };
          let added=0;
          for(const [id,rows] of Object.entries(add)){
            const inv=plan.machines[id]; if(!inv) throw new Error(`missing inventory ${id}`);
            for(const [discoveryCandidateId,name,researchTarget,transferStatus] of rows){
              if(inv.some(x=>x.discoveryCandidateId===discoveryCandidateId)) continue;
              const x={discoveryCandidateId,name,researchTarget}; if(transferStatus)x.transferStatus=transferStatus;
              inv.push(x); added++;
            }
          }
          fs.writeFileSync(planPath,JSON.stringify(plan,null,2)+'\n');
          const sourceExtra={
            L_TOLOVE_DARKNESS_S8:{sourceId:'SRC_NANA_REDTEAM',publisher:'なな徹',title:'ToLOVEる TRANCE 設定判別・打-WIN LITE',url:'https://nana-press.com/kaiseki/machine/969/29581/',checkedAt:'2026-09-03',sourceType:'major_analysis'},
            S_KABANERI_ZR:{sourceId:'SRC_NANA_REDTEAM',publisher:'なな徹',title:'甲鉄城のカバネリ 解析情報まとめ',url:'https://nana-press.com/kaiseki/machine/384/',checkedAt:'2026-09-03',sourceType:'major_analysis'},
            L_DMC5_ST_XA:{sourceId:'SRC_NANA_REDTEAM',publisher:'なな徹',title:'デビルメイクライ5 設定差・設定示唆演出まとめ',url:'https://nana-press.com/kaiseki/machine/959/29918/',checkedAt:'2026-09-03',sourceType:'major_analysis'},
            L_GUILTY_CROWN_2_XF:{sourceId:'SRC_NANA_REDTEAM',publisher:'なな徹',title:'ギルティクラウン2 設定判別',url:'https://nana-press.com/kaiseki/machine/962/29843/',checkedAt:'2026-09-03',sourceType:'major_analysis'},
            LB_1000CHAN_ALPHA_L3:{sourceId:'SRC_NANA_REDTEAM',publisher:'なな徹',title:'1000ちゃんA 通常時ボーナス抽選',url:'https://nana-press.com/kaiseki/machine/945/30001/',checkedAt:'2026-09-03',sourceType:'major_analysis'},
            LB_JACKPOT_CY1:{sourceId:'SRC_PWORLD_REDTEAM',publisher:'P-WORLD',title:'LBジャックポット 機種情報',url:'https://www.p-world.co.jp/machine/database/10258',checkedAt:'2026-09-03',sourceType:'major_analysis'}
          };
          const pendingNote='Gate 0 red-team sweepで追加発見。公開条件・分母・設定別表のResearch精査を継続し、Selection前に確定する。';
          for(const [id,rows] of Object.entries(add)){
            const file=`research/${id}/research-data.json`; const data=JSON.parse(fs.readFileSync(file,'utf8'));
            const sx=sourceExtra[id]; if(sx && !data.sources.some(s=>s.sourceId===sx.sourceId)) data.sources.push(sx);
            const refs=data.sources.map(s=>s.sourceId);
            for(const [,name,target,status] of rows){
              if(status==='REFERENCE'||target==='reference') continue;
              if(target.startsWith('RE_')){
                if(!data.evidenceCandidates.some(x=>x.researchEvidenceId===target)) data.evidenceCandidates.push({researchEvidenceId:target,name,factStatus:'pending',allowedSettings:[],deniedSettings:[],sourceRefs:refs,crossSourceStatus:refs.length>1?'cross_checked':'single_source',notes:pendingNote});
              }else if(target.startsWith('RF_')){
                if(!data.features.some(x=>x.researchFeatureId===target)) data.features.push({researchFeatureId:target,name,factStatus:'pending',candidateModel:'binomial',trialUnit:'公開条件を満たす対象試行',numeratorDefinition:`${name}の条件成立回数`,denominatorDefinition:`${name}が定義される公開上の正しい対象試行数`,settingValues:{},sourceRefs:refs,crossSourceStatus:refs.length>1?'cross_checked':'single_source',notes:pendingNote});
              }
            }
            data.discoveryInventory=plan.machines[id];
            if(id==='LB_JACKPOT_CY1'){
              const big=data.features.find(x=>x.researchFeatureId==='RF_BIG');
              big.settingValues.SET_1={probability:1/384.6,rawDisplay:'1/384.6'};
              big.notes='P-WORLDは設定1 BIGを1/384.6と掲載する一方、一撃・なな徹は1/348.6。合算1/209.4との整合も含めResearch conflictとして保留し、Selection前に一次情報または追加ソースで解消する。';
              big.factStatus='conflict'; big.crossSourceStatus='conflict';
              if(!data.conflicts.some(x=>x.conflictId==='CF_BIG_SET1')) data.conflicts.push({conflictId:'CF_BIG_SET1',researchTarget:'RF_BIG',summary:'設定1 BIG: P-WORLD/HAZUSE 1/384.6 vs 一撃/なな徹 1/348.6',status:'OPEN',sourceRefs:['SRC_1GEKI','SRC_NANA','SRC_PWORLD_REDTEAM']});
            }
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          const auditPath='reports/batch-20260903-gate-0-audit.json'; const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const total=Object.values(plan.machines).reduce((n,a)=>n+a.length,0);
          audit.generatedAt='2026-09-03';
          audit.webDiscovery={status:'PASS',machineCount:10,candidateCountBeforeRedTeam:97,candidateCountFinal:total,redTeamAdded:total-97,webResearchCandidate:0,distributionTableSweep:'PASS',settingHintSweep:'PASS',notes:'Post-Gate-0 adversarial sweep additions were incorporated into canonical Discovery and fully transferred to ResearchData or explicit REFERENCE. LBジャックポット設定1 BIG source discrepancy is Research conflict, not an unmapped Web candidate.'};
          audit.researchTransfer={status:'READY',discoveryInventoryFile:planPath,nextGate:'Gate A',requirement:'Discovery completeness missing=0 after red-team expansion. Research conflicts/pending tables must be resolved or formally classified before Gate A.'};
          audit.result='PASS';
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          console.log({added,total});
          NODE
      - name: Validate red-team transfer completeness
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_HANAGASA_NA L_TOLOVE_DARKNESS_S8 LB_PREMIUM_UMAIBO_S1 LB_NEW_PULSAR_BT_C9 S_KABANERI_ZR L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 L_GUILTY_CROWN_2_XF L_ULTRAMAN_KE)
          for id in "${ids[@]}"; do node tools/validate-research-data.mjs "research/$id/research-data.json"; done
          node tools/discovery-completeness-gate.mjs "${ids[@]}"
      - name: Commit Gate 0 red-team closure
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/batch-20260903-discovery-inventory-plan.json reports/batch-20260903-gate-0-audit.json research/*/research-data.json
          git commit -m 'research: close Gate 0 red-team discovery gaps' || exit 0
          git pull --rebase origin batch/20260903-hanagasa-ultraman
          git push origin HEAD:batch/20260903-hanagasa-ultraman
