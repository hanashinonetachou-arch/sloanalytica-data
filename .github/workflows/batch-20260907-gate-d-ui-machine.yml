name: Batch 20260907 Gate D UI MachineData

on:
  push:
    branches: [batch/20260907-next10-gated]
    paths:
      - tools/generate-batch-20260907-gate-d-ui.mjs
      - tools/fix-batch-20260907-jormungand-selection-contract.mjs
      - tools/fix-batch-20260907-baseline-difficulty-version.mjs
      - .github/workflows/batch-20260907-gate-d-ui-machine.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-validate-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-gated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refine Jormungand Selection execution contract
        run: node tools/fix-batch-20260907-jormungand-selection-contract.mjs
      - name: Repair inherited difficulty version mismatch
        run: node tools/fix-batch-20260907-baseline-difficulty-version.mjs
      - name: Generate Gate D UI Design
        run: node tools/generate-batch-20260907-gate-d-ui.mjs
      - name: Validate UI Design
        run: npm run ui-design:validate
      - name: Audit UI Selection linkage
        run: |
          npm run ui-design:linkage:audit -- . \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Audit UI Observation linkage
        run: |
          npm run ui-design:observation:audit -- \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA --strict-v2
      - name: Semantic UI assertions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const noLinked=new Set(['L_FIRE_FORCE_2','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','LB_TRIPLE_CROWN_SEVEN_FG']);
          const errors=[];
          for(const id of ids){
            const ui=JSON.parse(fs.readFileSync(`research/${id}/ui-design-data.json`,'utf8'));
            if(ui.machineId!==id) errors.push(`${id}: machineId mismatch`);
            if(!['PASS','PASS_WITH_UNRESOLVED'].includes(ui.status)) errors.push(`${id}: invalid status ${ui.status}`);
            const allIds=Object.values(ui.sections??{}).flatMap(s=>s.inputIds??[]);
            if(new Set(allIds).size!==allIds.length) errors.push(`${id}: duplicate input across sections`);
            const evidenceTitles=(ui.sectionOrder??[]).filter(t=>String(t).includes('設定示唆')||String(t).includes('設定確定'));
            if(evidenceTitles.length){
              const first=Math.min(...evidenceTitles.map(t=>ui.sectionOrder.indexOf(t)));
              const laterOrdinary=ui.sectionOrder.slice(first+1).some(t=>!String(t).includes('設定示唆')&&!String(t).includes('設定確定'));
              if(laterOrdinary) errors.push(`${id}: ordinary section appears after Evidence section`);
            }
            if(noLinked.has(id)){
              const linked=Object.values(ui.sections??{}).some(s=>(s.acquisitionSources??[]).includes('LINKED_SERVICE')||s.observationRole==='LINKED_SERVICE');
              if(linked) errors.push(`${id}: linked-service UX exposed despite CHECKED_NONE`);
              if((ui.unresolved??[]).some(x=>String(x).startsWith('linkedService:'))) errors.push(`${id}: linked-service unresolved reopened`);
            }
          }
          const tc=JSON.parse(fs.readFileSync('research/LB_TRIPLE_CROWN_SEVEN_FG/ui-design-data.json','utf8'));
          const tcInputs=new Set(Object.values(tc.sections??{}).flatMap(s=>s.inputIds??[]));
          if([...tcInputs].some(x=>String(x).includes('PLUM'))) errors.push('Triple Crown plum input must not be exposed');
          const jo=JSON.parse(fs.readFileSync('research/L_JORMUNGAND_ND01G/selection-data.json','utf8'));
          const jf=(jo.features??[]).find(f=>f.featureId==='FEAT_BONUS_END_SCREEN');
          const expectedExcluded=['HANDGUN_SHELL','OLD_KOKO_TEAM','KASPER','GOLDEN_SCARECROW'];
          if(!jf) errors.push('Jormungand FEAT_BONUS_END_SCREEN missing');
          else {
            if(JSON.stringify(jf.categoryExcludeLabels??[])!==JSON.stringify(expectedExcluded)) errors.push('Jormungand Hard Evidence category exclusions changed');
            if(jf.normalizeRoundedCategoryProbabilities!==false) errors.push('Jormungand deliberate Evidence exclusion must not use small-rounding guard');
          }
          if(errors.length) throw new Error(errors.join('\n'));
          console.log(JSON.stringify({status:'PASS',machines:ids.length,noLinkedServiceConfirmed:noLinked.size,jormungandEvidenceConditioning:'PASS'},null,2));
          NODE
      - name: Four-layer Gate
        run: |
          npm run pipeline:four-layer:gate -- \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Build MachineData batch
        run: |
          npm run machine:batch -- \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Materialize UI Design into MachineData
        run: |
          node tools/materialize-ui-design.mjs --apply \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Verify materialization stability
        run: |
          node tools/materialize-ui-design.mjs --require-unchanged \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Gate D contract validations
        run: |
          npm run ui-design:test
          npm run difficulty:exposure-audit
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Write Gate D report
        shell: bash
        run: |
          cat > reports/batch-20260907-gate-d-baseline.md <<'EOF'
          # 20260907 Gate D UI Design / MachineData baseline

          - UI Design: generated 10/10 from finalized SelectionData + Machine Observation Data v2
          - UI validation: PASS
          - Selection linkage: PASS
          - Observation linkage strict-v2: PASS
          - Semantic UI assertions: PASS
          - Four-layer gate: PASS (35 tracked field-verification items may remain)
          - MachineData batch construction: PASS
          - UI Design -> MachineData materialization: PASS / stable 10/10
          - Blank vs observed zero, conditional denominators, suppression/fallback and Evidence separation are retained.
          - Hard Evidence sections are kept after ordinary inference sections.
          - Five user-confirmed no-linked-service machines do not expose LINKED_SERVICE UX.
          - Triple Crown plum remains excluded from UI.
          - Jormungand end-screen numeric multinomial conditions on the four non-Evidence categories; four Hard Evidence screens remain Evidence-only.
          - Inherited Burning Express catalog/difficulty version skew was repaired by syncing difficulty-catalog to catalog version 0.1.1.
          - Difficulty exposure / repository tests / audits: PASS
          - Gate E / Formal Publish: NOT RUN
          - public main: unchanged
          EOF
      - name: Commit Gate D baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research machines reports difficulty-catalog.json machine-registry.json catalog.json 2>/dev/null || true
          git add reports/batch-20260907-gate-d-baseline.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'machine-data: materialize 20260907 Gate D UI contracts'
          git pull --rebase origin batch/20260907-next10-gated
          git push origin HEAD:batch/20260907-next10-gated
