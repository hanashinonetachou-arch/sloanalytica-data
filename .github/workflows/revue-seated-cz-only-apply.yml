name: Revue seated CZ-only apply

on:
  push:
    branches:
      - fix/revue-seated-cz-only
    paths:
      - tools/apply-revue-seated-cz-only.mjs
      - .github/workflows/revue-seated-cz-only-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revue-seated-cz-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply seated CZ-only migration
        run: node tools/apply-revue-seated-cz-only.mjs
      - name: Run machine pipeline
        run: npm run machine:pipeline -- S_REVUE_STARLIGHT_CX --skip-repo-checks
      - name: Run test suite
        run: npm test
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/S_REVUE_STARLIGHT_CX machines/S_REVUE_STARLIGHT_CX catalog.json difficulty-catalog.json machine-registry.json reports || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use seated CZ only for Revue Starlight"
          git push origin HEAD:fix/revue-seated-cz-only
