name: Batch 20260908 Gate A Validate

on:
  push:
    branches:
      - batch/20260908-manifest-v7-first10
  workflow_dispatch:

jobs:
  validate-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate canonical ResearchData 10/10
        shell: bash
        run: |
          set -euo pipefail
          machines=(
            L_ANIMAL_SLOT_DOCCHI_ZT
            L_BIG_DREAM_GOLDEN_PUSHER_KR
            L_BIOHAZARD_RE3_ZD
            L_TAKT_OP_DESTINY_M1
            L_SUPER_RIO_ACE2_ND02H
            L_BIRDIE_WING_BC
            L_SAO2_PA1
            L_SENGOKU_OTOME5_L8
            L_DARK_HAIBI_SB
            L_LOTIS_TN
          )
          for machine in "${machines[@]}"; do
            echo "=== ${machine} ==="
            node tools/validate-research-data.mjs "research/${machine}/research-data.json"
          done
          echo "GATE_A_RESEARCH_VALIDATOR_10_OF_10_PASS"
