name: Reconstruct missing Observation v7

on:
  push:
    branches:
      - audit/20260912-cross-sectional-v7
    paths:
      - tools/reconstruct-missing-observation-v7.mjs
      - .github/workflows/reconstruct-missing-observation-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/20260912-cross-sectional-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct Observation files
        run: node tools/reconstruct-missing-observation-v7.mjs
      - name: Validate Observation repository
        run: node tools/validate-machine-observation-data.mjs
      - name: Repository tests
        run: npm test
      - name: Repository audit
        run: npm run audit
      - name: Cross-sectional check
        run: |
          node tools/audit-cross-sectional-v7.mjs
          node tools/reclassify-cross-sectional-v7.mjs
          node -e "const r=require('./reports/cross-sectional-v7-audit.json'); if(r.issueCounts.MISSING_OBSERVATION) throw new Error('MISSING_OBSERVATION remains: '+r.issueCounts.MISSING_OBSERVATION); console.log('MISSING_OBSERVATION: 0')"
      - name: Commit reconstructed Observation files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/machine-observation-data.json
          if git diff --cached --quiet; then
            echo 'No Observation reconstruction required.'
            exit 0
          fi
          git commit -m 'Audit: reconstruct missing Observation v7 files'
          git push origin HEAD:audit/20260912-cross-sectional-v7
