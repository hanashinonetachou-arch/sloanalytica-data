name: v6.4 Cross-machine Semantic Audit

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/audit-v64-cross-machine-semantic.mjs'
      - 'test/v64-cross-machine-semantic-audit.test.mjs'
      - '.github/workflows/v64-cross-machine-semantic-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run semantic audit
        id: semantic
        shell: bash
        run: |
          set +e
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build concise review summary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const machines=r.machines.filter(m=>m.status!=='PASS').map(m=>({
            machineId:m.machineId,
            displayName:m.displayName,
            status:m.status,
            issues:m.issues.map(i=>({code:i.code,researchFeatureId:i.researchFeatureId??null,featureId:i.featureId??null,name:i.name??null,reason:i.reason??null,relationConfidence:i.relationConfidence??null,completeDistribution:i.completeDistribution??null,settingCount:i.settingCount??null,relatedEvidence:(i.relatedEvidence??[]).map(e=>e.researchEvidenceId)}))
          }));
          const priorityCandidates=machines.flatMap(m=>m.issues.filter(i=>i.code==='LEGACY_EVIDENCE_OVERLAP_REJECT_CANDIDATE').map(i=>({machineId:m.machineId,displayName:m.displayName,...i})));
          const out={schemaVersion:'v6.4-cross-machine-semantic-review-summary-v1',generatedAt:r.generatedAt,summary:r.summary,priorityCandidates,machines};
          fs.writeFileSync('reports/v64-cross-machine-semantic-review-summary.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit audit reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v64-cross-machine-semantic-audit.json reports/v64-cross-machine-semantic-review-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh v6.4 semantic reports [skip ci]"
            git push
          fi
      - name: Run regression test
        run: node --test --test-concurrency=1 test/v64-cross-machine-semantic-audit.test.mjs
      - name: Enforce audit result
        if: steps.semantic.outputs.status != '0'
        run: exit "${{ steps.semantic.outputs.status }}"
