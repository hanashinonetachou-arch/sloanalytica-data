name: Next10 Selection v6.14 re-audit

on:
  push:
    branches:
      - audit/20260908-next10-selection-v614
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-v614:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate Research and Selection for Next10
        run: |
          set -euo pipefail
          ids=(
            L_FIRE_FORCE_2
            L_UMINEKO_2_A1
            L_KABANERI_UNATO_KESSEN_XX
            L_JORMUNGAND_ND01G
            LB_TRIPLE_CROWN_SEVEN_FG
            L_SHINUCHI_YOSHIMUNE_A1
            L_KYOKOU_SUIRI_ST
            L_AKUDAMA_DRIVE_TP
            L_MILLION_GOD_KISEKI_CX
            L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
          )
          for id in "${ids[@]}"; do
            node tools/validate-research-data.mjs "research/$id/research-data.json"
            node tools/validate-selection-data.mjs "research/$id/selection-data.json"
          done
      - name: Strict Selection Quality Gate for Next10
        run: |
          node tools/audit-selection-quality.mjs \
            L_FIRE_FORCE_2 \
            L_UMINEKO_2_A1 \
            L_KABANERI_UNATO_KESSEN_XX \
            L_JORMUNGAND_ND01G \
            LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 \
            L_KYOKOU_SUIRI_ST \
            L_AKUDAMA_DRIVE_TP \
            L_MILLION_GOD_KISEKI_CX \
            L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA \
            --strict
      - name: Guard against forbidden input-burden rejection
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const bad=[];
          for(const id of ids){
            const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`,'utf8'));
            for(const f of s.features??[]){
              if(f.adoptionCategory!=='EXCLUDE') continue;
              const r=String(f.userFacingReason??'');
              if(/入力負担|手動.*負担|カウント.*負担/.test(r)) bad.push(`${id}/${f.featureId}: ${r}`);
            }
          }
          if(bad.length){ console.error(bad.join('\n')); process.exit(1); }
          console.log('PASS: no EXCLUDE uses manual/input burden as rejection basis');
          NODE
      - name: Report all EXCLUDE reasons
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          for(const id of ids){
            const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`,'utf8'));
            const fsx=(s.features??[]).filter(f=>f.adoptionCategory==='EXCLUDE');
            console.log(`\n## ${id} EXCLUDE ${fsx.length}`);
            for(const f of fsx) console.log(`- ${f.featureId}: ${f.userFacingReason??'(missing reason)'}`);
          }
          NODE
