name: Backfill canonical UI v7 pilot10

on:
  push:
    branches:
      - audit/20260912-cross-sectional-v7
    paths:
      - tools/backfill-canonical-ui-v7-pilot10.mjs
      - .github/workflows/backfill-canonical-ui-v7-pilot10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/20260912-cross-sectional-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill pilot canonical UI
        run: node tools/backfill-canonical-ui-v7-pilot10.mjs
      - name: Validate canonical UI
        run: node tools/validate-ui-design-data.mjs
      - name: Repository tests
        run: npm test
      - name: Repository audit
        run: npm run audit
      - name: Cross-sectional audit
        run: |
          node tools/audit-cross-sectional-v7.mjs
          node tools/reclassify-cross-sectional-v7.mjs
      - name: Commit pilot UI Design artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/ui-design-data.json reports/cross-sectional-v7-audit.json reports/cross-sectional-v7-summary.md
          if git diff --cached --quiet; then
            echo 'No pilot UI Design changes.'
            exit 0
          fi
          git commit -m 'Audit: backfill canonical UI pilot 10'
          git push origin HEAD:audit/20260912-cross-sectional-v7
