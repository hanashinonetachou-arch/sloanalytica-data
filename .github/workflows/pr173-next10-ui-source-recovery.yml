name: PR173 Next10 UI Design Source Recovery

on:
  push:
    branches:
      - fix/prototype-v64-causal-review-20260906
    paths:
      - tools/recover-pr172-ui-design-from-formal-publish.mjs
      - .github/workflows/pr173-next10-ui-source-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-ui-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prototype-v64-causal-review-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Define Next10
        run: |
          cat > /tmp/next10.txt <<'EOF'
          L_AZURLANE_THE_ANIMATION_KN
          L_DRUAGA_NO_TOU_ZA
          L_SMASLO_TOKYO_REVENGERS_ZF
          L_BABEL_BA
          L_SHIN_ONIMUSHA_3_SA
          L_ZENIGATA_5_L2
          L_TOARU_KAGAKU_NO_RAILGUN_2_FV
          L_ZETTAI_SHOGEKI_FORCE_FH
          L_KAKUMEIKI_VALVRAVE_2_JF
          L_NEO_PLANET_SLED
          EOF
          test "$(wc -l < /tmp/next10.txt)" -eq 10

      - name: Recover UI Design source from Gate-E-passing Formal Publish
        run: node tools/recover-pr172-ui-design-from-formal-publish.mjs

      - name: Validate recovered UI Design
        run: |
          node tools/validate-ui-design-data.mjs .
          npm run ui-design:linkage:audit -- . $(cat /tmp/next10.txt)

      - name: Regenerate current MachineData from current Research Selection plus recovered UI source
        run: npm run machine:batch -- --file /tmp/next10.txt

      - name: Require zero UI materialization drift
        run: node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/next10.txt)

      - name: Verify explicit unobserved zero semantics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=fs.readFileSync('/tmp/next10.txt','utf8').trim().split(/\s+/);
          const failures=[];
          for(const id of ids){
            const pkg=JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`,'utf8'));
            const inputs=new Map((pkg.inputs?.inputs??[]).map(x=>[x.id,x]));
            const ui=new Map();
            for(const section of pkg.ui?.sections??[]) for(const item of section.items??[]) if(item.type==='input'){
              if(!ui.has(item.inputId)) ui.set(item.inputId,[]);
              ui.get(item.inputId).push(item);
            }
            for(const input of inputs.values()) if(['counter','integer','number'].includes(input.type)){
              const items=ui.get(input.id)??[];
              if(!items.some(item=>item.config?.emptyMeansUnobserved===true&&item.config?.observedZeroAllowed===true)) failures.push(`${id}/${input.id}`);
            }
          }
          if(failures.length) throw new Error(`missing explicit observation semantics: ${failures.join(', ')}`);
          console.log(`PASS explicit unobserved/zero semantics: ${ids.length}/10`);
          NODE

      - name: Repository checks
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
          npm run ux-contract:audit

      - name: Commit canonical UI source and regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json difficulty-catalog.json machine-registry.json \
            research/*/ui-design-data.json research/*/statistics-report.json research/*/difficulty-report.json research/*/setting-band-report.json \
            machines/*/machine-package.json
          if git diff --cached --quiet; then
            echo 'No recovery outputs changed.'
            exit 0
          fi
          git commit -m 'ui: canonicalize Next10 UI Design source'
          git push origin HEAD:fix/prototype-v64-causal-review-20260906
