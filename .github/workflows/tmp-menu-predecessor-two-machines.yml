name: Temporary two-machine menu predecessor update
on:
  push:
    branches: [feature/menu-predecessor-two-machines]
    paths: [.github/workflows/tmp-menu-predecessor-two-machines.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-predecessor-two-machines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update menu-based predecessor inputs
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,d)=>fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');

          // Monkey Turn V: menu "通常" + SG RUSH initial count.
          {
            const sp='research/L_MONKEY_TURN5_CE/selection-data.json';
            const rp='research/L_MONKEY_TURN5_CE/research-data.json';
            const s=read(sp), r=read(rp);
            const games=s.inputs.find(x=>x.id==='INP_SEATED_GAMES');
            const at=s.inputs.find(x=>x.id==='INP_SEATED_AT_COUNT');
            if(!games||!at) throw new Error('Monkey predecessor inputs missing');
            games.name='着席時 通常ゲーム数';
            games.description='実機メニュー「遊技データ」の「通常」に表示される累計通常ゲーム数を入力してください。';
            at.name='着席時 SGラッシュ初当り回数';
            at.description='実機メニュー「遊技データ」の通常欄に表示されるSGラッシュ回数を入力してください。青島SGラッシュは別項目のため含めません。';
            const rf=r.features.find(x=>x.researchFeatureId==='RF_AT_PREDECESSOR');
            if(!rf) throw new Error('Monkey predecessor research feature missing');
            rf.name='着席時メニューのSGラッシュ初当り';
            rf.trialUnit='メニュー累計通常ゲーム';
            rf.observationScope='着席時・実機メニュー遊技データ';
            rf.numeratorDefinition='メニュー通常欄のSGラッシュ回数';
            rf.denominatorDefinition='メニューの累計通常ゲーム数';
            rf.notes='実機メニューで通常ゲーム数とSGラッシュ回数を同時に直接確認できるため、データカウンターより優先して使用する。青島SGラッシュは別集計のため含めない。';
            const sf=s.features.find(x=>x.featureId==='FEAT_AT_PREDECESSOR');
            if(sf) sf.userReason='実機メニューから前任者を含む通常ゲーム数とSGラッシュ初当り回数を直接取得でき、公開AT初当り確率と同じ通常時区間で評価できるため採用。';
            write(sp,s); write(rp,r);
          }

          // Revue Starlight: menu normal games + Challenge Revue + STAR LIGHT initial count.
          {
            const sp='research/S_REVUE_STARLIGHT_CX/selection-data.json';
            const rp='research/S_REVUE_STARLIGHT_CX/research-data.json';
            const s=read(sp), r=read(rp);
            const ids=new Set(s.inputs.map(x=>x.id));
            const addInput=x=>{ if(!ids.has(x.id)){s.inputs.push(x);ids.add(x.id);} };
            addInput({id:'INP_SEATED_NORMAL_GAMES',name:'着席時 通常ゲーム数',category:'PREDECESSOR',type:'integer',unit:'G',displayOrder:1,inferenceRole:'INCLUDE_SUPPORT',description:'実機メニュー「遊技履歴」の通常ゲーム数を入力してください。',defaultValue:'',observationScope:'PREDECESSOR_SNAPSHOT'});
            addInput({id:'INP_SEATED_CZ_COUNT',name:'着席時 Challenge Revue回数',category:'PREDECESSOR',type:'counter',unit:'回',displayOrder:2,inferenceRole:'INCLUDE_SUPPORT',description:'実機メニュー「遊技履歴」のChallenge Revue累計回数を入力してください。',defaultValue:'',observationScope:'PREDECESSOR_SNAPSHOT'});
            addInput({id:'INP_SEATED_AT_COUNT',name:'着席時 STAR LIGHT初当り回数',category:'PREDECESSOR',type:'counter',unit:'回',displayOrder:3,inferenceRole:'INCLUDE_SUPPORT',description:'実機メニュー「遊技履歴」のSTAR LIGHT累計回数（AT初当り）を入力してください。',defaultValue:'',observationScope:'PREDECESSOR_SNAPSHOT'});
            if(!r.features.some(x=>x.researchFeatureId==='RF_REVUE_AT')){
              r.features.push({
                researchFeatureId:'RF_REVUE_AT',name:'AT初当り',factStatus:'verified',candidateModel:'poisson',trialUnit:'通常時1G',numeratorDefinition:'AT初当り回数',denominatorDefinition:'通常ゲーム数',settingValues:{
                  SET_1:{probability:1/359.6,rawDisplay:'1/359.6'},SET_2:{probability:1/346.8,rawDisplay:'1/346.8'},SET_4:{probability:1/277.1,rawDisplay:'1/277.1'},SET_5:{probability:1/255.7,rawDisplay:'1/255.7'},SET_6:{probability:1/232.5,rawDisplay:'1/232.5'}
                },sourceRefs:['SRC_1GEKI'],crossSourceStatus:'matched',notes:'公開AT初当り。実機メニューSTAR LIGHT累計回数を着席時観測にも利用する。'
              });
            }
            const addFeature=x=>{if(!s.features.some(f=>f.featureId===x.featureId))s.features.push(x);};
            addFeature({researchFeatureId:'RF_REVUE_CZ',featureId:'FEAT_CZ_PREDECESSOR',adoptionCategory:'INCLUDE_SUPPORT',numeratorInputId:'INP_SEATED_CZ_COUNT',denominatorInputId:'INP_SEATED_NORMAL_GAMES',minimumSample:1,sampleRecommendation:1000,weight:1,difficultyParticipation:'EXCLUDE',userReason:'実機メニューから通常ゲーム数とChallenge Revue累計回数を直接取得できるため、着席前区間のCZ初当り観測として採用。',difficultyExclusionReason:'着席時スナップショットのためDifficultyには含めない。'});
            addFeature({researchFeatureId:'RF_REVUE_AT',featureId:'FEAT_AT_PREDECESSOR',adoptionCategory:'INCLUDE_SUPPORT',numeratorInputId:'INP_SEATED_AT_COUNT',denominatorInputId:'INP_SEATED_NORMAL_GAMES',minimumSample:1,sampleRecommendation:1000,weight:1,difficultyParticipation:'EXCLUDE',userReason:'実機メニューのSTAR LIGHT累計回数がAT初当り回数として確認でき、通常ゲーム数と同一区間で評価できるため採用。',difficultyExclusionReason:'着席時スナップショットのためDifficultyには含めない。'});
            s.uiCategoryLabels={...(s.uiCategoryLabels||{}),PREDECESSOR:'着席時データ'};
            write(sp,s); write(rp,r);
          }
          NODE
      - name: Validate and rebuild both machines
        run: npm run machine:batch -- L_MONKEY_TURN5_CE S_REVUE_STARLIGHT_CX
      - name: Verify predecessor contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const id of ['L_MONKEY_TURN5_CE','S_REVUE_STARLIGHT_CX']){
            const p=JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`,'utf8'));
            const sec=(p.ui?.sections||[]).find(s=>s.id==='AUTO_PREDECESSOR');
            if(!sec) throw new Error(`${id}: predecessor section missing`);
          }
          const r=JSON.parse(fs.readFileSync('machines/S_REVUE_STARLIGHT_CX/machine-package.json','utf8'));
          for(const id of ['FEAT_CZ_PREDECESSOR','FEAT_AT_PREDECESSOR']) if(!(r.features?.features||[]).some(f=>f.featureId===id)) throw new Error(`Revue missing ${id}`);
          NODE
      - name: Commit generated changes
        run: |
          rm .github/workflows/tmp-menu-predecessor-two-machines.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_MONKEY_TURN5_CE research/S_REVUE_STARLIGHT_CX machines/L_MONKEY_TURN5_CE machines/S_REVUE_STARLIGHT_CX reports difficulty-catalog.json machine-registry.json .github/workflows/tmp-menu-predecessor-two-machines.yml
          git commit -m "Use machine menu data for predecessor inference" || exit 0
          git push origin HEAD:feature/menu-predecessor-two-machines
