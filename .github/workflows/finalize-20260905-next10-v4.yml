name: Finalize 20260905 Next10 Research Batch v4

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/finalize-20260905-next10-v4.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source finalization transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/finalize-20260905-next10.yml')
          s=p.read_text(encoding='utf-8')
          a=s.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          b=s.index("\n          PY", a)
          Path('/tmp/finalize_next10.py').write_text(textwrap.dedent(s[a:b]), encoding='utf-8')
          PY
          python /tmp/finalize_next10.py
      - name: Restore verified cumulative catalog as normal prototype catalog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const sourcePath='device-test/20260905-next10/catalog.json';
          if(!fs.existsSync(sourcePath)) throw new Error('verified 220-device catalog is missing');
          const cat=JSON.parse(fs.readFileSync(sourcePath,'utf8'));
          const entries=cat.machines || cat.entries || cat.items;
          if(!Array.isArray(entries) || entries.length!==220) throw new Error(`verified catalog count ${entries?.length} != 220`);

          const ids=new Set();
          for(const entry of entries){
            const id=entry.machineId || entry.id;
            if(!id) throw new Error('catalog entry without machineId');
            if(ids.has(id)) throw new Error(`duplicate catalog id ${id}`);
            ids.add(id);
            const local=`machines/${id}/machine-package.json`;
            if(!fs.existsSync(local)) throw new Error(`missing local package ${local}`);
            const buf=fs.readFileSync(local);
            const sha=crypto.createHash('sha256').update(buf).digest('hex');
            const declared=String(entry.sha256 || entry.packageSha256 || entry.hash || '').replace(/^sha256:/,'');
            if(declared && declared!==sha) throw new Error(`hash mismatch ${id}: catalog=${declared} local=${sha}`);
            if(entry.sizeBytes!=null && Number(entry.sizeBytes)!==buf.length) throw new Error(`size mismatch ${id}`);
            entry.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${id}/machine-package.json`;
            if('sha256' in entry) entry.sha256=sha;
            if('packageSha256' in entry) entry.packageSha256=sha;
            if('hash' in entry && String(entry.hash).startsWith('sha256:')) entry.hash=`sha256:${sha}`;
            if('sizeBytes' in entry) entry.sizeBytes=buf.length;
          }
          cat.catalogVersion='20260905-next10-final';
          cat.generatedAt=new Date().toISOString();
          cat.generatedBy='finalize-20260905-next10-v4.yml';
          fs.writeFileSync('catalog.json',JSON.stringify(cat,null,2)+'\n');
          console.log(`restored catalog entries=${entries.length}`);
          NODE
      - name: Remove isolated-device artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf device-test/20260905-next10
          rm -f .github/workflows/publish-20260905-next10-isolated.yml \
                .github/workflows/real-device-feedback-20260905.yml \
                .github/workflows/real-device-feedback-20260905-v2.yml \
                .github/workflows/repair-20260905-next10-device-feed.yml \
                .github/workflows/repair-20260905-next10-device-feed-v2.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate next10 source files
        shell: bash
        run: |
          set -euo pipefail
          IDS="L_IZA_BANCHO_SB8 L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN LB_TRIPLE_CROWN_SF4 LB_MATADOR_3_TT L_TENSEI_SHITARA_KEN_DESHITA_GT L_DARLING_IN_THE_FRANXX_SA L_SAKI_CHOJO_KESSEN_YR S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS"
          for id in $IDS; do
            npm run research:validate -- "research/$id/research-data.json"
            npm run observation:validate -- "research/$id/machine-observation-data.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateUiDesignData } from './tools/validate-ui-design-data.mjs';
          const ids=['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'];
          let failed=0;
          for(const id of ids){
            const data=JSON.parse(fs.readFileSync(`research/${id}/ui-design-data.json`,'utf8'));
            const errors=validateUiDesignData(data,{expectedMachineId:id});
            if(errors.length){failed++; console.error(id,errors);}
          }
          if(failed) process.exit(1);
          console.log(`Next10 UI Design validation: PASS / files ${ids.length}`);
          NODE
      - name: Final repository catalog and registry audit
        shell: bash
        run: |
          set -euo pipefail
          npm run audit
          npm run registry:validate
          npm test
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const cat=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entries=cat.machines || cat.entries || cat.items || [];
          if(entries.length!==220) throw new Error(`catalog count ${entries.length} != 220`);
          const catIds=new Set(entries.map(x=>x.machineId||x.id));
          if(catIds.size!==220) throw new Error(`catalog unique count ${catIds.size} != 220`);
          for(const e of entries){
            const id=e.machineId||e.id;
            const p=`machines/${id}/machine-package.json`;
            if(!fs.existsSync(p)) throw new Error(`catalog package missing ${id}`);
            const b=fs.readFileSync(p);
            const sha=crypto.createHash('sha256').update(b).digest('hex');
            const declared=String(e.sha256||e.packageSha256||e.hash||'').replace(/^sha256:/,'');
            if(declared && declared!==sha) throw new Error(`final hash mismatch ${id}`);
            if(!String(e.packageUrl||'').includes('/prototype-multi-machine/')) throw new Error(`non-prototype package URL ${id}`);
          }
          const reg=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const machines=reg.machines || reg.entries || [];
          const regIds=new Set(machines.map(x=>x.machineId||x.id));
          const missing=[...catIds].filter(id=>!regIds.has(id));
          if(missing.length) throw new Error(`registry missing catalog ids: ${missing.join(',')}`);
          const next10=['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'];
          for(const id of next10) if(!catIds.has(id)) throw new Error(`next10 missing from final catalog: ${id}`);
          if(fs.existsSync('device-test/20260905-next10')) throw new Error('device-test residue remains');
          console.log(`FINAL_NEXT10_CHECK PASS catalog=220 registry=${regIds.size} next10=10`);
          NODE
      - name: Commit finalized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize reviewed next10 batch and restore 220 catalog'
          git push origin HEAD:publish/20260905-next10
