name: v6.4 Iceborne Unresolved Evidence

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-iceborne-unresolved-evidence.mjs'
      - 'tools/audit-v64-cross-machine-semantic.mjs'
      - '.github/workflows/v64-iceborne-unresolved-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run Evidence gating
        run: node tools/migrate-v64-iceborne-unresolved-evidence.mjs .
      - name: Apply Evidence gating
        run: node tools/migrate-v64-iceborne-unresolved-evidence.mjs . --apply
      - name: Rebuild Iceborne package
        run: npm run machine:pipeline -- S_MHW_ICEBORNE_ZF --skip-repo-checks
      - name: Refresh semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Assert unresolved state Evidence is not exposed
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('research/S_MHW_ICEBORNE_ZF/selection-data.json','utf8'));
          const ids=new Set((s.evidenceUi?.groups??[]).flatMap(g=>g.options??[]).flatMap(o=>o.sourceEvidenceIds??[]));
          if(ids.has('RE_HIGH_WEAK_SELIANA')) throw new Error('unresolved high-state Evidence still exposed');
          const report=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=report.machines.find(x=>x.machineId==='S_MHW_ICEBORNE_ZF');
          const bad=(m?.issues??[]).filter(x=>x.code==='EXCLUDED_NUMERIC_FEATURE_WITH_RELATED_EVIDENCE');
          if(bad.length) throw new Error(`Iceborne still has ${bad.length} excluded-numeric Evidence review(s)`);
          console.log(`PASS Iceborne unresolved Evidence gated; remaining issues=${(m?.issues??[]).map(x=>x.code).join(',')||'none'}`);
          NODE
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Commit validated Evidence gating
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/S_MHW_ICEBORNE_ZF machines/S_MHW_ICEBORNE_ZF catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "fix: gate unresolved Iceborne state Evidence"
            git push origin HEAD:prototype-multi-machine
          fi
