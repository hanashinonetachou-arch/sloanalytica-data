name: Batch004 Hiho Selfcheck Repair

on:
  push:
    branches:
      - production/v85-batch-004-foundation-20261003
    paths:
      - production/.batch004-hiho-selfcheck-repair-trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: batch004-hiho-selfcheck-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-004-foundation-20261003
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution branch
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate observability repair contract
        working-directory: production-state/production
        run: npm test

      - name: Invalidate Hiho from Research through Distribution
        working-directory: production-state/production
        run: node --experimental-strip-types src/invalidate-machine-downstream.ts batch-20261003-004 L_HIHODEN_PA7 --include-research

      - name: Materialize corrected Hiho Research
        working-directory: production-state/production
        run: node --experimental-strip-types src/materialize-research-drafts.ts batch-20261003-004 wave-1 --force-machine=L_HIHODEN_PA7 --force-only

      - name: Regenerate Hiho through App Runtime
        working-directory: production-state/production
        run: node --experimental-strip-types src/deterministic-production-worker.ts batch-20261003-004 --through APP_RUNTIME

      - name: Assert hidden-state features are reference-only and safe aggregate is active
        working-directory: production-state/production
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const batch='batch-20261003-004',id='L_HIHODEN_PA7';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const research=read(path.join('batches',batch,'artifacts',id,'research','result.json'));
          const app=read(path.join('batches',batch,'artifacts',id,'app_runtime','result.json')).package;
          const byId=new Map((research.findings??[]).map(x=>[x.findingId,x]));
          const hidden=[
            'chance-to-koukaku','non-densetsu-big-koukaku','densetsu-big-koukaku',
            'mystery-koukaku','densetsu-after-koukaku-fail','densetsu-after-reg'
          ];
          for(const fid of hidden){
            const f=byId.get(fid);
            if(!f||f.observationType!=='reference_distribution')throw new Error('HIDDEN_STATE_NOT_REFERENCE_ONLY:'+fid);
            if((app.features?.runtimeProjection??[]).some(x=>x.featureId===fid&&x.runtimeStatus==='ACTIVE'))throw new Error('HIDDEN_STATE_FEATURE_ACTIVE:'+fid);
          }
          const safe=byId.get('big-koukaku-selection-overall');
          if(!safe||safe.observationType!=='conditional_probability'||safe.trialUniverse!=='KOUKAKU_HIT_TRIAL')throw new Error('SAFE_BIG_KOUKAKU_RESEARCH_ROUTE');
          const projected=(app.features?.runtimeProjection??[]).find(x=>x.featureId==='big-koukaku-selection-overall');
          if(!projected||projected.runtimeStatus!=='ACTIVE')throw new Error('SAFE_BIG_KOUKAKU_NOT_ACTIVE');
          const feature=(app.features?.features??[]).find(x=>x.featureId==='big-koukaku-selection-overall');
          if(!feature||feature.denominatorInputId!=='big-koukaku-selection-overall.eligibleTrialCount'||feature.numeratorInputId!=='big-koukaku-selection-overall.successCount')throw new Error('SAFE_BIG_KOUKAKU_INPUT_BINDING');
          const uiText=JSON.stringify(app.ui?.v8Sections??[]);
          for(const fid of hidden)if(uiText.includes('"OBS_'+fid+'"'))throw new Error('HIDDEN_STATE_OBSERVATION_UI_VISIBLE:'+fid);
          if(!uiText.includes('"OBS_big-koukaku-selection-overall"'))throw new Error('SAFE_BIG_KOUKAKU_UI_MISSING');
          console.log(JSON.stringify({status:'PASS',hiddenReferenceOnly:hidden.length,safeAggregateActive:true},null,2));
          NODE
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261003-004

      - name: Commit regenerated authoritative pre-distribution state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-004-foundation-20261003
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/production/v85-batch-004-foundation-20261003)" || {
            echo "Production branch moved during repair; refusing non-CAS publication."
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261003-004
          git commit -m "Regenerate Hiho after observability selfcheck [skip ci]"
          git push origin HEAD:production/v85-batch-004-foundation-20261003
          echo "PRE_DISTRIBUTION_PROD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize corrected Hiho live package
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261003-004',machineId='L_HIHODEN_PA7';
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json');
          const catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const entry=catalog.machines.find(x=>x.machineId===machineId);
          if(!entry)throw new Error('CATALOG_ENTRY_MISSING');
          const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
          if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE');
          const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
          const pkg=app.package;
          pkg.machine.introductionDate=entry.introductionDate;
          pkg.machine.machineType=entry.machineType;
          pkg.machine.gameType=entry.gameType;
          const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
          const target=path.join(proto,'machines',machineId,'machine-package.json');
          fs.writeFileSync(target,bytes);
          const caps=[];
          for(const feature of pkg.features?.features??[]){
            const model=String(feature.modelType??'').toLowerCase();
            if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');
            if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');
          }
          if((pkg.evidence?.references??[]).length>0&&!caps.includes('evidence'))caps.push('evidence');
          const sha256=crypto.createHash('sha256').update(bytes).digest('hex');
          entry.machineDataVersion=pkg.machine.machineDataVersion;
          entry.sha256=sha256;
          entry.packageSizeBytes=bytes.length;
          entry.requiredCapabilities=caps;
          entry.updatedAt=new Date().toISOString();
          fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/hiho-package-metadata.json',JSON.stringify({
            [machineId]:{machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256,packageSizeBytes:bytes.length,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType}
          },null,2)+'\n');
          NODE

      - name: Validate corrected live distribution package
        working-directory: prototype
        run: |
          npm run ux-contract:audit
          node --test --test-concurrency=1 test/user-verified-ux-contracts.test.mjs
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const id='L_HIHODEN_PA7';
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entry=catalog.machines.find(x=>x.machineId===id);
          const b=fs.readFileSync('machines/'+id+'/machine-package.json');
          if(b.length!==entry.packageSizeBytes)throw new Error('SIZE');
          if(crypto.createHash('sha256').update(b).digest('hex')!==entry.sha256)throw new Error('SHA');
          const p=JSON.parse(b);
          const active=new Set((p.features?.runtimeProjection??[]).filter(x=>x.runtimeStatus==='ACTIVE').map(x=>x.featureId));
          for(const fid of ['chance-to-koukaku','non-densetsu-big-koukaku','densetsu-big-koukaku','mystery-koukaku','densetsu-after-koukaku-fail','densetsu-after-reg'])if(active.has(fid))throw new Error('HIDDEN_STATE_ACTIVE_LIVE:'+fid);
          if(!active.has('big-koukaku-selection-overall'))throw new Error('SAFE_AGGREGATE_INACTIVE_LIVE');
          NODE

      - name: Commit corrected Hiho distribution atomically
        shell: bash
        working-directory: prototype
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git add catalog.json machines/L_HIHODEN_PA7/machine-package.json
          git commit -m "Repair Hiho hidden-state observability [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "PROTOTYPE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$PROTOTYPE_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Build targeted Distribution attestation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const doc={
            batchId:'batch-20261003-004',
            integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.PROTOTYPE_COMMIT},
            packages:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/hiho-package-metadata.json','utf8')),
            checks:{
              catalogIntegrity:true,
              pagesDeployment:{runId:Number(process.env.PAGES_RUN_ID),conclusion:'success'},
              uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},
              machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}
            }
          };
          const p=path.resolve('production-state','production','batches','batch-20261003-004','distribution-repair-attestation.json');
          fs.writeFileSync(p,JSON.stringify(doc,null,2)+'\n');
          NODE

      - name: Finalize corrected Hiho Distribution stage
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261003-004 --through DISTRIBUTION
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261003-004

      - name: Commit finalized authoritative repair state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-004-foundation-20261003
          test "$PRE_DISTRIBUTION_PROD_COMMIT" = "$(git rev-parse origin/production/v85-batch-004-foundation-20261003)" || {
            echo "Production branch moved during distribution repair; refusing non-CAS publication."
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261003-004
          git commit -m "Finalize Hiho observability repair Distribution [skip ci]"
          git push origin HEAD:production/v85-batch-004-foundation-20261003
