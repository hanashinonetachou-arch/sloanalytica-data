name: Batch 20260901 Publish Diagnostic

on:
  push:
    branches:
      - batch/20260901-magia-gundamseed
    paths:
      - '.github/workflows/batch-20260901-publish-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-publish-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: batch/20260901-magia-gundamseed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce APPLY and capture failure summary
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin prototype-multi-machine:refs/remotes/origin/prototype-multi-machine
          npm run machine:publish:batch -- --apply \
            L_MAGIA_RECORD_RN \
            L_GODZILLA_NS \
            L_USHIO_TORA_HAKUMEN_VH \
            L_AMAZING_LIVE_PD \
            L_YOSHIMUNE_SC2 \
            L_MAHJONG_MONOGATARI_S2 \
            L_IDOLMASTER_MILLION_LIVE_HC \
            L_YOUJITSU_DE \
            L_MIDORIDON_VIVA_REVIVAL_FY \
            L_GUNDAM_SEED_G 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          echo '===== DIAGNOSTIC MATCHES ====='
          grep -Ein -C 4 '(^|[^A-Z])(ERROR|FAIL|BLOCK|mismatch|missing|invalid|WARNING)([^A-Z]|$)' /tmp/publish.log | tail -n 240 || true
          echo '===== FINAL 160 LINES ====='
          tail -n 160 /tmp/publish.log
          exit "$status"
