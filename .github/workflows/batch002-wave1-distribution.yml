name: Batch002 Wave1 Distribution Integration

on:
  push:
    branches:
      - production/v85-batch-002-foundation-20261001
    paths:
      - production/.batch002-wave1-integration-trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: batch002-distribution-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-002-foundation-20261001
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution branch
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate authoritative production state
        working-directory: production-state/production
        run: npm test

      - name: Materialize Wave 1 App Runtime packages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261001-002';
          const machines=['L_LOTIS_TN','L_DARK_HAIBI_SB','L_SENGOKU_OTOME5_L8','L_SAO2_PA1','L_BIRDIE_WING_BC'];
          const prod=path.resolve('production-state');
          const proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json');
          const catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x]));
          const metadata={};
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package;
            if(pkg?.machine?.machineId!==machineId)throw new Error('PACKAGE_IDENTITY:'+machineId);
            const entry=byId.get(machineId);
            if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;
            pkg.machine.machineType=entry.machineType;
            pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            const target=path.join(proto,'machines',machineId,'machine-package.json');
            fs.mkdirSync(path.dirname(target),{recursive:true});
            fs.writeFileSync(target,bytes);
            const caps=[];
            for(const feature of pkg.features?.features??[]){
              const model=String(feature.modelType??'').toLowerCase();
              if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');
              if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');
            }
            if((pkg.evidence?.references??[]).length>0&&!caps.includes('evidence'))caps.push('evidence');
            const nextHash=sha256(bytes);
            const changed=entry.machineDataVersion!==pkg.machine.machineDataVersion||entry.sha256!==nextHash||entry.packageSizeBytes!==bytes.length||JSON.stringify(entry.requiredCapabilities??[])!==JSON.stringify(caps);
            entry.machineDataVersion=pkg.machine.machineDataVersion;
            entry.sha256=nextHash;
            entry.packageSizeBytes=bytes.length;
            entry.requiredCapabilities=caps;
            if(changed)entry.updatedAt=new Date().toISOString();
            metadata[machineId]={machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:entry.packageSizeBytes,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType};
          }
          fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch002-wave1-package-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE

      - name: Verify catalog package integrity
        shell: bash
        working-directory: prototype
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const ids=new Set(['L_LOTIS_TN','L_DARK_HAIBI_SB','L_SENGOKU_OTOME5_L8','L_SAO2_PA1','L_BIRDIE_WING_BC']);
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          for(const item of catalog.machines.filter(x=>ids.has(x.machineId))){
            const p=path.join('machines',item.machineId,'machine-package.json');
            const b=fs.readFileSync(p);
            if(b.length!==item.packageSizeBytes)throw new Error('SIZE:'+item.machineId);
            if(crypto.createHash('sha256').update(b).digest('hex')!==item.sha256)throw new Error('SHA:'+item.machineId);
          }
          NODE

      - name: Run user-verified UX contracts
        working-directory: prototype
        run: |
          npm run ux-contract:audit
          node --test --test-concurrency=1 test/user-verified-ux-contracts.test.mjs

      - name: Apply and verify machine identity consistency
        working-directory: prototype
        run: |
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify

      - name: Commit prototype distribution atomically
        shell: bash
        working-directory: prototype
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git add catalog.json \
            machines/L_LOTIS_TN/machine-package.json \
            machines/L_DARK_HAIBI_SB/machine-package.json \
            machines/L_SENGOKU_OTOME5_L8/machine-package.json \
            machines/L_SAO2_PA1/machine-package.json \
            machines/L_BIRDIE_WING_BC/machine-package.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Batch 002 Wave 1 packages [skip ci]"
            git push origin HEAD:prototype-multi-machine
          fi
          echo "PROTOTYPE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$PROTOTYPE_COMMIT\" and .conclusion == \"success\") | .id" | head -n1 || true)"
          if [ -z "$run_id" ]; then
            gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
            for _ in $(seq 1 30); do
              run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$PROTOTYPE_COMMIT\") | .id" | head -n1 || true)"
              [ -n "$run_id" ] && break
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          fi
          echo "PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Build Distribution attestation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const doc={
            batchId:'batch-20261001-002',
            integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.PROTOTYPE_COMMIT},
            packages:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch002-wave1-package-metadata.json','utf8')),
            checks:{
              catalogIntegrity:true,
              pagesDeployment:{runId:Number(process.env.PAGES_RUN_ID),conclusion:'success'},
              uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},
              machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}
            }
          };
          const p=path.resolve('production-state','production','batches','batch-20261001-002','distribution-repair-attestation.json');
          fs.writeFileSync(p,JSON.stringify(doc,null,2)+'\n');
          NODE

      - name: Finalize Wave 1 Distribution state
        working-directory: production-state/production
        run: node --experimental-strip-types src/finalize-batch-distribution.ts batch-20261001-002 batches/batch-20261001-002/distribution-repair-attestation.json

      - name: Validate finalized production state
        working-directory: production-state/production
        run: npm test

      - name: Commit finalized authoritative state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-002-foundation-20261001
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/production/v85-batch-002-foundation-20261001)" || {
            echo "Production branch moved during integration; refusing non-CAS publication."
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261001-002
          git commit -m "Finalize Batch 002 Wave 1 Distribution [skip ci]"
          git push origin HEAD:production/v85-batch-002-foundation-20261001
