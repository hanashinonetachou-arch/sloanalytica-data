name: Feature UI v2 Rematerialize Stale Packages

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - '.github/workflows/feature-ui-v2-rematerialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rematerialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare stale non-drift machine list
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/feature_ui_v2_stale_machine_ids.txt <<'EOF'
          L_ARIFURETA_JA
          L_DISCUP_ULTRA_REMIX_XR
          L_DOUBLE_ATTACK2_EX
          L_INITIAL_D_2ND
          L_KAMEN_RIDER_DEN_O_UD
          L_LUPIN_DAIKOUKAISHA_H1
          L_NANATSU_NO_MAKEN_PU
          L_NYANKO_DAISENSO_CHOSHINSOKU_KB
          L_ONIMUSHA3_XA
          L_REZERO_SEASON2_PA5
          L_SALARYMAN_KINTARO_ET
          L_SHAMANKING_SS
          L_SHIMAMUSUME_L2
          L_SHIN_EVANGELION
          L_SHIN_IKKITOUSEN_V
          L_SHIOKININ_KC
          L_STAR_HANAHANA_MX
          L_SUPER_BLACKJACK_SLDC
          L_TIDADONDON_PA5
          L_TOARU_ACCELERATOR_RZ
          S_ANOTHER_GOD_HADES_SL
          S_BIG_SHIMAUTA_E2_30
          S_BIOHAZARD_RE2_XB
          S_BOOWY_SV
          S_CHABUDAI_EB6
          S_DANMACHI_GAIDEN_XR
          S_ENENN_SHOUBOUTAI_JS
          S_GRANBELM_ZX
          S_GUNDAM_UNICORN_SF
          S_HAIYORE_NYARUKO_SAN_Y
          S_KACHO_KUMADA_GZA
          S_MADE_IN_ABYSS_EN
          S_MAHOIKU_NB
          S_MOMOKYUN_SWORD_DX
          S_MORE_CHIBARIYO_NB_30
          S_MY_FLOWER_II_EE_30
          S_NIGHTS_YTCC
          S_OKIDOKI_GOLD_GS
          S_OVERLORD_II_SX
          S_SENGOKU_COLLECTION5_PS
          S_SHIN_ORE_NO_SORA_ST
          S_SHIN_TENKAFUBU_DD
          S_SLODOL_PK
          S_SUPER_RIO_ACE_CC
          S_TEKKEN4_ULTIMATE_DEVIL_TCD
          S_TOARU_RAILGUN_FB
          S_WARAU4_KH
          S_YOUJO_SENKI_ZR
          EOF
          test "$(wc -l < /tmp/feature_ui_v2_stale_machine_ids.txt | tr -d ' ')" = '48'
          ! grep -qx 'L_KYOUKARA_OREHA_FE' /tmp/feature_ui_v2_stale_machine_ids.txt
          ! grep -qx 'S_SENGOKU_KOIHIME_FC' /tmp/feature_ui_v2_stale_machine_ids.txt
          ! grep -qx 'S_SUPER_BINGO_NEO_CLASSIC_HH1' /tmp/feature_ui_v2_stale_machine_ids.txt
          ! grep -qx 'L_KOMONCHAMA_TEN_L2' /tmp/feature_ui_v2_stale_machine_ids.txt
          split -l 10 /tmp/feature_ui_v2_stale_machine_ids.txt /tmp/feature_ui_v2_chunk_
          for chunk in /tmp/feature_ui_v2_chunk_*; do
            count="$(wc -l < "$chunk" | tr -d ' ')"
            test "$count" -le 10
            echo "${chunk##*/}: ${count} machines"
          done

      - name: Rematerialize in guarded batches and commit each successful chunk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for chunk in /tmp/feature_ui_v2_chunk_*; do
            count="$(wc -l < "$chunk" | tr -d ' ')"
            echo "::group::Feature UI v2 rematerialize ${chunk##*/} (${count} machines)"
            npm run machine:batch -- --file "$chunk"
            echo '::endgroup::'

            git add catalog.json difficulty-catalog.json research/*/selection-data.json research/*/statistics-report.json research/*/difficulty-report.json research/*/setting-band-report.json machines/*/machine-package.json machine-registry.json
            if git diff --cached --quiet; then
              echo "No generated changes for ${chunk##*/}."
              continue
            fi
            git commit -m "chore: rematerialize Feature UI v2 ${chunk##*/}"
            if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
              git push origin HEAD:${{ github.event.pull_request.head.ref }}
            fi
          done

      - name: Verify repository state
        run: |
          npm test
          npm run audit
