name: Apply 20260907 Gate B reconsideration

on:
  push:
    branches:
      - batch/20260907-next10-gateb
    paths:
      - '.github/workflows/apply-20260907-gateb-reconsideration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-gateb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reconsider Triple Crown plum
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          const f=s.features.find(x=>x.researchFeatureId==='RF_PLUM');
          if(!f) throw new Error('RF_PLUM missing');
          f.adoptionCategory='EXCLUDE';
          delete f.userReason; delete f.weight; delete f.numeratorInputId; delete f.denominatorInputId; delete f.suppressedByFeatureIds;
          f.userFacingReason='プラムは設定差自体はあるが、チェリーと同一の通常ゲームを分母とする排他的な小役事象であり、チェリーと独立Binomialとして同時評価すると同じ通常ゲーム情報を重ねて尤度を強めるため不採用とする。設定差がより大きいチェリーを代表Featureとして残す。';
          f.difficultyParticipation='EXCLUDE';
          f.difficultyExclusionReason='推測計算に採用しないためDifficultyにも参加させない。';
          const input=s.inputs.find(x=>x.id==='INP_PLUM_COUNT'); if(input) input.inferenceRole='EXCLUDE';
          const r=JSON.parse(fs.readFileSync('research/LB_TRIPLE_CROWN_SEVEN_FG/research-data.json','utf8'));
          const byId=new Map(r.features.map(x=>[x.researchFeatureId,x]));
          const sel=s.features.filter(x=>x.adoptionCategory!=='EXCLUDE'); const rej=s.features.filter(x=>x.adoptionCategory==='EXCLUDE');
          s.selectionSummaryContract={schemaVersion:'selection-summary-v1',evaluatedCount:s.features.length,selectedCount:sel.length,rejectedCount:rej.length,selected:sel.map(x=>({name:byId.get(x.researchFeatureId)?.name??x.researchFeatureId,reason:x.userReason??'推測計算に採用しています。'})),rejected:rej.map(x=>({name:byId.get(x.researchFeatureId)?.name??x.researchFeatureId,reason:x.userFacingReason??'推測計算には採用していません。'}))};
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');

          const vr=JSON.parse(fs.readFileSync('reports/batch-20260907-gate-b-validation.json','utf8'));
          vr.selected=34; vr.rejected=4;
          fs.writeFileSync('reports/batch-20260907-gate-b-validation.json',JSON.stringify(vr,null,2)+'\n');
          fs.writeFileSync('reports/batch-20260907-gate-b-completion.md',`# SloAnalytica 2026-09-07 Next10 — Gate B checkpoint\n\n## Status\n\n**Gate B / Statistical Selection + Dependency Audit: PASS**\n\n- exact batch scope: 10/10\n- Research Features evaluated: 38/38\n- selected: 34\n- rejected: 4\n- Research Evidence dispositioned: 95/95\n- strict batch ingest: READY_FOR_MACHINE 10 / REVIEW 0 / BLOCKED 0\n- public main: unchanged\n\n## Reconsideration from Gate C\n\nLBトリプルクラウンセブンのプラムは、チェリーと同一の通常ゲーム分母上で排他的に成立する自然観測であることがGate Cで明確になったため、Selectionを再評価した。独立Binomialとしてチェリーと同時利用すると同じ通常ゲーム情報を二重に尤度化するため、プラムをEXCLUDEへ変更し、設定差がより大きいチェリーを代表Featureとして残した。Research候補自体は保持する。\n\nその他の包含・因果依存Featureは既存suppression/Fallback契約を維持する。ヨルムンガンド終了画面はHard Evidenceカテゴリを数値Multinomialから除外し、同一観測の二重評価を防止する。\n`);
          NODE
      - name: Validate exact 10
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA)
          for id in "${ids[@]}"; do npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assessSelectionQuality } from './tools/selection-quality-gate.mjs';
          import { validateSelectionEvidenceCoverage } from './tools/batch-completeness-gates.mjs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          let f=0,sn=0,rj=0,e=0;const errors=[];
          for(const id of ids){const r=JSON.parse(fs.readFileSync(`research/${id}/research-data.json`));const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`));const q=assessSelectionQuality(r,s);if(q.status==='BLOCKED')errors.push(...q.blockers);const ec=validateSelectionEvidenceCoverage(s,r,{required:true});if(!ec.ok)errors.push(...ec.errors);f+=s.features.length;sn+=s.features.filter(x=>x.adoptionCategory!=='EXCLUDE').length;rj+=s.features.filter(x=>x.adoptionCategory==='EXCLUDE').length;e+=s.evidence.length;}
          if(f!==38||sn!==34||rj!==4||e!==95)errors.push(`totals f=${f} selected=${sn} rejected=${rj} evidence=${e}`);
          if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify({status:'PASS',machines:10,features:f,selected:sn,rejected:rj,evidence:e},null,2));
          NODE
      - name: Commit reconsideration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json reports/batch-20260907-gate-b-validation.json reports/batch-20260907-gate-b-completion.md
          git commit -m 'GateB: reconsider Triple Crown plum after Observation'
          git push origin HEAD:batch/20260907-next10-gateb
