name: Batch 20260903 User Feedback R3

on:
  push:
    branches:
      - batch/20260903-hanagasa-ultraman
    paths:
      - '.github/workflows/batch-20260903-user-feedback-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260903-hanagasa-ultraman
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed UX and Selection changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const sel=id=>`research/${id}/selection-data.json`;
          const ui=id=>`research/${id}/ui-design-data.json`;

          const dropFeature=(s,researchFeatureId,reason)=>{
            const f=s.features.find(x=>x.researchFeatureId===researchFeatureId);
            if(!f) throw new Error(`missing feature ${researchFeatureId}`);
            const ids=[f.numeratorInputId,f.denominatorInputId,...(f.categoryInputIds??[]),...(f.denominatorInputIds??[])].filter(Boolean);
            f.adoptionCategory='EXCLUDE';
            f.userFacingReason=reason;
            f.rejectionReason=reason;
            f.difficultyParticipation='EXCLUDE';
            delete f.numeratorInputId;
            delete f.denominatorInputId;
            delete f.categoryInputIds;
            delete f.denominatorInputIds;
            delete f.difficultyExclusionReason;
            delete f.suppressedByFeatureIds;
            delete f.userReason;
            s.inputs=s.inputs.filter(i=>!ids.includes(i.id));
            return ids;
          };

          const dropUiInputs=(u,ids)=>{
            const set=new Set(ids);
            for(const id of ids) delete u.inputContracts[id];
            for(const [title,section] of Object.entries(u.sections)) {
              section.inputIds=(section.inputIds??[]).filter(id=>!set.has(id));
              if(Array.isArray(section.inputRows)) {
                section.inputRows=section.inputRows
                  .map(r=>({...r,inputIds:(r.inputIds??[]).filter(id=>!set.has(id))}))
                  .filter(r=>r.inputIds.length>0);
              }
              if(section.inputIds.length===0){
                delete u.sections[title];
                u.sectionOrder=u.sectionOrder.filter(x=>x!==title);
              }
            }
          };

          // New Pulsar: make denominator/opportunity explicit.
          {
            const id='LB_NEW_PULSAR_BT_C9',u=read(ui(id));
            u.sections['ボーナス合算'].description='母数には、通常時に回したゲーム数を入力します。ボーナス中のゲームは含めません。';
            u.inputContracts.INP_BONUS_AGG_TRIALS.name='通常時ゲーム数（母数）';
            u.sections['チャンスチェリー'].description='母数には、チャンスチェリーを数えた通常時ゲーム数を入力します。通常時1Gを1試行として、チャンスチェリー成立回数を数えます。';
            u.inputContracts.INP_CHANCE_CHERRY_TRIALS.name='通常時ゲーム数（母数）';
            u.sections['BIG中リールバックライトフラッシュ'].description='母数には、BIG中に消化したゲーム数を入力します。BIG中1Gを1試行として、リールバックライトフラッシュが発生した回数を数えます。';
            u.inputContracts.INP_BIG_FLASH_TRIALS.name='BIG中ゲーム数（母数）';
            u.sections['REG中リールバックライトフラッシュ'].description='母数には、REG中に消化したゲーム数を入力します。REG中1Gを1試行として、リールバックライトフラッシュが発生した回数を数えます。';
            u.inputContracts.INP_REG_FLASH_TRIALS.name='REG中ゲーム数（母数）';
            write(ui(id),u);
          }

          // DMC5: exclude upper-ST-only numeric observations because full-day trial counts are not reliably obtainable.
          {
            const id='L_DMC5_ST_XA',s=read(sel(id)),u=read(ui(id));
            const reason1='上位STセット開始時の3個エンブレムには設定差があるが、上位ST自体が終日でも安定して複数回到達できる事象ではない。上位ST1回から得られるセット開始試行も有限で、7000G実戦で安定した判別力を得るだけの試行数を継続的に確保できないため数値推測から除外する。';
            const reason2='上位ST終了後100G+α以内のボーナス当選率は設定差が大きいが、母数は上位ST終了回数であり、7000G実戦でも0～少数回になりやすい。少数の当否を強く評価する危険があるため数値推測から除外する。';
            const ids=[...dropFeature(s,'RF_UPPER_ST_EMBLEM_COUNT',reason1),...dropFeature(s,'RF_UPPER_ST_100G_HIT',reason2)];
            dropUiInputs(u,ids);
            write(sel(id),s);
            write(ui(id),u);
          }

          // 1000chan: small roles are too weak at 7000G; remove rather than burden users with near-noise counters.
          {
            const id='LB_1000CHAN_ALPHA_L3',s=read(sel(id)),u=read(ui(id));
            const reasons={
              RF_CHERRY:'設定1の1/40.0に対して設定6でも約1/38.9で、7000Gの期待差は標準偏差に対して小さく、終日実戦でも設定判別への寄与がほぼ得られないため数値推測から除外する。',
              RF_WATERMELON:'設定1の1/77.0に対して設定6でも約1/76.2で、7000Gでは統計的な分離がほぼ生じないため数値推測から除外する。',
              RF_WEAK_CHANCE:'設定1の1/99.9に対して設定6でも約1/96.8で、7000Gの期待差は標準偏差に対して小さく、終日実戦でも単独の設定判別材料として実用性が低いため数値推測から除外する。'
            };
            let dropped=[];
            for(const [fid,reason] of Object.entries(reasons)) dropped.push(...dropFeature(s,fid,reason));
            dropUiInputs(u,dropped);

            u.sections['通常時ボーナス合算'].description='母数には、自分が通常時に回したゲーム数を入力します。BIG・1000☆ボーナス・BTなどの消化ゲームは含めません。';
            u.inputContracts.INP_ALL_BONUS_TOTAL_TRIALS.name='通常時ゲーム数（母数）';
            u.sections['ボーナス当選契機内訳分布'].description='母数の別入力は不要です。通常時にボーナスへ当選するたび、当選契機を1つだけカウントしてください。各項目の合計回数が、この分布の母数になります。';

            const jp={
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_SOLO:'単独当選',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_REPLAY:'リプレイ',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_BELL:'ベル',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_CHERRY:'チェリー',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_WATERMELON:'スイカ',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_WEAKCHANCE:'弱チャンス目',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_STRONGCHANCE:'強チャンス目',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_REACH:'リーチ目',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_CONFIRMEDROLE:'確定役',
              INP_BONUS_TRIGGER_DISTRIBUTION_CAT_CONFIRMEDREPLAY:'確定リプレイ'
            };
            for(const [iid,label] of Object.entries(jp)){
              const si=s.inputs.find(x=>x.id===iid);
              if(si) si.name=label;
              if(u.inputContracts[iid]) u.inputContracts[iid].name=label;
            }

            const g=s.evidenceUi?.groups?.find(x=>x.groupId==='EVG_BB_END_VOICE');
            if(!g || !Array.isArray(g.options) || g.options.length!==3) throw new Error('BB end voice Evidence E/F/G contract changed');
            const cueByValue={
              V1_E:'E：設定6濃厚（「おっ昼だぁ!」）',
              V2_F:'F：設定2以上濃厚（「きたきたきたーーー!!」）',
              V3_G:'G：設定5以上濃厚（「1000ちゃん!いつものアレ言って!」など）'
            };
            for(const o of g.options){
              if(!cueByValue[o.value]) throw new Error(`unknown BB end voice option ${o.value}`);
              o.label=cueByValue[o.value];
            }

            write(sel(id),s);
            write(ui(id),u);
          }

          // Jackpot: denominator is number of REG endings, not games in REG.
          {
            const id='LB_JACKPOT_CY1',u=read(ui(id));
            u.sections['ボーナス合算'].description='母数には、通常時に回したゲーム数を入力します。ボーナス中のゲームは含めません。';
            u.inputContracts.INP_BONUS_AGG_TRIALS.name='通常時ゲーム数（母数）';
            u.sections['REG終了時リールバックランプ消灯'].description='母数には、REGを終了まで消化した回数を入力します。REG1回の終了時を1試行として、リールバックランプが消灯した回数を数えます。REG中のゲーム数は入力しません。';
            u.inputContracts.INP_REG_END_BACKLIGHT_TRIALS.name='REG終了回数（母数）';
            write(ui(id),u);
          }

          const report={
            schemaVersion:'batch-user-feedback-r2-v1',
            batch:'20260903-hanagasa-ultraman',
            reviewedAt:'2026-09-03',
            status:'APPLIED_PENDING_REAUDIT',
            decisions:{
              dmc5:{
                upperStEmblem:'EXCLUDE_PRACTICAL_TRIAL_SCARCITY',
                upperSt100g:'EXCLUDE_PRACTICAL_TRIAL_SCARCITY',
                note:'公開上位ST継続期待度は約89%。1回の上位STでセット開始試行は平均的に一桁～10回程度だが、上位STそのものの7000Gあたり突入回数を安定して置けない。終了後100G判定は上位ST終了1回につき1試行。'
              },
              chan1000:{
                smallRoles:'EXCLUDE_LOW_7000G_DISCRIMINATION',
                metrics7000G:{
                  cherry:{zSet1Set6:0.376,expectedBayesFactorSet6VsSet1:1.074},
                  watermelon:{zSet1Set6:0.100,expectedBayesFactorSet6VsSet1:1.005},
                  weakChance:{zSet1Set6:0.267,expectedBayesFactorSet6VsSet1:1.037}
                },
                note:'7000Gでも各小役単独の期待情報量が極小のため、入力負担ではなく統計的実用性を理由に不採用へ変更。'
              },
              ui:'denominator wording clarified; trigger labels localized; E/F/G voice cues expanded'
            }
          };
          fs.writeFileSync('reports/batch-20260903-user-feedback-r2.json',JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Validate edited source layers
        run: |
          npm run selection:validate -- research/L_DMC5_ST_XA/selection-data.json research/L_DMC5_ST_XA/research-data.json
          npm run selection:validate -- research/LB_1000CHAN_ALPHA_L3/selection-data.json research/LB_1000CHAN_ALPHA_L3/research-data.json
          npm run ui-design:validate -- research/LB_NEW_PULSAR_BT_C9/ui-design-data.json
          npm run ui-design:validate -- research/L_DMC5_ST_XA/ui-design-data.json
          npm run ui-design:validate -- research/LB_1000CHAN_ALPHA_L3/ui-design-data.json
          npm run ui-design:validate -- research/LB_JACKPOT_CY1/ui-design-data.json
          npm run observation:selection:audit -- LB_NEW_PULSAR_BT_C9 L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 --strict-v2
          npm run ui-design:observation:audit -- LB_NEW_PULSAR_BT_C9 L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 --strict-v2

      - name: Rebuild affected MachineData atomically
        run: |
          npm run machine:batch -- LB_NEW_PULSAR_BT_C9 L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1

      - name: Final quality gates
        run: |
          npm run pipeline:four-layer:gate -- LB_NEW_PULSAR_BT_C9 L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1
          npm run registry:validate
          npm run audit:ui-service-names
          npm test
          npm run audit

      - name: Mark report PASS and commit reviewed feedback
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='reports/batch-20260903-user-feedback-r2.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.status='PASS_REAUDITED';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/LB_NEW_PULSAR_BT_C9 research/L_DMC5_ST_XA research/LB_1000CHAN_ALPHA_L3 research/LB_JACKPOT_CY1 \
                  machines/LB_NEW_PULSAR_BT_C9 machines/L_DMC5_ST_XA machines/LB_1000CHAN_ALPHA_L3 machines/LB_JACKPOT_CY1 \
                  catalog.json difficulty-catalog.json machine-registry.json reports/batch-20260903-user-feedback-r2.json
          git commit -m 'fix: apply 20260903 user feedback round 2'
          git restore --worktree .
          git clean -fd -- reports/ || true
          git pull --rebase origin batch/20260903-hanagasa-ultraman
          git push origin HEAD:batch/20260903-hanagasa-ultraman
