name: Batch 20260901 UI Design

on:
  push:
    branches:
      - batch/20260901-user-selected-10
    paths:
      - 'tools/generate-batch-ui-design-20260901.mjs'
      - '.github/workflows/batch-20260901-ui-design.yml'
      - 'research/L_MAGIA_RECORD_RN/selection-data.json'
      - 'research/L_GODZILLA_NS/selection-data.json'
      - 'research/L_USHIO_TORA_HAKUMEN_VH/selection-data.json'
      - 'research/L_AMAZING_LIVE_PD/selection-data.json'
      - 'research/L_YOSHIMUNE_SC2/selection-data.json'
      - 'research/L_MAHJONG_MONOGATARI_S2/selection-data.json'
      - 'research/L_IDOLMASTER_MILLION_LIVE_HC/selection-data.json'
      - 'research/L_YOUJITSU_DE/selection-data.json'
      - 'research/L_MIDORI_DON_5_FY/selection-data.json'
      - 'research/L_GUNDAM_SEED_G/selection-data.json'
      - 'research/L_MAGIA_RECORD_RN/machine-observation-data.json'
      - 'research/L_GODZILLA_NS/machine-observation-data.json'
      - 'research/L_USHIO_TORA_HAKUMEN_VH/machine-observation-data.json'
      - 'research/L_AMAZING_LIVE_PD/machine-observation-data.json'
      - 'research/L_YOSHIMUNE_SC2/machine-observation-data.json'
      - 'research/L_MAHJONG_MONOGATARI_S2/machine-observation-data.json'
      - 'research/L_IDOLMASTER_MILLION_LIVE_HC/machine-observation-data.json'
      - 'research/L_YOUJITSU_DE/machine-observation-data.json'
      - 'research/L_MIDORI_DON_5_FY/machine-observation-data.json'
      - 'research/L_GUNDAM_SEED_G/machine-observation-data.json'

permissions:
  contents: write

jobs:
  ui-design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate UI Design contracts
        run: node tools/generate-batch-ui-design-20260901.mjs
      - name: Validate UI Design contracts
        run: node tools/validate-ui-design-data.mjs .
      - name: Audit Selection linkage
        run: >-
          node tools/audit-ui-design-selection-linkage.mjs .
          L_MAGIA_RECORD_RN L_GODZILLA_NS L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2
          L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORI_DON_5_FY L_GUNDAM_SEED_G
      - name: Audit Observation linkage
        run: >-
          node tools/audit-ui-design-observation-linkage.mjs
          L_MAGIA_RECORD_RN L_GODZILLA_NS L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2
          L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORI_DON_5_FY L_GUNDAM_SEED_G
          --strict-v2
      - name: Commit generated UI Design files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/*/ui-design-data.json
          if git diff --cached --quiet; then
            echo "No UI Design changes"
          else
            git commit -m "ui: generate batch 20260901 design contracts"
            git push
          fi
