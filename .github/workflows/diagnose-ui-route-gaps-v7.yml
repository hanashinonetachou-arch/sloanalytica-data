name: Diagnose UI route gaps v7

on:
  push:
    branches:
      - audit/20260912-cross-sectional-v7
    paths:
      - tools/diagnose-ui-route-gaps-v7.mjs
      - .github/workflows/diagnose-ui-route-gaps-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/20260912-cross-sectional-v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/diagnose-ui-route-gaps-v7.mjs
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ui-route-gap-v7.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit: record canonical UI route gaps'
          git push origin HEAD:audit/20260912-cross-sectional-v7
