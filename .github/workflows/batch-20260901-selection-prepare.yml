name: Batch 20260901 Selection Prepare

on:
  push:
    branches:
      - batch/20260901-magia-gundamseed
    paths:
      - '.github/workflows/batch-20260901-selection-prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260901-magia-gundamseed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare strict Selection workspace
        run: |
          npm run selection:batch -- \
            L_MAGIA_RECORD_RN \
            L_GODZILLA_NS \
            L_USHIO_TORA_HAKUMEN_VH \
            L_AMAZING_LIVE_PD \
            L_YOSHIMUNE_SC2 \
            L_MAHJONG_MONOGATARI_S2 \
            L_IDOLMASTER_MILLION_LIVE_HC \
            L_YOUJITSU_DE \
            L_MIDORIDON_VIVA_REVIVAL_FY \
            L_GUNDAM_SEED_G \
            --report reports/batch-20260901-selection-prepare-report.json
      - name: Commit workspace and report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selection-batch reports/batch-20260901-selection-prepare-report.json
          git commit -m 'selection: prepare 20260901 batch workspace'
          git pull --rebase origin batch/20260901-magia-gundamseed
          git push origin HEAD:batch/20260901-magia-gundamseed
