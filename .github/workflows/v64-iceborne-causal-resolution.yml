name: v6.4 Iceborne Causal Resolution

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-iceborne-causal-resolution.mjs'
      - 'test/iceborne-cz-composition.test.mjs'
      - 'tools/audit-v64-causal-relations.mjs'
      - 'test/v64-causal-relation-audit.test.mjs'
      - '.github/workflows/v64-iceborne-causal-resolution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run migration
        run: node tools/migrate-v64-iceborne-causal-resolution.mjs .
      - name: Apply migration
        run: node tools/migrate-v64-iceborne-causal-resolution.mjs . --apply
      - name: Run focused regression
        run: node --test test/iceborne-cz-composition.test.mjs
      - name: Rebuild Iceborne package
        run: npm run machine:pipeline -- S_MHW_ICEBORNE_ZF --skip-repo-checks
      - name: Refresh semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Refresh causal review
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Run causal regression
        run: node --test test/v64-causal-relation-audit.test.mjs
      - name: Assert causal review is closed
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const semantic=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const causalCount=semantic.machines.flatMap(m=>m.issues??[]).filter(x=>x.code==='CAUSAL_RELATION_REJECT_CANDIDATE').length;
          if(causalCount!==0) throw new Error(`causal candidates remain: ${causalCount}`);
          const causal=JSON.parse(fs.readFileSync('reports/v64-causal-relation-review.json','utf8'));
          if(causal.summary.candidateCount!==0 || causal.summary.machineCount!==0) throw new Error(`causal review not closed ${JSON.stringify(causal.summary)}`);
          console.log('PASS v6.4 causal review closed');
          NODE
      - name: Assert generated CZ composition surface
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p='machines/S_MHW_ICEBORNE_ZF/machine-package.json';
          const text=fs.readFileSync(p,'utf8');
          for(const token of ['FEAT_CZ_TYPE_COMPOSITION','INP_CZ_QUEST_COUNT','INP_CZ_AIROU_COUNT','INP_CZ_SELIANA_COUNT']){
            if(!text.includes(token)) throw new Error(`generated package missing ${token}`);
          }
          console.log('PASS generated CZ composition surface');
          NODE
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Run Observation linkage target check
        run: |
          set +e
          npm run observation:selection:audit 2>&1 | tee /tmp/observation-linkage.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '^ERROR: S_MHW_ICEBORNE_ZF:' /tmp/observation-linkage.log; then
            echo 'Iceborne introduced an Observation -> Selection linkage error.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Global Observation linkage audit still has pre-existing errors outside this batch; recorded as REVIEW.'
          fi
      - name: Show diff
        run: |
          git status --short
          git --no-pager diff --stat
          git --no-pager diff -- research/S_MHW_ICEBORNE_ZF machines/S_MHW_ICEBORNE_ZF catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/S_MHW_ICEBORNE_ZF machines/S_MHW_ICEBORNE_ZF catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "fix: factor Iceborne CZ likelihoods"
            git push origin HEAD:prototype-multi-machine
          fi
