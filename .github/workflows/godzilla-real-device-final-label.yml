name: Godzilla Real-device Final Label

on:
  push:
    branches: [fix/godzilla-real-device-final-label]
    paths:
      - '.github/workflows/godzilla-real-device-final-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/godzilla-real-device-final-label
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize G-RUSH semantics and bump package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const rp = 'research/L_GODZILLA_NS/research-data.json';
          const sp = 'research/L_GODZILLA_NS/selection-data.json';
          const r = JSON.parse(fs.readFileSync(rp, 'utf8'));
          const f = r.features.find(x => x.researchFeatureId === 'RF_AT_FIRST_HIT');
          if (!f) throw new Error('RF_AT_FIRST_HIT not found');
          f.name = 'G-RUSH初当り';
          f.numeratorDefinition = 'G-RUSH初当り回数';
          fs.writeFileSync(rp, JSON.stringify(r, null, 2) + '\n');
          const s = JSON.parse(fs.readFileSync(sp, 'utf8'));
          s.machineDataVersion = '0.1.1';
          fs.writeFileSync(sp, JSON.stringify(s, null, 2) + '\n');
          NODE
      - name: Validate source and rebuild published artifacts
        run: |
          npm run research:validate -- research/L_GODZILLA_NS/research-data.json
          npm run selection:validate -- research/L_GODZILLA_NS/selection-data.json
          npm run observation:validate -- research/L_GODZILLA_NS/machine-observation-data.json
          npm run ui-design:validate -- research/L_GODZILLA_NS/ui-design-data.json
          npm run machine:pipeline -- L_GODZILLA_NS --skip-repo-checks
      - name: Assert real-device semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"machineDataVersion": "0.1.1"' machines/L_GODZILLA_NS/machine-package.json
          grep -q '"name": "G-RUSH初当り"' machines/L_GODZILLA_NS/machine-package.json
          ! grep -q 'G-RUSH DESTRUCTION初当り' machines/L_GODZILLA_NS/machine-package.json
          grep -q '"name": "G-RUSH初当り 回数"' machines/L_GODZILLA_NS/machine-package.json
      - name: Full regression
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Commit generated result
        shell: bash
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_GODZILLA_NS/research-data.json research/L_GODZILLA_NS/selection-data.json machines/L_GODZILLA_NS/machine-package.json catalog.json difficulty-catalog.json
          if [ -f research/L_GODZILLA_NS/setting-band-report.json ]; then git add research/L_GODZILLA_NS/setting-band-report.json; fi
          git commit -m 'fix: align Godzilla package with G-RUSH first-hit semantics'
          git push
