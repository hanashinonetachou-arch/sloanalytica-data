name: Next10 v6.14 dependency report

on:
  push:
    branches:
      - audit/20260908-next10-selection-v614
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Report dispositions and dependency candidates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          for (const id of ids) {
            const r=JSON.parse(fs.readFileSync(`research/${id}/research-data.json`,'utf8'));
            const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`,'utf8'));
            const rf=new Map((r.features??[]).map(x=>[x.researchFeatureId,x]));
            console.log(`\n========== ${id} ==========`);
            console.log(`Research=${r.features?.length??0} Selection=${s.features?.length??0}`);
            for (const f of s.features??[]) {
              const q=rf.get(f.researchFeatureId)??{};
              const reason=f.userReason??f.userFacingReason??'';
              console.log(`${f.adoptionCategory}\t${f.featureId}\tmodel=${q.candidateModel??'?'}\ttrial=${q.trialUnit??'?'}\tden=${q.denominatorDefinition??'?'}\t${reason}`);
            }
            const groups=new Map();
            for (const f of s.features??[]) {
              if (!String(f.adoptionCategory).startsWith('INCLUDE')) continue;
              const q=rf.get(f.researchFeatureId)??{};
              const key=`${q.observationScope??'?'} :: ${q.denominatorDefinition??q.trialUnit??'?'}`;
              if(!groups.has(key)) groups.set(key,[]);
              groups.get(key).push(`${f.featureId}[${q.candidateModel??'?'}]`);
            }
            for(const [k,v] of groups) if(v.length>1) console.log(`SHARED_DENOM\t${k}\t${v.join(', ')}`);
          }
          NODE
