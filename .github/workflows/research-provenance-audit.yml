name: Research Provenance Audit

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'research/**/research-data.json'
      - 'research/**/selection-data.json'
      - 'tools/audit-research-provenance.mjs'
      - '.github/workflows/research-provenance-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit research provenance
        run: |
          node tools/audit-research-provenance.mjs
          cat reports/research-provenance-audit-v1.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: research-provenance-audit
          path: |
            reports/research-provenance-audit-v1.json
            reports/research-provenance-audit-v1.md
