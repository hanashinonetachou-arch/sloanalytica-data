name: Finalize 20260905 Next10 Research Batch v2

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/finalize-20260905-next10-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed finalization transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/finalize-20260905-next10.yml')
          s=p.read_text(encoding='utf-8')
          a=s.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          b=s.index("\n          PY", a)
          code=textwrap.dedent(s[a:b])
          Path('/tmp/finalize_next10.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/finalize_next10.py
          rm -rf device-test/20260905-next10
          rm -f .github/workflows/publish-20260905-next10-isolated.yml \
                .github/workflows/real-device-feedback-20260905.yml \
                .github/workflows/real-device-feedback-20260905-v2.yml \
                .github/workflows/repair-20260905-next10-device-feed.yml \
                .github/workflows/repair-20260905-next10-device-feed-v2.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate research source files
        shell: bash
        run: |
          set -euo pipefail
          for id in \
            L_IZA_BANCHO_SB8 L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN \
            LB_TRIPLE_CROWN_SF4 LB_MATADOR_3_TT L_TENSEI_SHITARA_KEN_DESHITA_GT \
            L_DARLING_IN_THE_FRANXX_SA L_SAKI_CHOJO_KESSEN_YR S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS; do
            npm run research:validate -- "research/$id/research-data.json"
          done
          npm run observation:validate
          npm run ui-design:validate
      - name: Final repository audit
        shell: bash
        run: |
          set -euo pipefail
          npm run audit
          npm run registry:validate
          npm test
          node - <<'NODE'
          const fs=require('fs');
          const cat=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entries=cat.machines || cat.entries || cat.items || [];
          if(entries.length!==220) throw new Error(`catalog count ${entries.length} != 220`);
          const reg=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const machines=reg.machines || reg.entries || [];
          const ids=new Set(machines.map(x=>x.machineId||x.id));
          const next10=['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'];
          for(const id of next10) if(!ids.has(id)) throw new Error(`missing ${id}`);
          if(fs.existsSync('device-test/20260905-next10')) throw new Error('device-test residue remains');
          console.log('FINAL_NEXT10_CHECK PASS catalog=220 next10=10');
          NODE
      - name: Commit finalized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize reviewed next10 batch'
          git push origin HEAD:publish/20260905-next10
