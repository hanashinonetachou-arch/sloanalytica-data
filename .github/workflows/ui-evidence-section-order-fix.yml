name: UI Evidence Section Order Fix

on:
  push:
    branches: [fix/evidence-section-last-20260906]
    paths:
      - 'tools/normalize-evidence-section-order.mjs'
      - 'tools/audit-ui-evidence-section-order.mjs'
      - '.github/workflows/ui-evidence-section-order-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-section-last-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize section order
        run: node tools/normalize-evidence-section-order.mjs .
      - name: Audit section order
        run: node tools/audit-ui-evidence-section-order.mjs .
      - name: Validate UI Design
        run: node tools/validate-ui-design-data.mjs .
      - name: Commit normalized UI Design
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/*/ui-design-data.json
          git commit -m 'ui: place setting confirmation sections last'
          git push
