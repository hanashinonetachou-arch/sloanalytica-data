name: MachineData Non-default Weight Audit

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'research/**/selection-data.json'
      - 'tools/audit-machine-data-nondefault-weights.mjs'
      - '.github/workflows/machine-data-nondefault-weight-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit non-default weights
        run: |
          node tools/audit-machine-data-nondefault-weights.mjs
          cat reports/machine-data-nondefault-weight-audit-v2.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: machine-data-nondefault-weight-audit
          path: |
            reports/machine-data-nondefault-weight-audit-v2.json
            reports/machine-data-nondefault-weight-audit-v2.md
