name: Migrate v6.4 Observation Batch 01
on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-observation-batch-01.mjs'
      - '.github/workflows/migrate-v64-observation-batch-01.yml'
permissions: {contents: write}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prototype-multi-machine}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Apply five-machine migration
        run: node tools/migrate-v64-observation-batch-01.mjs
      - name: Targeted regressions
        run: node --test --test-concurrency=1 test/selection-policy-migration-audit.test.mjs test/v64-observation-trial-universe-audit.test.mjs
      - name: Full test suite
        run: npm test
      - name: Observation audit
        run: node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json
      - name: Semantic and causal audits
        run: |
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Commit batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_MONKEY_TURN5_CE/selection-data.json research/L_MONKEY_TURN5_CE/machine-observation-data.json research/L_HIGURASHI_GOU_SS/selection-data.json research/L_HIGURASHI_GOU_SS/machine-observation-data.json research/L_HOKUTO_AD_XR/selection-data.json research/L_HOKUTO_AD_XR/machine-observation-data.json research/L_KING_PULSAR_SLCC/selection-data.json research/L_KING_PULSAR_SLCC/machine-observation-data.json research/L_HANABI_KM/selection-data.json research/L_HANABI_KM/machine-observation-data.json tools/audit-selection-policy-migration.mjs test/selection-policy-migration-audit.test.mjs reports/v64-observation-trial-universe-audit.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
          git commit -m "audit: migrate five observation contracts to v2"
          git push
