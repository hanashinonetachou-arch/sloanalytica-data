name: V8 Reference Validation
on:
  pull_request:
    branches: [spec/reproducible-machine-construction-manifest-20260921]
  push:
    branches: [validation/v8-lovejou3-rebuild-20260921]
jobs:
  canonical-ui-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-concurrency=1 test/canonical-ui-v8-preview.test.mjs test/canonical-ui-v8-runtime-materialization.test.mjs
      - run: node tools/build-v8-reference-package.mjs L_LOVEJOU3_M4
      - uses: actions/upload-artifact@v4
        with:
          name: lovejou3-v8-machine-package
          path: validation/v8/L_LOVEJOU3_M4/machine-package.generated.json
