name: Batch 20260910 Next10 Gate D Materialize

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - 'research/*/ui-design-data.json'
      - 'tools/audit-gate-d-ui-20260910.mjs'
      - 'tools/materialize-ui-design-into-machine-package.mjs'
      - 'tools/build-machine-data-with-ui.mjs'
      - 'tools/audit-ui-materialization-v7.mjs'
      - '.github/workflows/batch-20260910-next10-gate-d-materialize.yml'

permissions:
  contents: write

jobs:
  materialize-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical UI
        run: npm run ui-design:validate
      - name: Audit UX v7.1 UI semantics
        run: node tools/audit-gate-d-ui-20260910.mjs
      - name: Rebuild MachineData baseline
        run: |
          npm run machine:batch -- \
            L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME \
            L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA
      - name: Materialize canonical UI into MachineData
        run: |
          for id in \
            L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME \
            L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA; do
            node tools/materialize-ui-design-into-machine-package.mjs \
              "machines/$id/machine-package.json" \
              "research/$id/ui-design-data.json"
            cp "machines/$id/machine-package.json" "research/$id/machine-package.generated.json"
          done
      - name: Audit exact canonical UI materialization
        run: |
          node tools/audit-ui-materialization-v7.mjs \
            L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME \
            L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA
      - name: Verify materialization idempotence
        run: |
          cp -R machines /tmp/machines-before
          for id in \
            L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME \
            L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA; do
            node tools/materialize-ui-design-into-machine-package.mjs \
              "machines/$id/machine-package.json" \
              "research/$id/ui-design-data.json"
          done
          diff -ru /tmp/machines-before machines
      - name: Repository contract validation
        run: |
          npm run ui-design:linkage:audit -- . \
            L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME \
            L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA
          npm run ui-design:observation:audit -- \
            L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME \
            L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA --strict-v2
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Write Gate D materialization report
        run: |
          cat > batches/20260910-next10-v7/gate-d-materialization-report.json <<'JSON'
          {
            "schemaVersion": "gate-d-materialization-report-v1",
            "batchId": "20260910-next10-v7",
            "machineCount": 10,
            "uxManifest": "v7.1",
            "canonicalUiMaterialization": "PASS",
            "semanticEquality": "PASS",
            "idempotence": "PASS",
            "rejectExcludeVisibility": "PASS",
            "repositoryContracts": "PASS",
            "gateDClosure": "PENDING_LEDGER_UPDATE"
          }
          JSON
      - name: Commit materialized MachineData
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add machines research batches/20260910-next10-v7/gate-d-materialization-report.json batches/20260910-next10-v7/gate-d-ui-semantic-audit.json
          git commit -m 'machine-data: materialize 20260910 next10 canonical UI'
          git push origin HEAD:batch/20260910-next10-gate0-v2
