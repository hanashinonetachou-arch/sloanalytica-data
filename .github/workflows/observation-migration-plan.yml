name: Observation Migration Priority Plan

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/plan-machine-observation-migration.mjs'
      - 'research/**/machine-observation-data.json'
      - 'research/**/selection-data.json'
      - 'ux-contracts/*.json'
      - '.github/workflows/observation-migration-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate migration priority report
        run: node tools/plan-machine-observation-migration.mjs --json-out=reports/machine-observation-migration-plan.json
      - name: Print top priorities
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/machine-observation-migration-plan.json','utf8'));
          console.log('SUMMARY',JSON.stringify(r.summary));
          for(const m of r.machines.slice(0,40)) console.log(`${m.priority} ${m.score} ${m.machineId} :: ${m.reasons.join(', ')}`);
          NODE
      - name: Commit migration plan report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/machine-observation-migration-plan.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh Observation migration priority plan [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
