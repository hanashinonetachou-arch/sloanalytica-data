name: Batch 20260910 Next10 Gate C Draft

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - 'tools/materialize-gate-c-observation-20260910.mjs'
      - '.github/workflows/batch-20260910-next10-gate-c-draft.yml'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize Gate C ObservationData
        run: node tools/materialize-gate-c-observation-20260910.mjs
      - name: Show report
        if: always()
        run: cat batches/20260910-next10-v7/gate-c-observation-draft-report.json || true
      - name: Commit ObservationData and report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_YABACHIBA_ZM/machine-observation-data.json \
                  research/L_NANGOKU_SPECIAL_M1/machine-observation-data.json \
                  research/L_SENGOKU_COLLECTION6_KS/machine-observation-data.json \
                  research/L_KARAKURI_CIRCUS2_JG/machine-observation-data.json \
                  research/L_ULTRAMAN_FINAL_BATTLE_ME/machine-observation-data.json \
                  research/L_WORLD_DAI_STAR_PA3/machine-observation-data.json \
                  research/L_YAJIKITA_MAIRU_BG/machine-observation-data.json \
                  research/L_TONDEMO_SKILL_KM/machine-observation-data.json \
                  research/LB_TRIPLE_CROWN_X300/machine-observation-data.json \
                  research/L_TOARU_INDEX2_FA/machine-observation-data.json \
                  batches/20260910-next10-v7/gate-c-observation-draft-report.json
          if ! git diff --cached --quiet; then
            git commit -m "observation: materialize 20260910 next10 Gate C draft"
            git push origin HEAD:batch/20260910-next10-gate0-v2
          fi
