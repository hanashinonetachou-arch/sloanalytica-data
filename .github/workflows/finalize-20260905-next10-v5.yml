name: Finalize 20260905 Next10 Research Batch v5

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/finalize-20260905-next10-v5.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source finalization transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/finalize-20260905-next10.yml').read_text(encoding='utf-8')
          a=s.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          b=s.index("\n          PY", a)
          Path('/tmp/finalize_next10.py').write_text(textwrap.dedent(s[a:b]), encoding='utf-8')
          PY
          python /tmp/finalize_next10.py
      - name: Recover missing prior verified machine source from Sep03 integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/20260903-publish-stack
          node --input-type=module <<'NODE' > /tmp/missing_ids.txt
          import fs from 'node:fs';
          const cat=JSON.parse(fs.readFileSync('device-test/20260905-next10/catalog.json','utf8'));
          const entries=cat.machines || cat.entries || cat.items || [];
          if(entries.length!==220) throw new Error(`device catalog ${entries.length} != 220`);
          for(const e of entries){
            const id=e.machineId||e.id;
            if(!fs.existsSync(`machines/${id}/machine-package.json`)) console.log(id);
          }
          NODE
          echo 'Missing prior verified machine directories:'
          cat /tmp/missing_ids.txt
          test "$(wc -l < /tmp/missing_ids.txt)" -eq 9
          while IFS= read -r id; do
            test -n "$id"
            git cat-file -e "origin/integration/20260903-publish-stack:machines/$id/machine-package.json"
            git checkout origin/integration/20260903-publish-stack -- "machines/$id"
            if git cat-file -e "origin/integration/20260903-publish-stack:research/$id/research-data.json" 2>/dev/null; then
              git checkout origin/integration/20260903-publish-stack -- "research/$id"
            fi
          done < /tmp/missing_ids.txt

          # Restore registry records for any recovered machine missing from the current registry.
          git show origin/integration/20260903-publish-stack:machine-registry.json > /tmp/prior-registry.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const current=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const prior=JSON.parse(fs.readFileSync('/tmp/prior-registry.json','utf8'));
          const missing=fs.readFileSync('/tmp/missing_ids.txt','utf8').trim().split(/\s+/).filter(Boolean);
          const cur=current.machines||[];
          const src=prior.machines||[];
          const ids=new Set(cur.map(x=>x.machineId||x.id));
          for(const id of missing){
            if(ids.has(id)) continue;
            const found=src.find(x=>(x.machineId||x.id)===id);
            if(!found) throw new Error(`prior registry entry missing ${id}`);
            cur.push(found); ids.add(id);
          }
          current.machines=cur;
          current.generatedAt=new Date().toISOString();
          fs.writeFileSync('machine-registry.json',JSON.stringify(current,null,2)+'\n');
          console.log(`registry records=${cur.length}`);
          NODE
      - name: Restore verified cumulative catalog for prototype
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const cat=JSON.parse(fs.readFileSync('device-test/20260905-next10/catalog.json','utf8'));
          const entries=cat.machines || cat.entries || cat.items || [];
          if(entries.length!==220) throw new Error(`verified catalog count ${entries.length} != 220`);
          const ids=new Set();
          for(const entry of entries){
            const id=entry.machineId||entry.id;
            if(ids.has(id)) throw new Error(`duplicate ${id}`); ids.add(id);
            const p=`machines/${id}/machine-package.json`;
            if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
            const b=fs.readFileSync(p); const sha=crypto.createHash('sha256').update(b).digest('hex');
            const declared=String(entry.sha256||entry.packageSha256||entry.hash||'').replace(/^sha256:/,'');
            if(declared && declared!==sha) throw new Error(`verified hash mismatch ${id}: ${declared} != ${sha}`);
            if(entry.sizeBytes!=null && Number(entry.sizeBytes)!==b.length) throw new Error(`verified size mismatch ${id}`);
            entry.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${id}/machine-package.json`;
            if('sha256' in entry) entry.sha256=sha;
            if('packageSha256' in entry) entry.packageSha256=sha;
            if('hash' in entry && String(entry.hash).startsWith('sha256:')) entry.hash=`sha256:${sha}`;
            if('sizeBytes' in entry) entry.sizeBytes=b.length;
          }
          cat.catalogVersion='20260905-next10-final';
          cat.generatedAt=new Date().toISOString();
          cat.generatedBy='finalize-20260905-next10-v5.yml';
          fs.writeFileSync('catalog.json',JSON.stringify(cat,null,2)+'\n');
          console.log(`catalog restored=${entries.length}`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Validate next10 source files
        shell: bash
        run: |
          set -euo pipefail
          IDS="L_IZA_BANCHO_SB8 L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN LB_TRIPLE_CROWN_SF4 LB_MATADOR_3_TT L_TENSEI_SHITARA_KEN_DESHITA_GT L_DARLING_IN_THE_FRANXX_SA L_SAKI_CHOJO_KESSEN_YR S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS"
          for id in $IDS; do
            npm run research:validate -- "research/$id/research-data.json"
            npm run observation:validate -- "research/$id/machine-observation-data.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateUiDesignData } from './tools/validate-ui-design-data.mjs';
          const ids=['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'];
          for(const id of ids){
            const errors=validateUiDesignData(JSON.parse(fs.readFileSync(`research/${id}/ui-design-data.json`,'utf8')),{expectedMachineId:id});
            if(errors.length){ console.error(id,errors); process.exitCode=1; }
          }
          if(process.exitCode) process.exit(1);
          console.log('Next10 UI Design validation PASS');
          NODE
      - name: Final repository catalog and registry audit
        shell: bash
        run: |
          set -euo pipefail
          npm run audit
          npm run registry:validate
          npm test
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const cat=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entries=cat.machines||cat.entries||cat.items||[];
          if(entries.length!==220) throw new Error(`catalog count ${entries.length}`);
          const catIds=new Set(entries.map(x=>x.machineId||x.id));
          if(catIds.size!==220) throw new Error(`unique count ${catIds.size}`);
          for(const e of entries){
            const id=e.machineId||e.id; const p=`machines/${id}/machine-package.json`; const b=fs.readFileSync(p);
            const sha=crypto.createHash('sha256').update(b).digest('hex');
            const declared=String(e.sha256||e.packageSha256||e.hash||'').replace(/^sha256:/,'');
            if(declared && declared!==sha) throw new Error(`hash mismatch ${id}`);
            if(!String(e.packageUrl||'').includes('/prototype-multi-machine/')) throw new Error(`bad URL ${id}`);
          }
          const reg=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const regIds=new Set((reg.machines||[]).map(x=>x.machineId||x.id));
          const miss=[...catIds].filter(id=>!regIds.has(id)); if(miss.length) throw new Error(`registry missing ${miss.join(',')}`);
          console.log(`FINAL_NEXT10_CHECK PASS catalog=220 registry=${regIds.size}`);
          NODE
      - name: Remove isolated-device and temporary finalization artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf device-test/20260905-next10
          rm -f .github/workflows/publish-20260905-next10-isolated.yml \
                .github/workflows/real-device-feedback-20260905.yml \
                .github/workflows/real-device-feedback-20260905-v2.yml \
                .github/workflows/repair-20260905-next10-device-feed.yml \
                .github/workflows/repair-20260905-next10-device-feed-v2.yml
      - name: Commit finalized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize reviewed next10 batch with prior verified stack'
          git push origin HEAD:publish/20260905-next10
