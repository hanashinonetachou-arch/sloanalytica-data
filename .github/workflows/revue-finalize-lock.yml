name: Revue Finalize UI Lock
on:
  push:
    branches: [chore/revue-finalize-ui-lock]
    paths: ['tools/finalize-revue-ui-lock.mjs']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/finalize-revue-ui-lock.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/S_REVUE_STARLIGHT_CX/user-verified-ui-lock.json
          git diff --cached --quiet || git commit -m 'chore: finalize Revue user-verified UI lock'
          git push
