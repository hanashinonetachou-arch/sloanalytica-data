name: Finalize 20260905 Next10 Research Batch v11

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/finalize-20260905-next10-v11.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix MachineData builder to respect inferenceSettings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build-machine-data.mjs')
          s=p.read_text(encoding='utf-8')
          old='function buildFeature(rf,sf,inputIds){'
          new='function buildFeature(rf,sf,inputIds,inferenceSettings=null){'
          if old not in s: raise SystemExit('buildFeature signature not found')
          s=s.replace(old,new,1)
          old='base.probabilities=Object.fromEntries(Object.entries(rf.settingValues??{}).map(([s,v])=>[s,v.probability]).filter(([,p])=>Number.isFinite(p)));'
          new='base.probabilities=Object.fromEntries(Object.entries(rf.settingValues??{}).filter(([s])=>!Array.isArray(inferenceSettings)||inferenceSettings.includes(s)).map(([s,v])=>[s,v.probability]).filter(([,p])=>Number.isFinite(p)));'
          if old not in s: raise SystemExit('binomial probability materialization not found')
          s=s.replace(old,new,1)
          old='base.categoryProbabilities=Object.fromEntries(Object.entries(rf.settingDistributions??{}).map(([s,dist])=>{'
          new='base.categoryProbabilities=Object.fromEntries(Object.entries(rf.settingDistributions??{}).filter(([s])=>!Array.isArray(inferenceSettings)||inferenceSettings.includes(s)).map(([s,dist])=>{'
          if old not in s: raise SystemExit('multinomial probability materialization not found')
          s=s.replace(old,new,1)
          old='const estimate=estimateRequiredTrials80(rf,sf,research.machine?.settings??[]);'
          new='const estimate=estimateRequiredTrials80(rf,sf,research.machine?.inferenceSettings??research.machine?.settings??[]);'
          if old not in s: raise SystemExit('required trials settings source not found')
          s=s.replace(old,new,1)
          old='const built=buildFeature(rf,sf,inputIds); if(built) features.push(built);'
          new='const built=buildFeature(rf,sf,inputIds,research.machine?.inferenceSettings??null); if(built) features.push(built);'
          if old not in s: raise SystemExit('buildFeature invocation not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'buildFeature(rf,sf,inputIds,inferenceSettings=null)' tools/build-machine-data.mjs
          grep -F 'research.machine?.inferenceSettings??null' tools/build-machine-data.mjs
      - name: Apply reviewed next10 source finalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/finalize-20260905-next10.yml').read_text(encoding='utf-8')
          a=s.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          b=s.index("\n          PY", a)
          Path('/tmp/finalize_next10.py').write_text(textwrap.dedent(s[a:b]),encoding='utf-8')
          PY
          python /tmp/finalize_next10.py
      - name: Recover exact prior verified packages missing from stale prototype base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          node --input-type=module <<'NODE' > /tmp/recover.tsv
          import fs from'node:fs';
          const c=JSON.parse(fs.readFileSync('device-test/20260905-next10/catalog.json','utf8')),es=c.machines||c.entries||c.items||[];
          if(es.length!==220)throw new Error(`verified feed=${es.length}`);
          for(const e of es){const id=e.machineId||e.id;if(!fs.existsSync(`machines/${id}/machine-package.json`)){const h=String(e.sha256||e.packageSha256||e.hash||'').replace(/^sha256:/,'');if(!h)throw new Error(`no hash ${id}`);console.log(`${id}\t${h}`)}}
          NODE
          test "$(wc -l < /tmp/recover.tsv)" -eq 9
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v 'origin/HEAD' > /tmp/refs.txt
          while IFS=$'\t' read -r id expected; do
            found=''
            while IFS= read -r ref; do
              if git cat-file -e "$ref:machines/$id/machine-package.json" 2>/dev/null; then
                actual="$(git show "$ref:machines/$id/machine-package.json" | sha256sum | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then found="$ref";break;fi
              fi
            done < /tmp/refs.txt
            test -n "$found" || { echo "exact package not found: $id" >&2;exit 1; }
            echo "$id <- $found"
            git checkout "$found" -- "machines/$id"
            if git cat-file -e "$found:research/$id/research-data.json" 2>/dev/null; then git checkout "$found" -- "research/$id"; fi
          done < /tmp/recover.tsv
      - name: Build normalized 220-machine prototype catalog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from'node:fs';import crypto from'node:crypto';
          const c=JSON.parse(fs.readFileSync('device-test/20260905-next10/catalog.json','utf8')),es=c.machines||c.entries||c.items||[];
          if(es.length!==220)throw new Error(`membership=${es.length}`);const ids=new Set();let refreshed=0;
          for(const e of es){const id=e.machineId||e.id;if(ids.has(id))throw new Error(`duplicate ${id}`);ids.add(id);const p=`machines/${id}/machine-package.json`;if(!fs.existsSync(p))throw new Error(`missing ${p}`);const b=fs.readFileSync(p),pkg=JSON.parse(b.toString('utf8')),sha=crypto.createHash('sha256').update(b).digest('hex'),old=String(e.sha256||e.packageSha256||e.hash||'').replace(/^sha256:/,'');if(old&&old!==sha)refreshed++;e.machineDataVersion=pkg.machine?.machineDataVersion??e.machineDataVersion;e.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${id}/machine-package.json`;e.sha256=sha;e.packageSizeBytes=b.length;if('packageSha256'in e)e.packageSha256=sha;if('hash'in e)e.hash=String(e.hash).startsWith('sha256:')?`sha256:${sha}`:sha;if('sizeBytes'in e)e.sizeBytes=b.length;}
          c.catalogVersion='20260905-next10-final';c.generatedAt=new Date().toISOString();c.generatedBy='finalize-20260905-next10-v11.yml';fs.writeFileSync('catalog.json',JSON.stringify(c,null,2)+'\n');console.log(`catalog=220 refreshedExistingHashes=${refreshed}`);
          NODE
      - name: Install dependencies and synchronize registry and difficulty
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run registry:sync
          npm run registry:validate
          while IFS=$'\t' read -r id expected; do
            node tools/sync-machine-difficulty-catalog.mjs "$id"
          done < /tmp/recover.tsv
          node --input-type=module <<'NODE'
          import fs from'node:fs';const c=JSON.parse(fs.readFileSync('catalog.json','utf8')),d=JSON.parse(fs.readFileSync('difficulty-catalog.json','utf8'));const ci=new Set((c.machines||[]).map(x=>x.machineId)),di=new Set((d.entries||[]).map(x=>x.machineId)),m=[...ci].filter(x=>!di.has(x));if(ci.size!==220||di.size!==220||m.length)throw new Error(`difficulty coverage catalog=${ci.size} difficulty=${di.size} missing=${m}`);console.log('difficulty coverage PASS 220/220');
          NODE
      - name: Validate next10 source contracts
        shell: bash
        run: |
          set -euo pipefail
          IDS="L_IZA_BANCHO_SB8 L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN LB_TRIPLE_CROWN_SF4 LB_MATADOR_3_TT L_TENSEI_SHITARA_KEN_DESHITA_GT L_DARLING_IN_THE_FRANXX_SA L_SAKI_CHOJO_KESSEN_YR S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS"
          for id in $IDS;do npm run research:validate -- "research/$id/research-data.json";npm run observation:validate -- "research/$id/machine-observation-data.json";done
          node --input-type=module <<'NODE'
          import fs from'node:fs';import{validateUiDesignData}from'./tools/validate-ui-design-data.mjs';const ids=['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'];for(const id of ids){const e=validateUiDesignData(JSON.parse(fs.readFileSync(`research/${id}/ui-design-data.json`,'utf8')),{expectedMachineId:id});if(e.length){console.error(id,e);process.exit(1)}}console.log('next10 UI PASS');
          NODE
      - name: Verify selection migration before full suite
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-selection-policy-migration.mjs . /tmp/selection-policy-migration-audit.json
          node --input-type=module <<'NODE'
          import fs from'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/selection-policy-migration-audit.json','utf8'));console.log(r.summary);if(r.summary.blocked!==0||r.summary.review!==0||r.summary.reviewedSafetyChanges!==25)throw new Error('selection migration not clean');
          NODE
      - name: Final 220-machine audit and tests
        shell: bash
        run: |
          set -euo pipefail
          npm run audit
          npm test
          node --input-type=module <<'NODE'
          import fs from'node:fs';import crypto from'node:crypto';const c=JSON.parse(fs.readFileSync('catalog.json','utf8')),es=c.machines||[];if(es.length!==220)throw new Error(`catalog=${es.length}`);const ids=new Set(es.map(e=>e.machineId));if(ids.size!==220)throw new Error(`unique=${ids.size}`);for(const e of es){const id=e.machineId,b=fs.readFileSync(`machines/${id}/machine-package.json`),pkg=JSON.parse(b.toString('utf8')),s=crypto.createHash('sha256').update(b).digest('hex');if(e.sha256!==s)throw new Error(`hash ${id}`);if(e.packageSizeBytes!==b.length)throw new Error(`size ${id}`);if(e.machineDataVersion!==pkg.machine?.machineDataVersion)throw new Error(`version ${id}`);if(!String(e.packageUrl||'').includes('/prototype-multi-machine/'))throw new Error(`url ${id}`)}const r=JSON.parse(fs.readFileSync('machine-registry.json','utf8')),ri=new Set((r.machines||[]).map(x=>x.machineId)),m=[...ids].filter(x=>!ri.has(x));if(m.length)throw new Error(`registry missing ${m}`);console.log(`FINAL_NEXT10_CHECK PASS catalog=220 registry=${ri.size}`);
          NODE
      - name: Remove isolated and temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf device-test/20260905-next10
          rm -f .github/workflows/publish-20260905-next10-isolated.yml .github/workflows/real-device-feedback-20260905.yml .github/workflows/real-device-feedback-20260905-v2.yml .github/workflows/repair-20260905-next10-device-feed.yml .github/workflows/repair-20260905-next10-device-feed-v2.yml .github/workflows/diagnose-20260905-selection-migration.yml
          rm -f .github/workflows/finalize-20260905-next10.yml .github/workflows/finalize-20260905-next10-v2.yml .github/workflows/finalize-20260905-next10-v3.yml .github/workflows/finalize-20260905-next10-v4.yml .github/workflows/finalize-20260905-next10-v5.yml .github/workflows/finalize-20260905-next10-v6.yml .github/workflows/finalize-20260905-next10-v7.yml .github/workflows/finalize-20260905-next10-v8.yml .github/workflows/finalize-20260905-next10-v9.yml .github/workflows/finalize-20260905-next10-v10.yml
      - name: Commit final integration candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize reviewed next10 batch for prototype'
          git push origin HEAD:publish/20260905-next10
