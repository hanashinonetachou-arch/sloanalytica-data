name: Evidence UI v2 Formal Migration Batch 9 Hokuto

on:
  push:
    branches:
      - audit/evidence-ui-v2-phase2-20260914
    paths:
      - .github/workflows/evidence-ui-v2-batch9-hokuto-formal.yml

permissions:
  contents: write

jobs:
  formal-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-phase2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Batch 9 Hokuto formal migration and gates
        run: node tools/run-evidence-ui-v2-batch9.mjs
      - name: Commit canonical observation and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_HOKUTO_AD_XR/selection-data.json
          git add research/L_HOKUTO_AD_XR/machine-observation-data.json
          git add research/L_HOKUTO_AD_XR/ui-design-data.json
          git add machines/L_HOKUTO_AD_XR/machine-package.json
          git add research/L_HOKUTO_AD_XR/statistics-report.json research/L_HOKUTO_AD_XR/difficulty-report.json research/L_HOKUTO_AD_XR/setting-band-report.json
          git add catalog.json difficulty-catalog.json machine-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence-ui: formalize Hokuto trophy and AT-end voice evidence'
          git push origin HEAD:audit/evidence-ui-v2-phase2-20260914
