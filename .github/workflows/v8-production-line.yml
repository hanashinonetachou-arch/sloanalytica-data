name: Manifest V8 Production Line

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: Machine ID to build from repro-v8 upstream contracts
        required: true
        type: string
      publish:
        description: Publish package and refresh catalog/registry on this branch
        required: true
        default: false
        type: boolean
  push:
    branches:
      - prototype-multi-machine
    paths:
      - '.v8-production-request.json'
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'repro-v8/**'
      - 'runtime-policy.json'
      - '.v8-production-request.json'
      - 'tools/*v8*.mjs'
      - 'test/v8-*.test.mjs'
      - '.github/workflows/v8-production-line.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare selected V8 machine for regression
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="$(node -p "require('./.v8-production-request.json').machineId")"
          npm run machine:v8 -- "$MACHINE_ID"
      - name: Run V8 production-line regression suite
        run: npm run test:v8-production-line
      - name: Build selected V8 machine
        if: github.event_name == 'workflow_dispatch'
        run: npm run machine:v8 -- "${{ inputs.machine_id }}"
      - name: Publish requested V8 machine from branch request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="$(node -p "require('./.v8-production-request.json').machineId")"
          PUBLISH="$(node -p "String(require('./.v8-production-request.json').publish)")"
          npm run machine:v8 -- "$MACHINE_ID"
          if [ "$PUBLISH" = "true" ]; then
            npm run machine:v8:publish -- "$MACHINE_ID" --publish
          fi
      - name: Publish selected V8 machine
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: npm run machine:v8:publish -- "${{ inputs.machine_id }}" --publish
      - name: Commit published distribution metadata
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MACHINE_ID="${{ inputs.machine_id }}"
            SHOULD_PUBLISH="${{ inputs.publish }}"
          else
            MACHINE_ID="$(node -p "require('./.v8-production-request.json').machineId")"
            SHOULD_PUBLISH="$(node -p "String(require('./.v8-production-request.json').publish)")"
          fi
          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "Publish not requested."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-registry.json "machines/$MACHINE_ID/machine-package.json" "build/$MACHINE_ID/approval.json" "build/$MACHINE_ID/machine-package.approved.json" "build/$MACHINE_ID/publish-report.json"
          if git diff --cached --quiet; then
            echo "Published distribution already current."
            exit 0
          fi
          git commit -m "publish: Manifest v8 $MACHINE_ID [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
