name: Manifest V8 Production Line

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: Machine ID to build from repro-v8 upstream contracts
        required: true
        type: string
      publish:
        description: Publish package and refresh catalog/registry on this branch
        required: true
        default: false
        type: boolean
  push:
    branches:
      - 'production/**'
    paths:
      - '.github/v8-publish-trigger'
  pull_request:
    branches:
      - prototype-multi-machine
      - 'production/**'
    paths:
      - 'repro-v8/**'
      - 'production/**'
      - 'tools/*v8*.mjs'
      - 'test/v8-*.test.mjs'
      - '.github/workflows/v8-production-line.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve selected V8 machine
        id: selected
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            machine_id="${{ inputs.machine_id }}"
            publish="${{ inputs.publish }}"
          else
            test -f .github/v8-publish-trigger
            machine_id="$(sed -n 's/^machineId:[[:space:]]*//p' .github/v8-publish-trigger | tail -1 | tr -d '\r')"
            publish="$(sed -n 's/^publish:[[:space:]]*//p' .github/v8-publish-trigger | tail -1 | tr -d '\r')"
          fi
          test -n "$machine_id" || { echo "Missing machineId"; exit 1; }
          [[ "$publish" == "true" || "$publish" == "false" ]] || { echo "publish must be true or false"; exit 1; }
          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Run V8 production-line regression suite
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !startsWith(github.base_ref, 'production/')) }}
        run: npm run test:v8-production-line
      - name: Run repository-persisted production orchestrator tests
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'production/')) }}
        working-directory: production
        run: npm test
      - name: Build selected V8 machine
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: npm run machine:v8 -- "${{ steps.selected.outputs.machine_id }}"
      - name: Publish selected V8 machine
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && steps.selected.outputs.publish == 'true' }}
        run: npm run machine:v8:publish -- "${{ steps.selected.outputs.machine_id }}" --publish
      - name: Commit published distribution metadata
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && steps.selected.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-registry.json "machines/${{ steps.selected.outputs.machine_id }}/machine-package.json"
          if git diff --cached --quiet; then
            echo "Published distribution already current."
            exit 0
          fi
          git commit -m "publish: Manifest v8 ${{ inputs.machine_id }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
