name: Diagnose canonical UI batch03

on:
  push:
    branches:
      - fix/20260912-canonical-ui-backfill-batch03
    paths:
      - tools/diagnose-canonical-ui-batch03.mjs
      - .github/workflows/diagnose-canonical-ui-batch03.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260912-canonical-ui-backfill-batch03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose latest prototype state
        run: node tools/diagnose-canonical-ui-batch03.mjs
      - name: Commit diagnostic report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/batch03-canonical-ui-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit: record batch03 canonical UI diagnostic'
          git push origin HEAD:fix/20260912-canonical-ui-backfill-batch03
