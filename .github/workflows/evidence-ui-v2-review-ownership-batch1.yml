name: Evidence UI v2 REVIEW Ownership Remediation Batch 1

# retry marker: evidenceReview policyVersion v1
on:
  push:
    branches:
      - audit/evidence-ui-v2-review-remediation-20260915
    paths:
      - .github/workflows/evidence-ui-v2-review-ownership-batch1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ownership-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-review-remediation-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Feature/Evidence ownership remediation and gates
        id: remediate
        shell: bash
        run: |
          mkdir -p audit-reports
          set +e
          node tools/run-evidence-ui-v2-review-ownership-batch1.mjs > audit-reports/review-ownership-batch1.log 2>&1
          status=$?
          echo "$status" > audit-reports/review-ownership-batch1.status
          cat audit-reports/review-ownership-batch1.log
          exit $status
      - name: Commit failure diagnostics only
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-reports/review-ownership-batch1.log audit-reports/review-ownership-batch1.status
          git diff --cached --quiet && exit 0
          git commit -m 'audit: capture ownership remediation failure'
          git push origin HEAD:audit/evidence-ui-v2-review-remediation-20260915
      - name: Commit canonical and generated artifacts
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_ENEN_NO_SHOUBOUTAI_JG/selection-data.json research/L_ENEN_NO_SHOUBOUTAI_JG/machine-observation-data.json research/L_ENEN_NO_SHOUBOUTAI_JG/ui-design-data.json
          git add research/S_HARD_BOILED_XX/selection-data.json research/S_HARD_BOILED_XX/machine-observation-data.json research/S_HARD_BOILED_XX/ui-design-data.json
          git add machines/L_ENEN_NO_SHOUBOUTAI_JG/machine-package.json research/L_ENEN_NO_SHOUBOUTAI_JG/statistics-report.json research/L_ENEN_NO_SHOUBOUTAI_JG/difficulty-report.json research/L_ENEN_NO_SHOUBOUTAI_JG/setting-band-report.json
          git add machines/S_HARD_BOILED_XX/machine-package.json research/S_HARD_BOILED_XX/statistics-report.json research/S_HARD_BOILED_XX/difficulty-report.json research/S_HARD_BOILED_XX/setting-band-report.json
          git add catalog.json difficulty-catalog.json machine-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence-ui: resolve Feature Evidence ownership conflicts'
          git push origin HEAD:audit/evidence-ui-v2-review-remediation-20260915
