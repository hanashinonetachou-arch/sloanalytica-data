name: Batch003 Selfcheck Semantic Repair

on:
  push:
    branches:
      - production/v85-batch-003-foundation-20261002
    paths:
      - production/.batch003-selfcheck-repair-trigger

permissions:
  contents: write

concurrency:
  group: batch003-selfcheck-semantic-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/v85-batch-003-foundation-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate repaired production contracts
        working-directory: production
        run: npm test

      - name: Invalidate Batch 003 downstream state
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          machines=(
            L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
            L_MILLION_GOD_KISEKI_CX
            L_AKUDAMA_DRIVE_TP
            L_KYOKOU_SUIRI_ST
            L_SHINUCHI_YOSHIMUNE_A1
            LB_TRIPLE_CROWN_SEVEN_FG
            L_JORMUNGAND_ND01G
            L_KABANERI_UNATO_KESSEN_XX
            L_UMINEKO_2_A1
            L_FIRE_FORCE_2
          )
          for machine in "${machines[@]}"; do
            node --experimental-strip-types src/invalidate-machine-downstream.ts batch-20261002-003 "$machine"
          done
      - name: Regenerate re-audited machines through App Runtime
        working-directory: production
        run: node --experimental-strip-types src/deterministic-production-worker.ts batch-20261002-003 --through APP_RUNTIME

      - name: Validate regenerated production state
        working-directory: production
        run: |
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261002-003

      - name: Audit Research to App Runtime semantic fidelity
        working-directory: production
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const batch='batch-20261002-003';
          const ids=[
            'L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA','L_MILLION_GOD_KISEKI_CX','L_AKUDAMA_DRIVE_TP','L_KYOKOU_SUIRI_ST','L_SHINUCHI_YOSHIMUNE_A1',
            'LB_TRIPLE_CROWN_SEVEN_FG','L_JORMUNGAND_ND01G','L_KABANERI_UNATO_KESSEN_XX','L_UMINEKO_2_A1','L_FIRE_FORCE_2'
          ];
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const fail=m=>{throw new Error(m)};
          const expectedImportance=n=>n>=20?'主要':n>=10?'有力':n>=5?'補助':'微小';
          for(const id of ids){
            const research=read(path.join('batches',batch,'artifacts',id,'research','result.json'));
            const stage=read(path.join('batches',batch,'machines',id,'stages','APP_RUNTIME.json'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)fail('APP_RUNTIME_NOT_COMPLETE:'+id);
            const app=read(stage.authoritativeOutputRef.path.replace(/^production\//,''));
            const pkg=app.package;
            const sections=new Map((pkg.ui?.v8Sections??[]).filter(x=>String(x.id).startsWith('EVI_')).map(x=>[String(x.id).slice(4),x]));
            for(const finding of (research.findings??[]).filter(x=>x.observationType==='evidence')){
              const categories=finding.semanticCategories??[];
              const section=sections.get(finding.findingId);
              if(!section){
                const linked=(pkg.evidence?.evidences??[]).filter(x=>(x.sourceEvidenceRefs??[]).includes(finding.findingId));
                const exactOnly=categories.length>0&&categories.every(x=>x.semanticType==='EXACT_CONSTRAINT');
                if(!exactOnly||linked.length!==categories.length||linked.some(x=>String(x.inputId??'').startsWith('REF_')))fail('EVIDENCE_SECTION_MISSING:'+id+':'+finding.findingId);
                continue;
              }
              const actual=section.items?.[0]?.interaction?.categories??[];
              if(actual.length!==categories.length)fail('EVIDENCE_CATEGORY_COUNT:'+id+':'+finding.findingId+':'+categories.length+':'+actual.length);
              categories.forEach((c,i)=>{
                if(actual[i]?.label!==c.label)fail('EVIDENCE_LABEL:'+id+':'+finding.findingId+':'+i);
                const expectedMeaning=c.meaning??'観測回数';
                if(actual[i]?.meaning!==expectedMeaning)fail('EVIDENCE_MEANING:'+id+':'+finding.findingId+':'+i);
              });
            }
            const exactExpected=(research.findings??[]).filter(x=>x.observationType==='evidence').flatMap(x=>x.semanticCategories??[]).filter(x=>x.semanticType==='EXACT_CONSTRAINT').length;
            if((pkg.evidence?.evidences??[]).length!==exactExpected)fail('EXACT_EVIDENCE_COUNT:'+id+':'+exactExpected+':'+(pkg.evidence?.evidences??[]).length);
            for(const e of pkg.evidence?.evidences??[])if(/示唆|期待|アップ|出現しやすい/.test(e.name??''))fail('SOFT_HINT_CONSTRAINED:'+id+':'+e.name);
            const summary=pkg.v8?.machineResearchSummary??{};
            const visibleSummaryText=[
              summary.title,
              ...(summary.adopted??[]).flatMap(x=>[x.label,x.reason,x.evaluation?.userLabel]),
              ...(summary.notAdopted??[]).flatMap(x=>[x.label,x.reason,x.reevaluationCondition]),
              ...(summary.unresolved??[]).flatMap(x=>[x.label,x.reason]),
              summary.highLowDiscrimination?.selectedFeatureLabel,
              summary.highLowDiscrimination?.note
            ].filter(Boolean).join(' ');
            if(/likelihood|source-supported|joint|conditional|categorical|candidate contract|runtime policy|research|evaluation/i.test(visibleSummaryText))fail('INTERNAL_WORDING:'+id);
            const abstractLabels=new Set(['対象回数','回数','観測機会数','該当回数']);
            const compact=v=>String(v??'').normalize('NFKC').replace(/[\\s・：:「」『』（）()、,.。．!?！？]/g,'').trim();
            const restates=(description,label)=>{const d=compact(description).replace(/数えるもの|入力方法|基準|記録します|入力します|確認します|回数|ゲーム数/g,''),l=compact(label).replace(/回数|ゲーム数/g,'');return Boolean(d&&l&&(d===l||(Math.min(d.length,l.length)>=4&&(d.includes(l)||l.includes(d))&&Math.min(d.length,l.length)/Math.max(d.length,l.length)>=0.85)))};
            for(const input of pkg.inputs?.inputs??[])if(input.category==='V8_NUMERIC'&&abstractLabels.has(String(input.name)))fail('ABSTRACT_NUMERIC_LABEL:'+id+':'+input.id);
            for(const section of (pkg.ui?.v8Sections??[]).filter(x=>String(x.id).startsWith('OBS_'))){
              const description=String(section.description??'');
              if(!description.trim())fail('DESCRIPTION_MISSING:'+id+':'+section.title);
              if(/設定判別スコア|1回の判別力/.test(description))fail('METRIC_IN_DESCRIPTION:'+id+':'+section.title);
              if(/Evidence|denominator|trial universe|Candidate Contract|Runtime Policy|Opportunity model|joint model/i.test(description))fail('INTERNAL_DESCRIPTION_WORDING:'+id+':'+section.title);
              if(/・数えるもの：|・基準：/.test(description))fail('MECHANICAL_DESCRIPTION:'+id+':'+section.title);
              if(/\\n|\/n/i.test(description))fail('LITERAL_BREAK_TOKEN:'+id+':'+section.title);
              for(const node of [...(section.groups??[]),...(section.items??[])]){
                for(const input of node.inputs??[]){
                  const label=String(input.label??'');
                  if(abstractLabels.has(label))fail('ABSTRACT_UI_INPUT:'+id+':'+input.id);
                  if(['denominator','counter'].includes(String(input.input??''))&&(label.length>30||/^(?:に|で|を|が|へ|から)/.test(label)))fail('NON_CONCISE_UI_INPUT:'+id+':'+input.id+':'+label);
                  if(restates(description,input.label))fail('DESCRIPTION_INPUT_RESTATEMENT:'+id+':'+input.id);
                }
              }
            }
            const features=pkg.features?.features??[];
            const universes=features.map(x=>String(x.trialUniverse??''));
            const needsNormal=universes.some(x=>x==='NORMAL_GAME_TRIAL'||x==='BONUS_ELIGIBLE_GAME_TRIAL');
            const needsExcluded=universes.some(x=>x==='LOTIS_NON_CHAIN_GAME_TRIAL'||x==='NON_CHAIN_BONUS_INITIAL_GAME_TRIAL');
            const needsTotal=needsExcluded||universes.includes('TOTAL_GAME_TRIAL');
            const expectedMode=needsTotal&&needsNormal?'TOTAL_AND_NORMAL':needsTotal?'TOTAL_ONLY':needsNormal?'NORMAL_ONLY':'NONE';
            const playInfo=pkg.ui?.playInfo??{};
            if(playInfo.mode!==expectedMode)fail('PLAY_INFO_MODE:'+id+':'+playInfo.mode+':'+expectedMode);
            const start=(playInfo.startFields??[]).map(x=>x.label);
            const current=(playInfo.currentFields??[]).map(x=>x.label);
            const expectedStart=[...(needsTotal?['着席時 総ゲーム数']:[]),...(needsNormal?['着席時 通常ゲーム数']:[])];
            const expectedCurrent=[...(needsTotal?['現在 総ゲーム数']:[]),...(needsNormal?['現在 通常ゲーム数']:[])];
            if(JSON.stringify(start)!==JSON.stringify(expectedStart)||JSON.stringify(current)!==JSON.stringify(expectedCurrent))fail('PLAY_INFO_UNUSED_OR_MISSING:'+id);
            if(Boolean(playInfo.exclusionGames?.visible===true)!==needsExcluded)fail('PLAY_INFO_EXCLUSION:'+id);
            for(const r of pkg.features?.runtimeProjection??[]){
              if(r.runtimeStatus==='ACTIVE'&&r.metric==='SELECTION_SCORE'&&r.importance!==expectedImportance(Number(r.metricValue)))fail('IMPORTANCE_RAW_THRESHOLD:'+id+':'+r.featureId);
            }
          }
          for(const id of ids){
            const research=read(path.join('batches',batch,'artifacts',id,'research','result.json'));
            if(!research.researchCompleteness||research.researchCompleteness.domains?.length<20)fail('RESEARCH_COMPLETENESS_MISSING:'+id);
            if(research.researchCompleteness.version!==2)fail('RESEARCH_COMPLETENESS_V2_MISSING:'+id);
            const blockText=(research.blockedItems??[]).map(x=>x.label).join(' ');
            if(/設定示唆演出.*設定別出現率|有利区間リセット後の恩恵|外部集計に依存する要素/.test(blockText))fail('ABSTRACT_RESEARCH_BUCKET:'+id);
            for(const finding of research.findings??[])if(finding.settingDistribution===undefined&&finding.observationType!=='evidence')fail('UNROUTED_RESEARCH_FINDING:'+id+':'+finding.findingId);
          }
          const active=(pkg,fid)=>(pkg.features?.runtimeProjection??[]).find(x=>x.featureId===fid)?.runtimeStatus==='ACTIVE';
          const uiText=pkg=>JSON.stringify(pkg.ui?.v8Sections??[]);
          const hardEvidenceText=pkg=>JSON.stringify(pkg.evidence?.evidences??[]);

          const reauditIds=['L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA','L_MILLION_GOD_KISEKI_CX','L_AKUDAMA_DRIVE_TP','L_KYOKOU_SUIRI_ST','L_SHINUCHI_YOSHIMUNE_A1','LB_TRIPLE_CROWN_SEVEN_FG','L_JORMUNGAND_ND01G'];
          for(const id of reauditIds){
            const research=read(path.join('batches',batch,'artifacts',id,'research','result.json'));
            if(!research.researchCompleteness?.reaudit)fail('READAUDIT_MISSING:'+id);
          }
          const million=read(path.join('batches',batch,'artifacts','L_MILLION_GOD_KISEKI_CX','app_runtime','result.json')).package;
          if(JSON.stringify(million.evidence?.evidences??[]).includes('ユニバプレート'))fail('MILLION_GOD_PLATE_WRONGLY_EXACT');
          if(!JSON.stringify(million.ui?.v8Sections??[]).includes('本機の確定解析は未確認'))fail('MILLION_GOD_PLATE_CAUTION_MISSING');
          const fire=read(path.join('batches',batch,'artifacts','L_FIRE_FORCE_2','app_runtime','result.json')).package;
          for(const fid of ['reg-character-scenario-selection','bonus-end-reg-accel-gray-distribution','bonus-end-fire-bonus-distribution'])if(!active(fire,fid))fail('FIRE_PROBABILITY_ROUTE_INACTIVE:'+fid);
          if((fire.ui?.v8Sections??[]).some(x=>x.id==='EVI_reg-mamoru-kun'))fail('FIRE_MAMORU_DUPLICATE_SECTION');
          if((fire.inputs?.inputs??[]).some(x=>String(x.id).startsWith('REF_reg-mamoru-kun_')))fail('FIRE_MAMORU_DUPLICATE_INPUT');
          const mamoruDefs=(fire.evidence?.evidences??[]).filter(x=>(x.sourceEvidenceRefs??[]).includes('reg-mamoru-kun'));
          if(mamoruDefs.length!==6||mamoruDefs.some(x=>!String(x.inputId).startsWith('reg-character-scenario-selection.categoryCounts.')))fail('FIRE_MAMORU_NOT_LINKED_TO_NUMERIC_INPUT');
          const regSection=(fire.ui?.v8Sections??[]).find(x=>x.id==='OBS_reg-character-scenario-selection');
          if(!regSection||!/別の欄へ重ねて入力する必要はありません/.test(regSection.description??''))fail('FIRE_MAMORU_AUTO_REFLECTION_GUIDANCE_MISSING');
          for(const label of ['1人目まもるくん','2人目まもるくん','3人目まもるくん','4人目まもるくん','5人目まもるくん','まもるくん無し'])if(!uiText(fire).includes(label))fail('FIRE_MAMORU_CATEGORY_MISSING:'+label);

          const akudama=read(path.join('batches',batch,'artifacts','L_AKUDAMA_DRIVE_TP','app_runtime','result.json')).package;
          if(!uiText(akudama).includes('ST終了画面後の処刑課バトル規定セット否定'))fail('AKUDAMA_DELAYED_DENIAL_EVIDENCE_MISSING');
          if(active(akudama,'cz-mode-upgrade-after-tank-failure'))fail('AKUDAMA_INTERNAL_MODE_REFERENCE_BECAME_ACTIVE');

          const kyokou=read(path.join('batches',batch,'artifacts','L_KYOKOU_SUIRI_ST','app_runtime','result.json')).package;
          for(const fid of ['bonus-end-screen-distribution','ayakashi-bonus-character-distribution'])if(!active(kyokou,fid))fail('KYOKOU_PROBABILITY_ROUTE_INACTIVE:'+fid);
          if((kyokou.ui?.v8Sections??[]).some(x=>x.id==='EVI_ayakashi-bonus-character-exact'))fail('KYOKOU_AYAKASHI_DUPLICATE_SECTION');
          if((kyokou.inputs?.inputs??[]).some(x=>String(x.id).startsWith('REF_ayakashi-bonus-character-exact_')))fail('KYOKOU_AYAKASHI_DUPLICATE_INPUT');
          const ayakashiDefs=(kyokou.evidence?.evidences??[]).filter(x=>(x.sourceEvidenceRefs??[]).includes('ayakashi-bonus-character-exact'));
          if(ayakashiDefs.length!==6||ayakashiDefs.some(x=>!String(x.inputId).startsWith('ayakashi-bonus-character-distribution.categoryCounts.')))fail('KYOKOU_AYAKASHI_NOT_LINKED_TO_NUMERIC_INPUT');

          const yoshimune=read(path.join('batches',batch,'artifacts','L_SHINUCHI_YOSHIMUNE_A1','app_runtime','result.json')).package;
          if(!active(yoshimune,'at-end-screen-distribution'))fail('YOSHIMUNE_AT_END_DISTRIBUTION_INACTIVE');

          const jorm=read(path.join('batches',batch,'artifacts','L_JORMUNGAND_ND01G','app_runtime','result.json')).package;
          for(const fid of ['reg-character-first-second-distribution','reg-character-third-distribution','bonus-end-screen-distribution'])if(!active(jorm,fid))fail('JORM_PROBABILITY_ROUTE_INACTIVE:'+fid);
          for(const label of ['サブ液晶・設定示唆カード','特定獲得枚数表示','エンディング中の筐体枠ランプ','ケロットトロフィー'])if(!uiText(jorm).includes(label))fail('JORM_EVIDENCE_MISSING:'+label);
          if(/ケロットトロフィー/.test(hardEvidenceText(jorm)))fail('JORM_TROPHY_MUST_NOT_HARD_CONSTRAIN');

          for(const id of ['L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA','LB_TRIPLE_CROWN_SEVEN_FG']){
            const research=read(path.join('batches',batch,'artifacts',id,'research','result.json'));
            if(research.researchCompleteness?.reaudit?.status!=='NO_ADDITIONAL_SETTING_ROUTE')fail('REAUDIT_STATUS_MISSING:'+id);
          }
          {
            const research=read(path.join('batches',batch,'artifacts','L_MILLION_GOD_KISEKI_CX','research','result.json'));
            if(research.researchCompleteness?.reaudit?.status!=='UPDATED')fail('MILLION_GOD_REAUDIT_NOT_UPDATED');
          }
          console.log(JSON.stringify({status:'PASS',machines:ids.length,reaudited:8},null,2));
          NODE

      - name: Commit repaired Batch 003 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261002-003
          git commit -m "Repair Batch 003 semantic fidelity [skip ci]"
          git push origin HEAD:production/v85-batch-003-foundation-20261002
