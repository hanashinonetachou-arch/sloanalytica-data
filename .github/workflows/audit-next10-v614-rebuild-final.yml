name: Next10 v6.14 final rebuild and quality gate

on:
  push:
    branches: [audit/20260908-next10-selection-v614]
    paths:
      - .github/workflows/audit-next10-v614-rebuild-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next10-v614-final-rebuild
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Define exact Next10 scope
        run: |
          cat >/tmp/ids.txt <<'EOF'
          L_FIRE_FORCE_2
          L_UMINEKO_2_A1
          L_KABANERI_UNATO_KESSEN_XX
          L_JORMUNGAND_ND01G
          LB_TRIPLE_CROWN_SEVEN_FG
          L_SHINUCHI_YOSHIMUNE_A1
          L_KYOKOU_SUIRI_ST
          L_AKUDAMA_DRIVE_TP
          L_MILLION_GOD_KISEKI_CX
          L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
          EOF
          test "$(wc -l </tmp/ids.txt)" -eq 10
      - name: Regenerate changed statistical reports
        run: |
          npm run stats:evaluate -- research/LB_TRIPLE_CROWN_SEVEN_FG/research-data.json research/LB_TRIPLE_CROWN_SEVEN_FG/statistics-report.json
          npm run stats:evaluate -- research/L_UMINEKO_2_A1/research-data.json research/L_UMINEKO_2_A1/statistics-report.json
      - name: Regenerate changed difficulty reports
        run: |
          for id in LB_TRIPLE_CROWN_SEVEN_FG L_UMINEKO_2_A1 L_FIRE_FORCE_2; do
            npm run difficulty:evaluate -- "research/$id/research-data.json" "research/$id/selection-data.json" "research/$id/difficulty-report.json"
          done
      - name: Revalidate four canonical layers
        run: |
          while read -r id; do
            npm run research:validate -- "research/$id/research-data.json"
            npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"
          done </tmp/ids.txt
          node tools/audit-selection-quality.mjs $(cat /tmp/ids.txt) --strict
          args=(); while read -r id; do args+=("research/$id/machine-observation-data.json"); done </tmp/ids.txt
          npm run observation:validate -- "${args[@]}"
          npm run observation:selection:audit -- $(cat /tmp/ids.txt) --strict-v2
          npm run ui-design:validate
          npm run ui-design:linkage:audit -- . $(cat /tmp/ids.txt)
          npm run ui-design:observation:audit -- $(cat /tmp/ids.txt) --strict-v2
          npm run pipeline:four-layer:gate -- $(cat /tmp/ids.txt)
      - name: v6.14 semantic assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const errors=[];
          const tc=read('research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json');
          const tco=read('research/LB_TRIPLE_CROWN_SEVEN_FG/machine-observation-data.json');
          const tcui=read('research/LB_TRIPLE_CROWN_SEVEN_FG/ui-design-data.json');
          const f=(s,id)=>s.features.find(x=>x.featureId===id);
          const m=(o,id)=>o.featureMappings.find(x=>x.featureId===id);
          if(f(tc,'FEAT_SMALL_ROLE_COMPOSITION')?.adoptionCategory!=='INCLUDE_SUPPORT') errors.push('Triple small-role joint not adopted');
          if(f(tc,'FEAT_BONUS_OUTCOME')?.adoptionCategory!=='INCLUDE_PRIMARY') errors.push('Triple bonus joint not primary');
          if(!tcui.sections['通常時']?.inputIds?.includes('INP_PLUM_COUNT')) errors.push('Triple plum input not materialized in canonical UI');
          for(const id of ['FEAT_CHERRY','FEAT_PLUM','FEAT_BB_INITIAL','FEAT_RB_INITIAL']) if(m(tco,id)) errors.push(`Triple stale mapping ${id}`);
          if(/入力負担|手動.*負担|カウント.*負担/.test(f(tc,'FEAT_BT_REPLAY_BB')?.userFacingReason??'')) errors.push('Triple BT reject references burden');
          const um=read('research/L_UMINEKO_2_A1/selection-data.json');
          const umo=read('research/L_UMINEKO_2_A1/machine-observation-data.json');
          const umui=read('research/L_UMINEKO_2_A1/ui-design-data.json');
          if(f(um,'FEAT_ART_ROLE_COMPOSITION')?.adoptionCategory!=='INCLUDE_SUPPORT') errors.push('Umineko ART joint not adopted');
          if(!umui.sections['ART中の役構成']) errors.push('Umineko ART joint section missing');
          if(umui.sections['ART中ハズレ']||umui.sections['ART中の共通ベル']) errors.push('Umineko split ART sections returned');
          for(const id of ['FEAT_ART_MISS','FEAT_ART_COMMON_BELL']) if(m(umo,id)) errors.push(`Umineko stale mapping ${id}`);
          const fire=read('research/L_FIRE_FORCE_2/selection-data.json');
          if(f(fire,'FEAT_BONUS_INITIAL')?.adoptionCategory!=='INCLUDE_FALLBACK') errors.push('Fire bonus initial not fallback');
          if(!(f(fire,'FEAT_BONUS_INITIAL')?.suppressedByFeatureIds??[]).includes('FEAT_ENEN_LOOP_INITIAL')) errors.push('Fire fallback suppression missing');
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          for(const id of ids){
            const s=read(`research/${id}/selection-data.json`);
            for(const x of s.features??[]) if(x.adoptionCategory==='EXCLUDE' && !(x.userFacingReason??'').trim()) errors.push(`${id}/${x.featureId}: missing EXCLUDE reason`);
          }
          if(errors.length) throw new Error(errors.join('\n'));
          console.log('PASS: v6.14 semantic assertions');
          NODE
      - name: Build MachineData for exact Next10
        run: npm run machine:batch -- $(cat /tmp/ids.txt)
      - name: Materialize preserved UI Design
        run: node tools/materialize-ui-design.mjs --apply $(cat /tmp/ids.txt)
      - name: Verify materialization and migration
        run: |
          node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/ids.txt)
          npm run selection:migration-audit
      - name: Assert generated MachineData contains new joint contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const find=(id)=>{
            const candidates=[`machines/${id}/machine-data.json`,`machines/${id}/machine-package.json`,`machines/${id}.json`];
            for(const p of candidates) if(fs.existsSync(p)) return [p,JSON.parse(fs.readFileSync(p,'utf8'))];
            return [null,null];
          };
          const [tp,t]=find('LB_TRIPLE_CROWN_SEVEN_FG');
          const [up,u]=find('L_UMINEKO_2_A1');
          if(!t) throw new Error('Triple generated MachineData not found');
          if(!u) throw new Error('Umineko generated MachineData not found');
          const ts=JSON.stringify(t), us=JSON.stringify(u);
          if(!ts.includes('FEAT_SMALL_ROLE_COMPOSITION')||!ts.includes('FEAT_BONUS_OUTCOME')||!ts.includes('INP_PLUM_COUNT')) throw new Error(`Triple generated joint contract missing in ${tp}`);
          if(!us.includes('FEAT_ART_ROLE_COMPOSITION')||!us.includes('INP_ART_COMMON_BELL_COUNT')) throw new Error(`Umineko generated joint contract missing in ${up}`);
          console.log(`PASS generated contracts: ${tp}, ${up}`);
          NODE
      - name: Repository-wide quality
        run: |
          npm run ui-design:test
          npm run difficulty:event-exposure:test
          npm run difficulty:exposure-audit
          npm run audit:ui-service-names
          npm run ux-contract:audit
          npm run registry:validate
          npm test
          npm run audit
      - name: Final materialization stability
        run: node tools/materialize-ui-design.mjs --require-unchanged $(cat /tmp/ids.txt)
      - name: Commit regenerated canonical/generated data
        run: |
          git restore -- reports/v64-observation-debt-classification.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research machines reports difficulty-catalog.json machine-registry.json catalog.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No regenerated changes to commit.'
          else
            git commit -m 'machine-data: rebuild Next10 after v6.14 Selection re-audit [v614-final]'
            git push origin HEAD:audit/20260908-next10-selection-v614
          fi
      - name: Summary
        run: |
          echo 'Next10 v6.14 final rebuild: PASS'
          echo 'Prototype/public integration: NOT RUN'
