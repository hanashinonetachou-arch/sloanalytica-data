name: Batch8 Latest Manifest Audit

on:
  push:
    branches:
      - prototype-multi-machine
    paths:
      - tools/audit-batch8-latest-manifest.mjs
      - .github/workflows/batch8-latest-manifest-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run latest-manifest semantic audit
        run: node tools/audit-batch8-latest-manifest.mjs

      - name: Validate Selection for remaining 8
        run: |
          set -e
          IDS=(
            L_USHIO_TORA_HAKUMEN_VH
            L_AMAZING_LIVE_PD
            L_YOSHIMUNE_SC2
            L_MAHJONG_MONOGATARI_S2
            L_IDOLMASTER_MILLION_LIVE_HC
            L_YOUJITSU_DE
            L_MIDORIDON_VIVA_REVIVAL_FY
            L_GUNDAM_SEED_G
          )
          for id in "${IDS[@]}"; do
            npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"
          done

      - name: Validate Observation for remaining 8
        run: npm run observation:validate -- research/L_USHIO_TORA_HAKUMEN_VH/machine-observation-data.json research/L_AMAZING_LIVE_PD/machine-observation-data.json research/L_YOSHIMUNE_SC2/machine-observation-data.json research/L_MAHJONG_MONOGATARI_S2/machine-observation-data.json research/L_IDOLMASTER_MILLION_LIVE_HC/machine-observation-data.json research/L_YOUJITSU_DE/machine-observation-data.json research/L_MIDORIDON_VIVA_REVIVAL_FY/machine-observation-data.json research/L_GUNDAM_SEED_G/machine-observation-data.json

      - name: Validate UI design for remaining 8
        run: npm run ui-design:validate -- research/L_USHIO_TORA_HAKUMEN_VH/ui-design-data.json research/L_AMAZING_LIVE_PD/ui-design-data.json research/L_YOSHIMUNE_SC2/ui-design-data.json research/L_MAHJONG_MONOGATARI_S2/ui-design-data.json research/L_IDOLMASTER_MILLION_LIVE_HC/ui-design-data.json research/L_YOUJITSU_DE/ui-design-data.json research/L_MIDORIDON_VIVA_REVIVAL_FY/ui-design-data.json research/L_GUNDAM_SEED_G/ui-design-data.json

      - name: Observation Selection linkage
        run: npm run observation:selection:audit -- L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2 L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORIDON_VIVA_REVIVAL_FY L_GUNDAM_SEED_G

      - name: UI Selection linkage
        run: npm run ui-design:linkage:audit -- L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2 L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORIDON_VIVA_REVIVAL_FY L_GUNDAM_SEED_G

      - name: UI Observation linkage
        run: npm run ui-design:observation:audit -- L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2 L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORIDON_VIVA_REVIVAL_FY L_GUNDAM_SEED_G

      - name: Run full test suite
        run: npm test

      - name: Run public-data audit
        run: npm run audit

      - name: Commit audit report
        run: |
          if git diff --quiet -- reports/batch8-latest-manifest-audit.json; then
            echo 'Audit report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/batch8-latest-manifest-audit.json
          git commit -m 'audit: record remaining 8 latest-manifest findings'
          git push origin HEAD:prototype-multi-machine
