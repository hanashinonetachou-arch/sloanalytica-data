name: Temp Hard Boiled JAC UI
on:
  push:
    branches: [fix/hardboiled-jac-ui-20260821]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hardboiled-jac-ui-20260821
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/tmp-hardboiled-jac-ui.mjs
      - run: npm run machine:pipeline -- S_HARD_BOILED_XX
      - run: npm test
      - run: npm run audit
      - run: npm run audit:ui-service-names
      - name: Commit generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/S_HARD_BOILED_XX/selection-data.json research/S_HARD_BOILED_XX/statistics-report.json research/S_HARD_BOILED_XX/difficulty-report.json research/S_HARD_BOILED_XX/setting-band-report.json machines/S_HARD_BOILED_XX/machine-package.json catalog.json difficulty-catalog.json machine-registry.json
          git diff --cached --quiet || git commit -m 'fix: compact Hard Boiled JAC voice counters'
          git push
