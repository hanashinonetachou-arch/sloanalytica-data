name: Finalize 20260906 Gate A Linked Services

on:
  push:
    branches:
      - batch/20260906-next10-gate0
    paths:
      - '.github/workflows/finalize-20260906-gate-a-linked-services.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260906-next10-gate0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Correct official linked-service research
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=id=>JSON.parse(fs.readFileSync(`research/${id}/research-data.json`,'utf8'));
          const write=(id,d)=>fs.writeFileSync(`research/${id}/research-data.json`,JSON.stringify(d,null,2)+'\n');
          const src=(d,s)=>{d.sources=d.sources??[];if(!d.sources.some(x=>x.sourceId===s.sourceId))d.sources.push(s)};

          {
            const id='L_GINGA_EIYUU_DNT_GH',d=read(id);
            src(d,{sourceId:'SRC_ESLOT_OFFICIAL_COMPAT',publisher:'コナミアミューズメント',title:'パチンコ・パチスロ実機連動アプリ対応機種',url:'https://www.konami.com/amusement/psm/rendo/compatible_models.html',sourceType:'official',checkedAt:'2026-09-06'});
            src(d,{sourceId:'SRC_ESLOT_OFFICIAL_ABOUT',publisher:'コナミアミューズメント',title:'e-slot+ 実機連動アプリ',url:'https://www.konami.com/amusement/psm/rendo/',sourceType:'official',checkedAt:'2026-09-06'});
            d.linkedServices=(d.linkedServices??[]).filter(x=>x.name!=='メーカー実機連動サービス');
            d.linkedServices.push({name:'e-slot+',status:'VERIFIED_SUPPORTED',sourceRefs:['SRC_ESLOT_OFFICIAL_COMPAT','SRC_ESLOT_OFFICIAL_ABOUT'],exactFieldsStatus:'GENERIC_OFFICIAL_FIELDS_ENUMERATED',verifiedFields:['ゲーム数','ボーナス回数などの遊技結果','ミッション達成回数','機種別・期間別ランキング','途中経過閲覧','遊技情報集計終了時の結果保存'],notes:'コナミ公式対応機種一覧に銀河英雄伝説 Die Neue Theseを掲載。機種固有の全フィールド名ではなく、e-slot+公式が保証する遊技結果カテゴリを列挙。'});
            const dc=d.discoveryInventory.find(x=>x.discoveryCandidateId==='DC_05');
            if(!dc)throw new Error('Ginga DC05 missing');
            Object.assign(dc,{transferStatus:'REFERENCE',researchTarget:'reference',researchReference:'linkedServices[e-slot+]'});
            write(id,d);
          }

          {
            const id='L_HOKUTO_TENSEI_2_MW',d=read(id);
            src(d,{sourceId:'SRC_MYSLOT_TENSEI_OFFICIAL',publisher:'サミー株式会社',title:'マイスロ「スマスロ 北斗の拳 転生の章2」登場・機種別サイト',url:'https://new.sammy.co.jp/japanese/myslot/news/',sourceType:'official',checkedAt:'2026-09-06'});
            src(d,{sourceId:'SRC_MYSLOT_ABOUT_OFFICIAL',publisher:'サミー株式会社',title:'マイスロとは？',url:'https://new.sammy.co.jp/japanese/myslot/about.html',sourceType:'official',checkedAt:'2026-09-06'});
            d.linkedServices=(d.linkedServices??[]).filter(x=>x.name!=='マイスロ');
            d.linkedServices.push({name:'マイスロ',status:'VERIFIED_SUPPORTED',sourceRefs:['SRC_MYSLOT_TENSEI_OFFICIAL','SRC_MYSLOT_ABOUT_OFFICIAL'],exactFieldsStatus:'GENERIC_OFFICIAL_FIELDS_ENUMERATED_MACHINE_SPECIFIC_PARTIAL',verifiedFields:['遊技ゲーム数・ボーナス回数等の遊技履歴','最新の遊技結果','マイカウンター','通算結果','ミッション達成結果','サミートロフィーコレクション','実戦データ','クイックマイスロ'],notes:'公式マイスロお知らせで北斗転生2の機種別サイト開設・導入を確認。機種固有の全マイカウンター項目は未列挙だが、公式サービス共通の取得カテゴリを確認済み。通常小役は全設定共通で、本機のMyCounterに小役確率項目なしとの解析情報とも整合。'});
            const dc=d.discoveryInventory.find(x=>x.discoveryCandidateId==='DC_06');
            if(!dc)throw new Error('Hokuto DC06 missing');
            Object.assign(dc,{transferStatus:'REFERENCE',researchTarget:'reference',researchReference:'linkedServices[マイスロ]'});
            write(id,d);
          }
          NODE
      - name: Validate two machines
        run: |
          node tools/validate-research-data.mjs research/L_GINGA_EIYUU_DNT_GH/research-data.json
          node tools/validate-research-data.mjs research/L_HOKUTO_TENSEI_2_MW/research-data.json
          node tools/discovery-completeness-gate.mjs L_GINGA_EIYUU_DNT_GH L_HOKUTO_TENSEI_2_MW
      - name: Commit linked-service corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_GINGA_EIYUU_DNT_GH/research-data.json research/L_HOKUTO_TENSEI_2_MW/research-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: confirm Ginga e-slot+ and Hokuto MySlot support'
          git pull --rebase origin batch/20260906-next10-gate0
          git push origin HEAD:batch/20260906-next10-gate0
