name: Kaguya BONUS End Shared Input

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/apply-kaguya-bonus-end-shared-input.mjs'
      - 'test/numeric-inference-profile.test.mjs'
      - '.github/workflows/kaguya-bonus-end-shared-input.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/apply-kaguya-bonus-end-shared-input.mjs
      - name: Validate Kaguya shared-input model
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateSelectionEvidenceCoverage } from './tools/batch-completeness-gates.mjs';
          const r=JSON.parse(fs.readFileSync('research/L_KAGUYA_SAMA_JA/research-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('research/L_KAGUYA_SAMA_JA/selection-data.json','utf8'));
          const rf=r.features.find(f=>f.researchFeatureId==='RF_KAGUYA_BONUS_END_FRAME');
          if(rf.distributionMode!=='explicit_complete'||!rf.categories.includes('OTHER')) throw new Error('explicit residual model missing');
          for(const setting of r.machine.settings){
            const total=rf.categories.reduce((sum,c)=>sum+Number(rf.settingDistributions[setting][c]),0);
            if(Math.abs(total-1)>1e-9) throw new Error(`${setting} total ${total}`);
          }
          const sf=s.features.find(f=>f.researchFeatureId==='RF_KAGUYA_BONUS_END_FRAME');
          if(sf.adoptionCategory!=='INCLUDE_SUPPORT'||!sf.categoryInputIds.includes('INP_KAGUYA_END_OTHER')) throw new Error('Selection multinomial invalid');
          for(const id of ['RE_KAGUYA_END_PURPLE','RE_KAGUYA_END_SILVER','RE_KAGUYA_END_GOLD']){
            const e=(s.evidence??[]).find(x=>x.researchEvidenceId===id);
            if(!e||(e.sharedFeatureIds??[])[0]!=='FEAT_KAGUYA_BONUS_END_FRAME') throw new Error(`shared evidence invalid ${id}`);
          }
          const coverage=validateSelectionEvidenceCoverage(s,r,{required:true});
          if(!coverage.ok) throw new Error(coverage.errors.join('\n'));
          NODE
      - name: Rebuild target machine
        run: npm run machine:pipeline -- L_KAGUYA_SAMA_JA --skip-repo-checks
      - name: Refresh semantic audit before tests
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Run full tests
        run: npm test
      - name: Run public audit
        run: npm run audit
      - name: Run UI service-name audit
        run: npm run audit:ui-service-names
      - name: Run Observation linkage legacy baseline
        run: node tools/audit-observation-selection-linkage.mjs L_KAGUYA_SAMA_JA
      - name: Run causal audit
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Verify Kaguya semantic review resolved
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=a.machines.find(x=>x.machineId==='L_KAGUYA_SAMA_JA');
          if(!m||m.status!=='PASS') throw new Error(`Kaguya semantic status ${m?.status}: ${JSON.stringify(m?.issues)}`);
          console.log('Kaguya semantic PASS');
          NODE
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: share Kaguya ending-frame Evidence inputs [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
