name: Batch001 Runtime Materialization Repair Generate

on:
  push:
    branches:
      - production/batch-20260928-001
    paths:
      - production/.batch001-runtime-materialization-repair-trigger

permissions:
  contents: write

concurrency:
  group: batch001-runtime-materialization-repair
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/batch-20260928-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate production orchestrator before repair
        working-directory: production
        run: npm test
      - name: Regenerate Batch 001 runtime artifacts
        working-directory: production
        run: node --experimental-strip-types src/repair-batch001-runtime-materialization.ts generate batch-20260928-001
      - name: Validate production orchestrator after repair
        working-directory: production
        run: npm test
      - name: Commit regenerated authoritative production state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20260928-001
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Regenerate Batch 001 runtime artifacts after materialization repair [skip ci]"
          git push origin HEAD:production/batch-20260928-001
