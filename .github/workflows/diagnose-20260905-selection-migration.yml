name: Diagnose 20260905 Selection Migration Review

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/diagnose-20260905-selection-migration.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply same in-memory finalization setup as v10
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/finalize-20260905-next10.yml').read_text(encoding='utf-8')
          a=s.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          b=s.index("\n          PY", a)
          Path('/tmp/finalize_next10.py').write_text(textwrap.dedent(s[a:b]),encoding='utf-8')
          PY
          python /tmp/finalize_next10.py
          git fetch --all --prune
          node --input-type=module <<'NODE' > /tmp/recover.tsv
          import fs from'node:fs';
          const c=JSON.parse(fs.readFileSync('device-test/20260905-next10/catalog.json','utf8')),es=c.machines||c.entries||c.items||[];
          for(const e of es){const id=e.machineId||e.id;if(!fs.existsSync(`machines/${id}/machine-package.json`)){const h=String(e.sha256||e.packageSha256||e.hash||'').replace(/^sha256:/,'');console.log(`${id}\t${h}`)}}
          NODE
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v 'origin/HEAD' > /tmp/refs.txt
          while IFS=$'\t' read -r id expected; do
            found=''
            while IFS= read -r ref; do
              if git cat-file -e "$ref:machines/$id/machine-package.json" 2>/dev/null; then
                actual="$(git show "$ref:machines/$id/machine-package.json" | sha256sum | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then found="$ref"; break; fi
              fi
            done < /tmp/refs.txt
            test -n "$found"
            git checkout "$found" -- "machines/$id"
            if git cat-file -e "$found:research/$id/research-data.json" 2>/dev/null; then git checkout "$found" -- "research/$id"; fi
          done < /tmp/recover.tsv
          npm ci
      - name: Print non-PASS selection migration entries
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-selection-policy-migration.mjs . /tmp/selection-policy-migration-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/selection-policy-migration-audit.json','utf8'));
          console.log('SUMMARY', JSON.stringify(r.summary));
          for(const m of r.machines.filter(x=>x.status!=='PASS')) console.log('NON_PASS', JSON.stringify(m));
          NODE
