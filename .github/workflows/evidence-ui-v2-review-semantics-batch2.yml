name: Evidence UI v2 REVIEW Semantics Batch 2

on:
  push:
    branches:
      - audit/evidence-ui-v2-review-remediation-20260915
    paths:
      - .github/workflows/evidence-ui-v2-review-semantics-batch2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantics-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-review-remediation-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run God Eater natural Evidence semantics remediation
        run: node tools/run-evidence-ui-v2-review-semantics-batch2.mjs
      - name: Commit canonical and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_GOD_EATER_RESURRECTION/selection-data.json research/L_GOD_EATER_RESURRECTION/machine-observation-data.json research/L_GOD_EATER_RESURRECTION/ui-design-data.json
          git add machines/L_GOD_EATER_RESURRECTION/machine-package.json research/L_GOD_EATER_RESURRECTION/statistics-report.json research/L_GOD_EATER_RESURRECTION/difficulty-report.json research/L_GOD_EATER_RESURRECTION/setting-band-report.json
          git add catalog.json difficulty-catalog.json machine-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence-ui: resolve God Eater natural Evidence semantics'
          git push origin HEAD:audit/evidence-ui-v2-review-remediation-20260915
