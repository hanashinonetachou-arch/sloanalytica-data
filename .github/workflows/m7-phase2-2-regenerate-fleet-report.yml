name: M7 Phase 2.2 Regenerate Fleet Report

on:
  push:
    branches:
      - audit/m7-phase2-2-observation-formalization-final-20260916
    paths:
      - .github/workflows/m7-phase2-2-regenerate-fleet-report.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m7-phase2-2-observation-formalization-final-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate deterministic full-fleet report
        run: node tools/audit-m7-full-fleet-migration.mjs --write
      - name: Verify focused M7 fleet audit tests
        run: node --test test/m7-full-fleet-migration-audit.test.mjs
      - name: Commit regenerated reports if changed
        run: |
          if git diff --quiet -- reports/m7-full-fleet-migration-audit-20260916.json reports/m7-full-fleet-migration-audit-20260916.md; then
            echo "Fleet report already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/m7-full-fleet-migration-audit-20260916.json reports/m7-full-fleet-migration-audit-20260916.md
          git commit -m "audit: refresh M7 fleet report after Observation formalization"
          git push origin HEAD:audit/m7-phase2-2-observation-formalization-final-20260916
