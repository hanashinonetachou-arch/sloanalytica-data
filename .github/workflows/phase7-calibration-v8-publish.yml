name: Phase 7 Calibration V8 Publish

on:
  push:
    branches:
      - phase7/calibration-v8-publish-20260923
    paths:
      - '.github/workflows/phase7-calibration-v8-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run V8 production-line regression suite
        run: npm run test:v8-production-line
      - name: Publish calibration machines through generic V8 pipeline
        run: |
          npm run machine:v8:publish -- L_LOVEJOU3_M4
          npm run machine:v8:publish -- S_REVUE_STARLIGHT_CX
          npm run machine:v8:publish -- L_MUSHOKU_TENSEI_NM
      - name: Commit generated distribution
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-registry.json \
            machines/L_LOVEJOU3_M4/machine-package.json \
            machines/S_REVUE_STARLIGHT_CX/machine-package.json \
            machines/L_MUSHOKU_TENSEI_NM/machine-package.json
          if git diff --cached --quiet; then
            echo "Calibration distribution already current."
            exit 0
          fi
          git commit -m "publish: calibration Manifest v8 machines"
          git push origin "HEAD:${{ github.ref_name }}"
