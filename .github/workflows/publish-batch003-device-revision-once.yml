name: Publish Batch003 Device Revision Once

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - .github/workflows/publish-batch003-device-revision-once.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish revised 10-machine batch
        run: >-
          npm run machine:publish:batch -- --apply
          L_HIGURASHI_GOU_SS
          L_TOARU_INDEX_JC
          L_GEN_CHOMUGEN_PH
          L_MADOKA_FORTE_UU
          L_KENGAN_ASHURA_ND
          L_RING_NI_KAKERO1_FS
          L_MONKEY_TURN5_CE
          L_MAGICAL_HALLOWEEN8_FE
          L_KEIJI_SADO_ER
          L_BASILISK_KIZUNA2_TENZEN_ZN
      - name: Commit published catalog artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json difficulty-catalog.json machine-registry.json machines reports || true
          if ! git diff --cached --quiet; then
            git commit -m "publish: batch003 device-test revision"
            git push origin HEAD:prototype-multi-machine
          fi
      - name: Deploy prototype Pages explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref prototype-multi-machine
