name: Evidence UI v2 Formal Migration Pilots

on:
  push:
    branches:
      - audit/evidence-ui-v2-phase2-20260914
    paths:
      - research/L_G1_YUSHUN_CLUB_GOLD_KD/selection-data.json
      - research/L_G1_YUSHUN_CLUB_GOLD_KD/machine-observation-data.json
      - research/L_G1_YUSHUN_CLUB_GOLD_KD/ui-design-data.json
      - research/L_EVANGELION_MIRAI_JF/selection-data.json
      - research/L_EVANGELION_MIRAI_JF/machine-observation-data.json
      - research/L_EVANGELION_MIRAI_JF/ui-design-data.json
      - .github/workflows/evidence-ui-v2-g1-gold-formal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formal-migration:
    runs-on: ubuntu-latest
    env:
      MACHINE_IDS: L_G1_YUSHUN_CLUB_GOLD_KD L_EVANGELION_MIRAI_JF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-phase2-20260914
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Selection against Research
        run: |
          for id in $MACHINE_IDS; do
            node tools/validate-selection-data.mjs research/$id/selection-data.json research/$id/research-data.json
          done

      - name: Validate Observation v2
        run: |
          for id in $MACHINE_IDS; do
            node tools/validate-machine-observation-data.mjs research/$id/machine-observation-data.json
          done

      - name: Validate canonical UI Design
        run: node tools/validate-ui-design-data.mjs .

      - name: Audit UI to Observation linkage
        run: node tools/audit-ui-design-observation-linkage.mjs $MACHINE_IDS --strict-v2

      - name: Run four-layer pipeline gate
        run: node tools/four-layer-pipeline-gate.mjs $MACHINE_IDS

      - name: Check MachineData regeneration without writing
        run: |
          for id in $MACHINE_IDS; do
            npm run machine:pipeline -- $id --check --skip-repo-checks
          done

      - name: Materialize formal MachineData
        run: |
          for id in $MACHINE_IDS; do
            npm run machine:pipeline -- $id --skip-repo-checks
          done

      - name: Validate regenerated Evidence UI
        run: node tools/validate-evidence-ui-all.mjs

      - name: Re-run canonical and four-layer gates
        run: |
          node tools/validate-ui-design-data.mjs .
          node tools/audit-ui-design-observation-linkage.mjs $MACHINE_IDS --strict-v2
          node tools/four-layer-pipeline-gate.mjs $MACHINE_IDS

      - name: Verify generated pilot contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function load(id){return JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`,'utf8'));}
          function assert(cond,msg){if(!cond) throw new Error(msg);}

          const gi=load('L_G1_YUSHUN_CLUB_GOLD_KD');
          const giInputs=new Map((gi.inputs?.inputs??[]).map(x=>[x.id,x]));
          assert(!giInputs.has('INP_EVI_SETTING_FLOOR'),'GI Gold legacy setting-floor input remains');
          assert(giInputs.has('INP_EVI_TROPHY'),'GI Gold trophy input missing');
          assert(giInputs.has('INP_EVI_AT_END_SCREEN'),'GI Gold AT end-screen input missing');
          assert((gi.evidence?.evidences??[]).length===7,'GI Gold expected 7 Evidence rules');
          assert(gi.machine?.machineDataVersion==='0.1.1','GI Gold version mismatch');

          const eva=load('L_EVANGELION_MIRAI_JF');
          const evaInputs=new Map((eva.inputs?.inputs??[]).map(x=>[x.id,x]));
          assert(!evaInputs.has('INP_EVI_SETTING_FLOOR'),'Eva legacy setting-floor input remains');
          assert(evaInputs.has('INP_EVI_E_FREEZE_END'),'Eva E-FREEZE end input missing');
          const labels=(evaInputs.get('INP_EVI_E_FREEZE_END')?.options??[]).map(o=>o.label).filter(x=>x!=='未選択');
          assert(JSON.stringify(labels)===JSON.stringify(['リリス','mark.6']),`Eva options mismatch: ${JSON.stringify(labels)}`);
          assert((eva.evidence?.evidences??[]).length===2,'Eva expected 2 Evidence rules');
          assert(eva.machine?.machineDataVersion==='0.1.1','Eva version mismatch');
          const evaUi=(eva.ui?.sections??[]).flatMap(s=>s.items??[]);
          assert(evaUi.some(i=>i.inputId==='INP_EVI_E_FREEZE_END'&&i.label==='E-FREEZE終了画面'),'Eva natural Evidence UI missing');
          console.log('Evidence UI v2 pilot contracts: PASS');
          NODE

      - name: Commit generated artifacts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          for id in $MACHINE_IDS; do
            git add machines/$id/machine-package.json \
                    research/$id/statistics-report.json \
                    research/$id/difficulty-report.json \
                    research/$id/setting-band-report.json || true
          done
          git add catalog.json difficulty-catalog.json machine-registry.json || true
          if git diff --cached --quiet; then
            echo 'No generated artifacts changed.'
            exit 0
          fi
          git commit -m 'evidence-ui: materialize formal pilot migrations'
          git push origin HEAD:audit/evidence-ui-v2-phase2-20260914
