name: Evidence UI v2 GI Gold Formal Migration

on:
  push:
    branches:
      - audit/evidence-ui-v2-phase2-20260914
    paths:
      - research/L_G1_YUSHUN_CLUB_GOLD_KD/selection-data.json
      - research/L_G1_YUSHUN_CLUB_GOLD_KD/machine-observation-data.json
      - research/L_G1_YUSHUN_CLUB_GOLD_KD/ui-design-data.json
      - .github/workflows/evidence-ui-v2-g1-gold-formal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formal-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-phase2-20260914
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Selection against Research
        run: node tools/validate-selection-data.mjs research/L_G1_YUSHUN_CLUB_GOLD_KD/selection-data.json research/L_G1_YUSHUN_CLUB_GOLD_KD/research-data.json

      - name: Validate Observation v2
        run: node tools/validate-machine-observation-data.mjs research/L_G1_YUSHUN_CLUB_GOLD_KD/machine-observation-data.json

      - name: Validate canonical UI Design
        run: node tools/validate-ui-design-data.mjs .

      - name: Audit UI to Observation linkage
        run: node tools/audit-ui-design-observation-linkage.mjs L_G1_YUSHUN_CLUB_GOLD_KD --strict-v2

      - name: Run four-layer pipeline gate
        run: node tools/four-layer-pipeline-gate.mjs L_G1_YUSHUN_CLUB_GOLD_KD

      - name: Check MachineData regeneration without writing
        run: npm run machine:pipeline -- L_G1_YUSHUN_CLUB_GOLD_KD --check --skip-repo-checks

      - name: Materialize formal MachineData
        run: npm run machine:pipeline -- L_G1_YUSHUN_CLUB_GOLD_KD --skip-repo-checks

      - name: Validate regenerated Evidence UI
        run: node tools/validate-evidence-ui-all.mjs

      - name: Re-run canonical and four-layer gates
        run: |
          node tools/validate-ui-design-data.mjs .
          node tools/audit-ui-design-observation-linkage.mjs L_G1_YUSHUN_CLUB_GOLD_KD --strict-v2
          node tools/four-layer-pipeline-gate.mjs L_G1_YUSHUN_CLUB_GOLD_KD

      - name: Verify generated GI Gold contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('machines/L_G1_YUSHUN_CLUB_GOLD_KD/machine-package.json','utf8'));
          const inputs=new Map((pkg.inputs?.inputs??[]).map(x=>[x.id,x]));
          const evidences=pkg.evidence?.evidences??[];
          const uiItems=(pkg.ui?.sections??[]).flatMap(s=>s.items??[]);
          const requiredInputs=['INP_EVI_TROPHY','INP_EVI_AT_END_SCREEN'];
          for(const id of requiredInputs) if(!inputs.has(id)) throw new Error(`missing generated input ${id}`);
          if(inputs.has('INP_EVI_SETTING_FLOOR')) throw new Error('legacy setting-floor input remains');
          const trophy=inputs.get('INP_EVI_TROPHY');
          const end=inputs.get('INP_EVI_AT_END_SCREEN');
          const trophyLabels=(trophy.options??[]).map(o=>o.label).filter(x=>x!=='未選択');
          const endLabels=(end.options??[]).map(o=>o.label).filter(x=>x!=='未選択');
          if(JSON.stringify(trophyLabels)!==JSON.stringify(['銅','銀','金','クローバー柄','虹'])) throw new Error(`unexpected trophy options ${JSON.stringify(trophyLabels)}`);
          if(JSON.stringify(endLabels)!==JSON.stringify(['まこ&アリア','黄金衣装'])) throw new Error(`unexpected end-screen options ${JSON.stringify(endLabels)}`);
          if(evidences.length!==7) throw new Error(`expected 7 evidence rules, got ${evidences.length}`);
          if(!uiItems.some(i=>i.inputId==='INP_EVI_TROPHY'&&i.label==='トロフィー')) throw new Error('trophy UI item missing');
          if(!uiItems.some(i=>i.inputId==='INP_EVI_AT_END_SCREEN'&&i.label==='AT終了画面')) throw new Error('AT end-screen UI item missing');
          if(pkg.machine?.machineDataVersion!=='0.1.1') throw new Error(`unexpected version ${pkg.machine?.machineDataVersion}`);
          console.log('GI Gold formal Evidence UI contract: PASS');
          NODE

      - name: Commit generated artifacts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add machines/L_G1_YUSHUN_CLUB_GOLD_KD/machine-package.json \
                  research/L_G1_YUSHUN_CLUB_GOLD_KD/statistics-report.json \
                  research/L_G1_YUSHUN_CLUB_GOLD_KD/difficulty-report.json \
                  research/L_G1_YUSHUN_CLUB_GOLD_KD/setting-band-report.json \
                  catalog.json difficulty-catalog.json machine-registry.json || true
          if git diff --cached --quiet; then
            echo 'No generated artifacts changed.'
            exit 0
          fi
          git commit -m 'evidence-ui: materialize GI Gold observed evidence groups'
          git push origin HEAD:audit/evidence-ui-v2-phase2-20260914
