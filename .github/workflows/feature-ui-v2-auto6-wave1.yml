name: Feature UI v2 AUTO-6 Wave1

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/apply-feature-ui-v2-auto6-wave1.mjs'
      - '.github/workflows/feature-ui-v2-auto6-wave1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical AUTO-6 wave1
        run: node tools/apply-feature-ui-v2-auto6-wave1.mjs

      - name: Prepare guarded machine batches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave1-a.txt <<'EOF'
          LB_TRIPLE_CROWN_X300
          L_KARAKURI_CIRCUS2_JG
          L_NANGOKU_SPECIAL_M1
          L_SENGOKU_COLLECTION6_KS
          L_TOARU_INDEX2_FA
          L_TONDEMO_SKILL_KM
          L_ULTRAMAN_FINAL_BATTLE_ME
          L_WORLD_DAI_STAR_PA3
          L_YABACHIBA_ZM
          L_YAJIKITA_MAIRU_BG
          EOF
          cat > /tmp/wave1-b.txt <<'EOF'
          S_IM_JUGGLER_EX_TP
          EOF
          test "$(wc -l < /tmp/wave1-a.txt | tr -d ' ')" -le 10
          test "$(wc -l < /tmp/wave1-b.txt | tr -d ' ')" -le 10

      - name: Materialize batch A
        run: npm run machine:batch -- --file /tmp/wave1-a.txt

      - name: Materialize batch B
        run: npm run machine:batch -- --file /tmp/wave1-b.txt

      - name: Run Feature UI v2 read-only audit
        run: node tools/audit-feature-ui-v2-final.mjs --report reports/feature-ui-v2-audit-wave1.json

      - name: Commit canonical and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/ui-design-data.json machines/*/machine-package.json catalog.json difficulty-catalog.json machine-registry.json research/*/statistics-report.json research/*/difficulty-report.json research/*/setting-band-report.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: apply Feature UI v2 AUTO-6 wave1'
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
