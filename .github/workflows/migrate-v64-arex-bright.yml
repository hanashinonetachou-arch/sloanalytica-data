name: Migrate v6.4 AREX Bright Observation

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-arex-bright-observation.mjs'
      - '.github/workflows/migrate-v64-arex-bright.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/migrate-v64-arex-bright-observation.mjs
      - name: Run targeted regressions
        run: node --test --test-concurrency=1 test/selection-policy-migration-audit.test.mjs test/v64-observation-trial-universe-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Run observation audit
        run: node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json
      - name: Run semantic and causal audits
        run: |
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/LB_AREX_BRIGHT_BA/selection-data.json research/LB_AREX_BRIGHT_BA/machine-observation-data.json tools/audit-selection-policy-migration.mjs test/selection-policy-migration-audit.test.mjs reports/v64-observation-trial-universe-audit.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
          git commit -m "audit: migrate AREX Bright observation contract to v2"
          git push
