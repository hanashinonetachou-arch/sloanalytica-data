name: Geass C.C. Policy v2 Fix

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/apply-geass-cc-policy-v2.mjs'
      - '.github/workflows/geass-cc-policy-v2-fix.yml'
      - 'FEATURE_SELECTION_POLICY_V2.md'

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Policy v2 update
        run: node tools/apply-geass-cc-policy-v2.mjs
      - name: Validate Research and Selection
        run: |
          npm run research:validate -- research/S_CODE_GEASS_3_CC_FS/research-data.json
          npm run selection:validate -- research/S_CODE_GEASS_3_CC_FS/selection-data.json research/S_CODE_GEASS_3_CC_FS/research-data.json
      - name: Rebuild C.C.&Kallen
        run: |
          printf '%s\n' S_CODE_GEASS_3_CC_FS > /tmp/machine_ids.txt
          npm run machine:batch -- --file /tmp/machine_ids.txt
      - name: Verify repository and audits
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
          node tools/audit-machine-data-statistics-v3.mjs . reports/machine-data-statistical-audit-after-geass-policy-v2.json reports/machine-data-statistical-audit-after-geass-policy-v2.md
          node tools/audit-feature-selection-policy-v2.mjs
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research machines catalog.json difficulty-catalog.json reports/machine-data-statistical-audit-after-geass-policy-v2.json reports/machine-data-statistical-audit-after-geass-policy-v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: apply Geass C.C. conditional cherry-RB feature'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
