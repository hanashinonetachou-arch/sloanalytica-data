name: Magia Final User Reasons
on:
  push:
    branches: [fix/20260902-magia-user-reasons]
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260902-magia-user-reasons
      - run: npm install
      - run: node tools/apply-magia-final-user-reasons.mjs
      - run: npm run ui-design:validate
      - run: npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
      - run: npm run ui-design:test
      - run: npm test
      - run: npm run audit
      - name: Contract check
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('research/L_MAGIA_RECORD_RN/selection-data.json','utf8'));
          const u=JSON.parse(fs.readFileSync('research/L_MAGIA_RECORD_RN/ui-design-data.json','utf8'));
          const w=s.features.find(f=>f.featureId==='FEAT_WATERMELON_CZ');
          const e=s.features.find(f=>f.featureId==='FEAT_EPISODE_BONUS_TYPE');
          if(!w.userFacingReason.includes('正しい分母') || !w.userFacingReason.includes('さなモード')) throw new Error('watermelon reason');
          if(!e.userReason.includes('黒江') || !e.userReason.includes('サポート')) throw new Error('episode reason');
          if(!u.sections['エピソードボーナス選択率'].description.includes('試行は少なめ')) throw new Error('episode UI reason');
          NODE
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_MAGIA_RECORD_RN machines/L_MAGIA_RECORD_RN catalog.json machine-registry.json difficulty-catalog.json build/L_MAGIA_RECORD_RN 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'docs: clarify Magia adoption reasons [generated]'
            git push
          fi
