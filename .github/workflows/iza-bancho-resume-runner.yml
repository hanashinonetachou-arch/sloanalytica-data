name: Iza Bancho reselection resume runner

on:
  push:
    branches:
      - research/20260903-batch10-next
    paths:
      - '.github/workflows/iza-bancho-resume-runner.yml'

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/20260903-batch10-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch before rebuild
        run: git pull --rebase origin research/20260903-batch10-next
      - name: Extract original multiline run blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/iza-bancho-field-reselection.yml')
          lines=p.read_text().splitlines()
          blocks=[]
          i=0
          while i < len(lines):
              line=lines[i]
              stripped=line.lstrip()
              if stripped == 'run: |':
                  indent=len(line)-len(stripped)
                  i+=1
                  block=[]
                  while i < len(lines):
                      cur=lines[i]
                      if cur.strip() and len(cur)-len(cur.lstrip()) <= indent:
                          break
                      cut=indent+2
                      block.append(cur[cut:] if len(cur)>=cut else '')
                      i+=1
                  blocks.append('\n'.join(block)+'\n')
                  continue
              i+=1
          if len(blocks) < 4:
              raise SystemExit(f'expected at least 4 multiline run blocks, got {len(blocks)}')
          out=Path('/tmp/iza-resume')
          out.mkdir(exist_ok=True)
          for n,b in enumerate(blocks[:3],1):
              (out/f'block{n}.sh').write_text(b)
          print(f'extracted {len(blocks)} multiline run blocks')
          PY
      - name: Apply Iza Bancho reselection
        run: bash -euo pipefail /tmp/iza-resume/block1.sh
      - name: Validate source layers
        run: bash -euo pipefail /tmp/iza-resume/block2.sh
      - name: Rebuild Iza MachineData
        run: npm run machine:batch -- L_IZA_BANCHO_SB8
      - name: Reaudit
        run: bash -euo pipefail /tmp/iza-resume/block3.sh
      - name: Mark PASS
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='reports/iza-bancho-field-reselection.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.status='PASS_REAUDITED';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
      - name: Commit generated changes locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_IZA_BANCHO_SB8 machines/L_IZA_BANCHO_SB8 reports/iza-bancho-field-reselection.json
          git status --short
          if git diff --cached --quiet; then
            echo 'No source changes to commit; reselection may already be present.'
          else
            git commit -m 'research: reselect Iza Bancho from Daito field findings'
          fi
      - name: Rebase onto latest branch
        run: |
          set -euo pipefail
          git fetch origin research/20260903-batch10-next
          git rebase origin/research/20260903-batch10-next
      - name: Push reselection result
        run: git push origin HEAD:research/20260903-batch10-next
