name: Batch 20260910 Next10 Gate E Automated Quality Gate

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - '.github/workflows/batch-20260910-next10-gate-e-quality.yml'
      - 'research/**'
      - 'machines/**'
      - 'batches/20260910-next10-v7/**'
      - 'catalog.json'
      - 'machine-registry.json'
      - 'difficulty-catalog.json'
      - 'package.json'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate-e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Define batch machines
        run: |
          cat > /tmp/gate-e-machines.txt <<'EOF'
          L_YABACHIBA_ZM
          L_NANGOKU_SPECIAL_M1
          L_SENGOKU_COLLECTION6_KS
          L_KARAKURI_CIRCUS2_JG
          L_ULTRAMAN_FINAL_BATTLE_ME
          L_WORLD_DAI_STAR_PA3
          L_YAJIKITA_MAIRU_BG
          L_TONDEMO_SKILL_KM
          LB_TRIPLE_CROWN_X300
          L_TOARU_INDEX2_FA
          EOF

      - name: Registration ID collision audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const batchId='20260910-next10-v7';
          const identity=JSON.parse(fs.readFileSync(`batches/${batchId}/machine-identity-data.json`,'utf8'));
          const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const ids=registry.machines.map(x=>x.provisionalRegistrationId).filter(Number.isInteger);
          const duplicates=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))];
          const max=ids.length?Math.max(...ids):0;
          const existingBatchEntries={};
          const collisions=[];
          const proposedAssignments=[];
          for(const m of identity.machines){
            const proposed=m.temporaryRegistrationId;
            const existing=registry.machines.find(x=>x.machineId===m.machineId);
            if(existing) existingBatchEntries[m.machineId]=existing.provisionalRegistrationId ?? null;
            const owner=registry.machines.find(x=>x.provisionalRegistrationId===proposed && x.machineId!==m.machineId);
            if(owner) collisions.push({machineId:m.machineId,proposed,occupiedBy:owner.machineId});
            proposedAssignments.push({machineId:m.machineId,provisionalRegistrationId:proposed});
          }
          const nextAvailableStart=max+1;
          const expectedStart=Math.min(...proposedAssignments.map(x=>x.provisionalRegistrationId));
          const status=duplicates.length===0 && collisions.length===0 && expectedStart===nextAvailableStart ? 'PASS':'FAIL';
          const out={schemaVersion:'gate-e-registration-id-audit-v1',batchId,status,registryMachineCount:registry.machines.length,assignedNumericCount:ids.length,maxProvisionalRegistrationId:max,duplicateIds:duplicates,existingBatchEntries,proposedAssignments,collisions,nextAvailableStart};
          fs.writeFileSync(`batches/${batchId}/gate-e-registration-id-audit.json`,JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(status!=='PASS') process.exit(1);
          NODE

      - name: Research validation 10/10
        run: |
          while read -r id; do npm run research:validate -- "research/$id/research-data.json"; done < /tmp/gate-e-machines.txt

      - name: Selection validation and strict quality
        run: |
          while read -r id; do npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"; done < /tmp/gate-e-machines.txt
          node tools/audit-selection-quality.mjs $(cat /tmp/gate-e-machines.txt) --strict

      - name: Observation validation and strict linkage
        run: |
          args=(); while read -r id; do args+=("research/$id/machine-observation-data.json"); done < /tmp/gate-e-machines.txt
          npm run observation:validate -- "${args[@]}"
          npm run observation:selection:audit -- $(cat /tmp/gate-e-machines.txt) --strict-v2

      - name: UI Design and four-layer linkage
        run: |
          npm run ui-design:validate
          npm run ui-design:linkage:audit -- . $(cat /tmp/gate-e-machines.txt)
          npm run ui-design:observation:audit -- $(cat /tmp/gate-e-machines.txt) --strict-v2
          npm run pipeline:four-layer:gate -- $(cat /tmp/gate-e-machines.txt)

      - name: Canonical UI materialization unchanged
        run: |
          for id in $(cat /tmp/gate-e-machines.txt); do
            cp "machines/$id/machine-package.json" "/tmp/$id.before.json"
            node tools/materialize-ui-design-into-machine-package.mjs "machines/$id/machine-package.json" "research/$id/ui-design-data.json"
            diff -u "/tmp/$id.before.json" "machines/$id/machine-package.json"
          done

      - name: Repository UX and difficulty contracts
        run: |
          npm run ui-design:test
          npm run difficulty:event-exposure:test
          npm run difficulty:exposure-audit
          npm run audit:ui-service-names
          npm run ux-contract:audit

      - name: Registry consistency
        run: npm run registry:validate

      - name: Repository-wide tests and public-data audit
        run: |
          npm test
          npm run audit

      - name: Generated artifact drift check
        run: |
          git restore -- reports/v64-observation-debt-classification.json 2>/dev/null || true
          git diff --exit-code -- research machines catalog.json machine-registry.json difficulty-catalog.json

      - name: Write Gate E report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='batches/20260910-next10-v7/gate-e-quality-report.json';
          const out={schemaVersion:'gate-e-quality-report-v1',batchId:'20260910-next10-v7',machineCount:10,status:'PASS',registrationIdAudit:'PASS',researchValidation:'PASS',selectionValidation:'PASS',selectionQuality:'PASS',observationValidation:'PASS',fourLayerGate:'PASS',canonicalUiDrift:'PASS',uxContracts:'PASS',registryValidation:'PASS',repositoryTests:'PASS',publicDataAudit:'PASS',publish:'NOT_RUN'};
          fs.writeFileSync(p,JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Commit Gate E audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batches/20260910-next10-v7/gate-e-registration-id-audit.json batches/20260910-next10-v7/gate-e-quality-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'gate-e: record 20260910 Next10 quality audit'
          git push origin HEAD:batch/20260910-next10-gate0-v2
