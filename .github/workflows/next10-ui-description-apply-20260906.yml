name: Next10 UI Description Apply 20260906
on:
  push:
    branches: [fix/next10-ui-description-dedupe-20260906]
    paths:
      - 'tools/apply-next10-ui-description-dedupe.mjs'
      - 'tools/materialize-ui-design.mjs'
      - 'tools/validate-ui-design-data.mjs'
      - '.github/workflows/next10-ui-description-apply-20260906.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply section-owned descriptions
        run: node tools/apply-next10-ui-description-dedupe.mjs
      - name: Validate all UI Design
        run: node tools/validate-ui-design-data.mjs .
      - name: Regenerate Next10
        run: |
          for id in L_AZURLANE_THE_ANIMATION_KN L_DRUAGA_NO_TOU_ZA L_SMASLO_TOKYO_REVENGERS_ZF L_BABEL_BA L_SHIN_ONIMUSHA_3_SA L_ZENIGATA_5_L2 L_TOARU_KAGAKU_NO_RAILGUN_2_FV L_ZETTAI_SHOGEKI_FORCE_FH L_KAKUMEIKI_VALVRAVE_2_JF L_NEO_PLANET_SLED; do
            npm run machine:pipeline -- "$id" --skip-repo-checks
          done
      - name: Verify suppression contract in generated packages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_AZURLANE_THE_ANIMATION_KN','L_DRUAGA_NO_TOU_ZA','L_SMASLO_TOKYO_REVENGERS_ZF','L_BABEL_BA','L_SHIN_ONIMUSHA_3_SA','L_ZENIGATA_5_L2','L_TOARU_KAGAKU_NO_RAILGUN_2_FV','L_ZETTAI_SHOGEKI_FORCE_FH','L_KAKUMEIKI_VALVRAVE_2_JF','L_NEO_PLANET_SLED'];
          for(const id of ids){
            const ui=JSON.parse(fs.readFileSync(`research/${id}/ui-design-data.json`));
            const pkg=JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`));
            const inputs=new Map(pkg.inputs.inputs.map(x=>[x.id,x]));
            for(const title of ui.sectionOrder){
              const s=ui.sections[title];
              if(s.suppressInputDescriptions!==true) continue;
              if(!s.description) throw new Error(`${id}/${title}: section description missing`);
              for(const inputId of s.inputIds){
                if(inputs.get(inputId)?.description) throw new Error(`${id}/${title}/${inputId}: repeated input description remains`);
              }
            }
          }
          console.log('PASS: section-owned descriptions suppress repeated per-input text.');
          NODE
      - name: Repository tests and audit
        run: |
          npm test
          npm run audit
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research machines catalog.json difficulty-catalog.json machine-registry.json tools/materialize-ui-design.mjs tools/validate-ui-design-data.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'ui: deduplicate Next10 measurement descriptions'
            git push
          fi
