name: Batch012 Research Gate
on:
  push:
    branches:
      - production/v85-batch-012-research-20261012
    paths:
      - .github/workflows/batch012-research-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate staged research against production contract
        working-directory: production
        run: node --experimental-strip-types src/check-batch012-research.ts
