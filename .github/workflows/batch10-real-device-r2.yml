name: Batch10 Real-device Review R2

on:
  push:
    branches: [fix/batch10-real-device-r2]
    paths:
      - 'tools/apply-batch10-real-device-r2.mjs'
      - 'tools/reconcile-batch10-difficulty-r2.mjs'
      - '.github/workflows/batch10-real-device-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch10-real-device-r2
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch10-real-device-r2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile Difficulty after applied real-device corrections
        run: node tools/reconcile-batch10-difficulty-r2.mjs
      - name: Validate Selection
        shell: bash
        run: |
          set -euo pipefail
          IDS=(L_MAGIA_RECORD_RN L_GODZILLA_NS L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2 L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORIDON_VIVA_REVIVAL_FY L_GUNDAM_SEED_G)
          for id in "${IDS[@]}"; do npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"; done
      - name: Validate Observation and UI
        shell: bash
        run: |
          set -euo pipefail
          IDS=(L_MAGIA_RECORD_RN L_GODZILLA_NS L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2 L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORIDON_VIVA_REVIVAL_FY L_GUNDAM_SEED_G)
          for id in "${IDS[@]}"; do npm run observation:validate -- "research/$id/machine-observation-data.json"; npm run ui-design:validate -- "research/$id/ui-design-data.json"; done
      - name: Regenerate all 10 packages and difficulty outputs
        run: npm run machine:batch -- L_MAGIA_RECORD_RN L_GODZILLA_NS L_USHIO_TORA_HAKUMEN_VH L_AMAZING_LIVE_PD L_YOSHIMUNE_SC2 L_MAHJONG_MONOGATARI_S2 L_IDOLMASTER_MILLION_LIVE_HC L_YOUJITSU_DE L_MIDORIDON_VIVA_REVIVAL_FY L_GUNDAM_SEED_G
      - name: Audit difficulty computability
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ids=['L_MAGIA_RECORD_RN','L_GODZILLA_NS','L_USHIO_TORA_HAKUMEN_VH','L_AMAZING_LIVE_PD','L_YOSHIMUNE_SC2','L_MAHJONG_MONOGATARI_S2','L_IDOLMASTER_MILLION_LIVE_HC','L_YOUJITSU_DE','L_MIDORIDON_VIVA_REVIVAL_FY','L_GUNDAM_SEED_G'];
          const rows=ids.map(id=>{const r=JSON.parse(fs.readFileSync(`research/${id}/difficulty-report.json`,'utf8')); return {machineId:id,status:r.status,targetGameBasis:r.targetGameBasis,targets:r.targets??[],coverage:r.coverage};});
          fs.mkdirSync('reports',{recursive:true}); fs.writeFileSync('reports/batch10-difficulty-computability.json',JSON.stringify({generatedAt:new Date().toISOString(),rows},null,2)+'\n');
          for(const r of rows) console.log(r.machineId,r.status,(r.targets??[]).map(x=>`${x.games}:${x.score}`).join(','));
          for(const must of ['L_MAGIA_RECORD_RN','L_MIDORIDON_VIVA_REVIVAL_FY']) { const r=rows.find(x=>x.machineId===must); if(r.status!=='COMPLETE'||r.targets.length!==3) throw new Error(`${must}: expected computable Difficulty after Observation reconciliation`); }
          for(const r of rows.filter(x=>x.status!=='COMPLETE')) {
            const stale=(r.coverage?.explicitlyExcludedNumericFeatures??[]).some(x=>String(x.reason).includes('Observationで実戦時'));
            if(stale) throw new Error(`${r.machineId}: stale pre-Observation Difficulty exclusion reason remains`);
          }
          NODE
      - name: Latest-manifest semantic audit
        run: node tools/audit-batch8-latest-manifest.mjs
      - name: Full tests and public-data audit
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Commit validated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_MAGIA_RECORD_RN research/L_GODZILLA_NS research/L_USHIO_TORA_HAKUMEN_VH research/L_AMAZING_LIVE_PD research/L_YOSHIMUNE_SC2 research/L_MAHJONG_MONOGATARI_S2 research/L_IDOLMASTER_MILLION_LIVE_HC research/L_YOUJITSU_DE research/L_MIDORIDON_VIVA_REVIVAL_FY research/L_GUNDAM_SEED_G machines/L_MAGIA_RECORD_RN machines/L_GODZILLA_NS machines/L_USHIO_TORA_HAKUMEN_VH machines/L_AMAZING_LIVE_PD machines/L_YOSHIMUNE_SC2 machines/L_MAHJONG_MONOGATARI_S2 machines/L_IDOLMASTER_MILLION_LIVE_HC machines/L_YOUJITSU_DE machines/L_MIDORIDON_VIVA_REVIVAL_FY machines/L_GUNDAM_SEED_G catalog.json difficulty-catalog.json machine-registry.json reports/batch10-difficulty-computability.json reports/batch8-latest-manifest-audit.json reports/batch-machine-pipeline-report.json 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'fix: reconcile batch10 Difficulty after observation'
          git push origin HEAD:fix/batch10-real-device-r2
