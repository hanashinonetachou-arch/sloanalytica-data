name: Batch Selection Pipeline Regression

on:
  pull_request:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/batch-selection-pipeline.mjs'
      - 'test/batch-selection-pipeline.test.mjs'
      - 'package.json'
      - '.github/workflows/batch-selection-pipeline-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Verify existing selections batch cleanly
        run: npm run selection:batch -- L_ANOTHER_RINO_HEAVEN_CC L_TOKYO_GHOUL --check
      - name: Verify Batch Selection help
        run: npm run selection:batch -- --help
