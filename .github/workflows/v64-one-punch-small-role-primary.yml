name: v6.4 One Punch Man Small Role Primary

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-one-punch-small-role-primary.mjs'
      - 'test/one-punch-small-role-primary.test.mjs'
      - 'tools/audit-v64-causal-relations.mjs'
      - 'test/v64-causal-relation-audit.test.mjs'
      - '.github/workflows/v64-one-punch-small-role-primary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run migration
        run: node tools/migrate-v64-one-punch-small-role-primary.mjs .
      - name: Apply migration
        run: node tools/migrate-v64-one-punch-small-role-primary.mjs . --apply
      - name: Run focused regression
        run: node --test test/one-punch-small-role-primary.test.mjs
      - name: Rebuild One Punch Man package
        run: npm run machine:pipeline -- L_ONE_PUNCH_MAN --skip-repo-checks
      - name: Refresh semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Refresh causal review
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Run causal regression
        run: node --test test/v64-causal-relation-audit.test.mjs
      - name: Assert One Punch Man leaves causal review
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const semantic=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=semantic.machines.find(x=>x.machineId==='L_ONE_PUNCH_MAN');
          const causal=(m?.issues??[]).filter(x=>x.code==='CAUSAL_RELATION_REJECT_CANDIDATE');
          if(causal.length) throw new Error(`One Punch Man still has ${causal.length} causal candidate(s)`);
          const causalReport=JSON.parse(fs.readFileSync('reports/v64-causal-relation-review.json','utf8'));
          if(causalReport.summary.candidateCount!==13 || causalReport.summary.machineCount!==3) throw new Error(`unexpected causal baseline ${JSON.stringify(causalReport.summary)}`);
          console.log('PASS One Punch Man causal resolution');
          NODE
      - name: Assert generated package uses small-role primary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p='machines/L_ONE_PUNCH_MAN/machine-package.json';
          if(!fs.existsSync(p)) throw new Error(`${p} missing`);
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          const text=JSON.stringify(m);
          if(!text.includes('FEAT_SMALL_ROLE_MULTI')) throw new Error('generated package missing FEAT_SMALL_ROLE_MULTI');
          if(!text.includes('INP_WEAK_CHERRY') || !text.includes('INP_WATERMELON')) throw new Error('generated package missing small-role inputs');
          console.log('PASS generated small-role surface');
          NODE
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Run Observation linkage target check
        run: |
          set +e
          npm run observation:selection:audit 2>&1 | tee /tmp/observation-linkage.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '^ERROR: L_ONE_PUNCH_MAN:' /tmp/observation-linkage.log; then
            echo 'One Punch Man introduced an Observation -> Selection linkage error.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Global Observation linkage audit still has pre-existing errors outside this batch; recorded as REVIEW.'
          fi
      - name: Show diff
        run: |
          git status --short
          git --no-pager diff --stat
          git --no-pager diff -- research/L_ONE_PUNCH_MAN/selection-data.json machines/L_ONE_PUNCH_MAN catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_ONE_PUNCH_MAN machines/L_ONE_PUNCH_MAN catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "fix: make One Punch Man small roles primary"
            git push origin HEAD:prototype-multi-machine
          fi
