name: Temp Run 20260822 Ryujin D4DJ
on:
  push:
    branches: [work/manifest-v4-batch-ryujin-d4dj]
permissions:
  contents: write
jobs:
  generate-and-persist:
    if: ${{ !contains(github.event.head_commit.message, '[generated-batch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/manifest-v4-batch-ryujin-d4dj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate research batch
        run: node tools/apply-user-batch-20260822-ryujin-d4dj.mjs
      - name: Persist research inputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research reports
          git diff --cached --quiet || git commit -m "data: persist 20260822 research batch [generated-batch]"
          git push origin HEAD:work/manifest-v4-batch-ryujin-d4dj
