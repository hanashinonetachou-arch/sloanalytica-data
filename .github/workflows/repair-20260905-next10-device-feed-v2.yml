name: Repair 20260905 Next10 Device Feed v2

on:
  push:
    branches:
      - publish/20260905-next10
    paths:
      - '.github/workflows/repair-20260905-next10-device-feed-v2.yml'

permissions:
  contents: write

jobs:
  repair-feed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current isolated publish branch
        uses: actions/checkout@v4
        with:
          ref: publish/20260905-next10
          fetch-depth: 0
      - name: Checkout prior verified device-feed branch
        uses: actions/checkout@v4
        with:
          ref: batch/20260904-next10-clean
          path: prior
          fetch-depth: 1
      - name: Build cumulative 220-machine device feed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const currentIds=[
            'L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN',
            'LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT',
            'L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'
          ];
          const mustKeep=['L_BIOHAZARD5_ZE','L_SISTER_QUEST_CA','L_HANAGASA_NA','L_ULTRAMAN_KE'];
          const branch='publish/20260905-next10';
          const rawBase=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/${branch}`;

          const prior=JSON.parse(fs.readFileSync('prior/device-test/20260903/catalog.json','utf8'));
          const latest=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          if(!Array.isArray(prior.machines)||!Array.isArray(latest.machines)) throw new Error('catalog schema invalid');
          const priorIds=new Set(prior.machines.map(x=>x.machineId));
          console.log(`prior verified device baseline count=${priorIds.size}`);
          if(priorIds.size!==210) throw new Error(`expected prior verified baseline=210, got ${priorIds.size}`);
          for(const id of mustKeep) if(!priorIds.has(id)) throw new Error(`${id}: missing from prior verified baseline`);
          for(const id of currentIds) if(priorIds.has(id)) throw new Error(`${id}: unexpectedly already present in prior baseline`);

          const additions=currentIds.map(id=>{
            const e=latest.machines.find(x=>x.machineId===id);
            if(!e||e.status!=='available') throw new Error(`${id}: latest current-batch catalog entry missing`);
            return {...e,packageUrl:`${rawBase}/machines/${id}/machine-package.json`};
          });
          const machines=[...additions,...prior.machines];
          const unique=new Set(machines.map(x=>x.machineId));
          if(machines.length!==220||unique.size!==220) throw new Error(`expected 220 machines, got ${machines.length}/${unique.size}`);

          const out={...prior,generatedAt:new Date().toISOString(),difficultyCatalogUrl:`${rawBase}/device-test/20260905-next10/difficulty-catalog.json`,machines};
          fs.mkdirSync('device-test/20260905-next10',{recursive:true});
          fs.writeFileSync('device-test/20260905-next10/catalog.json',JSON.stringify(out,null,2)+'\n');

          const priorDiff=JSON.parse(fs.readFileSync('prior/device-test/20260903/difficulty-catalog.json','utf8'));
          const latestDiff=JSON.parse(fs.readFileSync('difficulty-catalog.json','utf8'));
          const priorEntries=Array.isArray(priorDiff.entries)?priorDiff.entries:[];
          const latestEntries=Array.isArray(latestDiff.entries)?latestDiff.entries:[];
          const currentSet=new Set(currentIds);
          const addDiff=currentIds.map(id=>{
            const e=latestEntries.find(x=>x.machineId===id);
            if(!e) throw new Error(`${id}: latest difficulty entry missing`);
            return e;
          });
          const diffOut={...priorDiff,generatedAt:new Date().toISOString(),entries:[...addDiff,...priorEntries.filter(x=>!currentSet.has(x.machineId))]};
          fs.writeFileSync('device-test/20260905-next10/difficulty-catalog.json',JSON.stringify(diffOut,null,2)+'\n');

          console.log('PASS: prior verified 210 + current next10 = 220 unique machines.');
          console.log('PASS: Biohazard 5 / Sister Quest / prior Sep03 batch retained.');
          NODE
      - name: Commit repaired cumulative feed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prior
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add device-test/20260905-next10/catalog.json device-test/20260905-next10/difficulty-catalog.json
          git commit -m 'fix: restore prior 210 machines before next10 device verification'
          git push origin HEAD:publish/20260905-next10
