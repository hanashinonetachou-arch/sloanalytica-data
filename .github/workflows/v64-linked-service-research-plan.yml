name: v6.4 Linked Service Research Plan
on:
  workflow_dispatch:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/plan-v64-linked-service-research.mjs'
      - 'reports/v64-observation-debt-classification.json'
      - '.github/workflows/v64-linked-service-research-plan.yml'
permissions:
  contents: write
concurrency:
  group: v64-linked-service-research-plan
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prototype-multi-machine}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/plan-v64-linked-service-research.mjs
      - name: Refresh and commit report from latest branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin prototype-multi-machine
          git reset --hard origin/prototype-multi-machine
          node tools/plan-v64-linked-service-research.mjs
          git add reports/v64-linked-service-research-plan.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: update linked-service research plan"
            git push origin HEAD:prototype-multi-machine
          fi
