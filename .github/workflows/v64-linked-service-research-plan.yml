name: v6.4 Linked Service Research Plan
on:
  workflow_dispatch:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/plan-v64-linked-service-research.mjs'
      - 'reports/v64-observation-debt-classification.json'
      - '.github/workflows/v64-linked-service-research-plan.yml'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prototype-multi-machine}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/plan-v64-linked-service-research.mjs
      - name: Commit report
        run: |
          if [ -z "$(git status --porcelain -- reports/v64-linked-service-research-plan.json)" ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v64-linked-service-research-plan.json
          git commit -m "audit: update linked-service research plan"
          git pull --rebase origin prototype-multi-machine
          git push origin HEAD:prototype-multi-machine
