name: Batch007 10-Machine Integration Boundary

on:
  push:
    branches:
      - production/v85-batch-007-foundation-20261007
    paths:
      - production/.batch007-integration-trigger
      - .github/workflows/batch007-integration.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: batch007-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-007-foundation-20261007
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bootstrap Batch 007 and validate foundation
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/bootstrap-batch007.ts
          npm test

      - name: Materialize Wave 1 Research and advance through App Runtime
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261007-007 wave-1
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261007-007 --through APP_RUNTIME
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261007-007

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Publish Wave 1 packages
        shell: bash
        run: |
          set -euo pipefail
          MACHINES="L_HANAGASA_NA L_TOLOVE_DARKNESS_S8 LB_PREMIUM_UMAIBO_S1 LB_NEW_PULSAR_BT_C9 L_DMC5_ST_XA"
          MACHINES="$MACHINES" node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261007-007',machines=process.env.MACHINES.split(/\s+/).filter(Boolean);
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json'),catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x])),sha=b=>crypto.createHash('sha256').update(b).digest('hex'),metadata={};
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package,entry=byId.get(machineId); if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;pkg.machine.machineType=entry.machineType;pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            const target=path.join(proto,'machines',machineId,'machine-package.json');fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);
            const caps=[];for(const f of pkg.features?.features??[]){const model=String(f.modelType??'').toLowerCase();if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');}
            if((pkg.evidence?.references??[]).length&&!caps.includes('evidence'))caps.push('evidence');
            entry.machineDataVersion=pkg.machine.machineDataVersion;entry.sha256=sha(bytes);entry.packageSizeBytes=bytes.length;entry.requiredCapabilities=caps;entry.updatedAt=new Date().toISOString();
            metadata[machineId]={machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:bytes.length,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType};
          }
          catalog.generatedAt=new Date().toISOString();fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch007-wave1-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          cd prototype
          npm run ux-contract:audit
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machines/L_HANAGASA_NA/machine-package.json machines/L_TOLOVE_DARKNESS_S8/machine-package.json machines/LB_PREMIUM_UMAIBO_S1/machine-package.json machines/LB_NEW_PULSAR_BT_C9/machine-package.json machines/L_DMC5_ST_XA/machine-package.json
          git commit -m "Publish Batch 007 Wave 1 [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "WAVE1_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Wave 1 data pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$WAVE1_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "WAVE1_PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Finalize Wave 1 Distribution
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');const metadata=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch007-wave1-metadata.json','utf8'));
          for(const x of Object.values(metadata)){x.packagePath='machines/'+x.machineId+'/machine-package.json';}
          const doc={batchId:'batch-20261007-007',integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.WAVE1_COMMIT,packagePath:'',catalogPath:'catalog.json'},packages:metadata,checks:{catalogIntegrity:true,pagesDeployment:{runId:Number(process.env.WAVE1_PAGES_RUN_ID),conclusion:'success'},uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}}};
          fs.writeFileSync(path.resolve('production-state/production/batches/batch-20261007-007/distribution-repair-attestation.json'),JSON.stringify(doc,null,2)+'\n');
          NODE
          cd production-state/production
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261007-007 --through DISTRIBUTION
          npm test

      - name: Materialize Wave 2 Research and advance through App Runtime
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261007-007 wave-2
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261007-007 --through APP_RUNTIME
          npm test

      - name: Publish Wave 2 packages
        shell: bash
        run: |
          set -euo pipefail
          MACHINES="LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 L_GUILTY_CROWN_2_XF L_ULTRAMAN_KE L_MAGIA_RECORD_RN"
          MACHINES="$MACHINES" node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261007-007',machines=process.env.MACHINES.split(/\s+/).filter(Boolean);
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json'),catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x])),sha=b=>crypto.createHash('sha256').update(b).digest('hex'),metadata={};
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package,entry=byId.get(machineId); if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;pkg.machine.machineType=entry.machineType;pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            const target=path.join(proto,'machines',machineId,'machine-package.json');fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);
            const caps=[];for(const f of pkg.features?.features??[]){const model=String(f.modelType??'').toLowerCase();if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');}
            if((pkg.evidence?.references??[]).length&&!caps.includes('evidence'))caps.push('evidence');
            entry.machineDataVersion=pkg.machine.machineDataVersion;entry.sha256=sha(bytes);entry.packageSizeBytes=bytes.length;entry.requiredCapabilities=caps;entry.updatedAt=new Date().toISOString();
            metadata[machineId]={machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:bytes.length,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType};
          }
          catalog.generatedAt=new Date().toISOString();fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch007-wave2-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          cd prototype
          npm run ux-contract:audit
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machines/LB_1000CHAN_ALPHA_L3/machine-package.json machines/LB_JACKPOT_CY1/machine-package.json machines/L_GUILTY_CROWN_2_XF/machine-package.json machines/L_ULTRAMAN_KE/machine-package.json machines/L_MAGIA_RECORD_RN/machine-package.json
          git commit -m "Publish Batch 007 Wave 2 [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "WAVE2_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Wave 2 data pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$WAVE2_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "WAVE2_PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Finalize Wave 2 Distribution and authoritative state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');const metadata=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch007-wave2-metadata.json','utf8'));
          const doc={batchId:'batch-20261007-007',integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.WAVE2_COMMIT,packagePath:'',catalogPath:'catalog.json'},packages:metadata,checks:{catalogIntegrity:true,pagesDeployment:{runId:Number(process.env.WAVE2_PAGES_RUN_ID),conclusion:'success'},uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}}};
          fs.writeFileSync(path.resolve('production-state/production/batches/batch-20261007-007/distribution-repair-attestation.json'),JSON.stringify(doc,null,2)+'\n');
          NODE
          cd production-state/production
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261007-007 --through DISTRIBUTION
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261007-007

      - name: Commit authoritative Batch 007 state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-007-foundation-20261007
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261007-007
          git commit -m "Advance Batch 007 through Distribution [skip ci]"
          git push origin HEAD:production/v85-batch-007-foundation-20261007
