name: Feature UI v2 explicit KEEP-12 Wave3

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'tools/apply-feature-ui-v2-explicit12-wave3.mjs'
      - '.github/workflows/feature-ui-v2-explicit12-wave3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply explicit KEEP-12 wave3
        run: node tools/apply-feature-ui-v2-explicit12-wave3.mjs

      - name: Prepare guarded machine batch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave3.txt <<'EOF'
          L_SMASLO_BAKEMONOGATARI_KH
          L_ULTRAMAN_TIGA_KA
          S_KABANERI_ZR
          S_NAMENEKO_QQ
          EOF
          test "$(wc -l < /tmp/wave3.txt | tr -d ' ')" -le 10

      - name: Materialize machines
        run: npm run machine:batch -- --file /tmp/wave3.txt

      - name: Run Feature UI v2 read-only audit
        run: node tools/audit-feature-ui-v2-final.mjs --report reports/feature-ui-v2-audit-wave3.json

      - name: Commit canonical and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/ui-design-data.json machines/*/machine-package.json catalog.json difficulty-catalog.json machine-registry.json research/*/statistics-report.json research/*/difficulty-report.json research/*/setting-band-report.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make remaining Feature UI v2 KEEP-12 spans explicit'
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
