name: Magia Reaudit Generated Artifacts

on:
  push:
    branches:
      - fix/20260901-magia-selection-reaudit
    paths:
      - .github/workflows/magia-reaudit-generated-artifacts.yml

permissions:
  contents: write

jobs:
  generate-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260901-magia-selection-reaudit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run machine pipeline
        run: npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
      - name: Full tests
        run: npm test
      - name: Repository audit
        run: npm run audit
      - name: Persist tracked generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if [ -d build/L_MAGIA_RECORD_RN ]; then git add build/L_MAGIA_RECORD_RN; fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "build: regenerate magia after selection reaudit"
            git push origin HEAD:fix/20260901-magia-selection-reaudit
          fi
          git status --short
