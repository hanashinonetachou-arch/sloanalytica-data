name: MachineData Statistical Audit

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'machines/**'
      - 'research/**/research-data.json'
      - 'research/**/selection-data.json'
      - 'tools/audit-machine-data-statistics-v3.mjs'
      - '.github/workflows/machine-data-health-audit.yml'
  workflow_dispatch:

jobs:
  statistical-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run statistical MachineData audit
        run: node tools/audit-machine-data-statistics-v3.mjs . reports/machine-data-statistical-audit-v3.json reports/machine-data-statistical-audit-v3.md
      - name: Show report summary
        run: cat reports/machine-data-statistical-audit-v3.md
      - name: Upload statistical audit report
        uses: actions/upload-artifact@v4
        with:
          name: machine-data-statistical-audit-v3
          path: |
            reports/machine-data-statistical-audit-v3.json
            reports/machine-data-statistical-audit-v3.md
