name: Temp Batch 20260827 Gate

on:
  push:
    branches:
      - prototype-multi-machine
    paths:
      - '.github/workflows/temp-batch-20260827-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Observation validate
        run: npm run observation:validate
      - name: Selection to Observation linkage
        run: npm run observation:selection:audit -- S_ANOTHER_GOD_HADES_SL S_SLODOL_PK S_OVERLORD_II_SX S_GUNDAM_UNICORN_SF S_SENGOKU_COLLECTION5_PS L_CHO_HANAMATSURI_PB L_DOUBLE_ATTACK2_EX L_LUPIN_DAIKOUKAISHA_H1 L_MOMOTARO_DENTETSU_TEIBAN_PU L_SMASLO_DUNBINE_MF --strict-v2
      - name: UI validate
        run: npm run ui-design:validate
      - name: UI to Selection linkage
        run: npm run ui-design:linkage:audit
      - name: UI to Observation linkage
        run: npm run ui-design:observation:audit -- S_ANOTHER_GOD_HADES_SL S_SLODOL_PK S_OVERLORD_II_SX S_GUNDAM_UNICORN_SF S_SENGOKU_COLLECTION5_PS L_CHO_HANAMATSURI_PB L_DOUBLE_ATTACK2_EX L_LUPIN_DAIKOUKAISHA_H1 L_MOMOTARO_DENTETSU_TEIBAN_PU L_SMASLO_DUNBINE_MF --strict-v2
      - name: Four layer gate
        run: npm run pipeline:four-layer:gate -- S_ANOTHER_GOD_HADES_SL S_SLODOL_PK S_OVERLORD_II_SX S_GUNDAM_UNICORN_SF S_SENGOKU_COLLECTION5_PS L_CHO_HANAMATSURI_PB L_DOUBLE_ATTACK2_EX L_LUPIN_DAIKOUKAISHA_H1 L_MOMOTARO_DENTETSU_TEIBAN_PU L_SMASLO_DUNBINE_MF
      - name: Batch machine pipeline CHECK
        run: npm run machine:batch -- S_ANOTHER_GOD_HADES_SL S_SLODOL_PK S_OVERLORD_II_SX S_GUNDAM_UNICORN_SF S_SENGOKU_COLLECTION5_PS L_CHO_HANAMATSURI_PB L_DOUBLE_ATTACK2_EX L_LUPIN_DAIKOUKAISHA_H1 L_MOMOTARO_DENTETSU_TEIBAN_PU L_SMASLO_DUNBINE_MF --check
