name: Apply 20260907 Machine Identity Batch 25

on:
  push:
    branches:
      - batch/20260907-next10-publish
    paths:
      - .github/workflows/apply-20260907-machine-identity-batch25.yml
      - reports/machine-identity-classification-audit.json
      - reports/machine-identity-classification-batch-25.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-publish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply canonical machine identity metadata
        run: node tools/apply-machine-identity-classification.mjs --apply

      - name: Verify generated identity metadata
        run: node tools/apply-machine-identity-classification.mjs --verify

      - name: Assert mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Generated changes:\n%s\n' "${changed[*]}"
          allowed=(
            catalog.json
            machine-identity-metadata.json
            machines/L_AKUDAMA_DRIVE_TP/machine-package.json
            machines/L_FIRE_FORCE_2/machine-package.json
            machines/L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA/machine-package.json
            machines/L_JORMUNGAND_ND01G/machine-package.json
            machines/L_KABANERI_UNATO_KESSEN_XX/machine-package.json
            machines/L_KYOKOU_SUIRI_ST/machine-package.json
            machines/L_MILLION_GOD_KISEKI_CX/machine-package.json
            machines/L_SHINUCHI_YOSHIMUNE_A1/machine-package.json
            machines/L_UMINEKO_2_A1/machine-package.json
            machines/LB_TRIPLE_CROWN_SEVEN_FG/machine-package.json
          )
          for file in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fxq "$file" || {
              echo "Unexpected generated mutation: $file" >&2
              exit 1
            }
          done
          for file in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file" || {
              echo "Expected generated mutation missing: $file" >&2
              exit 1
            }
          done

      - name: Repository validation
        run: |
          npm test
          npm run audit

      - name: Commit generated identity synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json machine-identity-metadata.json \
            machines/L_AKUDAMA_DRIVE_TP/machine-package.json \
            machines/L_FIRE_FORCE_2/machine-package.json \
            machines/L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA/machine-package.json \
            machines/L_JORMUNGAND_ND01G/machine-package.json \
            machines/L_KABANERI_UNATO_KESSEN_XX/machine-package.json \
            machines/L_KYOKOU_SUIRI_ST/machine-package.json \
            machines/L_MILLION_GOD_KISEKI_CX/machine-package.json \
            machines/L_SHINUCHI_YOSHIMUNE_A1/machine-package.json \
            machines/L_UMINEKO_2_A1/machine-package.json \
            machines/LB_TRIPLE_CROWN_SEVEN_FG/machine-package.json
          git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 1; }
          git commit -m 'Synchronize machine identity metadata for 20260907 Next10'
          git push origin HEAD:batch/20260907-next10-publish
