name: v6.5 Research Completeness User10 Backfill

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/backfill-v65-research-completeness-user10.mjs'
      - '.github/workflows/v65-research-completeness-user10-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v65-research-completeness-user10-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backfill Research Completeness v2
        run: node tools/backfill-v65-research-completeness-user10.mjs
      - name: Validate Gate 0 and Research Completeness v2
        run: |
          node tools/discovery-completeness-gate.mjs \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateResearchCompleteness } from './tools/batch-completeness-gates.mjs';
          const ids = [
            'S_YOUJO_SENKI_ZR','S_HAIYORE_NYARUKO_SAN_Y','S_TOARU_RAILGUN_FB',
            'S_TEKKEN4_ULTIMATE_DEVIL_TCD','S_DANMACHI_GAIDEN_XR','S_MAHOIKU_NB',
            'L_SHIMAMUSUME_L2','L_SUPER_BLACKJACK_SLDC','L_SHAMANKING_SS','L_ARIFURETA_JA'
          ];
          let failed = false;
          for (const id of ids) {
            const r = JSON.parse(fs.readFileSync(`research/${id}/research-data.json`, 'utf8'));
            const v = validateResearchCompleteness(r, { required: true, minimumPolicyVersion: 2 });
            console.log(`${id}: ${v.ok ? 'PASS' : 'FAIL'} unresolved=${v.unresolved.length}`);
            for (const e of v.errors) { failed = true; console.error(`${id}: ${e}`); }
          }
          if (failed) process.exit(1);
          NODE
      - name: Validate scoped Research Selection Observation
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateSelectionData } from './tools/validate-selection-data.mjs';
          import { validateObservationObject } from './tools/validate-machine-observation-data.mjs';
          import { validateSelectionEvidenceCoverage } from './tools/batch-completeness-gates.mjs';
          import { assessSelectionQuality } from './tools/selection-quality-gate.mjs';
          const ids = [
            'S_YOUJO_SENKI_ZR','S_HAIYORE_NYARUKO_SAN_Y','S_TOARU_RAILGUN_FB',
            'S_TEKKEN4_ULTIMATE_DEVIL_TCD','S_DANMACHI_GAIDEN_XR','S_MAHOIKU_NB',
            'L_SHIMAMUSUME_L2','L_SUPER_BLACKJACK_SLDC','L_SHAMANKING_SS','L_ARIFURETA_JA'
          ];
          let failed = false;
          for (const id of ids) {
            const research = JSON.parse(fs.readFileSync(`research/${id}/research-data.json`, 'utf8'));
            const selection = JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`, 'utf8'));
            const observation = JSON.parse(fs.readFileSync(`research/${id}/machine-observation-data.json`, 'utf8'));
            const sv = validateSelectionData(selection, research);
            const ev = validateSelectionEvidenceCoverage(selection, research, { required: true });
            const sq = assessSelectionQuality(research, selection);
            const ov = validateObservationObject(observation, `research/${id}/machine-observation-data.json`);
            console.log(`${id}: selection=${sv.ok?'PASS':'FAIL'} evidence=${ev.ok?'PASS':'FAIL'} quality=${sq.status} observation=${ov.ok?'PASS':'FAIL'}`);
            for (const e of [...sv.errors, ...ev.errors, ...sq.blockers, ...ov.errors]) { failed = true; console.error(`${id}: ${e}`); }
            for (const r of sq.reviews ?? []) console.warn(`${id}: REVIEW ${r}`);
          }
          if (failed) process.exit(1);
          NODE
          node tools/audit-observation-selection-linkage.mjs --strict-v2 \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA
      - name: Validate scoped ResearchData schema
        run: |
          for id in \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA
          do
            node tools/validate-research-data.mjs "research/$id/research-data.json"
          done
      - name: Commit only scoped v6.5 normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/S_YOUJO_SENKI_ZR/research-data.json \
            research/S_HAIYORE_NYARUKO_SAN_Y/research-data.json \
            research/S_TOARU_RAILGUN_FB/research-data.json \
            research/S_TEKKEN4_ULTIMATE_DEVIL_TCD/research-data.json \
            research/S_DANMACHI_GAIDEN_XR/research-data.json \
            research/S_MAHOIKU_NB/research-data.json \
            research/L_SHIMAMUSUME_L2/research-data.json \
            research/L_SUPER_BLACKJACK_SLDC/research-data.json \
            research/L_SHAMANKING_SS/research-data.json \
            research/L_ARIFURETA_JA/research-data.json \
            research/L_SHAMANKING_SS/selection-data.json
          if ! git diff --cached --quiet; then
            git commit -m "selection: normalize v6.5 user10 quality review [skip ci]"
            git push origin HEAD:prototype-multi-machine
          fi
