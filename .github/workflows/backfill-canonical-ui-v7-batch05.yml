name: Backfill canonical UI v7 batch05

on:
  push:
    branches:
      - fix/20260912-canonical-ui-backfill-batch05
    paths:
      - tools/backfill-canonical-ui-v7-batch05.mjs
      - .github/workflows/backfill-canonical-ui-v7-batch05.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260912-canonical-ui-backfill-batch05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill canonical UI
        run: node tools/backfill-canonical-ui-v7-batch05.mjs
      - name: Validate UI Design repository
        run: node tools/validate-ui-design-data.mjs
      - name: Repository tests
        run: npm test
      - name: Repository audit
        run: npm run audit
      - name: Commit canonical UI artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/ui-design-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit: backfill canonical UI batch05'
          git push origin HEAD:fix/20260912-canonical-ui-backfill-batch05
