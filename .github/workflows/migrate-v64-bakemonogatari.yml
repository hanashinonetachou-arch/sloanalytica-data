name: Migrate v6.4 Bakemonogatari Observation

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-bakemonogatari-observation.mjs'
      - '.github/workflows/migrate-v64-bakemonogatari.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/migrate-v64-bakemonogatari-observation.mjs
      - name: Run targeted regression
        run: node --test --test-concurrency=1 test/v64-observation-trial-universe-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Run observation audit
        run: node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json
      - name: Run semantic and causal audits
        run: |
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_SMASLO_BAKEMONOGATARI_KH/machine-observation-data.json reports/v64-observation-trial-universe-audit.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
          git commit -m "audit: migrate Bakemonogatari observation contract to v2"
          git push
