name: Batch016 10-Machine Integration Boundary

on:
  push:
    branches:
      - production/v85-batch-016-contract-20261014
    paths:
      - production/.batch016-integration-trigger
      - .github/workflows/batch016-integration.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: batch016-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-016-contract-20261014
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Batch016 authoritative Research and Runtime
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/validate-recovered-batch.mjs batch-20261014-016
          node --experimental-strip-types --test test/batch016-observation-conditions.test.ts test/batch016-qa-feedback.test.ts
          node --experimental-strip-types src/reconcile-batch.ts batch-20261014-016

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Publish all ten Batch016 packages
        shell: bash
        run: |
          set -euo pipefail
          MACHINES="S_GRANBELM_ZX S_FAMISTA_KAIDO_FB L_ASLOT_KONOSUBA_FX L_PACHISLO_SENRAN_KAGURA2_L9 L_GEGEGE_NO_KITARO_KAKUSEI_JC L_D4DJ_KB S_KIZUMONOGATARI_FS S_MOECHIBA_GNC30 S_SUHANA_RISING_PC30 S_DIGISLO_JACK_GB1"
          MACHINES="$MACHINES" node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261014-016',machines=process.env.MACHINES.split(/\s+/).filter(Boolean);
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json'),catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const {resolveCatalogTimestamps}=require(path.join(proto,'tools/catalog-update-timestamp.mjs'));
          const previousCatalog=structuredClone(catalog),protectedEntries=catalog.machines.filter(x=>!machines.includes(x.machineId)),protectedHashes=new Map(protectedEntries.map(x=>[x.machineId,crypto.createHash('sha256').update(fs.readFileSync(path.join(proto,'machines',x.machineId,'machine-package.json'))).digest('hex')]));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x])),sha=b=>crypto.createHash('sha256').update(b).digest('hex'),metadata={};
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package,entry=byId.get(machineId); if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;pkg.machine.machineType=entry.machineType;pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            const target=path.join(proto,'machines',machineId,'machine-package.json');fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);
            const caps=[];for(const f of pkg.features?.features??[]){const model=String(f.modelType??'').toLowerCase();if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');}
            if((pkg.evidence?.references??[]).length&&!caps.includes('evidence'))caps.push('evidence');
            entry.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(machineId)}/machine-package.json`;entry.machineDataVersion=pkg.machine.machineDataVersion;entry.sha256=sha(bytes);entry.packageSizeBytes=bytes.length;entry.requiredCapabilities=caps;Object.assign(entry,resolveCatalogTimestamps(previousCatalog.machines.find(x=>x.machineId===machineId),entry.sha256,new Date().toISOString()));
            metadata[machineId]={machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:bytes.length,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType};
          }
          for(const old of protectedEntries){const current=byId.get(old.machineId);if(JSON.stringify(current)!==JSON.stringify(previousCatalog.machines.find(x=>x.machineId===old.machineId)))throw Error('OLD_CATALOG_CHANGED:'+old.machineId);const bytes=fs.readFileSync(path.join(proto,'machines',old.machineId,'machine-package.json'));if(sha(bytes)!==protectedHashes.get(old.machineId))throw Error('OLD_PACKAGE_CHANGED:'+old.machineId);}
          for(const entry of catalog.machines.filter(x=>x.status==='available')){const bytes=fs.readFileSync(path.join(proto,'machines',entry.machineId,'machine-package.json'));if(sha(bytes)!==entry.sha256||bytes.length!==entry.packageSizeBytes)throw Error('CATALOG_INTEGRITY:'+entry.machineId);}
          fs.writeFileSync(path.join(prod,'production/batches',batchId,'approved-fleet-regression.json'),JSON.stringify({status:'PASS',protectedMachines:protectedEntries.length,changedProtectedPackages:0,changedProtectedCatalogEntries:0},null,2)+'\n');
          catalog.generatedAt=new Date().toISOString();fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch016-all-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {getVisibleMachineCatalog} from './production-state/production/batches/batch-20261014-016/validation/app-catalog-source.ts';
          const catalog=JSON.parse(fs.readFileSync('prototype/catalog.json','utf8'));
          const ids=JSON.parse(fs.readFileSync('production-state/production/batches/batch-20261014-016/batch.json','utf8')).waves.flatMap(w=>w.machineIds);
          const visible=getVisibleMachineCatalog(catalog.machines,'',{sort:'RECENTLY_UPDATED'});
          const first=visible.slice(0,ids.length).map(x=>x.machineId);
          if(ids.some(id=>!first.includes(id)))throw Error('BATCH015_RECENT_CATALOG_ORDER');
          fs.writeFileSync('production-state/production/batches/batch-20261014-016/validation/catalog-recent-order.json',JSON.stringify({status:'PASS',appCommit:'6c7dde575afda121064a49fbe54b2783b4da93a5',appSourceBlob:'6d2818bc8c353241ac451a0d15f59ee2a1749c61',first},null,2)+'\n');
          NODE
          cd prototype
          npm run ux-contract:audit
          node tools/apply-machine-identity-classification.mjs --verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machines/S_GRANBELM_ZX/machine-package.json machines/S_FAMISTA_KAIDO_FB/machine-package.json machines/L_ASLOT_KONOSUBA_FX/machine-package.json machines/L_PACHISLO_SENRAN_KAGURA2_L9/machine-package.json machines/L_GEGEGE_NO_KITARO_KAKUSEI_JC/machine-package.json machines/L_D4DJ_KB/machine-package.json machines/S_KIZUMONOGATARI_FS/machine-package.json machines/S_MOECHIBA_GNC30/machine-package.json machines/S_SUHANA_RISING_PC30/machine-package.json machines/S_DIGISLO_JACK_GB1/machine-package.json
          git commit -m "Publish Batch 016 Batch016 [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "BATCH015_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Batch016 data pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$BATCH015_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "BATCH015_PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Finalize Batch016 Distribution and authoritative state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');const metadata=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch016-all-metadata.json','utf8'));
          const doc={batchId:'batch-20261014-016',integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.BATCH015_COMMIT,packagePath:'',catalogPath:'catalog.json'},packages:metadata,checks:{catalogIntegrity:true,pagesDeployment:{runId:Number(process.env.BATCH015_PAGES_RUN_ID),conclusion:'success'},uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}}};
          fs.writeFileSync(path.resolve('production-state/production/batches/batch-20261014-016/distribution-repair-attestation.json'),JSON.stringify(doc,null,2)+'\n');
          NODE
          cd production-state/production
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261014-016 --through DISTRIBUTION
          node --experimental-strip-types src/reconcile-batch.ts batch-20261014-016

      - name: Commit authoritative Batch 016 state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-016-contract-20261014
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261014-016
          git commit -m "Advance Batch 016 through Distribution [skip ci]"
          git push origin HEAD:production/v85-batch-016-contract-20261014
