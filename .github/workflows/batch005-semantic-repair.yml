name: Batch005 Semantic Repair

on:
  push:
    branches:
      - production/v85-batch-005-foundation-20261004
    paths:
      - production/.batch005-semantic-repair-trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: batch005-semantic-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-005-foundation-20261004
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate repaired generator contracts
        working-directory: production-state/production
        run: npm test

      - name: Build corrected Research drafts
        working-directory: production-state/production
        run: node --experimental-strip-types src/batch005-semantic-repair.ts

      - name: Invalidate the five QA targets from Research
        working-directory: production-state/production
        shell: bash
        run: |
          set -euo pipefail
          for machine in             L_AZURLANE_THE_ANIMATION_KN             L_SMASLO_TOKYO_REVENGERS_ZF             L_TOARU_KAGAKU_NO_RAILGUN_2_FV             L_ZETTAI_SHOGEKI_FORCE_FH             L_KAKUMEIKI_VALVRAVE_2_JF
          do
            node --experimental-strip-types src/invalidate-machine-downstream.ts batch-20261004-005 "$machine" --include-research
          done

      - name: Rematerialize corrected Research
        working-directory: production-state/production
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261004-005 wave-1 --force-machine=L_AZURLANE_THE_ANIMATION_KN --force-only
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261004-005 wave-1 --force-machine=L_SMASLO_TOKYO_REVENGERS_ZF --force-only
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261004-005 wave-2 --force-machine=L_TOARU_KAGAKU_NO_RAILGUN_2_FV --force-only
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261004-005 wave-2 --force-machine=L_ZETTAI_SHOGEKI_FORCE_FH --force-only
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261004-005 wave-2 --force-machine=L_KAKUMEIKI_VALVRAVE_2_JF --force-only

      - name: Regenerate five machines through App Runtime
        working-directory: production-state/production
        run: node --experimental-strip-types src/deterministic-production-worker.ts batch-20261004-005 --through APP_RUNTIME

      - name: Validate semantic repair
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/batch005-semantic-audit.ts
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261004-005

      - name: Commit authoritative pre-distribution repair
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-005-foundation-20261004
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/production/v85-batch-005-foundation-20261004)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261004-005
          git commit -m "Regenerate Batch 005 semantic repair [skip ci]"
          git push origin HEAD:production/v85-batch-005-foundation-20261004
          echo "PRE_DISTRIBUTION_PROD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize repaired live packages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261004-005';
          const machines=[
            'L_AZURLANE_THE_ANIMATION_KN',
            'L_SMASLO_TOKYO_REVENGERS_ZF',
            'L_TOARU_KAGAKU_NO_RAILGUN_2_FV',
            'L_ZETTAI_SHOGEKI_FORCE_FH',
            'L_KAKUMEIKI_VALVRAVE_2_JF'
          ];
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json');
          const catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x]));
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const metadata={};
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package,entry=byId.get(machineId);
            if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;
            pkg.machine.machineType=entry.machineType;
            pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            const target=path.join(proto,'machines',machineId,'machine-package.json');
            fs.mkdirSync(path.dirname(target),{recursive:true});
            fs.writeFileSync(target,bytes);
            const caps=[];
            for(const f of pkg.features?.features??[]){
              const model=String(f.modelType??'').toLowerCase();
              if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');
              if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');
            }
            if((pkg.evidence?.references??[]).length&&!caps.includes('evidence'))caps.push('evidence');
            entry.machineDataVersion=pkg.machine.machineDataVersion;
            entry.sha256=sha(bytes);
            entry.packageSizeBytes=bytes.length;
            entry.requiredCapabilities=caps;
            entry.updatedAt=new Date().toISOString();
            metadata[machineId]={
              machineId,
              machineDataVersion:pkg.machine.machineDataVersion,
              settings:pkg.machine.settings,
              sha256:entry.sha256,
              packageSizeBytes:bytes.length,
              introductionDate:entry.introductionDate,
              machineType:entry.machineType,
              gameType:entry.gameType
            };
          }
          catalog.generatedAt=new Date().toISOString();
          fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch005-semantic-repair-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE

      - name: Validate repaired live packages
        working-directory: prototype
        run: |
          npm run ux-contract:audit
          node --test --test-concurrency=1 test/user-verified-ux-contracts.test.mjs
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const ids=new Set([
            'L_AZURLANE_THE_ANIMATION_KN',
            'L_SMASLO_TOKYO_REVENGERS_ZF',
            'L_TOARU_KAGAKU_NO_RAILGUN_2_FV',
            'L_ZETTAI_SHOGEKI_FORCE_FH',
            'L_KAKUMEIKI_VALVRAVE_2_JF'
          ]);
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          for(const item of catalog.machines.filter(x=>ids.has(x.machineId))){
            const b=fs.readFileSync(path.join('machines',item.machineId,'machine-package.json'));
            if(b.length!==item.packageSizeBytes)throw new Error('SIZE:'+item.machineId);
            if(crypto.createHash('sha256').update(b).digest('hex')!==item.sha256)throw new Error('SHA:'+item.machineId);
          }
          NODE

      - name: Commit repaired distribution
        shell: bash
        working-directory: prototype
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json             machines/L_AZURLANE_THE_ANIMATION_KN/machine-package.json             machines/L_SMASLO_TOKYO_REVENGERS_ZF/machine-package.json             machines/L_TOARU_KAGAKU_NO_RAILGUN_2_FV/machine-package.json             machines/L_ZETTAI_SHOGEKI_FORCE_FH/machine-package.json             machines/L_KAKUMEIKI_VALVRAVE_2_JF/machine-package.json
          git commit -m "Publish Batch 005 semantic repair [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "PROTOTYPE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy data pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$PROTOTYPE_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Build repaired distribution attestation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const doc={
            batchId:'batch-20261004-005',
            integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.PROTOTYPE_COMMIT},
            packages:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch005-semantic-repair-metadata.json','utf8')),
            checks:{
              catalogIntegrity:true,
              pagesDeployment:{runId:Number(process.env.PAGES_RUN_ID),conclusion:'success'},
              uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},
              machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}
            }
          };
          fs.writeFileSync(path.resolve('production-state','production','batches','batch-20261004-005','distribution-repair-attestation.json'),JSON.stringify(doc,null,2)+'\n');
          NODE

      - name: Finalize repaired Distribution states
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261004-005 --through DISTRIBUTION
          node --experimental-strip-types src/batch005-semantic-audit.ts
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261004-005

      - name: Commit finalized authoritative repair state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-005-foundation-20261004
          test "$PRE_DISTRIBUTION_PROD_COMMIT" = "$(git rev-parse origin/production/v85-batch-005-foundation-20261004)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261004-005
          git commit -m "Finalize Batch 005 semantic repair [skip ci]"
          git push origin HEAD:production/v85-batch-005-foundation-20261004
