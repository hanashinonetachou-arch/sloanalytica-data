name: Batch010 Three-Machine UI Repair Boundary

on:
  push:
    branches:
      - production/v85-batch-010-research-20261010
    paths:
      - production/.batch010-three-machine-ui-trigger
      - .github/workflows/batch010-three-machine-ui-repair.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: batch010-three-machine-ui
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-010-research-20261010
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate three machine UI contracts from reviewed Research
        working-directory: production-state/production
        shell: bash
        run: |
          set -euo pipefail
          for machine in S_DANMACHI_GAIDEN_XR S_MAHOIKU_NB S_TOARU_RAILGUN_FB; do
            node --experimental-strip-types src/invalidate-machine-downstream.ts batch-20261010-010 "$machine" --include-research
            node --experimental-strip-types src/materialize-research-drafts.ts batch-20261010-010 wave-2 --force-machine="$machine" --force-only
          done
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261010-010 --through APP_RUNTIME
          node --input-type=module --experimental-strip-types <<'NODE'
          import {RepoStore,Orchestrator} from './src/core.ts';
          const s=new RepoStore(process.cwd()),o=new Orchestrator(s);
          for(const id of ['S_DANMACHI_GAIDEN_XR','S_MAHOIKU_NB','S_TOARU_RAILGUN_FB']){
            const x=o.stage('batch-20261010-010',id,'DEVICE_QA');
            if(x.state==='COMPLETE'||x.state==='HUMAN_REQUIRED')o.transition(x,'READY','AUTHORITATIVE_OUTPUT_INVALIDATED','batch010-3machine-ui-reqa-20261011');
            else if(x.state!=='READY')throw Error('DEVICE_QA_UNEXPECTED_STATE:'+id+':'+x.state);
          }
          NODE

      - name: Verify Batch010 authoritative Research and Runtime
        working-directory: production-state/production
        run: |
          node --experimental-strip-types src/validate-recovered-batch.mjs batch-20261010-010
          npm test
          node --experimental-strip-types src/reconcile-batch.ts batch-20261010-010

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Publish three context-reorganized machine packages
        shell: bash
        run: |
          set -euo pipefail
          MACHINES="S_DANMACHI_GAIDEN_XR S_MAHOIKU_NB S_TOARU_RAILGUN_FB"
          MACHINES="$MACHINES" node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const batchId='batch-20261010-010',machines=process.env.MACHINES.split(/\s+/).filter(Boolean);
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json'),catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x])),sha=b=>crypto.createHash('sha256').update(b).digest('hex'),metadata={};
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batchId,'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package,entry=byId.get(machineId); if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;pkg.machine.machineType=entry.machineType;pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            if(pkg.machine.machineDataVersion!=='8.5.2-batch-20261010-010')throw new Error('QA_PACKAGE_REVISION_MISMATCH:'+machineId+':'+pkg.machine.machineDataVersion);
            const target=path.join(proto,'machines',machineId,'machine-package.json');fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);
            const caps=[];for(const f of pkg.features?.features??[]){const model=String(f.modelType??'').toLowerCase();if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');}
            if((pkg.evidence?.references??[]).length&&!caps.includes('evidence'))caps.push('evidence');
            entry.machineDataVersion=pkg.machine.machineDataVersion;entry.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(machineId)}/machine-package.json`;entry.sha256=sha(bytes);entry.packageSizeBytes=bytes.length;entry.requiredCapabilities=caps;entry.updatedAt=new Date().toISOString();
            metadata[machineId]={machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:bytes.length,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType};
          }
          // A successful local checksum is not enough if catalog.packageUrl is pinned
          // to an earlier commit; that serves old bytes to the Android app.
          for(const entry of catalog.machines){
            if(entry.status!=='available')continue;
            const expected=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(entry.machineId)}/machine-package.json`;
            if(entry.packageUrl!==expected)throw new Error('STALE_CATALOG_PACKAGE_URL:'+entry.machineId);
            const file=path.join(proto,'machines',entry.machineId,'machine-package.json');
            const bytes=fs.readFileSync(file);
            if(bytes.length!==entry.packageSizeBytes||sha(bytes)!==entry.sha256.toLowerCase())
              throw new Error('CATALOG_PACKAGE_INTEGRITY_MISMATCH:'+entry.machineId);
          }
          catalog.generatedAt=new Date().toISOString();fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch010-all-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          cd prototype
          npm run ux-contract:audit
          node tools/apply-machine-identity-classification.mjs --verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machines/S_DANMACHI_GAIDEN_XR/machine-package.json machines/S_MAHOIKU_NB/machine-package.json machines/S_TOARU_RAILGUN_FB/machine-package.json
          git commit -m "Publish three Batch010 reviewed machine UIs [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "BATCH010_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Batch010 data pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$BATCH010_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "BATCH010_PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Finalize Batch010 Distribution and authoritative state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');const metadata=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch010-all-metadata.json','utf8'));
          const doc={batchId:'batch-20261010-010',integration:{repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.BATCH010_COMMIT,packagePath:'',catalogPath:'catalog.json'},packages:{...JSON.parse(fs.readFileSync(path.resolve('production-state/production/batches/batch-20261010-010/distribution-repair-attestation.json'),'utf8')).packages,...metadata},checks:{catalogIntegrity:true,pagesDeployment:{runId:Number(process.env.BATCH010_PAGES_RUN_ID),conclusion:'success'},uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}}};
          fs.writeFileSync(path.resolve('production-state/production/batches/batch-20261010-010/distribution-repair-attestation.json'),JSON.stringify(doc,null,2)+'\n');
          NODE
          cd production-state/production
          node --experimental-strip-types src/deterministic-production-worker.ts batch-20261010-010 --through DISTRIBUTION
          node --experimental-strip-types src/reconcile-batch.ts batch-20261010-010

      - name: Commit Batch010 three machine repair state
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-010-research-20261010
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261010-010
          git commit -m "Regenerate reviewed Danmachi Mahouiku Railgun through Distribution [skip ci]"
          git push origin HEAD:production/v85-batch-010-research-20261010
