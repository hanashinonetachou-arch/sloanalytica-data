name: v6.4 Unresolved Active Observations Batch 1

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-unresolved-active-observations-batch1.mjs'
      - 'test/v64-unresolved-active-observation-disposition.test.mjs'
      - '.github/workflows/v64-unresolved-active-observations-batch1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/migrate-v64-unresolved-active-observations-batch1.mjs
      - name: Validate Selection and UI Design
        run: |
          for m in L_MOMOTARO_DENTETSU_TEIBAN_PU L_SMASLO_DUNBINE_MF S_OVERLORD_II_SX; do
            node tools/validate-selection-data.mjs "research/$m/selection-data.json"
            node tools/validate-ui-design-data.mjs "research/$m/ui-design-data.json"
          done
      - name: Run target pipelines
        run: |
          for m in L_MOMOTARO_DENTETSU_TEIBAN_PU L_SMASLO_DUNBINE_MF S_OVERLORD_II_SX; do
            npm run machine:pipeline -- "$m" --skip-repo-checks
          done
      - name: Run disposition regression
        run: node --test test/v64-unresolved-active-observation-disposition.test.mjs
      - name: Run full tests
        run: npm test
      - name: Run public audit and require zero warnings
        run: |
          set -o pipefail
          npm run audit 2>&1 | tee /tmp/audit.log
          if grep -q '^WARNING' /tmp/audit.log; then cat /tmp/audit.log; exit 1; fi
      - name: Run semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Require semantic 170 PASS
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          if(r.summary?.PASS!==170||r.summary?.REVIEW!==0||r.summary?.HIGH_RISK!==0) throw new Error(JSON.stringify(r.summary));
          NODE
      - name: Run observation/trial-universe audit
        run: |
          node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
      - name: Require HIGH_RISK zero
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-observation-trial-universe-audit.json','utf8'));
          console.log(JSON.stringify(r.summary));
          if(r.summary?.HIGH_RISK!==0) throw new Error(`HIGH_RISK remains: ${JSON.stringify(r.machines.filter(m=>m.status==='HIGH_RISK').map(m=>m.machineId))}`);
          NODE
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: hold unresolved Observation features from inference [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
