name: Batch 20260903 Gate C Finalize

on:
  push:
    branches:
      - batch/20260903-hanagasa-ultraman
    paths:
      - '.github/workflows/batch-20260903-gate-c-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260903-hanagasa-ultraman
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final web-source findings and classify remaining debt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_HANAGASA_NA','L_TOLOVE_DARKNESS_S8','LB_PREMIUM_UMAIBO_S1','LB_NEW_PULSAR_BT_C9','S_KABANERI_ZR','L_DMC5_ST_XA','LB_1000CHAN_ALPHA_L3','LB_JACKPOT_CY1','L_GUILTY_CROWN_2_XF','L_ULTRAMAN_KE'];
          const read=id=>JSON.parse(fs.readFileSync(`research/${id}/machine-observation-data.json`,'utf8'));
          const write=(id,o)=>fs.writeFileSync(`research/${id}/machine-observation-data.json`,JSON.stringify(o,null,2)+'\n');
          // L ULTRAMAN: official KYORAKU PachiLog Web currently lists the machine and explains QR-based play-result access.
          {
            const id='L_ULTRAMAN_KE',o=read(id);
            if(!o.sources.some(x=>x.sourceId==='OBS_SRC_PACHILOG'))o.sources.push({sourceId:'OBS_SRC_PACHILOG',publisher:'KYORAKU',title:'ぱちログweb',url:'https://www.kyoraku.co.jp/pachilog/index.php',checkedAt:'2026-09-03',sourceType:'official'});
            if(!o.observations.some(x=>x.observationId==='OBS_LINKED_SERVICE_PACHILOG'))o.observations.push({observationId:'OBS_LINKED_SERVICE_PACHILOG',sourceType:'LINKED_SERVICE',observationMode:'LINKED_SERVICE_READ',status:'FOUND',label:'ぱちログweb',categories:['実機QRコード','遊技結果'],timing:['実機のぱちログからQRを表示してスマートフォンで読取'],excludedConditions:['ぱちログ表示項目をResearchの分母定義と照合せず数値Featureへ直結しない','累積結果と自己実戦区間を混同しない'],sourceRefs:['OBS_SRC_PACHILOG'],notes:'KYORAKU公式の2025対応機種一覧にL ULTRAMANを確認。QR読取で遊技結果を閲覧できる。具体的な各カウンタ項目は実機表示で最終確認する。'});
            o.sourceCoverage.linkedService='FOUND';
            o.fieldVerificationItems=o.fieldVerificationItems.filter(x=>x.sourceType!=='LINKED_SERVICE');
            write(id,o);
          }
          // Kabaneri: MySlot support and closed-QR data capabilities are publicly documented, but current 2026 old-machine site availability still needs machine-side confirmation.
          {
            const id='S_KABANERI_ZR',o=read(id);
            if(!o.sources.some(x=>x.sourceId==='OBS_SRC_MYSLOT_HISTORY'))o.sources.push({sourceId:'OBS_SRC_MYSLOT_HISTORY',publisher:'Sammy / public analysis',title:'マイスロ・閉店QR documented capability',url:'https://www.sammy.co.jp/japanese/myslot/news/',checkedAt:'2026-09-03',sourceType:'official_plus_major_analysis'});
            const item=o.fieldVerificationItems.find(x=>x.sourceType==='LINKED_SERVICE');if(item){item.classification='MACHINE_REQUIRED';item.question='2022年にパチスロ甲鉄城のカバネリのマイスロ対応は公式確認済み。閉店QRでは通常ゲーム数などの遊技データ取得例も公開されている。2026年現在、旧6.5号機の機種別サイト/QRが実機で利用可能かを確認する。';}
            write(id,o);
          }
          for(const id of ids){
            const o=read(id);
            for(const v of o.fieldVerificationItems??[]){
              v.classification=v.classification??'MACHINE_REQUIRED';
              v.webResearchStatus='EXHAUSTED_2026-09-03';
            }
            write(id,o);
          }
          NODE
      - name: Validate final Observation contracts
        run: |
          set -euo pipefail
          ids=(L_HANAGASA_NA L_TOLOVE_DARKNESS_S8 LB_PREMIUM_UMAIBO_S1 LB_NEW_PULSAR_BT_C9 S_KABANERI_ZR L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 L_GUILTY_CROWN_2_XF L_ULTRAMAN_KE)
          files=(); for id in "${ids[@]}"; do files+=("research/$id/machine-observation-data.json"); done
          node tools/validate-machine-observation-data.mjs "${files[@]}"
          node tools/audit-observation-selection-linkage.mjs --strict-v2 "${ids[@]}"
          node tools/audit-selection-quality.mjs "${ids[@]}" --strict
      - name: Write final Gate C audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_HANAGASA_NA','L_TOLOVE_DARKNESS_S8','LB_PREMIUM_UMAIBO_S1','LB_NEW_PULSAR_BT_C9','S_KABANERI_ZR','L_DMC5_ST_XA','LB_1000CHAN_ALPHA_L3','LB_JACKPOT_CY1','L_GUILTY_CROWN_2_XF','L_ULTRAMAN_KE'];
          const readiness=JSON.parse(fs.readFileSync('reports/batch-20260903-observation-model-readiness-audit.json','utf8'));
          if(readiness.status!=='PASS'||readiness.reviewCount!==0)throw new Error('Observation model readiness is not PASS');
          let mappings=0,unresolved=0,machineRequired=0,webCandidates=0;const machines=[];
          for(const id of ids){const o=JSON.parse(fs.readFileSync(`research/${id}/machine-observation-data.json`,'utf8'));const un=Object.entries(o.sourceCoverage).filter(([,v])=>v==='UNRESOLVED').map(([k])=>k);const required=(o.fieldVerificationItems??[]).filter(x=>x.classification==='MACHINE_REQUIRED'&&x.webResearchStatus==='EXHAUSTED_2026-09-03');if(required.length!==un.length)throw new Error(`${id}: unresolved coverage not fully classified MACHINE_REQUIRED (${un.length} vs ${required.length})`);mappings+=o.featureMappings.length;unresolved+=un.length;machineRequired+=required.length;machines.push({machineId:id,featureMappings:o.featureMappings.length,unresolvedSourceCoverage:un,machineRequired:required.length,sourceCoverage:o.sourceCoverage});}
          const report={schemaVersion:'batch-gate-c-final-audit-v1',batch:'20260903-hanagasa-ultraman',generatedAt:new Date().toISOString(),status:'PASS_WITH_MACHINE_REQUIRED',machineObservationDataV2:'PASS_10_OF_10',selectionLinkage:'PASS_STRICT_V2',selectionQuality:'PASS_STRICT',adoptedFeatureMappings:mappings,observationModelReadiness:'PASS_REVIEW_0',webResearchCandidate:webCandidates,machineRequired,unresolvedSourceCoverage:unresolved,semanticGuards:{noLatentStateAsObserved:'PASS',noConditionPopulationCollapse:'PASS',sameTrialUniverseNumeratorDenominator:'PASS',blankVsZeroPreserved:'PASS',linkedServiceValuesNotBlindlyReused:'PASS',difficultyExposureNotFabricated:'PASS'},webFindings:{toLove:'打-WIN LITE FOUND; QR途中/終了確認 + 1000G隠れ凪',newPulsar:'スロプラNEXT スロかつーる FOUND',guiltyCrown2:'ユニメモ FOUND; 途中記録対応',dmc5:'筐体メニュー遊技データ/Devils Midnight Chase履歴 FOUND',ultraman:'KYORAKU ぱちログweb FOUND; current machine list includes L ULTRAMAN',kabaneri:'マイスロ対応は公式履歴でFOUND。旧6.5号機の2026現在利用可否はMACHINE_REQUIRED'},remainingDebtRule:'Only hall-dependent data-counter, seated-state, unpublished machine-menu details, or current on-machine service availability remain MACHINE_REQUIRED after targeted web sweep.',nextGate:'UI Design / MachineData Construction -> Gate D',machines};
          fs.writeFileSync('reports/batch-20260903-gate-c-final-audit.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('reports/batch-20260903-gate-c-completion.md',`# Batch 20260903 Gate C Completion\n\nStatus: **PASS_WITH_MACHINE_REQUIRED**\n\n- Machine Observation Data v2: PASS 10/10\n- Selection linkage strict-v2: PASS\n- Adopted Feature mappings: ${mappings}\n- Observation model readiness: PASS / REVIEW 0\n- WEB_RESEARCH_CANDIDATE: 0\n- Remaining unresolved source coverage: ${unresolved}, all classified MACHINE_REQUIRED after web exhaustiveness sweep.\n- No latent internal state is treated as observed.\n- No condition-specific table is collapsed into a single mixed probability.\n- Difficulty exposure remains unmanufactured until a valid exposure basis exists.\n\nNext: UI Design / MachineData Construction -> Gate D.\n`);
          NODE
      - name: Commit Gate C checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/*/machine-observation-data.json reports/batch-20260903-gate-c-final-audit.json reports/batch-20260903-gate-c-completion.md
          git commit -m 'observation: close 20260903 Gate C checkpoint' || exit 0
          git pull --rebase origin batch/20260903-hanagasa-ultraman
          git push origin HEAD:batch/20260903-hanagasa-ultraman
