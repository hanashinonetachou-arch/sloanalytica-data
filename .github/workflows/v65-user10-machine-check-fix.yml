name: v6.5 User10 Machine Check Fix

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/fix-v65-user10-machine-check.mjs'
      - '.github/workflows/v65-user10-machine-check-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v65-user10-machine-check-fix
  cancel-in-progress: false

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply scoped fixes
        run: node tools/fix-v65-user10-machine-check.mjs
      - name: Run regression tests
        run: npm test
      - name: Run atomic batch machine CHECK
        run: |
          npm run machine:batch -- \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA \
            --check \
            --report reports/v65-user10-machine-check-fixed.json
      - name: Assert PASS=10 and rollback
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v65-user10-machine-check-fixed.json','utf8'));
          console.log(JSON.stringify({overallStatus:r.overallStatus,counts:r.counts,rolledBack:r.rolledBack,repositoryChecks:r.repositoryChecks.map(x=>({script:x.script,ok:x.ok}))},null,2));
          if(r.overallStatus!=='PASS') process.exit(1);
          if(r.counts?.PASS!==10||r.counts?.REVIEW!==0||r.counts?.BLOCKED!==0) process.exit(1);
          if(r.rolledBack!==true) process.exit(1);
          if(!(r.repositoryChecks??[]).every(x=>x.ok)) process.exit(1);
          NODE
      - name: Commit scoped fixes only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/L_SUPER_BLACKJACK_SLDC/selection-data.json \
            research/S_HAIYORE_NYARUKO_SAN_Y/selection-data.json \
            tools/batch-machine-pipeline.mjs \
            test/batch-machine-pipeline.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve v6.5 user10 machine check reviews [skip ci]"
            git push origin HEAD:prototype-multi-machine
          fi
