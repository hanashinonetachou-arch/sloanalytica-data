name: v6.5 User10 Build Publish

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - '.github/workflows/v65-user10-machine-check-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v65-user10-build-publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run atomic batch machine WRITE
        run: |
          npm run machine:batch -- \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA \
            --report reports/v65-user10-machine-write.json

      - name: Assert WRITE PASS=10
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v65-user10-machine-write.json','utf8'));
          console.log(JSON.stringify({overallStatus:r.overallStatus,counts:r.counts,rolledBack:r.rolledBack,repositoryChecks:r.repositoryChecks?.map(x=>({script:x.script,ok:x.ok}))},null,2));
          if(r.overallStatus!=='PASS') process.exit(1);
          if(r.counts?.PASS!==10||r.counts?.REVIEW!==0||r.counts?.BLOCKED!==0) process.exit(1);
          if(r.rolledBack!==false) process.exit(1);
          if(!(r.repositoryChecks??[]).every(x=>x.ok)) process.exit(1);
          NODE

      - name: Commit generated MachineData artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            machine-registry.json \
            research/S_YOUJO_SENKI_ZR/statistics-report.json research/S_YOUJO_SENKI_ZR/difficulty-report.json research/S_YOUJO_SENKI_ZR/setting-band-report.json machines/S_YOUJO_SENKI_ZR/machine-package.json \
            research/S_HAIYORE_NYARUKO_SAN_Y/statistics-report.json research/S_HAIYORE_NYARUKO_SAN_Y/difficulty-report.json research/S_HAIYORE_NYARUKO_SAN_Y/setting-band-report.json machines/S_HAIYORE_NYARUKO_SAN_Y/machine-package.json \
            research/S_TOARU_RAILGUN_FB/statistics-report.json research/S_TOARU_RAILGUN_FB/difficulty-report.json research/S_TOARU_RAILGUN_FB/setting-band-report.json machines/S_TOARU_RAILGUN_FB/machine-package.json \
            research/S_TEKKEN4_ULTIMATE_DEVIL_TCD/statistics-report.json research/S_TEKKEN4_ULTIMATE_DEVIL_TCD/difficulty-report.json research/S_TEKKEN4_ULTIMATE_DEVIL_TCD/setting-band-report.json machines/S_TEKKEN4_ULTIMATE_DEVIL_TCD/machine-package.json \
            research/S_DANMACHI_GAIDEN_XR/statistics-report.json research/S_DANMACHI_GAIDEN_XR/difficulty-report.json research/S_DANMACHI_GAIDEN_XR/setting-band-report.json machines/S_DANMACHI_GAIDEN_XR/machine-package.json \
            research/S_MAHOIKU_NB/statistics-report.json research/S_MAHOIKU_NB/difficulty-report.json research/S_MAHOIKU_NB/setting-band-report.json machines/S_MAHOIKU_NB/machine-package.json \
            research/L_SHIMAMUSUME_L2/statistics-report.json research/L_SHIMAMUSUME_L2/difficulty-report.json research/L_SHIMAMUSUME_L2/setting-band-report.json machines/L_SHIMAMUSUME_L2/machine-package.json \
            research/L_SUPER_BLACKJACK_SLDC/statistics-report.json research/L_SUPER_BLACKJACK_SLDC/difficulty-report.json research/L_SUPER_BLACKJACK_SLDC/setting-band-report.json machines/L_SUPER_BLACKJACK_SLDC/machine-package.json \
            research/L_SHAMANKING_SS/statistics-report.json research/L_SHAMANKING_SS/difficulty-report.json research/L_SHAMANKING_SS/setting-band-report.json machines/L_SHAMANKING_SS/machine-package.json \
            research/L_ARIFURETA_JA/statistics-report.json research/L_ARIFURETA_JA/difficulty-report.json research/L_ARIFURETA_JA/setting-band-report.json machines/L_ARIFURETA_JA/machine-package.json
          echo '--- staged WRITE files ---'
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m "build: generate v6.5 user10 MachineData [skip ci]"
            git push origin HEAD:prototype-multi-machine
          fi

      - name: Batch publish DRY RUN
        run: |
          npm run machine:publish:batch -- \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA

      - name: Batch publish APPLY
        run: |
          npm run machine:publish:batch -- --apply \
            S_YOUJO_SENKI_ZR \
            S_HAIYORE_NYARUKO_SAN_Y \
            S_TOARU_RAILGUN_FB \
            S_TEKKEN4_ULTIMATE_DEVIL_TCD \
            S_DANMACHI_GAIDEN_XR \
            S_MAHOIKU_NB \
            L_SHIMAMUSUME_L2 \
            L_SUPER_BLACKJACK_SLDC \
            L_SHAMANKING_SS \
            L_ARIFURETA_JA

      - name: Final repository audits
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
          npm run registry:validate

      - name: Commit published catalogs
        run: |
          git add catalog.json difficulty-catalog.json machine-registry.json \
            machines/S_YOUJO_SENKI_ZR/machine-package.json \
            machines/S_HAIYORE_NYARUKO_SAN_Y/machine-package.json \
            machines/S_TOARU_RAILGUN_FB/machine-package.json \
            machines/S_TEKKEN4_ULTIMATE_DEVIL_TCD/machine-package.json \
            machines/S_DANMACHI_GAIDEN_XR/machine-package.json \
            machines/S_MAHOIKU_NB/machine-package.json \
            machines/L_SHIMAMUSUME_L2/machine-package.json \
            machines/L_SUPER_BLACKJACK_SLDC/machine-package.json \
            machines/L_SHAMANKING_SS/machine-package.json \
            machines/L_ARIFURETA_JA/machine-package.json
          echo '--- staged PUBLISH files ---'
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'ERROR: publish apply produced no tracked public-data changes'
            exit 1
          fi
          git commit -m "publish: add v6.5 user-selected 10 machines [skip ci]"
          git push origin HEAD:prototype-multi-machine
