name: v6.4 Shared Observation Batch1

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-shared-observation-milky.mjs'
      - 'tools/apply-rounded-multinomial-builder-support.mjs'
      - '.github/workflows/v64-shared-observation-batch1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply rounded multinomial builder support
        run: node tools/apply-rounded-multinomial-builder-support.mjs .
      - name: Run rounded multinomial regression
        run: node --test test/rounded-multinomial-builder.test.mjs
      - name: Dry-run migration
        run: node tools/migrate-v64-shared-observation-milky.mjs .
      - name: Apply migration
        run: node tools/migrate-v64-shared-observation-milky.mjs . --apply
      - name: Rebuild target machine package
        run: npm run machine:pipeline -- S_MILKY_HOMES_GNB --skip-repo-checks
      - name: Run semantic regression tests
        run: node --test test/v64-cross-machine-semantic-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Run UI service-name audit
        run: npm run audit:ui-service-names
      - name: Run Observation linkage audit
        run: npm run observation:selection:audit
      - name: Run four-layer gate
        run: npm run pipeline:four-layer:gate
      - name: Run v6.4 cross-machine semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Show semantic diff
        run: |
          git status --short
          git --no-pager diff --stat
          git --no-pager diff -- tools/build-machine-data.mjs test/rounded-multinomial-builder.test.mjs research/S_MILKY_HOMES_GNB/selection-data.json research/S_MILKY_HOMES_GNB/machine-observation-data.json
      - name: Commit validated batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-machine-data.mjs test/rounded-multinomial-builder.test.mjs research/S_MILKY_HOMES_GNB machines/S_MILKY_HOMES_GNB catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "fix: share Milky bonus-end Evidence inputs"
            git push origin HEAD:prototype-multi-machine
          fi
