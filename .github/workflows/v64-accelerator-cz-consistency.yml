name: v6.4 Accelerator CZ Consistency

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-accelerator-cz-source-conflict.mjs'
      - 'test/accelerator-cz-consistency.test.mjs'
      - '.github/workflows/v64-accelerator-cz-consistency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run source conflict migration
        run: node tools/migrate-v64-accelerator-cz-source-conflict.mjs .
      - name: Apply source conflict migration
        run: node tools/migrate-v64-accelerator-cz-source-conflict.mjs . --apply
      - name: Run Accelerator CZ consistency regression
        run: node --test test/accelerator-cz-consistency.test.mjs
      - name: Rebuild target machine package
        run: npm run machine:pipeline -- L_TOARU_ACCELERATOR_RZ --skip-repo-checks
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Run four-layer gate
        run: npm run pipeline:four-layer:gate -- L_TOARU_ACCELERATOR_RZ
      - name: Run v6.4 semantic audit
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Run v6.4 causal relation review
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Show diff
        run: |
          git status --short
          git --no-pager diff --stat
          git --no-pager diff -- research/L_TOARU_ACCELERATOR_RZ/research-data.json test/accelerator-cz-consistency.test.mjs
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_TOARU_ACCELERATOR_RZ machines/L_TOARU_ACCELERATOR_RZ catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json test/accelerator-cz-consistency.test.mjs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "fix: resolve Accelerator SET_3 CZ source conflict"
            git push origin HEAD:prototype-multi-machine
          fi
