name: Report v6.4 Remaining V1
on:
  push:
    branches: [prototype-multi-machine]
    paths: ['tools/report-v64-remaining-v1.mjs','.github/workflows/report-v64-remaining-v1.yml']
permissions: {contents: write}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prototype-multi-machine}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/report-v64-remaining-v1.mjs
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v64-remaining-v1-candidates.json
          git commit -m "audit: report remaining v1 candidates"
          git push
