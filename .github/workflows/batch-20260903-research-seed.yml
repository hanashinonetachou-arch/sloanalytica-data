name: Batch 20260903 Research Seed

on:
  push:
    branches:
      - batch/20260903-hanagasa-ultraman
    paths:
      - '.github/workflows/batch-20260903-research-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260903-hanagasa-ultraman
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate ResearchData from Machine Identity and Discovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const identity = JSON.parse(fs.readFileSync('reports/batch-20260903-machine-identity.json','utf8'));
          const discovery = JSON.parse(fs.readFileSync('reports/batch-20260903-discovery-inventory-plan.json','utf8'));
          const checkedAt = '2026-09-03';
          const sources = {
            L_HANAGASA_NA:[['SRC_PWORLD','P-WORLD','花笠 機種情報・設定推測','https://www.p-world.co.jp/machine/database/10267','major_analysis']],
            L_TOLOVE_DARKNESS_S8:[['SRC_1GEKI','一撃','ToLOVEる TRANCE 設定差・設定判別要素まとめ','https://1geki.jp/slot/l_toloveru_d_trance/0/','major_analysis'],['SRC_NANA','なな徹','ToLOVEる TRANCE 設定判別','https://nana-press.com/kaiseki/machine/969/29581/','major_analysis']],
            LB_PREMIUM_UMAIBO_S1:[['SRC_1GEKI','一撃','LBプレミアムうまい棒 設定差・設定判別要素まとめ','https://1geki.jp/slot/lb_umaibou/0/','major_analysis'],['SRC_NANA','なな徹','LBプレミアムうまい棒 設定判別','https://nana-press.com/kaiseki/machine/957/30078/','major_analysis']],
            LB_NEW_PULSAR_BT_C9:[['SRC_NANA','なな徹','スマスロニューパルサーBT 設定判別','https://nana-press.com/kaiseki/machine/960/30050/','major_analysis'],['SRC_PWORLD','P-WORLD','スマスロニューパルサーBT 機種情報','https://www.p-world.co.jp/machine/database/10254','major_analysis']],
            S_KABANERI_ZR:[['SRC_1GEKI','一撃','甲鉄城のカバネリ 設定差・設定判別要素まとめ','https://1geki.jp/slot/s_kabaneri/0/','major_analysis'],['SRC_1GEKI_CZ','一撃','甲鉄城のカバネリ 無名CZの詳細と抽選','https://1geki.jp/slot/s_kabaneri/43/','major_analysis']],
            L_DMC5_ST_XA:[['SRC_1GEKI','一撃','デビル メイ クライ5 スタイリッシュトライブ 設定差・設定判別要素まとめ','https://1geki.jp/slot/l_dmc5_st/0/','major_analysis']],
            LB_1000CHAN_ALPHA_L3:[['SRC_1GEKI','一撃','LBパチスロ1000ちゃんA 設定差・設定判別要素まとめ','https://1geki.jp/slot/lb_1000chan_a/0/','major_analysis'],['SRC_PWORLD','P-WORLD','LBパチスロ1000ちゃんA 機種情報','https://www.p-world.co.jp/machine/database/10247','major_analysis']],
            LB_JACKPOT_CY1:[['SRC_1GEKI','一撃','LBジャックポット 設定差・設定判別要素まとめ','https://1geki.jp/slot/lb_jackpot/0/','major_analysis'],['SRC_NANA','なな徹','LBジャックポット 設定判別','https://nana-press.com/kaiseki/machine/968/30017/','major_analysis']],
            L_GUILTY_CROWN_2_XF:[['SRC_1GEKI','一撃','スマスロ ギルティクラウン2 設定差・設定判別要素まとめ','https://1geki.jp/slot/l_guiltycrown2/0/','major_analysis']],
            L_ULTRAMAN_KE:[['SRC_NANA','なな徹','L ULTRAMAN 設定判別','https://nana-press.com/kaiseki/machine/947/30100/','major_analysis'],['SRC_NANA_SPEC','なな徹','L ULTRAMAN 初当たり・CZ・小役確率','https://nana-press.com/kaiseki/machine/947/29682/','major_analysis']]
          };
          const rates = {
            L_HANAGASA_NA:{
              RF_FIRST_HIT:[194,186,171,162,152],RF_BIG:[137,131,116,102,91],RF_REG:[219,212,195,190,202],RF_BONUS_AGG:[84,81,73,66,63]
            },
            L_TOLOVE_DARKNESS_S8:{RF_AT_FIRST_HIT:[353.3,346.3,328.9,312.3,307.6]},
            LB_PREMIUM_UMAIBO_S1:{RF_BIG:[299.3,296.5,293.9,291.3],RF_REG:[471.5,455.1,337.8,291.3],RF_BONUS_AGG:[183.1,179.6,157.2,145.6],RF_SOLO_BIG:[417.4,414.8,412.2,409.6],RF_SOLO_REG:[675.6,648.9,436.9,364.1],RF_CHERRY_BIG:[1560.4,1524.1,1489.5,1456.4]},
            LB_NEW_PULSAR_BT_C9:{RF_BIG:[366.1,346.8,332.7,312.1],RF_REG:[366.1,346.8,332.7,312.1],RF_BONUS_AGG:[183.1,173.4,166.3,156.0],RF_SOLO_OR_REACH_BIG:[923.0,897.8,829.6,799.2],RF_SOLO_OR_REACH_REG:[885.6,862.3,799.2,771.0],RF_CHERRY:[20.2,20.0,19.9,19.7],RF_CHANCE_CHERRY:[655.4,606.8,606.8,565.0],RF_BELL:[62.1,61.7,62.1,61.7],RF_BIG_FLASH:[65536,16384,8192,4096],RF_REG_FLASH:[65536,3276.8,728.2,512]},
            S_KABANERI_ZR:{RF_BONUS_FIRST_HIT:[237.0,230.7,214.0,186.5,171.3,151.3],RF_ST_FIRST_HIT:[407.9,393.2,372.4,327.2,307.3,290.6],RF_CZ_TOTAL:[179.3,177.9,169.3,158.4,145.6,136.8]},
            L_DMC5_ST_XA:{RF_BONUS_FIRST_HIT:[257.0,254.1,251.5,222.6,217.3,204.1],RF_ST_FIRST_HIT:[445.4,436.5,411.2,359.6,329.5,303.9]},
            LB_1000CHAN_ALPHA_L3:{RF_BB_TOTAL:[190.0,182.0,164.3,152.8,662.0],RF_ALL_BONUS_TOTAL:[168.0,161.8,147.6,138.3,624.2],RF_1000_BONUS:[1598.4,1598.4,1598.4,1598.4,13107.2],RF_SUDDEN_JAC:[16384,16384,16384,16384,65536],RF_1000_PARTY:[1456.4,1456.4,1456.4,1456.4,10922.7],RF_CHERRY:[40.0,39.9,39.3,38.9,null],RF_WATERMELON:[77.0,76.7,76.5,76.2,null],RF_WEAK_CHANCE:[99.9,99.4,98.1,96.8,null]},
            LB_JACKPOT_CY1:{RF_BIG:[348.6,341.3,313.6,290.0],RF_REG:[524.3,448.9,360.1,290.0],RF_BONUS_AGG:[209.4,193.9,167.6,145.0],RF_REG_END_BACKLIGHT:[10,13,17,20]},
            L_GUILTY_CROWN_2_XF:{RF_AT_FIRST_HIT:[596.4,571.6,528.8,447.0,410.5,375.5],RF_SAME_COLOR_BIG:[606.8,595.8,585.2,574.9,555.4,537.2],RF_MIXED_COLOR_BIG:[655.4,655.4,655.4,618.3,585.2,555.4],RF_BONUS_TOTAL:[315.1,312.1,309.1,297.9,284.9,273.1]},
            L_ULTRAMAN_KE:{RF_AT_FIRST_HIT:[320.1,308.7,271.8,247.3,222.8],RF_COMMON_BELL:[8.4,8.3,8.2,8.1,8.0],RF_CHERRY:[69.5,71.0,71.3,71.4,71.6],RF_WATERMELON:[102.7,104.9,105.4,105.6,105.6],RF_MIDDLE_ULTRA:[1630.9,855.6,783.0,754.3,731.4],RF_ULTRA_TOTAL:[164.6,150.8,148.4,147.3,146.4],RF_LONG_FREEZE:[78484.1,69138.8,61976.5,53752.9,47541.8]}
          };
          const percentageFeatures = new Set(['RF_REG_END_BACKLIGHT']);
          const trialByFeature = {
            RF_BIG:'通常時ゲーム',RF_REG:'通常時ゲーム',RF_BONUS_AGG:'通常時ゲーム',RF_FIRST_HIT:'有効通常ゲーム',RF_AT_FIRST_HIT:'有効通常ゲーム',RF_ST_FIRST_HIT:'有効通常ゲーム',RF_BONUS_FIRST_HIT:'有効通常ゲーム',RF_CZ_TOTAL:'有効通常ゲーム',RF_BB_TOTAL:'通常時ゲーム',RF_ALL_BONUS_TOTAL:'通常時ゲーム',RF_1000_BONUS:'通常時ゲーム',RF_SUDDEN_JAC:'通常時ゲーム',RF_1000_PARTY:'通常時ゲーム',RF_SOLO_BIG:'通常時ゲーム',RF_SOLO_REG:'通常時ゲーム',RF_CHERRY_BIG:'通常時ゲーム',RF_SOLO_OR_REACH_BIG:'通常時ゲーム',RF_SOLO_OR_REACH_REG:'通常時ゲーム',RF_CHERRY:'対象状態の総ゲーム',RF_CHANCE_CHERRY:'通常時ゲーム',RF_BELL:'通常時ゲーム',RF_COMMON_BELL:'通常時・AT中を含む対象ゲーム',RF_WATERMELON:'対象状態の総ゲーム',RF_WEAK_CHANCE:'通常時ゲーム',RF_MIDDLE_ULTRA:'通常時・AT中を含む対象ゲーム',RF_ULTRA_TOTAL:'通常時・AT中を含む対象ゲーム',RF_LONG_FREEZE:'通常時ゲーム',RF_BIG_FLASH:'BIG中ゲーム',RF_REG_FLASH:'REG中ゲーム',RF_REG_END_BACKLIGHT:'REG終了1回'
          };
          const machineMap = new Map(identity.machines.map(m=>[m.machineId,m]));
          for (const [machineId, inventory] of Object.entries(discovery.machines)) {
            const m = machineMap.get(machineId); if (!m) throw new Error(`identity missing ${machineId}`);
            const srcRows=(sources[machineId]??[]).map(([sourceId,publisher,title,url,sourceType])=>({sourceId,publisher,title,url,checkedAt,sourceType}));
            if (!srcRows.length) throw new Error(`sources missing ${machineId}`);
            const sourceRefs=srcRows.map(s=>s.sourceId);
            const features=[]; const evidenceCandidates=[];
            for (const item of inventory) {
              if (item.transferStatus==='REFERENCE') continue;
              const target=String(item.researchTarget??'');
              if (target.startsWith('RE_')) {
                evidenceCandidates.push({researchEvidenceId:target,name:item.name,factStatus:'pending',allowedSettings:[],deniedSettings:[],sourceRefs,crossSourceStatus:sourceRefs.length>1?'cross_checked':'single_source',notes:'DiscoveryからResearchへ移送。示唆の閾値・否定設定・出現条件をSelection前に確定する。'});
                continue;
              }
              if (!target.startsWith('RF_')) continue;
              const denominators=rates[machineId]?.[target];
              const vals={};
              if (Array.isArray(denominators)) {
                m.settings.forEach((setting,i)=>{
                  const d=denominators[i]; if (d==null) return;
                  if (percentageFeatures.has(target)) vals[setting]={probability:d/100,rawDisplay:`${d}%`};
                  else vals[setting]={probability:1/d,rawDisplay:`1/${d}`};
                });
              }
              const verified=Object.keys(vals).length>=Math.min(m.settings.length,4);
              features.push({
                researchFeatureId:target,name:item.name,factStatus:verified?'verified':'pending',candidateModel:'binomial',
                trialUnit:trialByFeature[target]??'公開条件を満たす対象試行',
                numeratorDefinition:percentageFeatures.has(target)?'条件成立回数':`${item.name}の観測回数`,
                denominatorDefinition:percentageFeatures.has(target)?'対象イベント回数':`${item.name}が定義される公開上の正しい対象試行数`,
                settingValues:vals,sourceRefs,crossSourceStatus:sourceRefs.length>1?'cross_checked':'single_source',
                notes:verified?'公開設定別数値をResearchへ転記。Selectionで包含関係・重複・観測可能性を別途評価する。':'DiscoveryからResearchへ移送済み。条件別表・分母・設定別数値の追加調査を継続する。'
              });
            }
            const file=path.join('research',machineId,'research-data.json'); fs.mkdirSync(path.dirname(file),{recursive:true});
            const data={schemaVersion:'research-data-v1',machine:{...m,identitySourceRefs:[sourceRefs[0]]},researchedAt:checkedAt,sources:srcRows,features,evidenceCandidates,conflicts:[],discoveryInventory:inventory};
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
            console.log(`${machineId}: features=${features.length} evidence=${evidenceCandidates.length} discovery=${inventory.length}`);
          }
          NODE
      - name: Validate ResearchData and Discovery completeness
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_HANAGASA_NA L_TOLOVE_DARKNESS_S8 LB_PREMIUM_UMAIBO_S1 LB_NEW_PULSAR_BT_C9 S_KABANERI_ZR L_DMC5_ST_XA LB_1000CHAN_ALPHA_L3 LB_JACKPOT_CY1 L_GUILTY_CROWN_2_XF L_ULTRAMAN_KE)
          for id in "${ids[@]}"; do node tools/validate-research-data.mjs "research/$id/research-data.json"; done
          node tools/discovery-completeness-gate.mjs "${ids[@]}"
      - name: Commit ResearchData seed
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/*/research-data.json
          git commit -m 'research: transfer 20260903 discovery into ResearchData' || exit 0
          git pull --rebase origin batch/20260903-hanagasa-ultraman
          git push origin HEAD:batch/20260903-hanagasa-ultraman
