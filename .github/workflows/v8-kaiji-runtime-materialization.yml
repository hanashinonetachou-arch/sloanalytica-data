name: V8 Kaiji Runtime Materialization

on:
  push:
    branches:
      - ci/v8-kaiji-runtime-materialization-20260922
  workflow_dispatch:
  pull_request:
    branches:
      - prototype-multi-machine

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deterministic runtime materialization
        run: npm run test:v8-kaiji-runtime
      - name: Build v8 reference package from repro source
        run: node tools/build-v8-reference-package.mjs L_SMASLO_KAIJI_KYOEN_FJ
      - name: Verify generated package contains runtime bindings
        run: node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('repro-v8/L_SMASLO_KAIJI_KYOEN_FJ/machine-package.generated.json'));const s=p.ui.sections.find(x=>x.id==='SEC_NORMAL');const i=s.items[0].inputs.find(x=>x.id==='INP_NORMAL_GAMES');if(!i.engineBinding?.inputIds?.length)process.exit(1);"
