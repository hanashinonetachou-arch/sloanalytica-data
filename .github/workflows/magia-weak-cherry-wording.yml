name: Magia Weak Cherry Wording
on:
  push:
    branches: [fix/20260902-magia-weak-cherry-wording]
    paths:
      - tools/apply-magia-weak-cherry-wording.mjs
      - .github/workflows/magia-weak-cherry-wording.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260902-magia-weak-cherry-wording
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-magia-weak-cherry-wording.mjs
      - run: npm run ui-design:validate
      - run: npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
      - name: Weak-cherry contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('machines/L_MAGIA_RECORD_RN/machine-package.json','utf8'));
          const input=p.inputs.inputs.find(i=>i.id==='INP_WEAK_CHERRY_TRIALS');
          if(!input||input.name!=='総プレイG数'||input.unit!=='G') throw new Error('weak cherry denominator input mismatch');
          const sec=p.ui.sections.find(s=>s.title==='弱チェリー');
          if(!sec||!sec.description.includes('実機連動機能')||!sec.description.includes('全状態')) throw new Error('weak cherry description mismatch');
          if(sec.description.includes('ユニメモ')) throw new Error('brand wording leaked into user-facing description');
          const f=p.features.features.find(f=>f.featureId==='FEAT_WEAK_CHERRY');
          if(!f||f.denominatorInputId!=='INP_WEAK_CHERRY_TRIALS') throw new Error('weak cherry denominator binding mismatch');
          if(p.machine.machineDataVersion!=='0.1.4') throw new Error('version mismatch');
          console.log('Magia weak-cherry contract PASS');
          NODE
      - run: npm run ui-design:test
      - run: npm test
      - run: npm run audit
      - name: Persist generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_MAGIA_RECORD_RN machines/L_MAGIA_RECORD_RN catalog.json difficulty-catalog.json machine-registry.json reports 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: clarify Magia weak-cherry total-play denominator'
          git push origin HEAD:fix/20260902-magia-weak-cherry-wording
