name: Batch 20260908 Gate B-C Reaudit

on:
  push:
    branches:
      - batch/20260908-manifest-v7-first10
    paths:
      - '.github/workflows/batch-20260908-gate-bc-reaudit.yml'

permissions:
  contents: write

jobs:
  reaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260908-manifest-v7-first10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-materialize SelectionData
        run: node tools/materialize-gate-b-selection-v7.mjs
      - name: Re-close Gate B
        run: node tools/close-gate-b-v7.mjs
      - name: Materialize revised ObservationData
        run: node tools/materialize-gate-c-observation-v7.mjs
      - name: Validate ObservationData 10/10
        run: |
          node tools/validate-machine-observation-data.mjs \
            research/L_ANIMAL_SLOT_DOCCHI_ZT/machine-observation-data.json \
            research/L_BIG_DREAM_GOLDEN_PUSHER_KR/machine-observation-data.json \
            research/L_BIOHAZARD_RE3_ZD/machine-observation-data.json \
            research/L_TAKT_OP_DESTINY_M1/machine-observation-data.json \
            research/L_SUPER_RIO_ACE2_ND02H/machine-observation-data.json \
            research/L_BIRDIE_WING_BC/machine-observation-data.json \
            research/L_SAO2_PA1/machine-observation-data.json \
            research/L_SENGOKU_OTOME5_L8/machine-observation-data.json \
            research/L_DARK_HAIBI_SB/machine-observation-data.json \
            research/L_LOTIS_TN/machine-observation-data.json
      - name: Audit Selection-Observation linkage
        run: node tools/audit-observation-selection-linkage.mjs --strict-v2 L_ANIMAL_SLOT_DOCCHI_ZT L_BIG_DREAM_GOLDEN_PUSHER_KR L_BIOHAZARD_RE3_ZD L_TAKT_OP_DESTINY_M1 L_SUPER_RIO_ACE2_ND02H L_BIRDIE_WING_BC L_SAO2_PA1 L_SENGOKU_OTOME5_L8 L_DARK_HAIBI_SB L_LOTIS_TN
      - name: Run Machine Observation Gate
        run: node tools/machine-observation-gate.mjs
      - name: Assert batch Gate C draft has no unresolved debt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('batches/20260908-manifest-v7-first10/gate-c-observation-draft-report.json','utf8'));
          const s=x.summary||{};
          if(s.machines!==10||s.validatorPass!==10||s.unresolvedMappings!==0||s.researchReopenRequests!==0||s.linkedServiceDebt!==0) {
            console.error(JSON.stringify(x,null,2)); process.exit(1);
          }
          console.log('Gate C batch debt assertion PASS',JSON.stringify(s));
          NODE
      - name: Commit re-audited Gate B-C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/*/selection-data.json research/*/machine-observation-data.json \
            batches/20260908-manifest-v7-first10/gate-b-materialization-report.json \
            batches/20260908-manifest-v7-first10/gate-b-dependency-audit.json \
            batches/20260908-manifest-v7-first10/gate-c-observation-draft-report.json \
            batches/20260908-manifest-v7-first10/compliance-ledger.json
          if git diff --cached --quiet; then
            echo "No re-audit changes"
          else
            git commit -m "audit: revalidate Gate B and Gate C after observation reopen"
            git push origin HEAD:batch/20260908-manifest-v7-first10
          fi
