name: Classify missing canonical UI v7

on:
  push:
    branches:
      - audit/20260912-cross-sectional-v7
    paths:
      - tools/classify-missing-canonical-ui-v7.mjs
      - .github/workflows/classify-missing-canonical-ui-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/20260912-cross-sectional-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify recovery safety
        run: node tools/classify-missing-canonical-ui-v7.mjs
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/missing-canonical-ui-v7-classification.json
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'Audit: classify missing canonical UI recovery safety'
          git push origin HEAD:audit/20260912-cross-sectional-v7
