name: Migrate v6.4 Observation Batch 04
on:
  push:
    branches: [prototype-multi-machine]
    paths: ['tools/migrate-v64-observation-batch-04.mjs','.github/workflows/migrate-v64-observation-batch-04.yml','test/juggler-unverified-predecessor-observation.test.mjs']
permissions: {contents: write}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prototype-multi-machine}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/migrate-v64-observation-batch-04.mjs
      - run: node --test --test-concurrency=1 test/v64-observation-trial-universe-audit.test.mjs test/selection-policy-migration-audit.test.mjs test/juggler-unverified-predecessor-observation.test.mjs
      - run: npm test
      - run: node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json
      - run: |
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Commit batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/*/machine-observation-data.json reports/v64-observation-batch-04-machines.json reports/v64-observation-trial-universe-audit.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
          git commit -m "audit: migrate final ten direct observation contracts to v2"
          git push