name: Magia Evidence Layout Apply

on:
  push:
    branches:
      - fix/20260902-magia-evidence-layout
    paths:
      - tools/apply-magia-evidence-layout.mjs
      - .github/workflows/magia-evidence-layout-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260902-magia-evidence-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic layout migration
        run: node tools/apply-magia-evidence-layout.mjs
      - name: Validate UI design
        run: npm run ui-design:validate
      - name: Rebuild and materialize machine package
        run: npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
      - name: Verify episode and evidence layout contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('machines/L_MAGIA_RECORD_RN/machine-package.json','utf8'));
          if(p.machine?.machineDataVersion!=='0.1.1') throw new Error(`expected version 0.1.1, got ${p.machine?.machineDataVersion}`);
          const section=(p.ui?.sections||[]).find(s=>s.title==='エピソードボーナス選択率');
          if(!section) throw new Error('episode section missing');
          const episodeIds=['INP_EPISODE_BONUS_TYPE_CAT_YACHIYO','INP_EPISODE_BONUS_TYPE_CAT_TSURUNO','INP_EPISODE_BONUS_TYPE_CAT_SANA','INP_EPISODE_BONUS_TYPE_CAT_FELICIA','INP_EPISODE_BONUS_TYPE_CAT_KUROE'];
          for(const id of episodeIds){const item=section.items.find(x=>x.inputId===id);if(!item||item.gridSpan!==6)throw new Error(`${id}: expected gridSpan 6, got ${item?.gridSpan}`);}
          const e=(p.ui?.sections||[]).find(s=>s.title==='設定示唆・確定情報');
          if(!e||!Array.isArray(e.subgroups)||e.subgroups.length!==5) throw new Error('evidence subgroups missing');
          if(e.collapsible!==false||e.defaultExpanded!==true) throw new Error('evidence section should stay open');
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entry=catalog.machines.find(m=>m.machineId==='L_MAGIA_RECORD_RN');
          if(entry?.machineDataVersion!=='0.1.1') throw new Error(`catalog version mismatch: ${entry?.machineDataVersion}`);
          console.log('layout contract PASS');
          NODE
      - name: Validate repository
        run: |
          npm run ui-design:test
          npm test
          npm run audit
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/materialize-ui-design.mjs tools/machine-pipeline.mjs research/L_MAGIA_RECORD_RN/ui-design-data.json research/L_MAGIA_RECORD_RN/selection-data.json research/L_MAGIA_RECORD_RN/statistics-report.json research/L_MAGIA_RECORD_RN/setting-band-report.json research/L_MAGIA_RECORD_RN/difficulty-report.json machines/L_MAGIA_RECORD_RN/machine-package.json catalog.json difficulty-catalog.json machine-registry.json reports 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'ui: organize Magia evidence layout'
          git push origin HEAD:fix/20260902-magia-evidence-layout
