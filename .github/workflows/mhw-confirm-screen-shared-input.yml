name: MHW Confirm Screen Shared Input

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/apply-mhw-confirm-screen-shared-input.mjs'
      - '.github/workflows/mhw-confirm-screen-shared-input.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply shared-input migration
        run: node tools/apply-mhw-confirm-screen-shared-input.mjs
      - name: Validate shared-input contract
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('research/S_MHW_ICEBORNE_ZF/selection-data.json','utf8'));
          const f=s.features.find(x=>x.featureId==='FEAT_CONFIRM_SCREEN');
          if(!f) throw new Error('FEAT_CONFIRM_SCREEN missing');
          if(f.categoryExcludeLabels?.length) throw new Error('confirm screen still excludes categories');
          if(!f.categoryInputIds.includes('INP_CONFIRM_MORA')) throw new Error('MORA not in multinomial inputs');
          const e=(s.evidence??[]).find(x=>x.researchEvidenceId==='RE_CONFIRM_MORA');
          if(!e||e.inputId!=='INP_CONFIRM_MORA'||!(e.sharedFeatureIds??[]).includes('FEAT_CONFIRM_SCREEN')) throw new Error('shared MORA Evidence contract invalid');
          const stillSplit=(s.evidenceUi?.groups??[]).flatMap(g=>g.options??[]).some(o=>(o.sourceEvidenceIds??[]).includes('RE_CONFIRM_MORA'));
          if(stillSplit) throw new Error('MORA still present on separate Evidence surface');
          NODE
      - name: Rebuild target machine
        run: npm run machine:pipeline -- S_MHW_ICEBORNE_ZF --skip-repo-checks
      - name: Refresh semantic audit before tests
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Run full tests
        run: npm test
      - name: Run public audit
        run: npm run audit
      - name: Run UI service-name audit
        run: npm run audit:ui-service-names
      - name: Run target Observation linkage
        run: node tools/audit-observation-selection-linkage.mjs S_MHW_ICEBORNE_ZF --strict-v2
      - name: Run target four-layer gate
        run: node tools/four-layer-pipeline-gate.mjs S_MHW_ICEBORNE_ZF
      - name: Refresh causal audit
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Verify MHW semantic review resolved
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          const m=(r.machines??[]).find(x=>x.machineId==='S_MHW_ICEBORNE_ZF');
          if(!m) throw new Error('MHW semantic result missing');
          if(m.status!=='PASS') throw new Error(`MHW semantic status is ${m.status}: ${JSON.stringify(m.issues)}`);
          console.log('MHW semantic PASS');
          NODE
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: share MHW confirm-screen Evidence input [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
