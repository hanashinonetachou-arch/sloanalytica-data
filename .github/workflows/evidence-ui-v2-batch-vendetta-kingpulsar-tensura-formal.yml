name: Evidence UI v2 Residual Legacy Audit

on:
  push:
    branches:
      - audit/evidence-ui-v2-phase2-20260914
    paths:
      - .github/workflows/evidence-ui-v2-batch-vendetta-kingpulsar-tensura-formal.yml

permissions:
  contents: read

jobs:
  residual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-phase2-20260914
          fetch-depth: 0
      - name: Residual legacy Selection scan
        shell: bash
        run: |
          echo '=== LEGACY_SELECTION_FILES ==='
          grep -RlE '"groupId"[[:space:]]*:[[:space:]]*"(SETTING_FLOOR|SETTING_DENIAL|SETTING_SUBSET|SETTING_CONSTRAINT)"|"label"[[:space:]]*:[[:space:]]*"確認した設定' research/*/selection-data.json | sort || true
          echo '=== LEGACY_UI_FILES ==='
          grep -RlE 'INP_EVI_SETTING_(FLOOR|DENIAL|SUBSET|CONSTRAINT)' research/*/ui-design-data.json | sort || true
          echo '=== COUNTS ==='
          printf 'selection='; grep -RlE '"groupId"[[:space:]]*:[[:space:]]*"(SETTING_FLOOR|SETTING_DENIAL|SETTING_SUBSET|SETTING_CONSTRAINT)"|"label"[[:space:]]*:[[:space:]]*"確認した設定' research/*/selection-data.json | wc -l
          printf 'ui='; grep -RlE 'INP_EVI_SETTING_(FLOOR|DENIAL|SUBSET|CONSTRAINT)' research/*/ui-design-data.json | wc -l
      - name: Validate all Evidence UI
        run: node tools/validate-evidence-ui-all.mjs
