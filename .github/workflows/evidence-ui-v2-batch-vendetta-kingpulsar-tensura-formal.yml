name: Evidence UI v2 Formal Migration Batch 7

on:
  push:
    branches:
      - audit/evidence-ui-v2-phase2-20260914
    paths:
      - .github/workflows/evidence-ui-v2-batch-vendetta-kingpulsar-tensura-formal.yml

permissions:
  contents: write

jobs:
  formal-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-phase2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run formal migration and gates
        run: node tools/run-evidence-ui-v2-batch7.mjs
      - name: Commit canonical and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_MAHJONG_FIGHT_CLUB_KAKUSEI_KM research/L_RING_NI_KAKERO1_FS research/L_BAKI_L3 research/L_GOLDEN_KAMUY_KR research/L_TOARU_INDEX_JC
          git add machines/L_MAHJONG_FIGHT_CLUB_KAKUSEI_KM machines/L_RING_NI_KAKERO1_FS machines/L_BAKI_L3 machines/L_GOLDEN_KAMUY_KR machines/L_TOARU_INDEX_JC
          git add catalog.json difficulty-catalog.json machine-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence-ui: formalize MFC Ring Baki GoldenKamuy and Toaru evidence'
          git push origin HEAD:audit/evidence-ui-v2-phase2-20260914
