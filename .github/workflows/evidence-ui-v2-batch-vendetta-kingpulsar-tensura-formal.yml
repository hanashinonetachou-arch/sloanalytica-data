name: Evidence UI v2 Formal Migration Batch 8

on:
  push:
    branches:
      - audit/evidence-ui-v2-phase2-20260914
    paths:
      - .github/workflows/evidence-ui-v2-batch-vendetta-kingpulsar-tensura-formal.yml

permissions:
  contents: write

jobs:
  formal-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/evidence-ui-v2-phase2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run formal migration and gates
        run: node tools/run-evidence-ui-v2-batch8.mjs
      - name: Commit canonical and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_HIGURASHI_GOU_SS research/L_BASILISK_KIZUNA2_TENZEN_ZN research/L_MONKEY_TURN5_CE
          git add machines/L_HIGURASHI_GOU_SS machines/L_BASILISK_KIZUNA2_TENZEN_ZN machines/L_MONKEY_TURN5_CE
          git add catalog.json difficulty-catalog.json machine-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence-ui: formalize Higurashi Tenzen and Monkey V evidence'
          git push origin HEAD:audit/evidence-ui-v2-phase2-20260914
