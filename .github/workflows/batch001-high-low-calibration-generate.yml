name: Batch001 High-Low Calibration Generate

on:
  push:
    branches:
      - production/batch-20260928-001
    paths:
      - production/.batch001-high-low-calibration-trigger

permissions:
  contents: write

concurrency:
  group: batch001-high-low-calibration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/batch-20260928-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate production state before calibration
        working-directory: production
        run: npm test
      - name: Regenerate Batch 001 downstream artifacts with calculable-subset HLD
        working-directory: production
        run: node --experimental-strip-types src/repair-batch001-high-low-calibration.ts generate batch-20260928-001
      - name: Validate production state after calibration
        working-directory: production
        run: npm test
      - name: Commit calibrated authoritative production state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20260928-001
          if git diff --cached --quiet; then
            echo "No calibration changes to commit."
            exit 0
          fi
          git commit -m "Calibrate Batch 001 high-low discrimination [skip ci]"
          git push origin HEAD:production/batch-20260928-001
