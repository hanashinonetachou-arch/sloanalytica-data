name: Batch 20260901 Publish Audit Repair

on:
  push:
    branches:
      - batch/20260901-magia-gundamseed
    paths:
      - '.github/workflows/batch-20260901-publish-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: batch/20260901-magia-gundamseed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source-contract repairs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const amazingPath = 'research/L_AMAZING_LIVE_PD/research-data.json';
          const amazing = JSON.parse(fs.readFileSync(amazingPath, 'utf8'));
          amazing.machine.inferenceSettings = ['SET_1','SET_2','SET_4','SET_5','SET_6'];
          fs.writeFileSync(amazingPath, JSON.stringify(amazing, null, 2) + '\n');

          const magiaPath = 'research/L_MAGIA_RECORD_RN/selection-data.json';
          const magia = JSON.parse(fs.readFileSync(magiaPath, 'utf8'));
          const targets = new Set(['RF_MODE_AT_END','RF_MODE_BONUS_END','RF_EPISODE_BONUS_TYPE']);
          let changed = 0;
          for (const feature of magia.features ?? []) {
            if (targets.has(feature.researchFeatureId)) {
              feature.normalizeRoundedCategoryProbabilities = true;
              changed++;
            }
          }
          if (changed !== 3) throw new Error(`Expected 3 Magia rounded multinomial selections, found ${changed}`);
          fs.writeFileSync(magiaPath, JSON.stringify(magia, null, 2) + '\n');
          NODE

      - name: Rebuild affected MachineData
        shell: bash
        run: |
          set -euo pipefail
          npm run machine:pipeline -- L_AMAZING_LIVE_PD --skip-repo-checks
          npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
          git restore -- reports/v64-observation-debt-classification.json || true

      - name: Verify repaired semantics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const amazing = JSON.parse(fs.readFileSync('machines/L_AMAZING_LIVE_PD/machine-package.json','utf8'));
          const expected = ['SET_1','SET_2','SET_4','SET_5','SET_6'];
          if (JSON.stringify(amazing.machine.inferenceSettings) !== JSON.stringify(expected)) {
            throw new Error(`Amazing Live inferenceSettings mismatch: ${JSON.stringify(amazing.machine.inferenceSettings)}`);
          }
          if (!amazing.machine.settings.includes('SET_L')) throw new Error('Amazing Live SET_L identity was lost');
          const feature = amazing.features.features.find(x => x.featureId === 'FEAT_BONUS_FIRST_HIT');
          if (!feature) throw new Error('Amazing Live primary feature missing');
          if ('SET_L' in (feature.probabilities ?? {})) throw new Error('Amazing Live invented SET_L likelihood');

          const magia = JSON.parse(fs.readFileSync('machines/L_MAGIA_RECORD_RN/machine-package.json','utf8'));
          for (const id of ['FEAT_MODE_AT_END','FEAT_MODE_BONUS_END','FEAT_EPISODE_BONUS_TYPE']) {
            const f = magia.features.features.find(x => x.featureId === id);
            if (!f) throw new Error(`${id} missing`);
            if (f.categoryConditioning?.roundingNormalization !== true) throw new Error(`${id}: rounding normalization marker missing`);
            for (const [setting, probs] of Object.entries(f.categoryProbabilities ?? {})) {
              const sum = probs.reduce((a,b) => a + b, 0);
              if (Math.abs(sum - 1) > 1e-12) throw new Error(`${id}.${setting}: normalized sum=${sum}`);
            }
          }
          console.log('PASS: Amazing Live SET_L inference exclusion and Magia rounded multinomial normalization verified');
          NODE

      - name: Repository regression
        shell: bash
        run: |
          set -euo pipefail
          npm test
          git restore -- reports/v64-observation-debt-classification.json || true

      - name: Verify repair mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          allowed='^(research/L_AMAZING_LIVE_PD/research-data\.json|research/L_MAGIA_RECORD_RN/selection-data\.json|machines/L_AMAZING_LIVE_PD/machine-package\.json|machines/L_MAGIA_RECORD_RN/machine-package\.json)$'
          unexpected=$(git status --porcelain | sed -E 's/^...//' | grep -Ev "$allowed" || true)
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected repair-side mutation(s):'
            echo "$unexpected"
            exit 1
          fi

      - name: Commit repaired sources and materialized MachineData
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/L_AMAZING_LIVE_PD/research-data.json \
            research/L_MAGIA_RECORD_RN/selection-data.json \
            machines/L_AMAZING_LIVE_PD/machine-package.json \
            machines/L_MAGIA_RECORD_RN/machine-package.json
          git commit -m 'Fix 20260901 strict publish probability contracts'
          git push origin HEAD:batch/20260901-magia-gundamseed
