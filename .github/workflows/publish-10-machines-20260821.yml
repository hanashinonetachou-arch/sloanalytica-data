name: Publish 10-machine batch 20260821

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - '.github/workflows/publish-10-machines-20260821.yml'

jobs:
  publish-batch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare machine list
        shell: bash
        run: |
          cat > /tmp/machines.txt <<'EOF'
          L_EUREKA_SEVEN4_HIEVO_KX
          L_ENEN_NO_SHOUBOUTAI_JG
          L_ULTRAMAN_TIGA_KA
          L_TOLOVE_DARKNESS_S6
          S_OKIDOKI_GORGEOUS_GS
          S_NAMENEKO_QQ
          S_HAIBI_RETURN_PA30
          S_KABANERI_ZR
          S_HARD_BOILED_XX
          S_HYPER_RUSH_SLC8
          EOF

      - name: Regenerate setting-band reports and validate batch
        run: npm run machine:batch -- --file /tmp/machines.txt

      - name: Publish atomic 10-machine batch
        run: npm run machine:publish:batch -- --apply --file /tmp/machines.txt

      - name: Commit published artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json difficulty-catalog.json machine-registry.json \
            research/L_EUREKA_SEVEN4_HIEVO_KX/setting-band-report.json \
            research/L_ENEN_NO_SHOUBOUTAI_JG/setting-band-report.json \
            research/L_ULTRAMAN_TIGA_KA/setting-band-report.json \
            research/L_TOLOVE_DARKNESS_S6/setting-band-report.json \
            research/S_OKIDOKI_GORGEOUS_GS/setting-band-report.json \
            research/S_NAMENEKO_QQ/setting-band-report.json \
            research/S_HAIBI_RETURN_PA30/setting-band-report.json \
            research/S_KABANERI_ZR/setting-band-report.json \
            research/S_HARD_BOILED_XX/setting-band-report.json \
            research/S_HYPER_RUSH_SLC8/setting-band-report.json \
            machines/L_EUREKA_SEVEN4_HIEVO_KX/machine-package.json \
            machines/L_ENEN_NO_SHOUBOUTAI_JG/machine-package.json \
            machines/L_ULTRAMAN_TIGA_KA/machine-package.json \
            machines/L_TOLOVE_DARKNESS_S6/machine-package.json \
            machines/S_OKIDOKI_GORGEOUS_GS/machine-package.json \
            machines/S_NAMENEKO_QQ/machine-package.json \
            machines/S_HAIBI_RETURN_PA30/machine-package.json \
            machines/S_KABANERI_ZR/machine-package.json \
            machines/S_HARD_BOILED_XX/machine-package.json \
            machines/S_HYPER_RUSH_SLC8/machine-package.json
          if git diff --cached --quiet; then
            echo 'No publish changes to commit.'
            exit 0
          fi
          git commit -m 'data: publish 10-machine batch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
