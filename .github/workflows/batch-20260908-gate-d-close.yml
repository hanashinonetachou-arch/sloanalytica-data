name: Batch 20260908 Gate D Close

on:
  push:
    branches:
      - batch/20260908-manifest-v7-first10
    paths:
      - tools/close-gate-d-v7.mjs
      - batches/20260908-manifest-v7-first10/gate-d-ui-semantic-audit.json
      - batches/20260908-manifest-v7-first10/gate-d-materialization-report.json
      - .github/workflows/batch-20260908-gate-d-close.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260908-manifest-v7-first10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Close Gate D from canonical UI evidence
        run: node tools/close-gate-d-v7.mjs
      - name: Assert Gate D ledger closure
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='batches/20260908-manifest-v7-first10/gate-d-closure-audit.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.status!=='PASS'||r.machines!==10||r.closure.entries!==170||r.closure.fail||r.closure.blocked||r.closure.applicableUnevaluated||r.closure.missingNaReason||r.closure.missingEvidenceRef){console.error(JSON.stringify(r,null,2));process.exit(1)}
          const l=JSON.parse(fs.readFileSync('batches/20260908-manifest-v7-first10/compliance-ledger.json','utf8'));
          if(l.gateStatus.GATE_D!=='PASS'||l.gateStatus.GATE_E!=='OPEN'){console.error(l.gateStatus);process.exit(1)}
          console.log('Gate D ledger PASS',JSON.stringify(r.closure));
          NODE
      - name: Commit Gate D closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batches/20260908-manifest-v7-first10/compliance-ledger.json batches/20260908-manifest-v7-first10/gate-d-closure-audit.json
          if git diff --cached --quiet; then echo 'No Gate D closure changes'; else git commit -m 'audit: close Manifest v7 Gate D' && git push origin HEAD:batch/20260908-manifest-v7-first10; fi
