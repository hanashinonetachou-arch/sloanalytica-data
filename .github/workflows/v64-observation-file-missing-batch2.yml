name: v6.4 Observation Missing Batch 2

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'research/S_FIRE_DRIFT/machine-observation-data.json'
      - 'research/S_NINJA_JAJAMARU/machine-observation-data.json'
      - 'research/L_ONE_PUNCH_MAN/machine-observation-data.json'
      - 'test/v64-observation-file-missing-batch2.test.mjs'
      - '.github/workflows/v64-observation-file-missing-batch2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Observation repository
        run: node tools/validate-machine-observation-data.mjs
      - name: Run batch regression
        run: node --test test/v64-observation-file-missing-batch2.test.mjs test/v64-observation-trial-universe-audit.test.mjs
      - name: Validate target Observation-to-Selection linkage
        run: node tools/audit-observation-selection-linkage.mjs S_FIRE_DRIFT S_NINJA_JAJAMARU L_ONE_PUNCH_MAN --strict-v2
      - name: Run full tests
        run: npm test
      - name: Run public audit and require zero warnings
        run: |
          set -o pipefail
          npm run audit 2>&1 | tee /tmp/audit.log
          if grep -q '^WARNING' /tmp/audit.log; then cat /tmp/audit.log; exit 1; fi
      - name: Require Semantic 170 PASS
        run: |
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-cross-machine-semantic-audit.json','utf8'));
          if(r.summary?.PASS!==170||r.summary?.REVIEW!==0||r.summary?.HIGH_RISK!==0) throw new Error(JSON.stringify(r.summary));
          NODE
      - name: Run Observation/trial-universe audit
        run: node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json
      - name: Require missing files 4 and HIGH_RISK zero
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-observation-trial-universe-audit.json','utf8'));
          console.log(JSON.stringify(r.summary));
          console.log(JSON.stringify(r.issueCounts));
          if(r.summary?.HIGH_RISK!==0) throw new Error('Observation HIGH_RISK remains');
          if((r.issueCounts?.OBSERVATION_FILE_MISSING??0)!==4) throw new Error(`expected 4 missing Observation files, got ${r.issueCounts?.OBSERVATION_FILE_MISSING??0}`);
          NODE
      - name: Commit refreshed audit reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v64-cross-machine-semantic-audit.json reports/v64-observation-trial-universe-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh after Observation missing batch 2 [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
