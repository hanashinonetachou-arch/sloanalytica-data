name: M7 Hokuto Final Check
on:
  push:
    branches: [audit/m7-phase2-2-hokuto-formalization-final-20260916]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test test/m7-full-fleet-migration-audit.test.mjs
      - run: |
          node tools/audit-m7-full-fleet-migration.mjs --write
          git diff --exit-code -- reports/m7-full-fleet-migration-audit-20260916.json reports/m7-full-fleet-migration-audit-20260916.md
