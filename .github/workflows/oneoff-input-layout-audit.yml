name: One-off input layout audit

on:
  push:
    branches:
      - fix/20260907-input-layout-audit
    paths:
      - .github/workflows/oneoff-input-layout-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit canonical sources and rendered section layout
        run: |
          python - <<'PY'
          import json, pathlib, re

          targets = [
            'LB_TRIPLE_CROWN_SEVEN_FG','L_AKUDAMA_DRIVE_TP','L_FIRE_FORCE_2',
            'L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA','L_JORMUNGAND_ND01G',
            'L_KABANERI_UNATO_KESSEN_XX','L_KYOKOU_SUIRI_ST',
            'L_MILLION_GOD_KISEKI_CX','L_SHINUCHI_YOSHIMUNE_A1','L_UMINEKO_2_A1'
          ]

          def walk(obj, path=''):
              if isinstance(obj, dict):
                  yield path, obj
                  for k,v in obj.items():
                      yield from walk(v, f'{path}.{k}' if path else k)
              elif isinstance(obj, list):
                  for i,v in enumerate(obj):
                      yield from walk(v, f'{path}[{i}]')

          print('=== CANONICAL/SOURCE FILE HITS ===')
          for mid in targets:
              hits=[]
              for p in pathlib.Path('.').rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.json','.md','.mjs','.js'}:
                      continue
                  if '.git' in p.parts or str(p).startswith('machines/'):
                      continue
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  if mid in text:
                      hits.append(str(p))
              print(mid)
              for h in hits: print('  ', h)

          print('\n=== NEXT10 RENDERED UI-LIKE NODES ===')
          for mid in targets:
              p=pathlib.Path('machines')/mid/'machine-package.json'
              data=json.loads(p.read_text(encoding='utf-8'))
              print(f'--- {mid} ---')
              for path,node in walk(data):
                  if not isinstance(node,dict): continue
                  sid=node.get('id') or node.get('sectionId')
                  title=node.get('title') or node.get('label') or node.get('name')
                  if isinstance(sid,str) and ('UI_DESIGN' in sid or sid.startswith('section')):
                      print(path, 'id=',sid,'title=',title)
                      for k in ('inputs','fields','items','controls'):
                          arr=node.get(k)
                          if isinstance(arr,list):
                              vals=[]
                              for x in arr:
                                  if isinstance(x,dict): vals.append({kk:x.get(kk) for kk in ('id','inputId','label','name','featureId','role') if x.get(kk) is not None})
                              if vals: print('   ',k, vals)

          print('\n=== FULL CATALOG SUSPICIOUS ADJACENT SECTIONS ===')
          # Detect UI_DESIGN sections with one denominator/base-looking section adjacent to a hit/count section.
          suspicious=[]
          for p in pathlib.Path('machines').glob('*/machine-package.json'):
              try: data=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              nodes=[]
              for path,node in walk(data):
                  if not isinstance(node,dict): continue
                  sid=node.get('id') or node.get('sectionId')
                  title=node.get('title') or ''
                  if isinstance(sid,str) and 'UI_DESIGN_' in sid:
                      nodes.append((path,node,str(title)))
              # keep unique by id
              uniq=[]; seen=set()
              for path,node,title in nodes:
                  sid=node.get('id') or node.get('sectionId')
                  if sid in seen: continue
                  seen.add(sid); uniq.append((path,node,title))
              for i,(path,node,title) in enumerate(uniq):
                  low=title.lower()
                  is_base = any(s in title for s in ('通常ゲーム','通常時ゲーム','総ゲーム','ゲーム数','試行')) and not any(s in title for s in ('初当','当選','回数','CZ','AT','ボーナス'))
                  if not is_base: continue
                  neigh=[]
                  if i>0: neigh.append(uniq[i-1][2])
                  if i+1<len(uniq): neigh.append(uniq[i+1][2])
                  if any(any(s in t for s in ('初当','当選','回数','CZ','AT','ボーナス')) for t in neigh):
                      suspicious.append((p.parent.name,node.get('id') or node.get('sectionId'),title,neigh))
          print('count=',len(suspicious))
          for row in suspicious: print(row)
          PY
