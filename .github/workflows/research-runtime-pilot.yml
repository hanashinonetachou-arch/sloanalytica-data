name: Research runtime pilot
on:
  pull_request:
    branches: [prototype-multi-machine]
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-concurrency=1 test/research-runtime-adapter.test.mjs
      - run: npm run machine:build:research-pilot -- L_GOBLIN_SLAYER_RD L_LOVEJOU3_M4 L_SMASLO_KAIJI_KYOEN_FJ
      - run: node tools/validate-runtime-machine-package.mjs build/L_GOBLIN_SLAYER_RD/machine-package.generated.json build/L_LOVEJOU3_M4/machine-package.generated.json build/L_SMASLO_KAIJI_KYOEN_FJ/machine-package.generated.json

      - run: node tools/calculate-high-low-discrimination.mjs L_GOBLIN_SLAYER_RD L_LOVEJOU3_M4 L_SMASLO_KAIJI_KYOEN_FJ
      - run: node --test test/high-low-discrimination-reproducibility.test.mjs
      - name: Verify publisher approve and dry-run for pilot packages
        shell: bash
        run: |
          set -euo pipefail
          for id in L_GOBLIN_SLAYER_RD L_LOVEJOU3_M4 L_SMASLO_KAIJI_KYOEN_FJ; do
            npm run machine:publish -- approve "$id"
            npm run machine:publish -- publish "$id"
            npm run machine:publish -- status "$id"
          done
          git diff --exit-code -- catalog.json machines/
      - name: Publish pilot packages on release branch
        if: startsWith(github.head_ref, 'release/publish-research-pilot-three-')
        shell: bash
        run: |
          set -euo pipefail
          for id in L_GOBLIN_SLAYER_RD L_LOVEJOU3_M4 L_SMASLO_KAIJI_KYOEN_FJ; do
            npm run machine:publish -- publish "$id" --apply --defer-audit
          done
          # Generated JSON may preserve legacy whitespace outside this pilot; validate the
          # three materialized outputs directly instead of failing on repository-wide diff --check.
          node tools/validate-runtime-machine-package.mjs \
            machines/L_GOBLIN_SLAYER_RD/machine-package.json \
            machines/L_LOVEJOU3_M4/machine-package.json \
            machines/L_SMASLO_KAIJI_KYOEN_FJ/machine-package.json
          for id in L_GOBLIN_SLAYER_RD L_LOVEJOU3_M4 L_SMASLO_KAIJI_KYOEN_FJ; do
            test -f "machines/$id/machine-package.json"
            grep -q "\"machineId\": \"$id\"" catalog.json
          done
          git status --short
