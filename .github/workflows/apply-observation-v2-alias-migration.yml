name: Apply Observation v2 alias migration

on:
  push:
    branches:
      - audit/20260912-cross-sectional-v7
    paths:
      - tools/migrate-observation-v2-aliases.mjs
      - .github/workflows/apply-observation-v2-alias-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/20260912-cross-sectional-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe aliases
        run: node tools/migrate-observation-v2-aliases.mjs
      - name: Validate Observation repository
        run: node tools/validate-machine-observation-data.mjs
        continue-on-error: true
      - name: Repository tests
        run: npm test
      - name: Repository audit
        run: npm run audit
      - name: Commit migrated Observation files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/*/machine-observation-data.json
          if git diff --cached --quiet; then
            echo 'No Observation aliases required migration.'
            exit 0
          fi
          git commit -m 'Audit: migrate safe Observation v2 aliases'
          git push origin HEAD:audit/20260912-cross-sectional-v7
