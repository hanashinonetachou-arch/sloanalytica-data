name: Next10 user-facing wording cleanup
on:
  push:
    branches: [research/20260903-batch10-next]
    paths: ['.github/workflows/next10-user-facing-wording-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/20260903-batch10-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cleanup and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin research/20260903-batch10-next
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_IZA_BANCHO_SB8','L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK','L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN','LB_TRIPLE_CROWN_SF4','LB_MATADOR_3_TT','L_TENSEI_SHITARA_KEN_DESHITA_GT','L_DARLING_IN_THE_FRANXX_SA','L_SAKI_CHOJO_KESSEN_YR','S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS'];
          const clean=t=>String(t??'').replace(/デフォルト尤度へは入れずREFERENCE。/g,'標準の数値推測には採用しない。').replace(/ためREFERENCE。/g,'ため数値推測には採用しない。').replace(/のでREFERENCE。/g,'ので数値推測には採用しない。').replace(/ずREFERENCE。/g,'ず数値推測には採用しない。').replace(/REFERENCE。/g,'数値推測には採用しない。').replace(/REFERENCE/g,'参考扱い');
          for(const id of ids){
            const sp=`research/${id}/selection-data.json`,s=JSON.parse(fs.readFileSync(sp));
            for(const f of s.features??[]) for(const k of ['userFacingReason','rejectionReason','userReason']) if(typeof f[k]==='string') f[k]=clean(f[k]);
            fs.writeFileSync(sp,JSON.stringify(s,null,2)+'\n');
            const mp=`machines/${id}/machine-package.json`,p=JSON.parse(fs.readFileSync(mp));
            for(const x of [...(p.selectionSummary?.selected??[]),...(p.selectionSummary?.rejected??[])]) x.reason=clean(x.reason);
            fs.writeFileSync(mp,JSON.stringify(p,null,2)+'\n');
          }
          const gp='tools/materialize-next10-reference-layer.mjs'; let g=fs.readFileSync(gp,'utf8');
          g=g.replace(/デフォルト尤度へは入れずREFERENCE。/g,'標準の数値推測には採用しない。').replace(/ためREFERENCE。/g,'ため数値推測には採用しない。').replace(/のでREFERENCE。/g,'ので数値推測には採用しない。').replace(/ずREFERENCE。/g,'ず数値推測には採用しない。').replace(/REFERENCE。/g,'数値推測には採用しない。'); fs.writeFileSync(gp,g);
          for(const id of ids){const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`));for(const f of s.features??[])for(const k of ['userFacingReason','rejectionReason','userReason'])if(/REFERENCE/.test(String(f[k]??'')))throw new Error(`${id}:${k}`);const p=JSON.parse(fs.readFileSync(`machines/${id}/machine-package.json`));for(const x of [...(p.selectionSummary?.selected??[]),...(p.selectionSummary?.rejected??[])])if(/REFERENCE/.test(String(x.reason??'')))throw new Error(`${id}:package`)}
          NODE
          ids=(L_IZA_BANCHO_SB8 L_ZETTAI_SHOGEKI_PLATONIC_HEART_TK L_WATASHI_NO_SHIAWASE_NA_KEKKON_PN LB_TRIPLE_CROWN_SF4 LB_MATADOR_3_TT L_TENSEI_SHITARA_KEN_DESHITA_GT L_DARLING_IN_THE_FRANXX_SA L_SAKI_CHOJO_KESSEN_YR S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS)
          for id in "${ids[@]}"; do node tools/validate-selection-data.mjs "research/$id/selection-data.json" "research/$id/research-data.json"; done
          npm test
          git add research machines tools/materialize-next10-reference-layer.mjs
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'ux: remove internal REFERENCE wording from reasons'
          git push origin HEAD:research/20260903-batch10-next
