name: Batch Publish Pipeline Regression

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - "tools/batch-publish-pipeline.mjs"
      - "test/batch-publish-pipeline.test.mjs"
      - "package.json"
      - ".github/workflows/batch-publish-pipeline-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository tests
        run: npm test

      - name: Verify dry-run is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          npm run machine:publish:batch -- L_BAKI_L3 L_HOKUTO_AD_XR
          git diff --exit-code -- catalog.json difficulty-catalog.json machines/
          test -z "$(git status --porcelain -- build/L_BAKI_L3 build/L_HOKUTO_AD_XR)"

      - name: Verify help
        run: npm run machine:publish:batch -- --help
