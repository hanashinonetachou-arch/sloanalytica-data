name: Batch Publish Pipeline Regression

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - "tools/batch-publish-pipeline.mjs"
      - "test/batch-publish-pipeline.test.mjs"
      - "package.json"
      - ".github/workflows/batch-publish-pipeline-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository tests
        run: npm test

      - name: Verify dry-run is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          # The PR may legitimately carry unrelated MachinePackage changes (for example V8 publication).
          # Exercise the legacy batch dry-run against a clean base snapshot so its scope guard tests the
          # batch operation itself rather than pre-existing PR content.
          git diff --binary "${{ github.event.pull_request.base.sha }}" -- catalog.json difficulty-catalog.json machines/ > /tmp/preexisting-machine-data.patch
          git restore --source="${{ github.event.pull_request.base.sha }}" -- catalog.json difficulty-catalog.json machines/
          # The batch scope guard compares HEAD with prototype-multi-machine, so test it from an
          # isolated temporary commit whose tree contains the clean base MachineData snapshot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json difficulty-catalog.json machines/
          git commit -m "test: isolate legacy batch dry-run" --no-verify
          npm run machine:publish:batch -- L_BAKI_L3 L_HOKUTO_AD_XR
          git diff --exit-code -- catalog.json difficulty-catalog.json machines/
          test -z "$(git status --porcelain -- build/L_BAKI_L3 build/L_HOKUTO_AD_XR)"
          git apply /tmp/preexisting-machine-data.patch

      - name: Verify help
        run: npm run machine:publish:batch -- --help
