name: Backfill machine identity audit 20260906

on:
  push:
    branches: [fix/identity-audit-backfill-20260906]
    paths: ['.github/workflows/backfill-machine-identity-audit-20260906.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-audit-backfill-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate guarded checkpoints 20-25
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const auditPath='reports/machine-identity-classification-audit.json';
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const existing=[];
          for(const rel of audit.checkpointFiles??[]){
            const cp=JSON.parse(fs.readFileSync(rel,'utf8'));
            for(const e of cp.entries??[]) existing.push(e.machineId);
          }
          const seen=new Set(existing);
          const production=(catalog.machines??[]).filter(m=>m.machineId!=='S_REVUE_STARLIGHT_CX_TEST_V66');
          const missing=production.filter(m=>!seen.has(m.machineId));
          if(missing.length!==59) throw new Error(`expected 59 unaudited production machines, got ${missing.length}`);
          const validMachine=new Set(['SMART_SLOT','MEDAL']);
          const validGame=new Set(['A_TYPE','AT','A_AT','A_ART','BT']);
          const entries=[];
          for(const c of missing){
            const p=`machines/${c.machineId}/machine-package.json`;
            if(!fs.existsSync(p)) throw new Error(`${c.machineId}: package missing`);
            const pkg=JSON.parse(fs.readFileSync(p,'utf8'));
            const m=pkg.machine??{};
            if(m.machineId!==c.machineId) throw new Error(`${c.machineId}: package machineId mismatch`);
            for(const key of ['introductionDate','machineType','gameType']){
              if(c[key]!==m[key]) throw new Error(`${c.machineId}: catalog/package ${key} mismatch: ${c[key]} vs ${m[key]}`);
            }
            if(!/^\d{4}-\d{2}-\d{2}$/.test(c.introductionDate??'')) throw new Error(`${c.machineId}: invalid introductionDate`);
            if(!validMachine.has(c.machineType)) throw new Error(`${c.machineId}: invalid machineType ${c.machineType}`);
            if(!validGame.has(c.gameType)) throw new Error(`${c.machineId}: invalid gameType ${c.gameType}`);
            entries.push({machineId:c.machineId,displayName:c.displayName??m.displayName??c.machineId,introductionDate:c.introductionDate,machineType:c.machineType,gameType:c.gameType,sources:['Canonical catalog + machine-package identity, established by prior batch Machine Identity/Gate0; 2026-09-06 audit-ledger backfill']});
          }
          entries.sort((a,b)=>{
            const ca=production.findIndex(x=>x.machineId===a.machineId), cb=production.findIndex(x=>x.machineId===b.machineId);return ca-cb;
          });
          const chunks=[]; for(let i=0;i<entries.length;i+=10) chunks.push(entries.slice(i,i+10));
          if(chunks.length!==6) throw new Error(`expected 6 checkpoint chunks, got ${chunks.length}`);
          const newFiles=[];
          chunks.forEach((chunk,i)=>{
            const batch=20+i; const rel=`reports/machine-identity-classification-batch-${String(batch).padStart(2,'0')}.json`;
            const doc={schemaVersion:'machine-identity-classification-batch-v1',batch,resolved:chunk.length,unresolved:0,entries:chunk};
            fs.writeFileSync(rel,JSON.stringify(doc,null,2)+'\n'); newFiles.push(rel);
          });
          audit.updatedAt='2026-09-06';
          audit.progress.resolvedProductionMachines=production.length;
          audit.progress.unresolvedProductionMachines=0;
          audit.progress.completedBatches=[...Array(25)].map((_,i)=>i+1);
          audit.checkpointFiles=[...(audit.checkpointFiles??[]).filter(x=>!newFiles.includes(x)),...newFiles];
          audit.notes=[
            `Catalog enumeration refreshed through 2026-09-06: all ${production.length} production machine IDs are covered by checkpoints 01-25, with 0 unresolved values and 1 explicit test-only machine excluded.`,
            'Checkpoints 20-25 backfill the 59 production machines published after the previous 2026-08-31 / 190-machine identity-audit snapshot.',
            'Backfill was accepted only where catalog.json and machine-package.json matched exactly on introductionDate, machineType, and gameType.',
            ...(audit.notes??[]).filter(n=>!String(n).startsWith('Catalog enumeration is complete:')&&!String(n).startsWith('All completed batches'))
          ];
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          console.log(`PASS generated ${entries.length} identity entries in checkpoints 20-25; production=${production.length}`);
          EOF
      - name: Apply canonical identity metadata and verify
        run: |
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
      - name: Repository regression checks
        run: |
          npm run registry:validate
          npm run audit
          npm test
      - name: Assert no unexpected identity rewrite
        shell: bash
        run: |
          git status --short
          node --input-type=module <<'EOF'
          import {execFileSync} from 'node:child_process';
          const changed=execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).map(x=>x.slice(3));
          const bad=changed.filter(p=>!(p==='catalog.json'||p==='machine-identity-metadata.json'||p==='reports/machine-identity-classification-audit.json'||/^reports\/machine-identity-classification-batch-(20|21|22|23|24|25)\.json$/.test(p)||/^machines\/[^/]+\/machine-package\.json$/.test(p)));
          if(bad.length) throw new Error(`unexpected files: ${bad.join(', ')}`);
          EOF
      - name: Commit backfill
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-identity-metadata.json reports/machine-identity-classification-audit.json reports/machine-identity-classification-batch-{20,21,22,23,24,25}.json machines/*/machine-package.json
          git commit -m 'audit: backfill machine identity checkpoints 20-25'
          git pull --rebase origin fix/identity-audit-backfill-20260906
          git push origin HEAD:fix/identity-audit-backfill-20260906
