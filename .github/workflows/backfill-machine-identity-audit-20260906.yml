name: Backfill machine identity audit 20260906

on:
  push:
    branches: [fix/identity-audit-backfill-20260906]
    paths: ['.github/workflows/backfill-machine-identity-audit-20260906.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-audit-backfill-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate guarded checkpoints 20-24 from historical and web-verified sources
        shell: bash
        run: |
          git fetch origin fix/identity-audit-recover-fast-20260906:refs/remotes/origin/fix/identity-audit-recover-fast-20260906
          git show origin/fix/identity-audit-recover-fast-20260906:reports/machine-identity-fast-recovery-20260906.json > /tmp/fast-recovery.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const auditPath='reports/machine-identity-classification-audit.json';
          const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8'));
          const fast=JSON.parse(fs.readFileSync('/tmp/fast-recovery.json','utf8'));
          const web=JSON.parse(fs.readFileSync('reports/machine-identity-web-reverification-20260906.json','utf8'));
          const validMachine=new Set(['SMART_SLOT','MEDAL']);
          const validGame=new Set(['A_TYPE','AT','A_AT','A_ART','BT']);
          const existing=[];
          for(const rel of audit.checkpointFiles??[]){const cp=JSON.parse(fs.readFileSync(rel,'utf8'));for(const e of cp.entries??[])existing.push(e.machineId);}
          const seen=new Set(existing);
          const production=(catalog.machines??[]).filter(m=>m.machineId!=='S_REVUE_STARLIGHT_CX_TEST_V66');
          const missing=production.filter(m=>!seen.has(m.machineId));
          if(production.length!==239) throw new Error(`expected 239 production machines, got ${production.length}`);
          if(missing.length!==49) throw new Error(`expected 49 identity ledger gaps, got ${missing.length}`);
          const fastBy=new Map((fast.rows??[]).map(x=>[x.machineId,x]));
          const webBy=new Map((web.entries??[]).map(x=>[x.machineId,x]));
          if(webBy.size!==30) throw new Error(`expected 30 web-reverified entries, got ${webBy.size}`);
          const registryBy=new Map((registry.machines??[]).map(x=>[x.machineId,x]));
          const entries=[];
          const provenanceCounts={HISTORICAL:0,WEB_REVERIFIED:0};
          for(const c of missing){
            const hist=fastBy.get(c.machineId)?.uniqueTriples??[];
            const webEntry=webBy.get(c.machineId)??null;
            let src=null, provenance=null, sources=[];
            if(hist.length===1){
              src=hist[0]; provenance='HISTORICAL'; sources=[...(src.sources??[])];
              if(webEntry){
                const wk=`${webEntry.introductionDate}|${webEntry.machineType}|${webEntry.gameType}`;
                if(wk!==src.triple) throw new Error(`${c.machineId}: historical/web identity conflict ${src.triple} vs ${wk}`);
                sources.push(webEntry.sourceUrl);
              }
            } else if(hist.length===0 && webEntry){
              src=webEntry; provenance='WEB_REVERIFIED'; sources=[webEntry.sourceUrl,webEntry.sourceNote];
            } else if(hist.length>1){
              throw new Error(`${c.machineId}: multiple historical identity triples: ${hist.map(x=>x.triple).join(', ')}`);
            } else {
              throw new Error(`${c.machineId}: no resolved historical or web identity source`);
            }
            if(!/^\d{4}-\d{2}-\d{2}$/.test(src.introductionDate??'')) throw new Error(`${c.machineId}: invalid introductionDate`);
            if(!validMachine.has(src.machineType)) throw new Error(`${c.machineId}: invalid machineType ${src.machineType}`);
            if(!validGame.has(src.gameType)) throw new Error(`${c.machineId}: invalid gameType ${src.gameType}`);
            const reg=registryBy.get(c.machineId); if(!reg) throw new Error(`${c.machineId}: registry row missing`);
            if(reg.releaseDateStatus==='VERIFIED' && reg.releaseDate && reg.releaseDate!==src.introductionDate)
              throw new Error(`${c.machineId}: existing VERIFIED registry date ${reg.releaseDate} conflicts with recovered ${src.introductionDate}`);
            reg.releaseDate=src.introductionDate;
            reg.releaseDateStatus='VERIFIED';
            const packagePath=`machines/${c.machineId}/machine-package.json`;
            if(!fs.existsSync(packagePath)) throw new Error(`${c.machineId}: package missing`);
            const pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));
            if(pkg?.machine?.machineId!==c.machineId) throw new Error(`${c.machineId}: package machineId mismatch`);
            entries.push({machineId:c.machineId,displayName:c.displayName??pkg.machine.displayName??c.machineId,introductionDate:src.introductionDate,machineType:src.machineType,gameType:src.gameType,sources:[...new Set(sources)],provenance});
            provenanceCounts[provenance]++;
          }
          if(entries.length!==49) throw new Error(`expected 49 resolved entries, got ${entries.length}`);
          if(provenanceCounts.HISTORICAL!==19||provenanceCounts.WEB_REVERIFIED!==30)
            throw new Error(`unexpected provenance split ${JSON.stringify(provenanceCounts)}`);
          const chunks=[];for(let i=0;i<entries.length;i+=10)chunks.push(entries.slice(i,i+10));
          if(chunks.length!==5||chunks.at(-1).length!==9)throw new Error(`unexpected chunking ${chunks.map(x=>x.length)}`);
          const newFiles=[];
          chunks.forEach((chunk,i)=>{const batch=20+i;const rel=`reports/machine-identity-classification-batch-${String(batch).padStart(2,'0')}.json`;fs.writeFileSync(rel,JSON.stringify({schemaVersion:'machine-identity-classification-batch-v1',batch,resolved:chunk.length,unresolved:0,entries:chunk},null,2)+'\n');newFiles.push(rel);});
          audit.updatedAt='2026-09-06';
          audit.progress.catalogEnumeration='COMPLETE';
          audit.progress.resolvedProductionMachines=production.length;
          audit.progress.unresolvedProductionMachines=0;
          audit.progress.completedBatches=[...Array(24)].map((_,i)=>i+1);
          audit.checkpointFiles=[...(audit.checkpointFiles??[]).filter(x=>!/^reports\/machine-identity-classification-batch-(20|21|22|23|24)\.json$/.test(x)),...newFiles];
          audit.notes=[
            `Catalog enumeration refreshed through 2026-09-06: all ${production.length} production machine IDs are covered by checkpoints 01-24, with 0 unresolved values and 1 explicit test-only machine excluded.`,
            `Checkpoints 20-24 backfill 49 machines: ${provenanceCounts.HISTORICAL} recovered from historical structured Gate0/Identity artifacts and ${provenanceCounts.WEB_REVERIFIED} re-verified from public machine-information sources.`,
            'Any pre-existing VERIFIED registry releaseDate was required to match the recovered identity date exactly; conflicts block the workflow.',
            ...(audit.notes??[]).filter(n=>!String(n).startsWith('Catalog enumeration is complete:')&&!String(n).startsWith('All completed batches')&&!String(n).startsWith('Catalog enumeration refreshed through')&&!String(n).startsWith('Checkpoints 20-'))
          ];
          fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
          fs.writeFileSync('machine-registry.json',JSON.stringify(registry,null,2)+'\n');
          fs.writeFileSync('reports/machine-identity-backfill-20260906-summary.json',JSON.stringify({generatedAt:new Date().toISOString(),productionMachineCount:production.length,backfilledMachineCount:entries.length,provenanceCounts,checkpointFiles:newFiles},null,2)+'\n');
          console.log(`PASS identity source resolution 49/49 historical=${provenanceCounts.HISTORICAL} web=${provenanceCounts.WEB_REVERIFIED}`);
          EOF
      - name: Apply canonical identity metadata and verify
        run: |
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
      - name: Repository regression checks
        run: |
          npm run registry:validate
          npm run audit
          npm test
      - name: Assert mutation allowlist
        shell: bash
        run: |
          git status --short
          node --input-type=module <<'EOF'
          import {execFileSync} from 'node:child_process';
          const raw=execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim();
          const changed=raw?raw.split('\n').map(x=>x.slice(3)):[];
          const bad=changed.filter(p=>!(p==='catalog.json'||p==='machine-registry.json'||p==='machine-identity-metadata.json'||p==='reports/machine-identity-classification-audit.json'||p==='reports/machine-identity-backfill-20260906-summary.json'||/^reports\/machine-identity-classification-batch-(20|21|22|23|24)\.json$/.test(p)||/^machines\/[^/]+\/machine-package\.json$/.test(p)));
          if(bad.length) throw new Error(`unexpected files: ${bad.join(', ')}`);
          EOF
      - name: Commit backfill
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-registry.json machine-identity-metadata.json reports/machine-identity-classification-audit.json reports/machine-identity-backfill-20260906-summary.json reports/machine-identity-classification-batch-{20,21,22,23,24}.json machines/*/machine-package.json
          git commit -m 'audit: backfill machine identity checkpoints 20-24'
          git pull --rebase origin fix/identity-audit-backfill-20260906
          git push origin HEAD:fix/identity-audit-backfill-20260906
