name: Apply Code Geass Identity Audit
on:
  push:
    branches:
      - prototype-multi-machine
    paths:
      - reports/.geass-identity-apply-trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and verify canonical identity metadata
        run: |
          node tools/apply-machine-identity-classification.mjs --apply
          node tools/apply-machine-identity-classification.mjs --verify
      - name: Commit identity-normalized package and catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machine-identity-metadata.json machines/S_CODE_GEASS_R2_CC_ZS/machine-package.json
          git commit -m "Normalize Code Geass R2 C.C. identity metadata [skip ci]"
          git push origin HEAD:prototype-multi-machine
