name: Iza Bancho field reselection

on:
  push:
    branches:
      - research/20260903-batch10-next
    paths:
      - '.github/workflows/iza-bancho-field-reselection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/20260903-batch10-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Iza Bancho Research Selection Observation UI changes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id='L_IZA_BANCHO_SB8';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const rp=`research/${id}/research-data.json`;
          const sp=`research/${id}/selection-data.json`;
          const op=`research/${id}/machine-observation-data.json`;
          const up=`research/${id}/ui-design-data.json`;
          const r=read(rp), s=read(sp), o=read(op), u=read(up);

          const miimoSource={
            sourceId:'SRC_MIIMO_NANA',publisher:'なな徹',
            title:'いざ番長 設定差・設定示唆演出まとめ（絶頂決戦ミーモ斬シング）',
            url:'https://nana-press.com/kaiseki/machine/946/29776/',checkedAt:'2026-09-04',sourceType:'major_analysis'
          };
          if(!r.sources.some(x=>x.sourceId===miimoSource.sourceId)) r.sources.push(miimoSource);
          if(!o.sources.some(x=>x.sourceId===miimoSource.sourceId)) o.sources.push(miimoSource);

          let rf=r.features.find(x=>x.researchFeatureId==='RF_MIIMO_ZECCHO');
          const feature={
            researchFeatureId:'RF_MIIMO_ZECCHO',name:'絶頂決戦開始時 ミーモ斬シング発生',factStatus:'verified',candidateModel:'binomial',
            trialUnit:'絶頂決戦突入1回',numeratorDefinition:'絶頂決戦開始時にミーモ斬シングが発生した回数',denominatorDefinition:'絶頂決戦へ突入した回数',
            settingValues:{
              SET_1:{probability:0.06,rawDisplay:'6%'},SET_2:{probability:0.06,rawDisplay:'6%'},SET_3:{probability:0.10,rawDisplay:'10%'},
              SET_4:{probability:0.06,rawDisplay:'6%'},SET_5:{probability:0.16,rawDisplay:'16%'},SET_6:{probability:0.16,rawDisplay:'16%'}
            },sourceRefs:['SRC_MIIMO_NANA'],crossSourceStatus:'cross_checked',
            notes:'絶頂決戦開始時に毎回1試行。発生時は設定3・5・6、とくに5・6を相対的に押し上げるが、絶頂決戦自体が低頻度のため補助Featureとして扱う。未発生少数回を強い低設定根拠にしない。'
          };
          if(rf) Object.assign(rf,feature); else r.features.push(feature);

          // Existing rejected factors remain rejected after reselection.
          const direct=s.features.find(x=>x.researchFeatureId==='RF_REF_DIRECT_BIG');
          if(direct){
            const reason='通常時の番長ボーナス直撃には大きな設定差がありダイトモでも状態別回数を確認できるが、AT初当り合算の構成経路に含まれるため、AT初当りと独立に掛けると同じ初当り事象を二重評価するおそれがある。joint modelを導入しない現行方式では数値推測に併用しない。';
            direct.userFacingReason=reason;direct.rejectionReason=reason;
          }
          const weak=s.features.find(x=>x.researchFeatureId==='RF_REF_WEAK_CHERRY');
          if(weak){
            const reason='ダイトモで自動取得できるが、設定1の1/79.9に対して設定6でも1/77.6と差が小さく、7000G規模でも設定判別への追加情報量が小さいため数値推測には採用しない。';
            weak.userFacingReason=reason;weak.rejectionReason=reason;
          }

          const ensureInput=x=>{const old=s.inputs.find(i=>i.id===x.id);if(old)Object.assign(old,x);else s.inputs.push(x)};
          ensureInput({id:'INP_MIIMO_ZECCHO_COUNT',name:'ミーモ斬シング発生 回数',category:'SEL_FEAT_MIIMO_ZECCHO',type:'counter',unit:'回',displayOrder:20,inferenceRole:'INCLUDE_SUPPORT',defaultValue:''});
          ensureInput({id:'INP_ZECCHO_BATTLE_TRIALS',name:'絶頂決戦突入 回数',category:'SEL_FEAT_MIIMO_ZECCHO',type:'integer',unit:'回',displayOrder:21,inferenceRole:'INCLUDE_SUPPORT',defaultValue:''});
          let sf=s.features.find(x=>x.researchFeatureId==='RF_MIIMO_ZECCHO');
          const selected={researchFeatureId:'RF_MIIMO_ZECCHO',featureId:'FEAT_MIIMO_ZECCHO',adoptionCategory:'INCLUDE_SUPPORT',weight:1,
            numeratorInputId:'INP_MIIMO_ZECCHO_COUNT',denominatorInputId:'INP_ZECCHO_BATTLE_TRIALS',
            userReason:'絶頂決戦突入1回を1試行として開始時のミーモ斬シング発生を観測でき、設定1・2・4の6%に対して設定3は10%、設定5・6は16%と明確な設定差がある。試行機会が少ないため主軸ではなく補助要素として採用する。',
            difficultyParticipation:'EXCLUDE',difficultyExclusionReason:'絶頂決戦の突入回数は通常ゲーム数から安定して固定換算できず、7000Gでも試行数が少ないため共通Difficultyには混ぜない。'};
          if(sf)Object.assign(sf,selected);else s.features.push(selected);
          s.uiCategoryLabels.SEL_FEAT_MIIMO_ZECCHO='絶頂決戦 ミーモ斬シング';

          // User-provided Daito result screenshots: concrete linked-service fields.
          o.sourceCoverage.linkedService='FOUND';
          const addObs=(x)=>{const old=o.observations.find(y=>y.observationId===x.observationId);if(old)Object.assign(old,x);else o.observations.push(x)};
          addObs({observationId:'OBS_AT_INITIAL_DAITOMO',sourceType:'LINKED_SERVICE',observationMode:'LINKED_SERVICE_READ',status:'FOUND',label:'AT初当り（ダイトモ）',
            categories:['頂ZBASH突入回数','通常プレイ数'],timing:['ダイトモの同一遊技結果画面で頂ZBASH突入回数と通常プレイ数を確認'],
            excludedConditions:['AT中の再突入や上位AT引き戻し等が頂ZBASH突入回数へ含まれる表示条件では使用しない','別セッションの通常プレイ数と突入回数を混在させない'],
            sourceRefs:['SRC_1GEKI','SRC_NANA'],notes:'2026-09-04ユーザー実機提供画面で、通常プレイ1527G・頂ZBASH突入4回・表示率1/381.8が一致することを確認。ダイトモ表示内で分子と分母を同一セッションの組として使う。'});
          addObs({observationId:'OBS_MIIMO_ZECCHO',sourceType:'DIRECT_PLAY',observationMode:'VISUAL_EVENT',status:'FOUND',label:'絶頂決戦開始時 ミーモ斬シング',
            categories:['絶頂決戦突入 回数','ミーモ斬シング発生 回数'],timing:['絶頂決戦へ突入するたび開始時BGMを確認'],
            excludedConditions:['絶頂決戦開始時以外のBGM変化を数えない','絶頂決戦に突入していない区間を分母へ入れない','未観測を0回として扱わない'],sourceRefs:['SRC_MIIMO_NANA'],notes:'1回の絶頂決戦突入につき1試行。'});
          const atMap=o.featureMappings.find(x=>x.featureId==='FEAT_AT_INITIAL');
          if(atMap){atMap.mappingType='OPTIONAL_SOURCE';atMap.observationIds=['OBS_AT_INITIAL','OBS_AT_INITIAL_DAITOMO'];atMap.collectionMethods=['MANUAL_COUNTER','LINKED_SERVICE_READ'];atMap.notes='手動またはダイトモの同一取得経路を使用。ダイトモでは頂ZBASH突入回数と通常プレイ数を同一結果画面の組として使う。';}
          if(!o.featureMappings.some(x=>x.featureId==='FEAT_MIIMO_ZECCHO'))o.featureMappings.push({featureId:'FEAT_MIIMO_ZECCHO',mappingType:'EXACT',observationIds:['OBS_MIIMO_ZECCHO'],collectionMethods:['VISUAL_EVENT'],usableForInference:true,usableForDifficulty:false,notes:'絶頂決戦開始時のBGMを毎回確認する。'});
          o.fieldVerificationNotes ??=[];
          const fieldNote='2026-09-04 ユーザー提供ダイトモ結果画面で、総プレイ数・通常プレイ数・弱チェリー・弁当・強チェリー・チャンス目・共通10枚ベル・刺客ZONE突入/成功・状態別番長ボーナス・頂ZBASH突入/率・決闘勝敗等の自動集計を確認。取得可能であることと数値推測採用は分離して評価した。';
          if(!o.fieldVerificationNotes.includes(fieldNote))o.fieldVerificationNotes.push(fieldNote);

          // UI design for the new support feature and Daito alternative path.
          if(!u.sectionOrder.includes('絶頂決戦 ミーモ斬シング'))u.sectionOrder.push('絶頂決戦 ミーモ斬シング');
          u.sections['絶頂決戦 ミーモ斬シング']={inputIds:['INP_MIIMO_ZECCHO_COUNT','INP_ZECCHO_BATTLE_TRIALS'],
            description:'絶頂決戦へ突入するたび1回を母数として、開始時に「ミーモ斬シング」が流れた回数を入力します。絶頂決戦以外のBGM変化は含めません。',
            observationRole:'DIRECT_PLAY',observationRefs:['OBS_MIIMO_ZECCHO'],acquisitionSources:['DIRECT_PLAY'],collapsible:false,defaultExpanded:true};
          u.inputContracts.INP_MIIMO_ZECCHO_COUNT={name:'ミーモ斬シング発生',mode:'COUNTER',gridSpan:6,directInput:false,compact:true,step:1,quickAdd:[1],quickInputEligible:true,inputVisible:true,emptyMeansUnobserved:true,observedZeroAllowed:true};
          u.inputContracts.INP_ZECCHO_BATTLE_TRIALS={name:'絶頂決戦突入回数（母数）',mode:'NUMBER',gridSpan:12,directInput:true,quickAdd:[1],quickInputEligible:false,inputVisible:true,emptyMeansUnobserved:true,observedZeroAllowed:true};
          if(u.sections['AT初当り']){
            u.sections['AT初当り'].observationRefs=['OBS_AT_INITIAL','OBS_AT_INITIAL_DAITOMO'];
            u.sections['AT初当り'].acquisitionSources=['DIRECT_PLAY','LINKED_SERVICE'];
            u.sections['AT初当り'].description='母数にはAT初当りの対象となる通常時ゲームを入力します。手動で記録する場合は分子・分母を同じ区間で揃えます。ダイトモを使う場合は、同一結果画面の「頂ZBASH突入回数」と「通常プレイ数」の組を使用します。';
          }
          u.auditNotes=(u.auditNotes??[]).filter(x=>!String(x).includes('REFERENCE'));
          if(!u.auditNotes.includes('ダイトモで取得できる項目でも、公開された設定別確率と同一の観測定義を確認できないものは数値推測へ自動採用しない。'))u.auditNotes.push('ダイトモで取得できる項目でも、公開された設定別確率と同一の観測定義を確認できないものは数値推測へ自動採用しない。');

          // Keep research-side rejection notes free of internal labels as well.
          for(const f of r.features){if(typeof f.notes==='string')f.notes=f.notes.replace(/REFERENCE/g,'参考扱い');}

          write(rp,r);write(sp,s);write(op,o);write(up,u);
          const report={schemaVersion:'iza-bancho-field-reselection-v1',reviewedAt:'2026-09-04',machineId:id,status:'APPLIED_PENDING_REAUDIT',
            adopted:['AT初当り（ダイトモを代替取得経路として追加）','共通ベルA（ダイトモ自動取得を継続）','絶頂決戦開始時ミーモ斬シング（INCLUDE_SUPPORT）'],
            notAdopted:[
              {name:'通常時番長ボーナス直撃',reason:'設定差は大きくダイトモ取得可能だが、AT初当り合算との包含関係により現行の独立尤度積では二重評価リスクがある。'},
              {name:'弱チェリー',reason:'ダイトモ取得可能だが設定差が小さく7000Gでの追加情報量が小さい。'},
              {name:'刺客ZONE成功率',reason:'ダイトモで突入/成功は取得できるが、全設定の同一定義成功率テーブルを現時点で採用根拠として確定できない。'},
              {name:'状態別番長ボーナス・決闘・頂ZBASH周辺の各種回数',reason:'取得可能性は確認したが、独立した設定別確率と分母定義の一致を確認できた項目だけを数値推測へ採用する方針のため保留。'}
            ]};
          write('reports/iza-bancho-field-reselection.json',report);
          NODE

      - name: Validate source layers
        run: |
          set -euo pipefail
          node tools/validate-research-data.mjs research/L_IZA_BANCHO_SB8/research-data.json
          node tools/validate-selection-data.mjs research/L_IZA_BANCHO_SB8/selection-data.json research/L_IZA_BANCHO_SB8/research-data.json
          node tools/validate-machine-observation-data.mjs research/L_IZA_BANCHO_SB8/machine-observation-data.json
          node tools/validate-ui-design-data.mjs research/L_IZA_BANCHO_SB8/ui-design-data.json
          npm run observation:selection:audit -- L_IZA_BANCHO_SB8 --strict-v2
          npm run ui-design:observation:audit -- L_IZA_BANCHO_SB8 --strict-v2

      - name: Rebuild Iza MachineData
        run: npm run machine:batch -- L_IZA_BANCHO_SB8

      - name: Reaudit
        run: |
          set -euo pipefail
          npm run pipeline:four-layer:gate -- L_IZA_BANCHO_SB8
          npm run registry:validate
          npm run audit:ui-service-names
          npm test
          npm run audit

      - name: Mark PASS and commit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='reports/iza-bancho-field-reselection.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));x.status='PASS_REAUDITED';fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_IZA_BANCHO_SB8 machines/L_IZA_BANCHO_SB8 reports/iza-bancho-field-reselection.json
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'research: reselect Iza Bancho from Daito field findings'
          git pull --rebase origin research/20260903-batch10-next
          git push origin HEAD:research/20260903-batch10-next
