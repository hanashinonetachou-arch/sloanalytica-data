name: Magia Device UX3
on:
  push:
    branches: [fix/20260902-magia-device-ux3]
    paths:
      - tools/apply-magia-device-ux3.mjs
      - .github/workflows/magia-device-ux3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260902-magia-device-ux3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-magia-device-ux3.mjs
      - run: npm run ui-design:validate
      - run: npm run machine:pipeline -- L_MAGIA_RECORD_RN --skip-repo-checks
      - name: UX contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('machines/L_MAGIA_RECORD_RN/machine-package.json','utf8'));
          const ui=p.ui.sections;
          const first=ui.find(s=>s.title==='通常時・初当り');
          if(!first) throw new Error('merged first-hit section missing');
          const expectedFirst=['INP_NORMAL_GAME_COUNT','INP_BONUS_FIRST_HIT_COUNT','INP_AT_FIRST_HIT_COUNT'];
          if(JSON.stringify(first.items.map(x=>x.inputId))!==JSON.stringify(expectedFirst)) throw new Error('merged first-hit item order mismatch');
          const titles=ui.map(s=>s.title);
          const seq=['ストーリー5話開始','ストーリーコンプリート','エンディングカード'];
          const idx=seq.map(x=>titles.indexOf(x));
          if(idx.some(x=>x<0)||!(idx[0]<idx[1]&&idx[1]<idx[2])) throw new Error(`evidence order mismatch: ${idx}`);
          const weak=ui.find(s=>s.title==='弱チェリー');
          const wt=weak.items.find(x=>x.inputId==='INP_WEAK_CHERRY_TRIALS');
          if(!wt||wt.label!=='カウント対象G数'||wt.gridSpan!==6) throw new Error('weak cherry denominator UX mismatch');
          if(p.machine.machineDataVersion!=='0.1.3') throw new Error('version mismatch');
          console.log('Magia UX3 contract PASS');
          NODE
      - run: npm run ui-design:test
      - run: npm test
      - run: npm run audit
      - name: Persist generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/L_MAGIA_RECORD_RN machines/L_MAGIA_RECORD_RN catalog.json difficulty-catalog.json machine-registry.json reports tools/machine-pipeline.mjs tools/materialize-ui-design.mjs 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: refine Magia input grouping and labels'
          git push origin HEAD:fix/20260902-magia-device-ux3
