name: v6.4 Accelerator CZ Composition

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-accelerator-cz-composition.mjs'
      - 'tools/audit-v64-causal-relations.mjs'
      - 'test/accelerator-cz-composition.test.mjs'
      - 'test/v64-causal-relation-audit.test.mjs'
      - '.github/workflows/v64-accelerator-cz-composition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry-run composition migration
        run: node tools/migrate-v64-accelerator-cz-composition.mjs .
      - name: Apply composition migration
        run: node tools/migrate-v64-accelerator-cz-composition.mjs . --apply
      - name: Run Accelerator composition regression
        run: node --test test/accelerator-cz-consistency.test.mjs test/accelerator-cz-composition.test.mjs
      - name: Rebuild target machine package
        run: npm run machine:pipeline -- L_TOARU_ACCELERATOR_RZ --skip-repo-checks
      - name: Refresh v6.4 semantic audit before full tests
        run: node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
      - name: Run full test suite
        run: npm test
      - name: Run public-data audit
        run: npm run audit
      - name: Run UI service-name audit
        run: npm run audit:ui-service-names
      - name: Run Observation linkage and gate target only
        run: |
          set +e
          npm run observation:selection:audit 2>&1 | tee /tmp/observation-linkage.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '^ERROR: L_TOARU_ACCELERATOR_RZ:' /tmp/observation-linkage.log; then
            echo 'Target machine introduced an Observation -> Selection linkage error.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Global Observation linkage audit still has pre-existing errors outside this batch; recorded as REVIEW.'
          fi
      - name: Run four-layer gate
        run: npm run pipeline:four-layer:gate -- L_TOARU_ACCELERATOR_RZ
      - name: Run v6.4 causal relation review
        run: node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Show semantic diff
        run: |
          git status --short
          git --no-pager diff --stat
          git --no-pager diff -- research/L_TOARU_ACCELERATOR_RZ
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/L_TOARU_ACCELERATOR_RZ machines/L_TOARU_ACCELERATOR_RZ catalog.json difficulty-catalog.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json test/accelerator-cz-composition.test.mjs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "feat: preserve Accelerator CZ history with type composition"
            git push origin HEAD:prototype-multi-machine
          fi
