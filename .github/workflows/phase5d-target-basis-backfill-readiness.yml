name: Phase 5d Target Basis Backfill Readiness

on:
  pull_request:
    branches:
      - prototype-multi-machine
    paths:
      - 'research/**/selection-data.json'
      - 'research/**/research-data.json'
      - 'tools/audit-target-basis-backfill-readiness.mjs'
      - '.github/workflows/phase5d-target-basis-backfill-readiness.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit target basis metadata backfill readiness
        run: |
          node tools/audit-target-basis-backfill-readiness.mjs
          cat reports/target-basis-backfill-readiness-v1.md
      - uses: actions/upload-artifact@v4
        with:
          name: target-basis-backfill-readiness
          path: |
            reports/target-basis-backfill-readiness-v1.json
            reports/target-basis-backfill-readiness-v1.md
