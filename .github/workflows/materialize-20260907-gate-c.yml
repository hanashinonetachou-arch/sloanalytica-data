name: Materialize 20260907 Gate C

on:
  push:
    branches:
      - batch/20260907-next10-gatec
    paths:
      - '.github/workflows/materialize-20260907-gate-c.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-gatec
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate exact 10 ObservationData
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const linked={
            L_KABANERI_UNATO_KESSEN_XX:{name:'マイスロ',categories:['基本遊技データ','通常ゲーム・初当り履歴','キャラ紹介/ST終了画面/ボイス/アイテム抽選集計']},
            L_JORMUNGAND_ND01G:{name:'スロプラNEXT',categories:['総ゲーム/通常ゲーム','レア役回数','CZ種別/成功回数','AT/ボーナス/サブ液晶カード履歴']},
            L_SHINUCHI_YOSHIMUNE_A1:{name:'ダイトモ',categories:['総プレイ数','ボーナス回数']},
            L_MILLION_GOD_KISEKI_CX:{name:'ユニメモ',categories:['遊技途中/終了時の遊技結果','MyGOD間','機種固有カスタム']}
          };
          const sanitize=s=>String(s).replace(/^FEAT_/,'').replace(/[^A-Za-z0-9_]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').toUpperCase();
          for(const id of ids){
            const sel=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`,'utf8'));
            const res=JSON.parse(fs.readFileSync(`research/${id}/research-data.json`,'utf8'));
            const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8')).machines.find(x=>x.machineId===id);
            if(!registry)throw new Error(`${id}: registry missing`);
            const selected=(sel.features??[]).filter(f=>String(f.adoptionCategory??'').startsWith('INCLUDE'));
            const observations=[]; const mappings=[];
            const inputById=new Map((sel.inputs??[]).map(x=>[x.id,x]));
            const researchById=new Map((res.features??[]).map(x=>[x.researchFeatureId,x]));
            const handled=new Set();
            const addObs=o=>{if(observations.some(x=>x.observationId===o.observationId))throw new Error(`${id}: duplicate ${o.observationId}`);observations.push(o);};
            const addMap=(f,obsId,type='EXACT',methods=['MANUAL_COUNTER'])=>mappings.push({featureId:f.featureId,mappingType:type,observationIds:[obsId],collectionMethods:methods,usableForInference:true,usableForDifficulty:false,notes:'Gate C観測写像。Selectionの分母・抑制契約を保持し、未観測を観測済み0として扱わない。'});

            if(id==='LB_TRIPLE_CROWN_SEVEN_FG'){
              const cherry=selected.find(f=>f.researchFeatureId==='RF_CHERRY'),plum=selected.find(f=>f.researchFeatureId==='RF_PLUM');
              if(cherry&&plum){
                const denom=inputById.get(cherry.denominatorInputId)?.name??'通常ゲーム';
                addObs({observationId:'OBS_SMALL_ROLES_SHARED',sourceType:'DIRECT_PLAY',observationMode:'MANUAL_COUNTER',status:'FOUND',label:'通常時の小役（チェリー・プラム）',categories:['チェリー回数','プラム回数',denom],timing:['自己実戦中、通常ゲームと各小役成立時に更新'],excludedConditions:['チェリーとプラムを同一ゲームで重複成立として数えない','同じ通常ゲーム分母を各小役で別々に増やさない','着席前累積値を自己実戦値へ混ぜない','未観測を観測済み0として扱わない'],sourceRefs:[...new Set([...(researchById.get('RF_CHERRY')?.sourceRefs??[]),...(researchById.get('RF_PLUM')?.sourceRefs??[])])],notes:'チェリー/プラムは同一通常G上の排他的カテゴリとして一つの自然観測に統合。Gate D/MachineDataで独立二項の過信が生じないか再監査する。'});
                addMap(cherry,'OBS_SMALL_ROLES_SHARED','COMBINABLE'); addMap(plum,'OBS_SMALL_ROLES_SHARED','COMBINABLE'); handled.add(cherry.featureId);handled.add(plum.featureId);
              }
            }

            if(id==='L_JORMUNGAND_ND01G'){
              const f=selected.find(x=>x.researchFeatureId==='RF_BONUS_END_SCREEN');
              if(f){
                const rf=researchById.get(f.researchFeatureId);
                const evNames=(sel.evidence??[]).filter(e=>['RE_BONUS_HANDGUN_DENY2','RE_BONUS_OLD_KOKO_EVEN','RE_BONUS_KASPER_4PLUS','RE_BONUS_GOLDEN_6'].includes(e.researchEvidenceId)).map(e=>e.name);
                addObs({observationId:'OBS_BONUS_END_SCREEN_SHARED',sourceType:'END_EVENT',observationMode:'VISUAL_EVENT',status:'FOUND',label:'REG/BIG終了画面',categories:[...(rf?.categories??[]),...evNames],timing:['REGまたはBIG終了画面が表示された時に1回だけ記録'],excludedConditions:['ヨルムンガンドボーナスの固定デフォルト画面を対象回数へ含めない','Hard Evidenceカテゴリを数値カテゴリとして二重入力しない','同じ終了画面を数値推測用と確定情報用に二重記録しない','未観測を観測済み0として扱わない'],sourceRefs:[...(rf?.sourceRefs??[])],notes:'同じ終了画面の自然観測を数値分布とHard Evidenceで共有。SelectionDataでは4 Hardカテゴリを数値尤度から除外済み。'});
                addMap(f,'OBS_BONUS_END_SCREEN_SHARED','COMBINABLE',['VISUAL_EVENT']);handled.add(f.featureId);
              }
            }

            for(const f of selected){
              if(handled.has(f.featureId))continue;
              const rf=researchById.get(f.researchFeatureId); if(!rf)throw new Error(`${id}: research feature missing ${f.researchFeatureId}`);
              const obsId=`OBS_${sanitize(f.featureId)}`;
              const inputIds=[f.numeratorInputId,...(f.categoryInputIds??[]),...(f.denominatorInputId?[f.denominatorInputId]:[]),...(f.denominatorInputIds??[])].filter(Boolean);
              const cats=[...new Set(inputIds.map(x=>inputById.get(x)?.name??x))];
              const conditional=!['通常ゲーム','通常ゲーム数'].includes(rf.denominatorDefinition??'');
              const conditions=[`分母「${rf.denominatorDefinition}」外の遊技状態・試行を混ぜない`,'着席前累積値を自己実戦値へ混ぜない','未観測を観測済み0として扱わない'];
              if(conditional)conditions.push('条件付き母集団を総通常ゲームへ平坦化しない');
              if((f.suppressedByFeatureIds??[]).length)conditions.push(`Selection suppression契約を保持し、${f.suppressedByFeatureIds.join(' / ')}が利用可能な区間では本Fallbackを同時尤度化しない`);
              addObs({observationId:obsId,sourceType:'DIRECT_PLAY',observationMode:'MANUAL_COUNTER',status:'FOUND',label:rf.name,categories:cats,timing:[`自己実戦中、「${rf.denominatorDefinition}」の有効試行と対象事象の成立時に更新`],excludedConditions:conditions,sourceRefs:[...(rf.sourceRefs??[])],notes:`Selection ${f.featureId} (${f.adoptionCategory}) の観測契約。分子=${rf.numeratorDefinition} / 分母=${rf.denominatorDefinition}`});
              addMap(f,obsId,rf.candidateModel==='multinomial'?'COMBINABLE':'EXACT');
            }

            const evidenceNames=(sel.evidence??[]).map(e=>e.name);
            if(evidenceNames.length){
              addObs({observationId:'OBS_HARD_EVIDENCE_EVENTS',sourceType:'END_EVENT',observationMode:'VISUAL_EVENT',status:'FOUND',label:'設定を直接絞り込める演出・表示',categories:evidenceNames,timing:['各確定・否定Evidenceが表示/発生した時に成立として記録'],excludedConditions:['傾向示唆を確定・否定情報へ昇格させない','同一Evidenceの複数回出現で証拠強度を乗算しない','0は未確認、1回以上はEvidence成立として扱う','ヨルムンガンド終了画面Hardカテゴリは共有終了画面観測から一度だけ記録する'],sourceRefs:[],notes:'SelectionDataのHard Evidence候補を自然観測として保持。UIでは発生場所/タイミングに応じて分割可能だが、同一事象の二重入力は禁止。'});
            }
            if(linked[id])addObs({observationId:'OBS_LINKED_SERVICE',sourceType:'LINKED_SERVICE',observationMode:'LINKED_SERVICE_READ',status:'FOUND',label:`${linked[id].name}で確認できる遊技データ`,categories:linked[id].categories,timing:['連動サービスの実戦データ画面を確認できる時'],excludedConditions:['サービス上で表示されない項目を推測補完しない','サービス側集計区間と自己実戦区間を混同しない'],sourceRefs:[],notes:'Gate Aで対応を確認済み。機種固有の全フィールドが公開されていない場合は実機/サービス画面で追加確認する。'});

            const sourceCoverage={machineMenu:'UNRESOLVED',dataCounter:'UNRESOLVED',linkedService:linked[id]?'FOUND':'CHECKED_NONE',directPlay:'FOUND',endEvent:evidenceNames.length||id==='L_JORMUNGAND_ND01G'?'FOUND':'NOT_REQUIRED',seatedState:'UNRESOLVED'};
            const vf=[
              {verificationId:`VFY_${id}_MACHINE_MENU`,status:'WAITING_FOR_MACHINE',sourceType:'MACHINE_MENU',priority:'MEDIUM',question:'筐体メニュー/遊技履歴に総G・通常G・初当り・小役などSelectionに利用できる当日累積値がどこまで表示されるか確認する。'},
              {verificationId:`VFY_${id}_DATA_COUNTER`,status:'WAITING_FOR_MACHINE',sourceType:'DATA_COUNTER',priority:'HIGH',question:'ホールのデータカウンターで取得できる当日累積値と、Selectionの通常G/初当り分母定義が一致する範囲を確認する。設備依存のためWebだけで確定しない。'},
              {verificationId:`VFY_${id}_SEATED_STATE`,status:'WAITING_FOR_MACHINE',sourceType:'SEATED_STATE',priority:'HIGH',question:'着席直後に取得できる当日累積値と自己実戦開始値を確認し、安全に差分利用できる項目を確定する。'}
            ];
            if(linked[id])vf.push({verificationId:`VFY_${id}_LINKED_SERVICE`,status:'WAITING_FOR_MACHINE',sourceType:'LINKED_SERVICE',priority:'MEDIUM',question:`${linked[id].name}の実データ画面で、公開資料では列挙されていない機種固有項目と集計区間を確認する。`});
            else vf.push({verificationId:`VFY_${id}_LINKED_SERVICE`,status:'WAITING_FOR_MACHINE',sourceType:'LINKED_SERVICE',priority:'LOW',question:'公開資料では機種固有の遊技履歴連動を確認できなかったため、実機メニューにQR/連動導線が存在するかだけ確認する。非対応を事前断定しない。'});

            const data={schemaVersion:'machine-observation-data-v2',machineId:id,displayName:res.machine.displayName,provisionalRegistrationId:registry.provisionalRegistrationId??null,registrationId:registry.registrationId??null,releaseDate:registry.releaseDate??null,researchedAt:'2026-09-07',sources:[],sourceCoverage,observations,featureMappings:mappings,researchReopenRequests:[],fieldVerificationItems:vf};
            fs.writeFileSync(`research/${id}/machine-observation-data.json`,JSON.stringify(data,null,2)+'\n');
          }
          NODE
      - name: Validate Gate C exact scope
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA)
          files=(); for id in "${ids[@]}"; do files+=("research/$id/machine-observation-data.json"); done
          npm run observation:validate -- "${files[@]}"
          npm run observation:selection:audit -- "${ids[@]}" --strict-v2
          npm run observation:gate -- --from-id=250 --to-id=259
      - name: Semantic assertions and checkpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          let selected=0,mappings=0,observations=0,verification=0;const errors=[];
          for(const id of ids){const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`));const o=JSON.parse(fs.readFileSync(`research/${id}/machine-observation-data.json`));const sf=(s.features??[]).filter(x=>String(x.adoptionCategory??'').startsWith('INCLUDE'));selected+=sf.length;mappings+=(o.featureMappings??[]).length;observations+=(o.observations??[]).length;verification+=(o.fieldVerificationItems??[]).length;const mapped=new Set((o.featureMappings??[]).map(x=>x.featureId));for(const f of sf)if(!mapped.has(f.featureId))errors.push(`${id}: missing mapping ${f.featureId}`);if((o.researchReopenRequests??[]).some(x=>x.status==='RESEARCH_REOPEN_REQUIRED'))errors.push(`${id}: research reopen required`);}
          const tc=JSON.parse(fs.readFileSync('research/LB_TRIPLE_CROWN_SEVEN_FG/machine-observation-data.json'));const tcObs=tc.observations.find(x=>x.observationId==='OBS_SMALL_ROLES_SHARED');if(!tcObs||!tcObs.categories.some(x=>String(x).includes('チェリー'))||!tcObs.categories.some(x=>String(x).includes('プラム')))errors.push('Triple Crown shared small-role observation missing');
          const jo=JSON.parse(fs.readFileSync('research/L_JORMUNGAND_ND01G/machine-observation-data.json'));if(!jo.observations.some(x=>x.observationId==='OBS_BONUS_END_SCREEN_SHARED'))errors.push('Jormungand shared end-screen observation missing');
          if(selected!==35||mappings!==35)errors.push(`selected/mapping mismatch ${selected}/${mappings}`);if(errors.length)throw new Error(errors.join('\n'));
          fs.writeFileSync('reports/batch-20260907-gate-c-completion.md',`# SloAnalytica 2026-09-07 Next10 — Gate C Observation checkpoint\n\n## Status\n\n**Gate C / Observation: PASS_WITH_UNRESOLVED (field verification only)**\n\n- exact batch scope: 10/10\n- selected Selection Features: ${selected}\n- Observation feature mappings: ${mappings}/${selected}\n- natural observation groups: ${observations}\n- Research reopen required: 0\n- field verification items: ${verification}\n- public main: unchanged\n\nAll selected Features have a v2 Observation mapping. Remaining unresolved items are machine-menu/data-counter/seated-state/linked-service field verification, not missing statistical definitions.\n\n## Special natural-observation contracts\n\n- **LB Triple Crown Seven**: cherry and plum share one normal-play small-role observation and one normal-game denominator. They must not be entered as if each had an independent game count. Gate D/MachineData must re-audit whether the probability model preserves this mutually exclusive structure; if not, Selection must be reopened before publish.\n- **Jormungand**: REG/BIG end-screen is one natural observation. Four Hard Evidence screens are not separately re-entered into the numeric multinomial; Selection already excludes them from numeric likelihood.\n- **Hard Evidence**: repeated sightings of the same evidence do not multiply evidence strength. 0 means not confirmed; one or more sightings means the evidence is established unless a later explicit count contract says otherwise.\n- **Conditional Features**: route/state-specific eligible attempts remain their denominators; total normal games are never substituted.\n\n## Field verification\n\nEach machine retains machine-menu, hall data-counter, seated-state and linked-service checks as applicable. These are allowed to remain WAITING_FOR_MACHINE at Gate C and must be revisited during real-device verification.\n`);
          console.log(JSON.stringify({machines:10,selected,mappings,observations,verification,researchReopen:0},null,2));
          NODE
      - name: Commit canonical Gate C state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/*/machine-observation-data.json reports/batch-20260907-gate-c-completion.md
          git commit -m 'GateC: materialize 20260907 Next10 observations'
          git push origin HEAD:batch/20260907-next10-gatec
