name: Batch 20260910 Next10 Publish Diagnostic

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - '.github/workflows/batch-20260910-next10-publish-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce APPLY and persist bounded failure evidence
        shell: bash
        run: |
          set -u
          ids='L_YABACHIBA_ZM L_NANGOKU_SPECIAL_M1 L_SENGOKU_COLLECTION6_KS L_KARAKURI_CIRCUS2_JG L_ULTRAMAN_FINAL_BATTLE_ME L_WORLD_DAI_STAR_PA3 L_YAJIKITA_MAIRU_BG L_TONDEMO_SKILL_KM LB_TRIPLE_CROWN_X300 L_TOARU_INDEX2_FA'
          set +e
          npm run machine:publish:batch -- --apply $ids > /tmp/publish.log 2>&1
          code=$?
          set -e
          mkdir -p batches/20260910-next10-v7
          {
            echo "exitCode=$code"
            echo "head=$(git rev-parse HEAD)"
            echo '--- last 320 lines ---'
            tail -n 320 /tmp/publish.log
          } > batches/20260910-next10-v7/formal-publish-diagnostic.log
          git restore -- catalog.json difficulty-catalog.json machine-registry.json reports 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batches/20260910-next10-v7/formal-publish-diagnostic.log
          git commit -m 'audit: capture 20260910 Next10 publish diagnostic'
          git pull --rebase origin batch/20260910-next10-gate0-v2
          git push origin HEAD:batch/20260910-next10-gate0-v2
          exit "$code"
