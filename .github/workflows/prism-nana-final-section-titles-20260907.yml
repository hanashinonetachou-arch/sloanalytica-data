name: Prism Nana Final Section Titles 20260907

on:
  push:
    branches:
      - fix/prism-nana-final-section-titles-20260907
    paths:
      - '.github/workflows/prism-nana-final-section-titles-20260907.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prism-nana-final-section-titles-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final Prism Nana section titles
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const canonicalPath = 'research/L_PRISM_NANA_CC/ui-design-data.json';
          const pkgPath = 'machines/L_PRISM_NANA_CC/machine-package.json';
          const catalogPath = 'catalog.json';

          const replacements = [
            ['プリプリゾーン終了時 タッチボイス', 'プリプリゾーン終了時'],
            ['通常時の特定会話', '通常時会話演出'],
            ['獲得枚数による設定示唆・確定', '設定確定演出'],
          ];

          const canonical = JSON.parse(fs.readFileSync(canonicalPath, 'utf8'));
          canonical.sectionOrder = canonical.sectionOrder.map((name) => replacements.find(([from]) => from === name)?.[1] || name);
          for (const [from, to] of replacements) {
            if (!canonical.sections[from]) throw new Error(`canonical section missing: ${from}`);
            canonical.sections[to] = canonical.sections[from];
            delete canonical.sections[from];
          }
          fs.writeFileSync(canonicalPath, JSON.stringify(canonical, null, 2) + '\n');

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const sections = pkg.ui?.sections || pkg.ui?.layout?.sections;
          if (!Array.isArray(sections)) throw new Error('package UI sections missing');
          for (const section of sections) {
            const match = replacements.find(([from]) => from === section.title);
            if (match) section.title = match[1];
          }
          pkg.machine.machineDataVersion = '0.1.3';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const pkgBytes = fs.readFileSync(pkgPath);
          const sha256 = crypto.createHash('sha256').update(pkgBytes).digest('hex');
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          const entry = catalog.machines.find((m) => m.machineId === 'L_PRISM_NANA_CC');
          if (!entry) throw new Error('catalog entry missing');
          entry.machineDataVersion = '0.1.3';
          entry.sha256 = sha256;
          entry.packageSizeBytes = pkgBytes.length;
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');

          console.log({sha256, packageSizeBytes: pkgBytes.length});
          NODE
      - name: Verify exact titles and catalog sync
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const canonical = JSON.parse(fs.readFileSync('research/L_PRISM_NANA_CC/ui-design-data.json','utf8'));
          const expected = ['プリプリゾーン終了時','通常時会話演出','設定確定演出'];
          for (const title of expected) if (!canonical.sectionOrder.includes(title)) throw new Error(`canonical title missing: ${title}`);
          const pkgPath='machines/L_PRISM_NANA_CC/machine-package.json';
          const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));
          const sections=pkg.ui?.sections || pkg.ui?.layout?.sections || [];
          for (const title of expected) if (!sections.some(s=>s.title===title)) throw new Error(`package title missing: ${title}`);
          const bytes=fs.readFileSync(pkgPath);
          const hash=crypto.createHash('sha256').update(bytes).digest('hex');
          const catalog=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const entry=catalog.machines.find(m=>m.machineId==='L_PRISM_NANA_CC');
          if (entry.machineDataVersion!=='0.1.3' || entry.sha256!==hash || entry.packageSizeBytes!==bytes.length) throw new Error('catalog mismatch');
          console.log('Prism Nana final section titles: PASS');
          NODE
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_PRISM_NANA_CC/ui-design-data.json machines/L_PRISM_NANA_CC/machine-package.json catalog.json
          git commit -m 'fix: finalize Prism Nana section titles'
          git push
