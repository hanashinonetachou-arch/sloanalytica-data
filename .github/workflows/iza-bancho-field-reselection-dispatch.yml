name: Retry Iza Bancho field reselection

on:
  push:
    branches:
      - research/20260903-batch10-next
    paths:
      - '.github/workflows/iza-bancho-field-reselection-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch existing Iza Bancho reselection workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/iza-bancho-field-reselection.yml/dispatches \
            -f ref=research/20260903-batch10-next
