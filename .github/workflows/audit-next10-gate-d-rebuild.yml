name: Next10 isolated Gate D rebuild

on:
  push:
    branches:
      - audit/20260907-next10-research-universe

permissions:
  contents: write

concurrency:
  group: next10-gate-d-rebuild
  cancel-in-progress: false

jobs:
  gate-d:
    if: ${{ !contains(github.event.head_commit.message, '[gate-d-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate UI Design from repaired Selection and Observation
        run: node tools/generate-batch-20260907-gate-d-ui.mjs
      - name: Validate UI Design
        run: npm run ui-design:validate
      - name: Audit UI Selection linkage
        run: |
          npm run ui-design:linkage:audit -- . \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Audit UI Observation linkage strict v2
        run: |
          npm run ui-design:observation:audit -- \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA --strict-v2
      - name: Semantic UI assertions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const errors=[]; let selectedInputs=0, uiInputs=0;
          for(const id of ids){
            const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`,'utf8'));
            const ui=JSON.parse(fs.readFileSync(`research/${id}/ui-design-data.json`,'utf8'));
            const expected=(s.inputs??[]).filter(i=>i.inferenceRole!=='EXCLUDE').map(i=>i.id);
            const actual=Object.values(ui.sections??{}).flatMap(sec=>sec.inputIds??[]);
            selectedInputs+=expected.length; uiInputs+=actual.length;
            const a=new Set(actual), e=new Set(expected);
            for(const x of expected) if(!a.has(x)) errors.push(`${id}: UI missing ${x}`);
            for(const x of actual) if(!e.has(x)) errors.push(`${id}: unexpected UI input ${x}`);
            if(new Set(actual).size!==actual.length) errors.push(`${id}: duplicate UI input`);
            const order=ui.sectionOrder??[];
            const evidencePositions=order.map((t,i)=>({t,i})).filter(x=>String(x.t).includes('設定示唆')||String(x.t).includes('設定確定'));
            if(evidencePositions.length){
              const first=Math.min(...evidencePositions.map(x=>x.i));
              if(order.slice(first+1).some(t=>!String(t).includes('設定示唆')&&!String(t).includes('設定確定'))) errors.push(`${id}: ordinary section after Evidence`);
            }
          }
          if(errors.length) throw new Error(errors.join('\n'));
          console.log(JSON.stringify({status:'PASS',machines:10,selectedInputs,uiInputs},null,2));
          NODE
      - name: Four-layer Gate
        run: |
          npm run pipeline:four-layer:gate -- \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Build MachineData batch
        run: |
          npm run machine:batch -- \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Materialize UI Design into MachineData
        run: |
          node tools/materialize-ui-design.mjs --apply \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Verify materialization stability
        run: |
          node tools/materialize-ui-design.mjs --require-unchanged \
            L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG \
            L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Migration audit after MachineData rebuild
        run: npm run selection:migration-audit
      - name: Gate D contract validations
        run: |
          npm run ui-design:test
          npm run difficulty:exposure-audit
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Commit validated Gate D rebuild
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research machines reports difficulty-catalog.json machine-registry.json catalog.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No Gate D changes.'
            exit 0
          fi
          git commit -m 'machine-data: rebuild repaired Next10 Gate D [gate-d-generated]'
          git push origin HEAD:audit/20260907-next10-research-universe
