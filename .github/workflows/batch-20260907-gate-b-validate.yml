name: Batch 20260907 Gate B Validate

on:
  push:
    branches:
      - batch/20260907-next10-gateb
    paths:
      - 'research/L_FIRE_FORCE_2/selection-data.json'
      - 'research/L_UMINEKO_2_A1/selection-data.json'
      - 'research/L_KABANERI_UNATO_KESSEN_XX/selection-data.json'
      - 'research/L_JORMUNGAND_ND01G/selection-data.json'
      - 'research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json'
      - 'research/L_SHINUCHI_YOSHIMUNE_A1/selection-data.json'
      - 'research/L_KYOKOU_SUIRI_ST/selection-data.json'
      - 'research/L_AKUDAMA_DRIVE_TP/selection-data.json'
      - 'research/L_MILLION_GOD_KISEKI_CX/selection-data.json'
      - 'research/L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA/selection-data.json'
      - '.github/workflows/batch-20260907-gate-b-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260907-next10-gateb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate exact 10 SelectionData
        shell: bash
        run: |
          set -euo pipefail
          ids=(L_FIRE_FORCE_2 L_UMINEKO_2_A1 L_KABANERI_UNATO_KESSEN_XX L_JORMUNGAND_ND01G LB_TRIPLE_CROWN_SEVEN_FG L_SHINUCHI_YOSHIMUNE_A1 L_KYOKOU_SUIRI_ST L_AKUDAMA_DRIVE_TP L_MILLION_GOD_KISEKI_CX L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA)
          for id in "${ids[@]}"; do npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"; done
      - name: Selection quality, evidence coverage, dependency audit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assessSelectionQuality } from './tools/selection-quality-gate.mjs';
          import { validateSelectionEvidenceCoverage } from './tools/batch-completeness-gates.mjs';
          const ids=['L_FIRE_FORCE_2','L_UMINEKO_2_A1','L_KABANERI_UNATO_KESSEN_XX','L_JORMUNGAND_ND01G','LB_TRIPLE_CROWN_SEVEN_FG','L_SHINUCHI_YOSHIMUNE_A1','L_KYOKOU_SUIRI_ST','L_AKUDAMA_DRIVE_TP','L_MILLION_GOD_KISEKI_CX','L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA'];
          const expectedRejected=new Set(['L_FIRE_FORCE_2:RF_TRAP_SMALLV_CONVERT','L_FIRE_FORCE_2:RF_TRAP_SMALLV_BONUS_AFTER_CONVERT','L_KABANERI_UNATO_KESSEN_XX:RF_SHUNJO_3000PT','LB_TRIPLE_CROWN_SEVEN_FG:RF_PLUM']);
          const expectedSuppress={
            'L_UMINEKO_2_A1:RF_REG_INITIAL':['FEAT_BONUS_INITIAL'],
            'L_KABANERI_UNATO_KESSEN_XX:RF_ST_INITIAL':['FEAT_BONUS_INITIAL'],
            'L_JORMUNGAND_ND01G:RF_AT_INITIAL':['FEAT_CZ_INITIAL'],
            'L_SHINUCHI_YOSHIMUNE_A1:RF_CZ_INITIAL':['FEAT_AT_INITIAL'],
            'L_KYOKOU_SUIRI_ST:RF_BONUS_INITIAL':['FEAT_CZ_INITIAL'],
            'L_AKUDAMA_DRIVE_TP:RF_BONUS_INITIAL':['FEAT_CZ_INITIAL'],
            'L_AKUDAMA_DRIVE_TP:RF_AT_INITIAL':['FEAT_CZ_INITIAL','FEAT_BONUS_INITIAL'],
            'L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA:RF_AT_INITIAL':['FEAT_CZ_INITIAL']
          };
          let features=0,evidence=0,selected=0,rejected=0;const errors=[];
          for(const id of ids){
            const r=JSON.parse(fs.readFileSync(`research/${id}/research-data.json`));
            const s=JSON.parse(fs.readFileSync(`research/${id}/selection-data.json`));
            const q=assessSelectionQuality(r,s); if(q.status==='BLOCKED')errors.push(...q.blockers.map(x=>`${id}: ${x}`));
            const e=validateSelectionEvidenceCoverage(s,r,{required:true}); if(!e.ok)errors.push(...e.errors.map(x=>`${id}: ${x}`));
            for(const f of s.features??[]){
              features++; if(f.adoptionCategory==='EXCLUDE'){rejected++; if(!expectedRejected.has(`${id}:${f.researchFeatureId}`))errors.push(`${id}: unexpected reject ${f.researchFeatureId}`);} else selected++;
              const key=`${id}:${f.researchFeatureId}`; if(expectedSuppress[key]&&JSON.stringify(f.suppressedByFeatureIds??[])!==JSON.stringify(expectedSuppress[key]))errors.push(`${key}: suppression mismatch`);
            }
            evidence+=(s.evidence??[]).length;
            if(id==='L_JORMUNGAND_ND01G'){
              const f=(s.features??[]).find(x=>x.researchFeatureId==='RF_BONUS_END_SCREEN');
              const want=['HANDGUN_SHELL','OLD_KOKO_TEAM','KASPER','GOLDEN_SCARECROW'];
              if(JSON.stringify(f?.categoryExcludeLabels??[])!==JSON.stringify(want))errors.push('Jormungand: hard/numeric category partition mismatch');
            }
          }
          if(features!==38||selected!==34||rejected!==4||evidence!==95)errors.push(`totals mismatch f=${features} selected=${selected} rejected=${rejected} evidence=${evidence}`);
          if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify({status:'PASS',machines:10,features,selected,rejected,evidence},null,2));
          NODE
