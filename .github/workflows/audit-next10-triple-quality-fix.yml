name: Next10 Triple Crown quality rationale fix

on:
  push:
    branches:
      - audit/20260907-next10-research-universe

permissions:
  contents: write

concurrency:
  group: next10-triple-quality-fix
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[triple-quality-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/repair-triple-special-direction-reason.mjs
      - name: Validate Selection and strict quality
        run: |
          npm run selection:validate -- research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json research/LB_TRIPLE_CROWN_SEVEN_FG/research-data.json
          node tools/audit-selection-quality.mjs LB_TRIPLE_CROWN_SEVEN_FG --strict
      - name: Commit canonical rationale fix
        run: |
          if git diff --quiet -- research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/LB_TRIPLE_CROWN_SEVEN_FG/selection-data.json
          git commit -m 'selection: strengthen Triple Crown Special rationale [triple-quality-generated]'
          git push origin HEAD:audit/20260907-next10-research-universe
