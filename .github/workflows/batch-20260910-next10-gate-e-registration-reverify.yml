name: Batch 20260910 Next10 Gate E Registration Reverify

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - '.github/workflows/batch-20260910-next10-gate-e-registration-reverify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate-e-reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify corrected Gate 0 registration allocation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const batch='batches/20260910-next10-v7';
          const identity=JSON.parse(fs.readFileSync(`${batch}/machine-identity-data.json`,'utf8'));
          const registry=JSON.parse(fs.readFileSync('machine-registry.json','utf8')).machines;
          const numeric=registry.map(x=>x.provisionalRegistrationId).filter(Number.isInteger);
          const max=Math.max(...numeric);
          const expected=identity.machines.map((m,i)=>({machineId:m.machineId,provisionalRegistrationId:max+identity.machines.length-i}));
          const actual=identity.machines.map(m=>({machineId:m.machineId,provisionalRegistrationId:m.temporaryRegistrationId}));
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`Gate0 ID allocation does not match publish allocator\nactual=${JSON.stringify(actual)}\nexpected=${JSON.stringify(expected)}`);
          if(new Set(actual.map(x=>x.provisionalRegistrationId)).size!==10) throw new Error('duplicate corrected temporaryRegistrationId');
          const collisions=actual.filter(a=>registry.some(r=>r.machineId!==a.machineId&&r.provisionalRegistrationId===a.provisionalRegistrationId));
          if(collisions.length) throw new Error(`registration collisions ${JSON.stringify(collisions)}`);
          const report={schemaVersion:'gate-e-registration-id-audit-v2',batchId:'20260910-next10-v7',status:'PASS',registryMachineCount:registry.length,assignedNumericCount:numeric.length,maxExistingProvisionalRegistrationId:max,assignmentRule:'machine:publish:batch prepends catalog entries; registry sync assigns new IDs in catalog order, therefore one batch receives reverse input order',proposedAssignments:actual,collisions,nextAvailableRange:[max+1,max+identity.machines.length],verifiedAgainstPublishDiagnostic:`${batch}/postpublish-registration-diagnostic.json`};
          fs.writeFileSync(`${batch}/gate-e-registration-id-audit.json`,JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Full Gate E revalidation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ids <<'EOF'
          L_YABACHIBA_ZM
          L_NANGOKU_SPECIAL_M1
          L_SENGOKU_COLLECTION6_KS
          L_KARAKURI_CIRCUS2_JG
          L_ULTRAMAN_FINAL_BATTLE_ME
          L_WORLD_DAI_STAR_PA3
          L_YAJIKITA_MAIRU_BG
          L_TONDEMO_SKILL_KM
          LB_TRIPLE_CROWN_X300
          L_TOARU_INDEX2_FA
          EOF
          while read -r id; do npm run research:validate -- "research/$id/research-data.json"; done < /tmp/ids
          while read -r id; do npm run selection:validate -- "research/$id/selection-data.json" "research/$id/research-data.json"; done < /tmp/ids
          node tools/audit-selection-quality.mjs $(cat /tmp/ids) --strict
          args=(); while read -r id; do args+=("research/$id/machine-observation-data.json"); done < /tmp/ids
          npm run observation:validate -- "${args[@]}"
          npm run observation:selection:audit -- $(cat /tmp/ids) --strict-v2
          npm run ui-design:validate
          npm run ui-design:linkage:audit -- . $(cat /tmp/ids)
          npm run ui-design:observation:audit -- $(cat /tmp/ids) --strict-v2
          npm run pipeline:four-layer:gate -- $(cat /tmp/ids)
          npm run registry:validate
          npm run audit:ui-service-names
          npm run ux-contract:audit
          npm test
          npm run audit
          git restore -- reports/v64-observation-debt-classification.json reports/market-registry-merge.json reports/batch-machine-pipeline-report.json 2>/dev/null || true

      - name: Write corrected Gate E closure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='batches/20260910-next10-v7/gate-e-quality-report.json';
          const out={schemaVersion:'gate-e-quality-report-v2',batchId:'20260910-next10-v7',machineCount:10,status:'PASS',registrationIdAudit:'PASS',registrationAllocation:'REVERSE_INPUT_279_TO_270_VERIFIED',researchValidation:'PASS',selectionValidation:'PASS',selectionQuality:'PASS',observationValidation:'PASS',fourLayerGate:'PASS',uxContracts:'PASS',registryValidation:'PASS',repositoryTests:'PASS',publicDataAudit:'PASS',publish:'NOT_RUN_AFTER_SOURCE_CORRECTION'};
          fs.writeFileSync(p,JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batches/20260910-next10-v7/gate-e-registration-id-audit.json batches/20260910-next10-v7/gate-e-quality-report.json
          git commit -m 'gate-e: close corrected registration allocation audit'
          git pull --rebase origin batch/20260910-next10-gate0-v2
          git push origin HEAD:batch/20260910-next10-gate0-v2
