name: Batch 20260901 Publish Gate

on:
  push:
    branches:
      - batch/20260901-user-selected-10
    paths:
      - '.github/workflows/batch-20260901-publish-gate.yml'

permissions:
  contents: write

concurrency:
  group: batch-20260901-publish-gate
  cancel-in-progress: false

jobs:
  publish-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prototype baseline for batch safety
        run: git fetch origin prototype-multi-machine:refs/remotes/origin/prototype-multi-machine
      - name: Publish 10 machines atomically
        run: >-
          npm run machine:publish:batch -- --apply
          L_MAGIA_RECORD_RN
          L_GODZILLA_NS
          L_USHIO_TORA_HAKUMEN_VH
          L_AMAZING_LIVE_PD
          L_YOSHIMUNE_SC2
          L_MAHJONG_MONOGATARI_S2
          L_IDOLMASTER_MILLION_LIVE_HC
          L_YOUJITSU_DE
          L_MIDORI_DON_5_FY
          L_GUNDAM_SEED_G
      - name: Verify clean generated public-data state
        run: |
          npm test
          npm run audit
          npm run audit:ui-service-names
      - name: Commit published batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json difficulty-catalog.json machine-registry.json machines build
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "publish: batch 20260901 user-selected 10"
            git push
          fi
