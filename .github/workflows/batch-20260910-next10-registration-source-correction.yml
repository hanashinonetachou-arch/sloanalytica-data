name: Batch 20260910 Next10 Registration Source Correction

on:
  push:
    branches:
      - batch/20260910-next10-gate0-v2
    paths:
      - '.github/workflows/batch-20260910-next10-registration-source-correction.yml'

permissions:
  contents: write

jobs:
  correct-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/20260910-next10-gate0-v2
          fetch-depth: 0
      - name: Backport formal publish allocation into Gate 0 identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='batches/20260910-next10-v7/machine-identity-data.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const mapping={
            L_YABACHIBA_ZM:279,
            L_NANGOKU_SPECIAL_M1:278,
            L_SENGOKU_COLLECTION6_KS:277,
            L_KARAKURI_CIRCUS2_JG:276,
            L_ULTRAMAN_FINAL_BATTLE_ME:275,
            L_WORLD_DAI_STAR_PA3:274,
            L_YAJIKITA_MAIRU_BG:273,
            L_TONDEMO_SKILL_KM:272,
            LB_TRIPLE_CROWN_X300:271,
            L_TOARU_INDEX2_FA:270
          };
          for(const m of d.machines){
            if(!(m.machineId in mapping)) throw new Error(`unexpected identity machine ${m.machineId}`);
            m.temporaryRegistrationId=mapping[m.machineId];
          }
          const got=d.machines.map(m=>m.temporaryRegistrationId);
          if(new Set(got).size!==10 || Math.min(...got)!==270 || Math.max(...got)!==279) throw new Error('corrected registration range invalid');
          d.checkedAt='2026-09-11T01:24:00+09:00';
          d.temporaryRegistrationIdStatus='FORMAL_PUBLISH_ALLOCATION_VERIFIED';
          d.openItems=(d.openItems??[]).filter(x=>!String(x).includes('Formal provisionalRegistrationId assignment'));
          d.notes=[...(d.notes??[]).filter(x=>!String(x).startsWith('Registration allocation')), 'Registration allocation corrected from provisional batch-order guess after isolated formal publish proved catalog-prepend -> reverse-input registry assignment: 279..270.'];
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batches/20260910-next10-v7/machine-identity-data.json
          git commit -m 'gate0: correct Next10 provisional registration allocation'
          git pull --rebase origin batch/20260910-next10-gate0-v2
          git push origin HEAD:batch/20260910-next10-gate0-v2
