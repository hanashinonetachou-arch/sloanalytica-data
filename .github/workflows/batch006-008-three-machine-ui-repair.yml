name: Batch006-008 Three Machine UI Repair Boundary

on:
  push:
    branches:
      - production/v85-batch-010-research-20261010
    paths:
      - production/.batch006-008-three-machine-ui-trigger
      - .github/workflows/batch006-008-three-machine-ui-repair.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: batch006-008-three-machine-ui
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-010-research-20261010
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Research presentation and existing runtime packages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const [batch,wave,id,oldVer,features,groups,tabs] of [
            ['batch-20261007-008','wave-1','L_GOBLIN_SLAYER_RD','8.5.1-batch-20261007-008',11,3,9],
            ['batch-20261005-006','wave-2','S_KONOSUBA_ZR','8.5.1-batch-20261005-006',5,3,12],
            ['batch-20261005-006','wave-2','S_RAKUEN_TSUHO_FS','8.5.3-batch-20261005-006',5,2,5]
          ]){
            const source=JSON.parse(fs.readFileSync(path.resolve('production-state/production/batches',batch,'research-drafts',wave,id+'.json'),'utf8'));
            const pkg=JSON.parse(fs.readFileSync(path.resolve('prototype/machines',id,'machine-package.json'),'utf8'));
            const policy=source.uiPresentation,existing=pkg.ui.v8Sections.map(s=>s.id);
            if(!policy||!Array.isArray(policy.sectionOrder)||!Array.isArray(policy.tabGroups)||pkg.machine.machineDataVersion!==oldVer||pkg.features.features.length!==features)throw Error('BASELINE_OR_RESEARCH_MISMATCH:'+id);
            if(existing.length!==policy.sectionOrder.length||new Set(policy.sectionOrder).size!==existing.length||existing.some(id=>!policy.sectionOrder.includes(id)))throw Error('UI_ORDER_MISMATCH:'+id);
            if(policy.tabGroups.length!==groups||policy.tabGroups.flatMap(g=>g.tabs).length!==tabs)throw Error('UI_TAB_COUNT_MISMATCH:'+id);
            console.log('RESEARCH_UI_BASELINE_PASS',id);
          }
          NODE
      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Publish three context-reorganized machine packages
        shell: bash
        run: |
          set -euo pipefail
          MACHINES="L_GOBLIN_SLAYER_RD S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS"
          MACHINES="$MACHINES" node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const machines=process.env.MACHINES.split(/\s+/).filter(Boolean),batches={L_GOBLIN_SLAYER_RD:'batch-20261007-008',S_KONOSUBA_ZR:'batch-20261005-006',S_RAKUEN_TSUHO_FS:'batch-20261005-006'};
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json'),catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x])),sha=b=>crypto.createHash('sha256').update(b).digest('hex'),metadata={};
          for(const machineId of machines){
            const batch=batches[machineId],wave=machineId==='L_GOBLIN_SLAYER_RD'?'wave-1':'wave-2';
            const research=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batch,'research-drafts',wave,machineId+'.json'),'utf8'));
            const entry=byId.get(machineId);if(!entry)throw Error('CATALOG_ENTRY_MISSING:'+machineId);
            const original=JSON.parse(fs.readFileSync(path.join(proto,'machines',machineId,'machine-package.json'),'utf8'));
            const pkg=structuredClone(original),policy=research.uiPresentation,sections=pkg.ui.v8Sections;
            if(!policy||policy.evidenceSectionMerges.length||policy.hiddenDerivedFindingIds.length)throw Error('UI_ONLY_REVIEW_POLICY_EXPECTED:'+machineId);
            for(const sec of sections){
              delete sec.tabGroup;
              const found=policy.tabGroups.flatMap(g=>g.tabs.map(t=>({group:g,tab:t}))).find(x=>x.tab.sectionId===sec.id);
              if(found)sec.tabGroup={id:found.group.id,title:found.group.title,label:found.tab.label};
            }
            const rank=new Map(policy.sectionOrder.map((id,i)=>[id,i]));
            sections.sort((a,b)=>rank.get(a.id)-rank.get(b.id));
            for(const override of policy.textOverrides?.sections??[]){
              const target=sections.find(x=>x.id===override.sectionId);
              if(!target||!target.description)throw Error('UI_TEXT_OVERRIDE_TARGET:'+machineId);
              target.description=override.description;
            }
            for(const override of policy.textOverrides?.researchSummaryReasonTerms??[]){
              let applied=0;
              for(const row of pkg.v8?.machineResearchSummary?.notAdopted??[]){
                if(String(row.reason??'').includes(override.from)){
                  row.reason=row.reason.replace(override.from,override.to);
                  applied++;
                }
              }
              if(applied!==1)throw Error('UI_SUMMARY_COPY_OVERRIDE_NOT_UNIQUE:'+machineId+':'+applied);
            }
            const actual=sections.flatMap(s=>s.items??[]).filter(x=>x.featureId);
            if(actual.length!==original.features.features.length)throw Error('FEATURES_HIDDEN:'+machineId);
            const version=machineId==='L_GOBLIN_SLAYER_RD'?'8.5.2-batch-20261007-008':machineId==='S_KONOSUBA_ZR'?'8.5.2-batch-20261005-006':'8.5.4-batch-20261005-006';
            pkg.machine.machineDataVersion=version;
            // Fail closed if anything except runtime UI and declared version changes.
            const stable=p=>{const x=structuredClone(p);delete x.ui;delete x.machine.machineDataVersion;if(x.v8?.machineResearchSummary)delete x.v8.machineResearchSummary;return JSON.stringify(x)};
            if(stable(pkg)!==stable(original))throw Error('NON_UI_OR_INFERENCE_CHANGED:'+machineId);
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            fs.writeFileSync(path.join(proto,'machines',machineId,'machine-package.json'),bytes);
            entry.machineDataVersion=version;
            entry.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(machineId)}/machine-package.json`;
            entry.sha256=sha(bytes);entry.packageSizeBytes=bytes.length;entry.updatedAt=new Date().toISOString();
            metadata[machineId]={machineId,machineDataVersion:version,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:bytes.length,reviewType:'PRESENTATION_ONLY_AFTER_APP_RUNTIME',sourceBatch:batch,inferenceSha256:sha(Buffer.from(stable(pkg)))};
          }
          // A successful local checksum is not enough if catalog.packageUrl is pinned
          // to an earlier commit; that serves old bytes to the Android app.
          for(const entry of catalog.machines){
            if(entry.status!=='available')continue;
            const expected=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(entry.machineId)}/machine-package.json`;
            if(entry.packageUrl!==expected)throw new Error('STALE_CATALOG_PACKAGE_URL:'+entry.machineId);
            const file=path.join(proto,'machines',entry.machineId,'machine-package.json');
            const bytes=fs.readFileSync(file);
            if(bytes.length!==entry.packageSizeBytes||sha(bytes)!==entry.sha256.toLowerCase())
              throw new Error('CATALOG_PACKAGE_INTEGRITY_MISMATCH:'+entry.machineId);
          }
          catalog.generatedAt=new Date().toISOString();fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch006008-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          cd prototype
          npm run ux-contract:audit
          node tools/apply-machine-identity-classification.mjs --verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machines/L_GOBLIN_SLAYER_RD/machine-package.json machines/S_KONOSUBA_ZR/machine-package.json machines/S_RAKUEN_TSUHO_FS/machine-package.json
          git commit -m "Publish reviewed Goblin Konosuba Rakuen machine UIs [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy updated catalog and three UI overlays
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$REVIEW_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "REVIEW_PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Record immutable original-batch UI overlay attestation and re-QA need
        working-directory: production-state/production
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --experimental-strip-types <<'NODE'
          import fs from 'node:fs';
          import {RepoStore,Orchestrator} from './src/core.ts';
          const s=new RepoStore(process.cwd()),o=new Orchestrator(s);
          const metadata=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch006008-metadata.json','utf8'));
          const rows=[
            ['batch-20261007-008','L_GOBLIN_SLAYER_RD'],
            ['batch-20261005-006','S_KONOSUBA_ZR'],
            ['batch-20261005-006','S_RAKUEN_TSUHO_FS']
          ];
          for(const [batch,id] of rows){
            const p=s.p('batches',batch,'device-qa','ui-overlay-20261011-'+id+'.json');
            fs.mkdirSync(p.slice(0,p.lastIndexOf('/')),{recursive:true});
            fs.writeFileSync(p,JSON.stringify({schemaVersion:'qa-presentation-only-v1',batchId:batch,machineId:id,state:'HUMAN_REQUIRED',historicalAcceptancePreserved:true,originalAppRuntimePreserved:true,requiresHumanDeviceQa:true,distributionCommit:process.env.REVIEW_COMMIT,productionWorkflowRunId:Number(process.env.GITHUB_RUN_ID),pagesRunId:Number(process.env.REVIEW_PAGES_RUN_ID),metadata:metadata[id]},null,2)+'\n');
            let q=o.stage(batch,id,'DEVICE_QA');
            if(q.state==='COMPLETE'||q.state==='HUMAN_REQUIRED')q=o.transition(q,'READY','AUTHORITATIVE_OUTPUT_INVALIDATED','ui-presentation-review-20261011');
            if(q.state!=='READY')throw Error('DEVICE_QA_NOT_READY:'+id+':'+q.state);
            q.humanResolved=false;delete q.authoritativeOutputRef;o.saveStage(q);
          }
          NODE

      - name: Commit revised original batch states
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-010-research-20261010
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261007-008 production/batches/batch-20261005-006
          git commit -m "Record user-reviewed Goblin Konosuba Rakuen UI overlay [skip ci]"
          git push origin HEAD:production/v85-batch-010-research-20261010
