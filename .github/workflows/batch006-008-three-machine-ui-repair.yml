name: Batch006-008 Three Machine UI Repair Boundary

on:
  push:
    branches:
      - production/v85-batch-010-research-20261010
    paths:
      - production/.batch006-008-three-machine-ui-trigger
      - .github/workflows/batch006-008-three-machine-ui-repair.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: batch006-008-three-machine-ui
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production state
        uses: actions/checkout@v4
        with:
          ref: production/v85-batch-010-research-20261010
          path: production-state
          fetch-depth: 0

      - name: Checkout prototype distribution
        uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          path: prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate three machines by their original batch contracts
        working-directory: production-state/production
        shell: bash
        run: |
          set -euo pipefail
          for record in "batch-20261007-008|wave-1|L_GOBLIN_SLAYER_RD" "batch-20261005-006|wave-2|S_KONOSUBA_ZR" "batch-20261005-006|wave-2|S_RAKUEN_TSUHO_FS"; do
            IFS='|' read -r batch wave machine <<< "$record"
            node --experimental-strip-types src/invalidate-machine-downstream.ts "$batch" "$machine" --include-research
            node --experimental-strip-types src/materialize-research-drafts.ts "$batch" "$wave" --force-machine="$machine" --force-only
          done
          for batch in batch-20261007-008 batch-20261005-006; do
            node --experimental-strip-types src/deterministic-production-worker.ts "$batch" --through APP_RUNTIME
          done
          node --input-type=module --experimental-strip-types <<'NODE'
          import {RepoStore,Orchestrator} from './src/core.ts';
          const o=new Orchestrator(new RepoStore(process.cwd()));
          for(const [b,id] of [
            ['batch-20261007-008','L_GOBLIN_SLAYER_RD'],
            ['batch-20261005-006','S_KONOSUBA_ZR'],
            ['batch-20261005-006','S_RAKUEN_TSUHO_FS']
          ]){
            let x=o.stage(b,id,'DEVICE_QA');
            if(x.state==='COMPLETE'||x.state==='HUMAN_REQUIRED')x=o.transition(x,'READY','AUTHORITATIVE_OUTPUT_INVALIDATED','three-machine-ui-20261011');
            if(x.state!=='READY')throw Error('DEVICE_QA_REVIEW_STATE:'+id+':'+x.state);
            x.humanResolved=false;
            delete x.authoritativeOutputRef;
            o.saveStage(x);
          }
          NODE
      - name: Validate regenerated UI and full Production suite
        working-directory: production-state/production
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cases=[
            ['batch-20261007-008','L_GOBLIN_SLAYER_RD',11,3,9,'8.5.2-batch-20261007-008'],
            ['batch-20261005-006','S_KONOSUBA_ZR',5,3,12,'8.5.2-batch-20261005-006'],
            ['batch-20261005-006','S_RAKUEN_TSUHO_FS',5,2,5,'8.5.4-batch-20261005-006']
          ];
          for(const [batch,id,count,groups,tabs,version] of cases){
            const stage=JSON.parse(fs.readFileSync('batches/'+batch+'/machines/'+id+'/stages/APP_RUNTIME.json','utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw Error('APP_RUNTIME_INCOMPLETE:'+id);
            const p=JSON.parse(fs.readFileSync(stage.authoritativeOutputRef.path.replace(/^production\//,''),'utf8')).package;
            if(p.machine.machineDataVersion!==version||p.features.features.length!==count)throw Error('FEATURE_LOSS_OR_REVISION:'+id);
            const secs=p.ui.v8Sections;
            const withTabs=secs.filter(x=>x.tabGroup);
            if(withTabs.length!==tabs||new Set(withTabs.map(x=>x.tabGroup.id)).size!==groups)throw Error('TAB_COVERAGE:'+id);
            const allFeatures=secs.flatMap(x=>x.items??[]).filter(x=>x.featureId);
            if(allFeatures.length!==count||new Set(allFeatures.map(x=>x.featureId)).size!==count)throw Error('UI_FEATURE_COVERAGE:'+id);
            for(const sec of secs)for(const item of sec.items??[])if(item.inputs?.length===2&&item.inputs[0].label===item.inputs[1].label)throw Error('DUPLICATE_COUNTERS:'+id+':'+item.id);
            console.log('UI_GATE_PASS',id,version,count,groups,tabs);
          }
          NODE

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Publish three context-reorganized machine packages
        shell: bash
        run: |
          set -euo pipefail
          MACHINES="L_GOBLIN_SLAYER_RD S_KONOSUBA_ZR S_RAKUEN_TSUHO_FS"
          MACHINES="$MACHINES" node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const machines=process.env.MACHINES.split(/\s+/).filter(Boolean),batches={L_GOBLIN_SLAYER_RD:'batch-20261007-008',S_KONOSUBA_ZR:'batch-20261005-006',S_RAKUEN_TSUHO_FS:'batch-20261005-006'};
          const prod=path.resolve('production-state'),proto=path.resolve('prototype');
          const catalogPath=path.join(proto,'catalog.json'),catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const byId=new Map(catalog.machines.map(x=>[x.machineId,x])),sha=b=>crypto.createHash('sha256').update(b).digest('hex'),metadata={};
          for(const machineId of machines){
            const stage=JSON.parse(fs.readFileSync(path.join(prod,'production','batches',batches[machineId],'machines',machineId,'stages','APP_RUNTIME.json'),'utf8'));
            if(stage.state!=='COMPLETE'||!stage.authoritativeOutputRef?.path)throw new Error('APP_RUNTIME_NOT_COMPLETE:'+machineId);
            const app=JSON.parse(fs.readFileSync(path.join(prod,stage.authoritativeOutputRef.path),'utf8'));
            const pkg=app.package,entry=byId.get(machineId); if(!entry)throw new Error('CATALOG_ENTRY_MISSING:'+machineId);
            pkg.machine.introductionDate=entry.introductionDate;pkg.machine.machineType=entry.machineType;pkg.machine.gameType=entry.gameType;
            const bytes=Buffer.from(JSON.stringify(pkg,null,2)+'\n','utf8');
            if(pkg.machine.machineDataVersion!==(machineId==='L_GOBLIN_SLAYER_RD'?'8.5.2-batch-20261007-008':machineId==='S_KONOSUBA_ZR'?'8.5.2-batch-20261005-006':'8.5.4-batch-20261005-006'))throw new Error('QA_PACKAGE_REVISION_MISMATCH:'+machineId+':'+pkg.machine.machineDataVersion);
            const target=path.join(proto,'machines',machineId,'machine-package.json');fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);
            const caps=[];for(const f of pkg.features?.features??[]){const model=String(f.modelType??'').toLowerCase();if(model==='binomial'&&!caps.includes('binomial'))caps.push('binomial');if(model==='multinomial'&&!caps.includes('multinomial'))caps.push('multinomial');}
            if((pkg.evidence?.references??[]).length&&!caps.includes('evidence'))caps.push('evidence');
            entry.machineDataVersion=pkg.machine.machineDataVersion;entry.packageUrl=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(machineId)}/machine-package.json`;entry.sha256=sha(bytes);entry.packageSizeBytes=bytes.length;entry.requiredCapabilities=caps;entry.updatedAt=new Date().toISOString();
            metadata[machineId]={machineId,machineDataVersion:pkg.machine.machineDataVersion,settings:pkg.machine.settings,sha256:entry.sha256,packageSizeBytes:bytes.length,introductionDate:entry.introductionDate,machineType:entry.machineType,gameType:entry.gameType};
          }
          // A successful local checksum is not enough if catalog.packageUrl is pinned
          // to an earlier commit; that serves old bytes to the Android app.
          for(const entry of catalog.machines){
            if(entry.status!=='available')continue;
            const expected=`https://raw.githubusercontent.com/hanashinonetachou-arch/sloanalytica-data/prototype-multi-machine/machines/${encodeURIComponent(entry.machineId)}/machine-package.json`;
            if(entry.packageUrl!==expected)throw new Error('STALE_CATALOG_PACKAGE_URL:'+entry.machineId);
            const file=path.join(proto,'machines',entry.machineId,'machine-package.json');
            const bytes=fs.readFileSync(file);
            if(bytes.length!==entry.packageSizeBytes||sha(bytes)!==entry.sha256.toLowerCase())
              throw new Error('CATALOG_PACKAGE_INTEGRITY_MISMATCH:'+entry.machineId);
          }
          catalog.generatedAt=new Date().toISOString();fs.writeFileSync(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/batch006008-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          cd prototype
          npm run ux-contract:audit
          node tools/apply-machine-identity-classification.mjs --verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json machines/L_GOBLIN_SLAYER_RD/machine-package.json machines/S_KONOSUBA_ZR/machine-package.json machines/S_RAKUEN_TSUHO_FS/machine-package.json
          git commit -m "Publish reviewed Goblin Konosuba Rakuen machine UIs [skip ci]"
          git push origin HEAD:prototype-multi-machine
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy Batch010 data pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref prototype-multi-machine --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=prototype-multi-machine&event=workflow_dispatch&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy SloAnalytica Data Pages\" and .head_sha == \"$REVIEW_COMMIT\") | .id" | head -n1 || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"; gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "REVIEW_PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Finalize original batch Distribution contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const all=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/batch006008-metadata.json','utf8'));
          for(const [batch,attestation,ids] of [
            ['batch-20261007-008','distribution-repair-attestation.json',['L_GOBLIN_SLAYER_RD']],
            ['batch-20261005-006','distribution-r2-attestation.json',['S_KONOSUBA_ZR','S_RAKUEN_TSUHO_FS']]
          ]){
            const file=path.resolve('production-state/production/batches',batch,attestation);
            const old=JSON.parse(fs.readFileSync(file,'utf8')),packages={...old.packages};
            for(const id of ids)packages[id]=all[id];
            const doc={...old,batchId:batch,integration:{...old.integration,repository:'hanashinonetachou-arch/sloanalytica-data',branch:'prototype-multi-machine',commit:process.env.REVIEW_COMMIT,packagePath:'',catalogPath:'catalog.json'},packages,checks:{...old.checks,catalogIntegrity:true,pagesDeployment:{runId:Number(process.env.REVIEW_PAGES_RUN_ID),conclusion:'success'},uxContractAudit:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success'},machineIdentityConsistency:{runId:Number(process.env.GITHUB_RUN_ID),conclusion:'success',batchMachineVerified:true}}};
            fs.writeFileSync(file,JSON.stringify(doc,null,2)+'\n');
          }
          NODE
          cd production-state/production
          for batch in batch-20261007-008 batch-20261005-006; do
            node --experimental-strip-types src/deterministic-production-worker.ts "$batch" --through DISTRIBUTION
            node --experimental-strip-types src/reconcile-batch.ts "$batch"
          done

      - name: Commit revised original batch states
        shell: bash
        working-directory: production-state
        run: |
          set -euo pipefail
          git fetch origin production/v85-batch-010-research-20261010
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261007-008 production/batches/batch-20261005-006
          git commit -m "Regenerate Goblin Konosuba Rakuen source UI through Distribution [skip ci]"
          git push origin HEAD:production/v85-batch-010-research-20261010
