name: Batch003 Wave1 Production Worker

on:
  push:
    branches:
      - production/v85-batch-003-foundation-20261002
    paths:
      - production/.batch003-wave1-production-trigger

permissions:
  contents: write

concurrency:
  group: batch003-wave1-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/v85-batch-003-foundation-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate production foundation
        working-directory: production
        run: |
          node --experimental-strip-types src/reconcile-batch.ts batch-20261002-003
          npm test
      - name: Rematerialize repaired Gundam research through authoritative validator
        working-directory: production
        run: |
          node --experimental-strip-types src/invalidate-machine-downstream.ts batch-20261002-003 L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA --include-research
          node --experimental-strip-types src/materialize-research-drafts.ts batch-20261002-003 wave-1 --force-machine=L_GUNDAM_UNICORN_KAKUSEI_DRIVE_2JA
      - name: Advance Wave 1 through app runtime
        working-directory: production
        run: node --experimental-strip-types src/deterministic-production-worker.ts batch-20261002-003 --through APP_RUNTIME
      - name: Validate resulting production state
        working-directory: production
        run: npm test
      - name: Commit authoritative Batch 003 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production/batches/batch-20261002-003
          if git diff --cached --quiet; then
            echo "Batch 003 production state already current."
            exit 0
          fi
          git commit -m "Advance Batch 003 Wave 1 through app runtime [skip ci]"
          git push origin HEAD:production/v85-batch-003-foundation-20261002
