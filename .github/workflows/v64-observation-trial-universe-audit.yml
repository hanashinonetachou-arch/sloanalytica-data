name: v6.4 Observation Trial Universe Audit

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/audit-v64-observation-trial-universe.mjs'
      - 'test/v64-observation-trial-universe-audit.test.mjs'
      - '.github/workflows/v64-observation-trial-universe-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run observation audit regression tests
        run: node --test test/v64-observation-trial-universe-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Generate 170-machine observation/trial-universe report
        run: |
          node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
      - name: Print review summary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-observation-trial-universe-audit.json','utf8'));
          console.log('SUMMARY',JSON.stringify(r.summary));
          console.log('ISSUES',JSON.stringify(r.issueCounts));
          const affected=r.machines.filter(m=>m.status!=='PASS');
          console.log('AFFECTED_MACHINES',affected.length);
          for(const m of affected.slice(0,80)) console.log(`${m.status} ${m.machineId} :: ${m.issues.map(i=>i.type).join(', ')}`);
          NODE
      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v64-observation-trial-universe-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: add v6.4 observation trial-universe report [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
