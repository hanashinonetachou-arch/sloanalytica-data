name: v6.4 Observation Trial Universe Audit

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/audit-v64-observation-trial-universe.mjs'
      - 'test/v64-observation-trial-universe-audit.test.mjs'
      - 'test/*observation*.test.mjs'
      - 'research/**/machine-observation-data.json'
      - '.github/workflows/v64-observation-trial-universe-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v64-observation-trial-universe-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run observation audit regression tests
        run: node --test test/v64-observation-trial-universe-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Generate 170-machine observation/trial-universe report
        run: |
          node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
      - name: Print review summary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-observation-trial-universe-audit.json','utf8'));
          console.log('SUMMARY',JSON.stringify(r.summary));
          console.log('SEVERITIES',JSON.stringify(r.severityCounts));
          console.log('ISSUES',JSON.stringify(r.issueCounts));
          const high=r.machines.filter(m=>m.status==='HIGH_RISK');
          const review=r.machines.filter(m=>m.status==='REVIEW');
          console.log('HIGH_RISK_MACHINES',high.length);
          for(const m of high) console.log(`HIGH_RISK ${m.machineId} :: ${m.issues.filter(i=>i.severity!=='DEBT').map(i=>`${i.type}${i.featureId?`(${i.featureId})`:''}`).join(', ')}`);
          console.log('REVIEW_MACHINES',review.length);
          for(const m of review.slice(0,80)) console.log(`REVIEW ${m.machineId} :: ${m.issues.filter(i=>i.severity==='REVIEW').map(i=>`${i.type}${i.featureId?`(${i.featureId})`:''}`).join(', ')}`);
          NODE
      - name: Refresh and commit audit report from latest branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin prototype-multi-machine
          git reset --hard origin/prototype-multi-machine
          node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
          git add reports/v64-observation-trial-universe-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh v6.4 observation trial-universe report"
            git push origin HEAD:prototype-multi-machine
          fi
