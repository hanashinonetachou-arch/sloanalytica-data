name: Migrate v6.4 Observation Batch 02
on:
  push:
    branches: [prototype-multi-machine]
    paths: ['tools/migrate-v64-observation-batch-02.mjs','.github/workflows/migrate-v64-observation-batch-02.yml']
permissions: {contents: write}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prototype-multi-machine}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/migrate-v64-observation-batch-02.mjs
      - run: node --test --test-concurrency=1 test/v64-observation-trial-universe-audit.test.mjs test/selection-policy-migration-audit.test.mjs
      - run: npm test
      - run: node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json
      - run: |
          node tools/audit-v64-cross-machine-semantic.mjs . reports/v64-cross-machine-semantic-audit.json
          node tools/audit-v64-causal-relations.mjs . reports/v64-causal-relation-review.json
      - name: Commit batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/L_CHIBARIYO2_ZB/machine-observation-data.json research/L_CODE_GEASS_REVIVAL_ZS/machine-observation-data.json research/L_D4DJ_KB/machine-observation-data.json research/L_GEGEGE_NO_KITARO_KAKUSEI_JC/machine-observation-data.json research/L_KARAKURI_CIRCUS_G/machine-observation-data.json research/L_KINNIKUMAN4_SLDC/machine-observation-data.json research/L_LOVEKYURE2_PS/machine-observation-data.json research/L_NANGOKU_SODACHI_S3/machine-observation-data.json research/L_NOGIZAKA46_UD/machine-observation-data.json reports/v64-observation-trial-universe-audit.json reports/v64-cross-machine-semantic-audit.json reports/v64-causal-relation-review.json
          git commit -m "audit: migrate nine direct observation contracts to v2"
          git push