name: Publish multinomial fixes once

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - .github/workflows/publish-multinomial-fix-once.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish affected machines
        run: |
          set -euo pipefail
          for id in L_MAGICAL_HALLOWEEN8_FE L_MONKEY_TURN5_CE; do
            npm run machine:publish -- approve "$id"
            npm run machine:publish -- publish "$id"
          done
          npm run audit
      - name: Commit published artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json difficulty-catalog.json machine-registry.json build machines reports 2>/dev/null || true
          git commit -m 'publish: multinomial contract fixes' || exit 0
          git push origin prototype-multi-machine
