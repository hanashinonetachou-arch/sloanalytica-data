name: v6.4 Magihallo8 Observation Migration

on:
  push:
    branches: [prototype-multi-machine]
    paths:
      - 'tools/migrate-v64-magihallo8-observation.mjs'
      - '.github/workflows/v64-magihallo8-observation-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype-multi-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node tools/migrate-v64-magihallo8-observation.mjs
      - name: Validate target pipeline
        run: npm run machine:pipeline -- L_MAGICAL_HALLOWEEN8_FE --skip-repo-checks
      - name: Run Observation audit regression
        run: node --test test/v64-observation-trial-universe-audit.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Run public audit
        run: npm run audit
      - name: Generate Observation audit
        run: |
          node tools/audit-v64-observation-trial-universe.mjs . reports/v64-observation-trial-universe-audit.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v64-observation-trial-universe-audit.json','utf8'));
          const m=r.machines.find(x=>x.machineId==='L_MAGICAL_HALLOWEEN8_FE');
          console.log('SUMMARY',r.summary);
          console.log('MAGI8',m);
          if(!m || m.status!=='PASS') process.exit(1);
          if(r.summary.HIGH_RISK!==0) process.exit(1);
          NODE
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # The permanent Observation workflow owns the cross-machine report; keep it out of this migration commit.
          git restore reports/v64-observation-trial-universe-audit.json 2>/dev/null || true
          # Stage every tracked artifact changed by the target pipeline without adding transient untracked build output.
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "fix: gate Magihallo8 predecessor observation [skip ci]"
            git pull --rebase origin prototype-multi-machine
            git push origin prototype-multi-machine
          fi
